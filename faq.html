  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"怎麼挑比較適合？","acceptedAnswer":{"@type":"Answer","text":"先從型態想起：想固定節奏可看膏，想簡單快速可看飲，想放進料理可看湯塊，想自己搭配可看粉。"}},{"@type":"Question","name":"龜鹿膏、龜鹿飲、龜鹿湯塊差在哪裡？","acceptedAnswer":{"@type":"Answer","text":"膏適合固定節奏，飲適合方便快速，湯塊適合燉湯與餐桌料理。三者的差異主要在型態與使用情境。"}},{"@type":"Question","name":"鹿茸粉適合怎麼使用？","acceptedAnswer":{"@type":"Answer","text":"鹿茸粉屬於粉末型態，可依個人習慣加入溫熱飲品，建議由少量開始，並以好執行為主。"}},{"@type":"Question","name":"可以怎麼安排食用時間？","acceptedAnswer":{"@type":"Answer","text":"以固定、好執行為優先。多數人會放在早上與下午，盡量避免接近睡前。"}},{"@type":"Question","name":"可以每天安排嗎？","acceptedAnswer":{"@type":"Answer","text":"若作為日常飲食搭配，建議以固定、少量、好執行的方式安排；若有特殊身體狀況，建議先詢問專業人員。"}},{"@type":"Question","name":"可以搭配熱水嗎？","acceptedAnswer":{"@type":"Answer","text":"龜鹿膏可搭配溫熱水化開，龜鹿飲建議溫熱後飲用，湯塊則適合加入燉湯或熱食。"}},{"@type":"Question","name":"龜鹿飲可以冰飲嗎？","acceptedAnswer":{"@type":"Answer","text":"不建議冰飲。若要安排日常節奏，會建議以溫熱方式飲用比較順口。"}},{"@type":"Question","name":"龜鹿湯塊可以怎麼料理？","acceptedAnswer":{"@type":"Answer","text":"可加入雞湯、排骨湯、蘿蔔湯等家常燉湯，也可以用保溫壺沖泡後再依喜好加入食材。"}},{"@type":"Question","name":"官網為什麼不直接放價格？","acceptedAnswer":{"@type":"Answer","text":"官網重點是幫你理解型態、規格與搭配，實際價格與建議由 LINE 集中回覆比較清楚。"}},{"@type":"Question","name":"套餐搭配怎麼選？","acceptedAnswer":{"@type":"Answer","text":"想固定節奏可看日常節奏組，想方便快速可看日常便利組，想料理熱飲一起安排可看餐桌搭配組。"}},{"@type":"Question","name":"可以到門市嗎？","acceptedAnswer":{"@type":"Answer","text":"萬華門市位於台北市萬華區西昌街52號。建議先透過官方 LINE 幫我看適合哪個，確認現場與安排時間。"}},{"@type":"Question","name":"付款方式有哪些？","acceptedAnswer":{"@type":"Answer","text":"目前可安排匯款與貨到付款。實際方式建議透過 LINE 確認。"}}]}</script>
