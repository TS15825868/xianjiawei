<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "第一次買，建議先看哪一款？", "acceptedAnswer": {"@type": "Answer", "text": "先從使用方式看。如果想固定安排，可先看龜鹿膏；想方便即飲，看龜鹿飲；想燉湯或保溫壺沖泡，看龜鹿湯塊；想大規格家庭使用，看龜鹿膠；想自行搭配飲品，看鹿茸粉。"}}, {"@type": "Question", "name": "龜鹿膏、龜鹿飲、龜鹿湯塊差在哪？", "acceptedAnswer": {"@type": "Answer", "text": "三者主要差異在型態與情境。龜鹿膏適合小匙取用或熱水化開；龜鹿飲適合開瓶即飲；龜鹿湯塊適合熱水沖泡、保溫壺或燉湯料理。"}}, {"@type": "Question", "name": "龜鹿湯塊和龜鹿膠差在哪？", "acceptedAnswer": {"@type": "Answer", "text": "兩者成分皆為鹿角萃取物、龜板萃取物。龜鹿湯塊是75g小盒裝，8塊，每塊約9.375g；龜鹿膠是一斤裝，32塊，每塊約18.75g。差異主要在規格、份量與使用安排。"}}, {"@type": "Question", "name": "龜鹿飲有哪幾種規格？", "acceptedAnswer": {"@type": "Answer", "text": "龜鹿飲目前可詢問30cc玻璃瓶與180cc鋁袋。30cc玻璃瓶適合體驗、外出與工作空檔；180cc鋁袋適合一次完整安排。"}}, {"@type": "Question", "name": "龜鹿膏怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "可直接食用，也可取1～2小匙加入約100～300mL熱水化開，調至適合溫度後飲用。建議安排在早上或下午，避免接近睡前。"}}, {"@type": "Question", "name": "龜鹿飲怎麼喝？", "acceptedAnswer": {"@type": "Answer", "text": "30cc玻璃瓶開瓶即可飲用，180cc鋁袋開封後即可飲用。也可依個人習慣溫熱後飲用，開瓶或開封後請儘速飲用完畢。"}}, {"@type": "Question", "name": "龜鹿湯塊怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "取1塊加入約300～500mL熱水沖泡，也可放入保溫壺悶泡，或加入雞湯、排骨湯等湯品燉煮。"}}, {"@type": "Question", "name": "龜鹿膠怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "取適量加入約300～500mL熱水化開，待溫度適合後飲用，也可加入雞湯、排骨湯等湯品燉煮。"}}, {"@type": "Question", "name": "鹿茸粉可以加牛奶或豆漿嗎？", "acceptedAnswer": {"@type": "Answer", "text": "可以。可依個人習慣取適量鹿茸粉，加入溫開水、牛奶、豆漿或其他飲品中攪拌均勻後飲用。"}}, {"@type": "Question", "name": "產品怎麼保存？", "acceptedAnswer": {"@type": "Answer", "text": "龜鹿膏、龜鹿湯塊與龜鹿膠可置於陰涼乾燥處，也可保存於5°C以下冷藏。龜鹿飲開瓶或開封後請儘速飲用完畢。鹿茸粉開封後請密封保存。"}}]}</script>
