<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "第一次買，建議先看哪一款？", "acceptedAnswer": {"@type": "Answer", "text": "先從使用方式看。如果想固定安排，可先看龜鹿膏；想方便即飲，看龜鹿飲；想燉湯或保溫壺沖泡，看龜鹿湯塊；想大規格家庭使用，看龜鹿膠；想自行搭配飲品，看鹿茸粉。"}}, {"@type": "Question", "name": "龜鹿膏、龜鹿飲、龜鹿湯塊差在哪？", "acceptedAnswer": {"@type": "Answer", "text": "三者主要差異在型態與情境。龜鹿膏適合小匙取用或熱水化開；龜鹿飲適合開瓶即飲；龜鹿湯塊適合熱水沖泡、保溫壺或燉湯料理。"}}, {"@type": "Question", "name": "龜鹿湯塊和龜鹿膠差在哪？", "acceptedAnswer": {"@type": "Answer", "text": "兩者成分皆為鹿角萃取物、龜板萃取物。龜鹿湯塊是75g小盒裝，8塊，每塊約9.375g；龜鹿膠是一斤裝，32塊，每塊約18.75g。差異主要在規格、份量與使用安排。"}}, {"@type": "Question", "name": "龜鹿飲有哪幾種規格？", "acceptedAnswer": {"@type": "Answer", "text": "龜鹿飲目前可詢問30cc玻璃瓶與180cc鋁袋。30cc玻璃瓶適合體驗、外出與工作空檔；180cc鋁袋適合一次完整安排。"}}, {"@type": "Question", "name": "龜鹿膏怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "可直接食用，也可取1～2小匙加入約100～300mL熱水化開，調至適合溫度後飲用。建議安排在早上或下午，避免接近睡前。"}}, {"@type": "Question", "name": "龜鹿飲怎麼喝？", "acceptedAnswer": {"@type": "Answer", "text": "30cc玻璃瓶開瓶即可飲用，180cc鋁袋開封後即可飲用。也可依個人習慣溫熱後飲用，開瓶或開封後請儘速飲用完畢。"}}, {"@type": "Question", "name": "龜鹿湯塊怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "取1塊加入約300～500mL熱水沖泡，也可放入保溫壺悶泡，或加入雞湯、排骨湯等湯品燉煮。"}}, {"@type": "Question", "name": "龜鹿膠怎麼用？", "acceptedAnswer": {"@type": "Answer", "text": "取適量加入約300～500mL熱水化開，待溫度適合後飲用，也可加入雞湯、排骨湯等湯品燉煮。"}}, {"@type": "Question", "name": "鹿茸粉可以加牛奶或豆漿嗎？", "acceptedAnswer": {"@type": "Answer", "text": "可以。可依個人習慣取適量鹿茸粉，加入溫開水、牛奶、豆漿或其他飲品中攪拌均勻後飲用。"}}, {"@type": "Question", "name": "產品怎麼保存？", "acceptedAnswer": {"@type": "Answer", "text": "龜鹿膏、龜鹿湯塊與龜鹿膠可置於陰涼乾燥處，也可保存於5°C以下冷藏。龜鹿飲開瓶或開封後請儘速飲用完畢。鹿茸粉開封後請密封保存。"}}, {"@type": "Question", "name": "官網為什麼不直接公開價格？", "acceptedAnswer": {"@type": "Answer", "text": "官網以產品型態、規格、成分與使用方式為主，實際購買方式、活動、配送與付款可透過官方 LINE 由客服協助確認。"}}, {"@type": "Question", "name": "可以門市自取或配送嗎？", "acceptedAnswer": {"@type": "Answer", "text": "可以透過官方 LINE 詢問門市自取、宅配、7-11賣貨便與雙北親送等方式，實際安排以客服確認為準。"}}, {"@type": "Question", "name": "有特殊身體狀況或正在用藥，可以詢問嗎？", "acceptedAnswer": {"@type": "Answer", "text": "可以先透過官方 LINE 說明情況，我們會協助整理產品資訊；若涉及孕哺、用藥或個人健康狀況，建議先詢問專業醫師或藥師。"}}, {"@type": "Question", "name": "龜鹿產品可以改善虛弱、疲勞、貧血、掉髮、腰痠或骨質疏鬆嗎？", "acceptedAnswer": {"@type": "Answer", "text": "這些說法涉及疾病、症狀或醫療效能，仙加味官網不以食品宣稱治療、改善或預防效果。官網只提供產品型態、規格、成分、使用方式與保存資訊；若有相關健康狀況，建議先詢問醫師、中醫師或藥師。"}}, {"@type": "Question", "name": "空腹食用吸收最好嗎？", "acceptedAnswer": {"@type": "Answer", "text": "仙加味不把「空腹效果最好」當成所有人的固定規則。可依產品標示與個人飲食習慣安排；龜鹿膏建議放在早上或下午，熱水化開後調到適合溫度飲用。腸胃較敏感者可改在餐後，若有特殊狀況請先詢問專業人員。"}}, {"@type": "Question", "name": "沒有骨質疏鬆，也需要吃龜鹿產品預防嗎？", "acceptedAnswer": {"@type": "Answer", "text": "龜鹿產品不是用來診斷、治療或預防骨質疏鬆，也不能取代骨密度檢查與醫療建議。骨骼保養可從均衡飲食、足夠蛋白質與鈣、維生素D、規律負重運動及定期評估開始；有疑慮請詢問醫師。"}}, {"@type": "Question", "name": "龜鹿產品有什麼功效？", "acceptedAnswer": {"@type": "Answer", "text": "仙加味不以食品宣稱醫療功效。我們會從產品型態與使用情境協助選擇：固定安排可看龜鹿膏、方便即飲可看龜鹿飲、沖泡或燉湯可看龜鹿湯塊、家庭大規格可看龜鹿膠、自行搭配熱飲可看鹿茸粉。"}}, {"@type": "Question", "name": "哪些情況應先詢問專業人員？", "acceptedAnswer": {"@type": "Answer", "text": "懷孕、哺乳、兒童、正在服藥、慢性疾病、手術前後、對成分過敏或有特殊體質者，建議先詢問醫師、中醫師或藥師，再決定是否使用。"}}, {"@type": "Question", "name": "龜鹿產品可以取代藥物或醫療嗎？", "acceptedAnswer": {"@type": "Answer", "text": "不可以。仙加味產品屬日常飲食與使用安排，不能取代藥物、診斷、治療或醫療追蹤。"}}]}</script>
