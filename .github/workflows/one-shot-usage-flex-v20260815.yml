name: 仙加味 20260815 使用方式與試喝按鈕一次性更新
# rerun-v4-exact-confirmed-copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-flex-v20260815.yml'
permissions:
  contents: write
jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current usage and layout rules
        run: python tools/apply-usage-flex-v20260815.py
      - name: Validate current release
        run: |
          python tools/validate-site-release.py
          python tools/validate-public-customer-pages-v20260809.py
      - name: Commit verified regular files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/one-shot-usage-flex-v20260815.yml' ':!tools/apply-usage-flex-v20260815.py'
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'fix(site): use exact personal-schedule usage copy'
          git push origin HEAD:main
