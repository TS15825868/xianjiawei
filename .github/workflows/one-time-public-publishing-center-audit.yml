name: ONE_TIME_PUBLIC_PUBLISHING_CENTER_AUDIT_20260806

on:
  push:
    branches: [main]
    paths:
      - '.github/public-publishing-center-audit-trigger.txt'

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate public publishing center
        id: audit
        shell: bash
        run: |
          set +e
          node --check publishing-center.js > /tmp/audit.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node <<'NODE' >> /tmp/audit.log 2>&1
          const fs = require('fs');
          const html = fs.readFileSync('publishing-center.html', 'utf8');
          const css = fs.readFileSync('publishing-center.css', 'utf8');
          const data = JSON.parse(fs.readFileSync('content/public-post-library.json', 'utf8'));
          if (!html.includes('publishing-center.js') || !html.includes('publishing-center.css')) throw new Error('發布中心缺少JS或CSS引用');
          if (!Array.isArray(data.posts) || data.posts.length !== 23) throw new Error(`公開貼文數量錯誤：${data.posts?.length}`);
          const locked = data.posts.filter((post) => post.status === 'published' || post.prevent_republish === true);
          if (locked.length !== 2) throw new Error(`已發布鎖定數量錯誤：${locked.length}`);
          const forbiddenKeys = /(customer|phone|address|order|cost|secret|token|password|credential|supplier_price|wholesale_cost)/i;
          for (const post of data.posts) {
            for (const key of Object.keys(post)) if (forbiddenKeys.test(key)) throw new Error(`公開貼文含私人欄位：${post.id}.${key}`);
            if (!post.id || !post.copy || !post.title) throw new Error(`公開貼文缺少必要欄位：${post.id || 'unknown'}`);
            if (post.image_url && !/^https:\/\/ts15825868\.github\.io\/xianjiawei\//.test(post.image_url)) throw new Error(`圖片網址非正式公開來源：${post.id}`);
          }
          if (!css.includes('.post-grid') || !css.includes('.post-dialog')) throw new Error('發布中心CSS不完整');
          console.log('PASS：公開發布中心HTML／CSS／JS、23篇貼文、2篇防重發鎖與私人欄位檢查全部通過。');
          NODE
            status=$?
          fi
          cat /tmp/audit.log
          if [ "$status" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "PASS｜公開貼文發布中心驗收 20260806" --body "公開發布中心已通過：JavaScript 語法、HTML/CSS 引用、23篇公開貼文、2篇已發布防重發鎖、正式圖片來源及私人欄位外洩檢查。此流程未發布任何社群貼文。"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "FAIL｜公開貼文發布中心驗收 20260806" --body "公開發布中心驗收失敗，請查看本次 Actions 工作紀錄。此流程未發布任何社群貼文。"

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          rm -f .github/workflows/one-time-public-publishing-center-audit.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(audit): remove one-time public publishing center workflow"
          git push origin main
