name: 仙加味77篇小老闆正式貼文圖重製

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-post-rebuild-v20260816.py'
      - 'assets/reference/mascot-sprite-v20260816.part*'
      - '.github/workflows/generate-post-rebuild-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image dependencies and Traditional Chinese fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Rebuild approved mascot sprite
        shell: bash
        run: |
          set -euo pipefail
          cat assets/reference/mascot-sprite-v20260816.part0 \
              assets/reference/mascot-sprite-v20260816.part1 \
              assets/reference/mascot-sprite-v20260816.part2 \
              assets/reference/mascot-sprite-v20260816.part3 \
              assets/reference/mascot-sprite-v20260816.part4 \
              > assets/reference/mascot-sprite-v20260816.txt
          python - <<'PY'
          import base64, io
          from PIL import Image
          p='assets/reference/mascot-sprite-v20260816.txt'
          raw=open(p,encoding='utf-8').read().strip()
          data=base64.b64decode(raw,validate=True)
          im=Image.open(io.BytesIO(data)); im.verify()
          print('PASS mascot sprite',len(data),'bytes')
          PY
      - name: Prepare high-resolution formal product source canvases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          pairs={
            'guilu-gao.jpg':'images/dm-final/01_guilu-gao-100g-dm.jpg',
            'guilu-drink-30.jpg':'images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg',
            'guilu-drink-180.jpg':'images/dm-final/03_guilu-drink-180cc-dm.jpg',
            'luerong-fen.jpg':'images/dm-final/04_luerong-fen-75g-dm.jpg',
            'guilu-tangkuai.jpg':'images/dm-final/05_guilu-tangkuai-75g-dm.jpg',
            'guilu-jiao.jpg':'images/dm-final/06_guilu-jiao-600g-dm.jpg',
          }
          for dst,src in pairs.items():
            im=Image.open(src).convert('RGB')
            im=ImageOps.fit(im,(1122,1402),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
            im.save('images/products-v3/'+dst,'JPEG',quality=96,optimize=True)
            print('prepared',dst,src)
          PY
      - name: Allow reading current legacy JPEG source bytes
        shell: bash
        run: |
          python - <<'PY'
          p='tools/generate-post-rebuild-v20260816.py'
          s=open(p,encoding='utf-8').read()
          needle='from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps\n'
          repl='from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps, ImageFile\nImageFile.LOAD_TRUNCATED_IMAGES=True\n'
          if needle not in s: raise SystemExit('PIL import marker missing')
          open(p,'w',encoding='utf-8').write(s.replace(needle,repl,1))
          PY
      - name: Generate 77 unique formal visuals
        run: python tools/generate-post-rebuild-v20260816.py
      - name: Validate generated outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f images/posts/rebuild-v20260816/_contact-sheet.webp
          count=$(find images/posts/rebuild-v20260816 -maxdepth 1 -type f -name '*.webp' ! -name '_contact-sheet.webp' | wc -l | tr -d ' ')
          test "$count" = 77
          grep -q '"count": 77' images/posts/rebuild-v20260816/manifest.json
      - name: Commit generated visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore images/products-v3 tools/generate-post-rebuild-v20260816.py assets/reference/mascot-sprite-v20260816.txt || true
          git add images/posts/rebuild-v20260816
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(posts): replace 77 visuals with approved small-boss reference'
          git pull --rebase origin main
          git push origin HEAD:main
