name: 仙加味｜新商品實拍去背與主圖待審核製作
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_partner_review_images.py"
      - ".github/workflows/build-partner-product-review.yml"
      - "partner-catalog.json"
      - "images/partner-products/**"

permissions:
  contents: read

concurrency:
  group: xjw-partner-product-physical-photo-review
  cancel-in-progress: false

jobs:
  produce-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline compositing and foreground cutout tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pillow>=10,<13' 'rembg[cpu]>=2.0.65,<3'
      - name: Keep original manufacturer photos for exact physical-product comparison
        uses: actions/upload-artifact@v4
        with:
          name: partner-original-physical-photo-evidence
          path: |
            images/partner-products/*.jpg
            images/partner-products/*.webp
          retention-days: 30
      - name: Compose original physical goods with current brand backdrop
        run: python tools/build_partner_review_images.py
      - name: Preserve review contact sheet and original-pixel audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-physical-product-main-review
          path: images/partner-product-design-review/
          if-no-files-found: warn
          retention-days: 30
      # Intentionally do not commit generated output to main. Images are kept
      # as review artifacts, protecting the current catalog and avoiding
      # conflicts with concurrent author updates. Human approval is required.
