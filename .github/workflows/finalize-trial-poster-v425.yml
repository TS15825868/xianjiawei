name: 官網試喝海報正式定稿 v425
run-name: 官網海報 v425｜製作加工5至7工作天・完成後出貨

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/finalize-trial-poster-v420.py"
      - ".github/workflows/finalize-trial-poster-v425.yml"
      - "staging/trial-poster-v425/READY"

permissions:
  contents: write

concurrency:
  group: site-trial-poster-v425
  cancel-in-progress: true

jobs:
  finalize-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
            python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy
            test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          } 2>&1 | tee /tmp/poster-deps-v425.log

      - name: Render final poster
        id: render
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/finalize-trial-poster-v420.py 2>&1 | tee /tmp/poster-render-v425.log

      - name: Verify final poster contract
        id: verify
        if: steps.render.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/poster-verify-v425.log
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          image_path = Path('images/posts/approved-v412/guilu-drink-trial-evergreen.jpg')
          report_path = Path('diagnostics/trial-poster-v420.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report.get('status') == 'success'
          assert report.get('line_1') == '接單後安排製作加工'
          assert report.get('line_2') == '製作加工約需5～7個工作天，完成後才安排出貨'
          assert report.get('after_sha256') == hashlib.sha256(image_path.read_bytes()).hexdigest()
          with Image.open(image_path) as image:
              assert image.width == image.height and image.width >= 1000
          print(report)
          PY
          git diff --check

      - name: Persist poster or exact failure diagnostic
        if: always()
        shell: bash
        env:
          DEPS_RESULT: ${{ steps.deps.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          SUCCESS=false
          if [ "$DEPS_RESULT" = success ] && [ "$RENDER_RESULT" = success ] && [ "$VERIFY_RESULT" = success ]; then SUCCESS=true; fi
          mkdir -p diagnostics
          if [ "$SUCCESS" = true ]; then
            rm -f diagnostics/trial-poster-v425-error.txt
          else
            {
              echo "status=failure"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "commit=$(git rev-parse HEAD)"
              echo "deps_result=${DEPS_RESULT}"
              echo "render_result=${RENDER_RESULT}"
              echo "verify_result=${VERIFY_RESULT}"
              echo
              echo "=== deps ==="
              tail -n 160 /tmp/poster-deps-v425.log 2>/dev/null || true
              echo
              echo "=== render ==="
              tail -n 160 /tmp/poster-render-v425.log 2>/dev/null || true
              echo
              echo "=== verify ==="
              tail -n 160 /tmp/poster-verify-v425.log 2>/dev/null || true
            } > diagnostics/trial-poster-v425-error.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          if [ "$SUCCESS" = true ]; then
            git add images/posts/approved-v412/guilu-drink-trial-evergreen.jpg
            git rm -r --ignore-unmatch staging/trial-poster-v420 staging/trial-poster-v425
          fi
          if ! git diff --cached --quiet; then
            if [ "$SUCCESS" = true ]; then
              git commit -m 'fix(site): finalize trial poster production wording v425'
            else
              git commit -m 'chore(site): persist exact trial poster failure v425'
            fi
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Fail only after diagnostics are persisted
        if: always()
        env:
          DEPS_RESULT: ${{ steps.deps.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          test "$DEPS_RESULT" = success
          test "$RENDER_RESULT" = success
          test "$VERIFY_RESULT" = success
