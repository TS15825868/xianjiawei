name: 仙加味｜參仲四物飲與龜鹿活力飲原物去背
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/stage_jinan_two_real_cutouts.py'
      - '.github/workflows/stage-jinan-two-real-cutouts.yml'
permissions:
  contents: write
concurrency:
  group: xjw-jinan-two-physical-mattes
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pillow>=10,<13'
      - name: Create only transparent original-pixel product silhouettes
        run: python tools/stage_jinan_two_real_cutouts.py
      - uses: actions/upload-artifact@v4
        with:
          name: xjw-jinan-two-original-photo-cutout-review
          path: |
            images/partner-products/cutouts-v20261016/
            images/partner-product-design-review/jinan-two-cutouts-review-20261016.jpg
          retention-days: 30
      - name: Save reviewed candidates without changing live product photo paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/partner-products/cutouts-v20261016/ images/partner-product-design-review/jinan-two-cutouts-review-20261016.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: preserve two Jinan product-source cutout candidates [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
