name: Audit mascot source resolution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-mascot-source-resolution.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Scan all mascot-related images
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageStat
          import json

          rows=[]
          for path in sorted(Path('images').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue
              name=path.name.lower()
              if not any(token in name for token in ('mascot','scene','boss','owner')):
                  continue
              try:
                  with Image.open(path) as im:
                      width,height=im.size
                      edge=ImageStat.Stat(im.convert('L').filter(ImageFilter.FIND_EDGES)).mean[0]
                  rows.append({
                      'file':str(path),
                      'width':width,
                      'height':height,
                      'bytes':path.stat().st_size,
                      'edgeMean':round(edge,3),
                      'nativeEnough':width>=1200 and height>=900,
                  })
              except Exception as exc:
                  rows.append({'file':str(path),'error':str(exc)})
          Path('mascot-source-audit.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit result to main
        run: |
          rm -f .github/workflows/audit-mascot-source-resolution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mascot-source-audit.json .github/workflows/audit-mascot-source-resolution.yml
          git commit -m '完成小老闆原始圖片解析度稽核'
          git push origin main
