name: Finalize current media authority v20260814
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-current-media-authority-v20260814.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete trial-component authority
        shell: python
        run: |
          from pathlib import Path
          import json
          V='20260814-product-modal-media-v3'
          TR='/images/trial/trial-poster-small-boss-official-v20260814.jpg'
          DM='/images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg'
          p=Path('images/formal-display/manifest.json')
          m=json.loads(p.read_text())
          r=m.setdefault('rules',{})
          r['customer_main_visual']='formal product media for product surfaces; current approved detailed DMs only for DM surfaces; latest user-approved trial poster only for trial surfaces'
          r.pop('trial_component_authority',None)
          r['trial_poster_authority']=TR
          r['guard_policy']='validate product image, current detailed DM, trial poster and real-product identity as separate roles; reject corrupt, low-resolution, wrong-role or retired media'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          p=Path('data/formal-media-authority-v20260810.json')
          a=json.loads(p.read_text())
          a['principle']='formal product images, current detailed DMs, and the latest user-approved trial poster are separate media roles; products-v3 remains immutable real-product identity reference only'
          a.setdefault('dm',{})['version']=V
          a['dm']['status']='approved_current_media'
          a['dm']['source']='current approved DM assets; 30cc uses exact latest user-approved 1122x1402 JPEG with 30cc／罐'
          rules=a.get('image_rules',[])
          rules=[('試喝頁使用最新核准小老闆正式試喝海報，產品圖／DM／試喝圖三層分離' if 'trial-showcase-v20260813' in x else x) for x in rules]
          a['image_rules']=rules
          a['post_image_policy']='product posts use formal product visuals; explicit DM posts use current approved detailed DMs; trial content uses the latest approved trial poster; edits return to pending_review and must pass the 16-item review gate'
          a['guard_policy']='validate product image, detailed DM, trial poster, visual validity and physical identity as separate roles; never restore retired trial masters or wrong-role 180cc DM'
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          p=Path('site-dm-authority-v20260811.js')
          s=p.read_text()
          s=s.replace('產品主圖、詳細DM、trial展示元件分開。','產品主圖、詳細DM、正式試喝海報分開。')
          s=s.replace("dmRoleRule:'product main image / high-resolution detailed DM / trial component are separate roles'", "dmRoleRule:'product main image / current detailed DM / approved trial poster are separate roles'")
          p.write_text(s)
          p=Path('publishing-center-guardian.js')
          s=p.read_text()
          s=s.replace("const TRIAL_COMPONENT='trial-showcase-v20260813';", "const TRIAL_POSTER='images/trial/trial-poster-small-boss-official-v20260814.jpg';")
          s=s.replace('`官網試喝頁目前使用${TRIAL_COMPONENT}元件；已花圖的trial-small-boss與舊trial別名全部退役。貼文候選不得引用這些退役檔，正式貼文圖仍需依最新核准素材做16項人工檢查。`', '`官網試喝頁目前固定使用最新核准正式試喝海報 ${TRIAL_POSTER}；已花圖的trial-small-boss與舊trial別名全部退役。貼文候選不得引用退役檔，正式貼文圖仍需依最新核准素材做16項人工檢查。`')
          s=s.replace("version:'20260813-v8'", "version:'20260814-v9'")
          s=s.replace('trialComponent:TRIAL_COMPONENT', 'trialPoster:TRIAL_POSTER')
          p.write_text(s)
      - name: Validate authority
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -q 'trial-showcase-v20260813' images/formal-display/manifest.json
          ! grep -q 'trial-showcase-v20260813' data/formal-media-authority-v20260810.json
          ! grep -q 'TRIAL_COMPONENT' publishing-center-guardian.js
          grep -q 'trial-poster-small-boss-official-v20260814.jpg' publishing-center-guardian.js
          grep -q 'const GUARD_BLOCKING=false' publishing-center-guardian.js
          node --check publishing-center-guardian.js
          node --check site-dm-authority-v20260811.js
      - name: Commit authority cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/formal-display/manifest.json data/formal-media-authority-v20260810.json site-dm-authority-v20260811.js publishing-center-guardian.js
          git commit -m 'fix(media): finalize current trial and DM authority'
          git push
