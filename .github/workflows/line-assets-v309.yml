name: LINE OA v309 assets

on:
  push:
    branches: [main]
    paths:
      - LINE_ASSETS_V309_TRIGGER.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet pillow

      - name: Generate LINE OA images
        run: python tools/apply_line_assets_v309.py

      - name: Final validation
        run: |
          python - <<'PY'
          from PIL import Image
          expected = {
              'images/line-mascot/xianjiawei-mascot-line-welcome.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-products.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-recommend.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-combo.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-usage.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-faq.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-service.jpg': (1200, 900),
              'images/line-mascot/xianjiawei-mascot-line-brand.jpg': (1200, 900),
              'images/line/xianjiawei-rich-menu-2500x1686-v309.jpg': (2500, 1686),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  assert image.size == size, (path, image.size)
                  image.verify()
          print('LINE OA v309 image validation passed')
          PY

      - name: Remove one-time files
        run: |
          rm -f LINE_ASSETS_V309_TRIGGER.txt
          rm -f tools/apply_line_assets_v309.py
          rm -f .github/workflows/line-assets-v309.yml

      - name: Commit production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LINE OA v309：更新清晰小老闆圖與放大文字 Rich Menu" || exit 0
          git push origin main
