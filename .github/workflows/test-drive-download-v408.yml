name: Test Drive download v408
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  test:
    if: github.event.issue.title == 'TEST_DRIVE_V408'
    runs-on: ubuntu-latest
    steps:
      - name: Test unauthenticated download
        run: |
          set +e
          exec > >(tee /tmp/drive-test.log) 2>&1
          ID='1GSIqMNPL-bbbl12kOnLj1Xqu6-2yGxUs'
          for url in \
            "https://drive.google.com/uc?export=download&id=$ID" \
            "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; do
            echo "URL=$url"
            rm -f /tmp/out
            curl -L --fail --silent --show-error -D /tmp/headers "$url" -o /tmp/out
            echo "curl=$? size=$(stat -c%s /tmp/out 2>/dev/null)"
            head -20 /tmp/headers || true
            file /tmp/out || true
            sha256sum /tmp/out || true
          done
      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const log=fs.readFileSync('/tmp/drive-test.log','utf8');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`DRIVE_TEST\n\n\`\`\`\n${log.slice(-20000)}\n\`\`\``});
