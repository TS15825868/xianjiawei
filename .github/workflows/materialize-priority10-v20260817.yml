name: 仙加味第一批10篇正式生活情境圖上線

on:
  push:
    branches: [main]
    paths:
      - 'asset-staging/priority10-v20260817-parts40/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild ZIP from verified text chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(find asset-staging/priority10-v20260817-parts40 -name 'part-*' -type f | wc -l)" -eq 25
          cat asset-staging/priority10-v20260817-parts40/part-* > /tmp/priority10.b64
          base64 -d /tmp/priority10.b64 > /tmp/priority10.zip
          unzip -t /tmp/priority10.zip
          rm -rf images/posts/priority10-v20260817
          mkdir -p images/posts/priority10-v20260817
          unzip -o /tmp/priority10.zip -d images/posts/priority10-v20260817
      - name: Validate formal images and manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('images/posts/priority10-v20260817')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['count']==10, manifest.get('count')
          files=sorted(root.glob('*.webp'))
          assert len(files)==10, len(files)
          for p in files:
              with Image.open(p) as im:
                  assert im.format=='WEBP', (p,im.format)
                  assert im.size==(1080,1350), (p,im.size)
              assert p.stat().st_size>50000, (p,p.stat().st_size)
              print('PASS',p,p.stat().st_size)
          ids={x['id'] for x in manifest['posts']}
          assert ids=={p.stem for p in files}
          print('PASS priority10 manifest/image one-to-one')
          PY
      - name: Commit formal assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/priority10-v20260817
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'feat(posts): publish priority10 formal lifestyle visuals'
          git push
