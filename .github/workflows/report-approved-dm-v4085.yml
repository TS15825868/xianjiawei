name: Report approved DM v408.5

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_APPROVED_DM_FAILURE_2'
    runs-on: ubuntu-latest
    steps:
      - name: Report failed log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 29235830284 --repo "${{ github.repository }}" --log-failed > /tmp/failed.log 2>&1 || true
          {
            echo 'APPROVED_DM_FAILURE_LOG_2'
            echo '```text'
            tail -120 /tmp/failed.log
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
