name: Report approved DM v408.5

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_APPROVED_DM_FINAL_FAILURE'
    runs-on: ubuntu-latest
    steps:
      - name: Report failed log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 29236159990 --repo "${{ github.repository }}" --log-failed > /tmp/failed.log 2>&1 || true
          {
            echo 'APPROVED_DM_FINAL_FAILURE_LOG'
            echo '```text'
            tail -160 /tmp/failed.log
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
