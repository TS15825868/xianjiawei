name: Promote exact product/trial release v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-product-trial-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote exact 180cc product role and v8 cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_version='20260813-trial-product-role-fix-v7'
          version='20260813-trial-product-role-fix-v8'
          old_180='images/products-v2/guilu-drink-180.jpeg'
          new_180='images/customer-display-v20260812/guilu-drink-180cc-product.jpg'
          files=[
            'site-customer-display-v20260812.js','site-product-image-safety.js','site-product-data-authority.js',
            'site-public-image-retirement-v20260812.js','site-formal-media-v20260810.js','site.js',
            'images/formal-display/manifest.json','data/formal-media-authority-v20260810.json',
            'product-guilu-drink-180cc.html','trial.html','tools/bump_site_entry_cache_v20260812.py'
          ]
          for name in files:
              p=Path(name); text=p.read_text(encoding='utf-8')
              p.write_text(text.replace(old_180,new_180).replace(old_version,version),encoding='utf-8')

          p=Path('trial.html'); text=p.read_text(encoding='utf-8')
          text=text.replace('.trial-showcase__mascot{min-height:430px}', '.trial-showcase__mascot{margin:0!important;width:100%!important;min-height:0!important;max-height:none!important}')
          text=text.replace('.trial-showcase__mascot img{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:32% 78%!important;transform:none!important;filter:none!important}', '.trial-showcase__mascot img{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;max-height:none!important;object-fit:contain!important;object-position:center!important;transform:none!important;filter:none!important}')
          text=text.replace('.trial-showcase__mascot{min-height:320px;max-height:380px}', '.trial-showcase__mascot{min-height:0!important;max-height:none!important}')
          text=text.replace('.trial-showcase__mascot img{object-position:32% 78%!important}', '.trial-showcase__mascot img{object-position:center!important}')
          p.write_text(text,encoding='utf-8')

          subprocess.run(['python','tools/bump_site_entry_cache_v20260812.py'],check=True)
          for f in Path('_upload').glob('180cc-hd-v7.part-*'): f.unlink()
          marker=Path('_upload/180cc-hd-v7.ready')
          if marker.exists(): marker.unlink()
          PY

      - name: Validate v8 public media roles and trial layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          V='20260813-trial-product-role-fix-v8'
          IMG='images/customer-display-v20260812/guilu-drink-180cc-product.jpg'
          SHA='719bd0a0823693c17e288ee2e4445874c9730710ce08de722c2d54c66e840e62'
          for name in [IMG,'images/products-v3/guilu-drink-180.jpg']:
              b=Path(name).read_bytes(); assert len(b)==315576 and hashlib.sha256(b).hexdigest()==SHA and b[:3]==b'\xff\xd8\xff'
          active=['site-customer-display-v20260812.js','site-product-image-safety.js','site-product-data-authority.js','site-public-image-retirement-v20260812.js','product-guilu-drink-180cc.html','trial.html','images/formal-display/manifest.json','data/formal-media-authority-v20260810.json']
          for name in active:
              text=Path(name).read_text(encoding='utf-8'); assert IMG in text, name
              assert 'images/products-v2/guilu-drink-180.jpeg' not in text, name
          a=json.loads(Path('data/formal-media-authority-v20260810.json').read_text(encoding='utf-8'))
          m=json.loads(Path('images/formal-display/manifest.json').read_text(encoding='utf-8'))
          assert a['runtime']==V and m['runtime']==V
          p180=next(p for p in a['products'] if p['id']=='guilu-drink-180cc')
          assert p180['image']=='/'+IMG and p180['dm']=='/images/dm-approved-v20260810/guilu-drink-180cc.webp'
          assert m['products']['guilu-drink-180']['path']=='/'+IMG
          trial=Path('trial.html').read_text(encoding='utf-8')
          for bad in ['trial.webp','trial-clean-v4.svg','trial-small-boss.webp','trial-small-boss.jpg','trial-small-boss.png']: assert bad not in trial
          for token in ['data-trial-showcase="official"','trial-product-card__media','trial-product-card__content','trial-product-card__actions','height:auto!important','object-fit:contain!important','margin:0!important','data-product-key="drink30"','data-product-key="drink180"']: assert token in trial, token
          assert 'object-fit:cover!important' not in trial
          assert 'min-height:320px;max-height:380px' not in trial and 'min-height:430px' not in trial
          site=Path('site.js').read_text(encoding='utf-8'); assert f'const VERSION = "{V}"' in site
          pat=re.compile(r'(?:src|href)=["\']site(?:-[^?"\']+)?\.(?:js|css)\?v=([^"\']+)["\']',re.I)
          vals=[(p.name,v) for p in Path('.').glob('*.html') for v in pat.findall(p.read_text(encoding='utf-8'))]
          assert vals and not [(n,v) for n,v in vals if v!=V]
          ux=Path('site-ux-v4104.css').read_text(encoding='utf-8'); assert 'body.ux-v410 .hero__content::after' in ux and 'content:none!important' in ux
          brand=Path('brand.html').read_text(encoding='utf-8'); assert 'images/brand/hd-v20260812/brand-story.png' in brand
          print('PASS v8:',len(vals),'cache refs; exact 180cc product alias; separate DM; stable trial natural layout')
          PY

      - name: Commit v8 site release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/*'
          if git diff --cached --quiet; then echo 'No v8 site changes required.'; exit 0; fi
          git commit -m 'fix(site): publish exact 180cc product and stable trial layout v8'
          git push origin HEAD:main
