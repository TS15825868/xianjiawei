name: Apply approved DM binary v408.5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-dm-binary-v4085
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_APPROVED_DM_BINARY_V408_5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install image validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Decode the approved six DM images
        run: |
          set -euo pipefail
          rm -rf /tmp/xjw-approved-dm
          mkdir -p /tmp/xjw-approved-dm images/dm-final
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import string
          raw=Path('_upload/dm-v408.zip.b64').read_text(encoding='utf-8',errors='ignore')
          allowed=set(string.ascii_letters+string.digits+'+/=')
          clean=''.join(ch for ch in raw if ch in allowed)
          clean += '=' * ((4-len(clean)%4)%4)
          Path('/tmp/dm-v408.zip').write_bytes(base64.b64decode(clean,validate=False))
          PY
          unzip -q /tmp/dm-v408.zip -d /tmp/xjw-approved-dm
          test "$(find /tmp/xjw-approved-dm/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          for f in /tmp/xjw-approved-dm/dm-final/*.webp; do
            identify -format '%w %h' "$f" | grep -qx '1122 1402'
            test "$(stat -c%s "$f")" -gt 100000
          done
          cp -f /tmp/xjw-approved-dm/dm-final/*.webp images/dm-final/

      - name: Point DM pages to the actual approved files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION='408.5'
          DM_BY_ID={
            'guilu-gao':'images/dm-final/01_guilu-gao-100g-dm.webp',
            'guilu-drink-30':'images/dm-final/02_guilu-drink-30cc-dm.webp',
            'guilu-drink-180':'images/dm-final/03_guilu-drink-180cc-dm.webp',
            'luerong-fen':'images/dm-final/04_luerong-fen-75g-dm.webp',
            'guilu-tangkuai':'images/dm-final/05_guilu-tangkuai-75g-dm.webp',
            'guilu-jiao':'images/dm-final/06_guilu-jiao-600g-dm.webp',
          }
          OLD_TO_NEW={
            'images/dm-final/01_guilu-gao-100g-dm.jpg':DM_BY_ID['guilu-gao'],
            'images/dm-final/02_guilu-drink-30cc-dm.jpg':DM_BY_ID['guilu-drink-30'],
            'images/dm-final/03_guilu-drink-180cc-dm.jpg':DM_BY_ID['guilu-drink-180'],
            'images/dm-final/04_luerong-fen-75g-dm.jpg':DM_BY_ID['luerong-fen'],
            'images/dm-final/05_guilu-tangkuai-75g-dm.jpg':DM_BY_ID['guilu-tangkuai'],
            'images/dm-final/06_guilu-jiao-600g-dm.jpg':DM_BY_ID['guilu-jiao'],
          }

          data_path=Path('data.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          for p in data['products']:
            p['image']=re.sub(r'\?v=[0-9.]+$',f'?v={VERSION}',p['image'])
            p['dmImage']=f"{DM_BY_ID[p['id']]}?v={VERSION}"
            p['detailImages']=[p['dmImage']]
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          text_paths=[Path('dm.html'),Path('site.js'),Path('deploy-version.json'),Path('.github/workflows/deploy-pages.yml')]
          text_paths += list(Path('.').glob('product-*.html'))
          for path in text_paths:
            if not path.exists():
              continue
            text=path.read_text(encoding='utf-8')
            for old,new in OLD_TO_NEW.items():
              text=text.replace(old,new)
            text=text.replace('v408.4',f'v{VERSION}').replace('?v=408.4',f'?v={VERSION}')
            text=text.replace('"version": "408.4"',f'"version": "{VERSION}"')
            path.write_text(text,encoding='utf-8')

          for path in Path('.').glob('*.html'):
            text=path.read_text(encoding='utf-8')
            text=re.sub(r'(\.(?:css|js|json|jpg|jpeg|png|webp|avif))\?v=[0-9.]+',lambda m:m.group(1)+f'?v={VERSION}',text)
            path.write_text(text,encoding='utf-8')

          site=Path('site.js').read_text(encoding='utf-8')
          site=re.sub(r'仙加味網站核心｜整合正式版 v[0-9.]+',f'仙加味網站核心｜整合正式版 v{VERSION}',site)
          site=re.sub(r"data\.json\?v=[0-9.]+",f'data.json?v={VERSION}',site)
          assert "const detailImage = p.image" in site
          Path('site.js').write_text(site,encoding='utf-8')

          deploy={
            'version':VERSION,
            'updated':'2026-07-13',
            'status':'production-ready',
            'catalog':'five-types-six-specifications',
            'imagePolicy':{
              'productCards':'verified-original-product-image',
              'quickViewModal':'verified-original-product-image',
              'detailHero':'verified-original-product-image',
              'detailDM':'six-user-approved-final-dm-webp',
              'detailMascot':'approved-page-specific-mascot',
              'dmPage':'six-user-approved-final-dm-webp'
            },
            'frontend':'single-site-js-and-single-site-css',
            'automation':'main-only-auto-deploy-and-trusted-pr-auto-merge',
            'safety':'approved-dm-binary-content-verified-1122x1402'
          }
          Path('deploy-version.json').write_text(json.dumps(deploy,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          workflow=Path('.github/workflows/deploy-pages.yml')
          wf=workflow.read_text(encoding='utf-8')
          wf=wf.replace('v408.4',f'v{VERSION}').replace('?v=408.4',f'?v={VERSION}')
          wf=wf.replace('"version": "408.4"',f'"version": "{VERSION}"')
          for old,new in OLD_TO_NEW.items():
            wf=wf.replace(old,new)
          workflow.write_text(wf,encoding='utf-8')
          PY

      - name: Remove superseded DM files and temporary files
        run: |
          rm -f images/dm-final/01_guilu-gao-100g-dm.jpg
          rm -f images/dm-final/02_guilu-drink-30cc-dm.jpg
          rm -f images/dm-final/03_guilu-drink-180cc-dm.jpg
          rm -f images/dm-final/04_luerong-fen-75g-dm.jpg
          rm -f images/dm-final/05_guilu-tangkuai-75g-dm.jpg
          rm -f images/dm-final/06_guilu-jiao-600g-dm.jpg
          rm -rf _upload
          rm -f .github/workflows/test-drive-download.yml
          rm -f .github/workflows/report-approved-dm-v4085.yml
          rm -f .github/workflows/apply-approved-dm-binary-v4085.yml

      - name: Final validation
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.5"' deploy-version.json
          grep -q '仙加味網站核心｜整合正式版 v408.5' site.js
          grep -q "const detailImage = p.image" site.js
          test "$(find images/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          test "$(find images/dm-final -maxdepth 1 -name '*-dm.jpg' | wc -l)" -eq 0
          for f in images/dm-final/*.webp; do
            identify -format '%w %h' "$f" | grep -qx '1122 1402'
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(data['products'])==6
          for p in data['products']:
            assert p['image'].startswith('images/products-v3/')
            assert p['dmImage'].startswith('images/dm-final/') and p['dmImage'].endswith('.webp?v=408.5')
            assert p['detailImages']==[p['dmImage']]
          dm=Path('dm.html').read_text(encoding='utf-8')
          assert dm.count('class="dm-image-v2"')==6
          assert dm.count('images/dm-final/')>=12
          assert '.jpg?v=408.5' not in '\n'.join(line for line in dm.splitlines() if 'dm-final/' in line)
          pages=[
            'product-guilu-gao.html','product-guilu-drink-30cc.html','product-guilu-drink-180cc.html',
            'product-guilu-tangkuai.html','product-guilu-jiao.html','product-luerong-fen.html'
          ]
          for page in pages:
            text=Path(page).read_text(encoding='utf-8')
            assert 'images/products-v3/' in text
            assert 'images/dm-final/' in text and '.webp?v=408.5' in text
          PY

      - name: Commit approved binary DM files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '實際替換六張核准正式DM圖檔 v408.5'
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.5_APPROVED_DM_BINARY_SUCCESS｜六張DM檔案內容已實際替換為使用者核准的1122×1402正式版；產品卡與快速查看仍使用真實產品原圖。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
