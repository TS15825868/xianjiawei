name: 官網單次公開圖片來源同步

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.event.issue.title == 'ONE_TIME_SITE_PUBLIC_IMAGE_SYNC_20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 統一公開30cc圖片來源
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          old_absolute = 'https://ts15825868.github.io/xianjiawei/images/guilu-drink-30cc-glass.jpg?v=412.1'
          old_relative = 'images/guilu-drink-30cc-glass.jpg?v=412.1'
          old_dm = 'images/dm-final/02_guilu-drink-30cc-dm.jpg?v=20260805'
          new_absolute = 'https://ts15825868.github.io/xianjiawei/images/products-v3/guilu-drink-30.jpg?v=20260805'
          new_relative = 'images/products-v3/guilu-drink-30.jpg?v=20260805'

          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          drink30 = next(item for item in data['products'] if item.get('id') == 'guilu-drink-30')
          drink30['image'] = new_relative
          drink30['dmImage'] = new_relative
          drink30['detailImages'] = [new_relative]
          drink30['imagePolicy'] = 'official-original-contain-no-crop'
          data['version'] = '2026-08-06-canonical-v3'
          data['catalogVersion'] = '2026-08-06-canonical-v3'
          data['updatedAt'] = '2026-08-06'
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          text_targets = [
            'llms-full.txt',
            'brand-facts.html',
            'index.html',
            'choose.html',
            'guide.html',
            'faq.html',
          ]
          for rel in text_targets:
            path = Path(rel)
            if not path.exists():
              continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = text.replace(old_absolute, new_absolute).replace(old_relative, new_relative).replace(old_dm, new_relative)
            if updated != text:
              path.write_text(updated, encoding='utf-8')

          sources = [
            Path('data.json'), Path('catalog-public.json'), Path('geo-data.json'),
            Path('llms.txt'), Path('llms-full.txt'), Path('product-guilu-drink-30cc.html'),
            Path('dm.html'), Path('products.html')
          ]
          public = '\n'.join(path.read_text(encoding='utf-8', errors='ignore') for path in sources if path.exists())
          for forbidden in [
            'images/guilu-drink-30cc-glass.jpg',
            'images/dm-final/02_guilu-drink-30cc-dm.jpg',
            'guilu-drink-30-clean.svg'
          ]:
            if forbidden in public:
              raise SystemExit(f'公開來源仍含舊30cc圖片：{forbidden}')
          assert new_relative in Path('data.json').read_text(encoding='utf-8')
          assert new_absolute in Path('catalog-public.json').read_text(encoding='utf-8')
          assert new_absolute in Path('geo-data.json').read_text(encoding='utf-8')
          assert new_relative in Path('product-guilu-drink-30cc.html').read_text(encoding='utf-8')

          Path('.github/workflows/one-time-public-image-sync.yml').unlink()
          PY

      - name: 提交並移除本流程
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(site): align every public 30cc source with canonical image'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 關閉一次性Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body '官網公開30cc圖片來源同步已執行；未修改或發布任何社群貼文。' || true
          gh issue close "$NUMBER" --reason completed || true
