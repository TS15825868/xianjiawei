name: 官網龜鹿飲主打策略同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/apply_drink_lead_strategy.py"
      - "tools/enforce_canonical_public_product_wording.py"
      - "data/marketing-priority.json"
      - ".github/workflows/drink-lead-strategy.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-drink-lead-strategy
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply drink-led homepage and product order
        run: python3 tools/apply_drink_lead_strategy.py --write

      - name: Normalize public 30cc glass jar wording
        run: python3 tools/enforce_canonical_public_product_wording.py --write

      - name: Verify strategy, wording and file integrity
        run: |
          set -euo pipefail
          python3 tools/apply_drink_lead_strategy.py
          python3 tools/enforce_canonical_public_product_wording.py
          git diff --check

      - name: Commit public strategy updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data.json catalog-public.json geo-data.json llms.txt llms-full.txt product-*.html products.html choose.html dm.html data/marketing-priority.json || true
          if git diff --cached --quiet; then
            echo '龜鹿飲主打策略與小玻璃罐用語已同步。'
          else
            git commit -m 'feat(site): lead with guilu drink and preserve gao as brand anchor'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
