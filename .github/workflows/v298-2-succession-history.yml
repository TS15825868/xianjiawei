name: v298.2 succession history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add approximate succession milestone
        shell: python
        run: |
          from pathlib import Path

          path = Path('brand.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
            '<h3>父親｜從協助祖父開始，逐步承接第三代</h3>\n      <p>父親出生於1964年，長期在祖父「鹿角伯」身邊協助原料處理、鹿角工序、代工加工與日常營運，從實際工作中逐步累積經驗。之後承接第三代工作，延續家族對原料、製程、火候與成品穩定度的要求。</p>',
            '<h3>父親｜從協助祖父開始，承接第三代工作</h3>\n      <p>父親出生於1964年，長期在祖父「鹿角伯」身邊協助原料處理、鹿角工序、代工加工與日常營運，從實際工作中逐步累積經驗。約2000年前後鹿角伯辭世後，父親正式承接第三代工作，延續家族對原料、製程、火候與成品穩定度的要求。</p>'
          )

          text = text.replace(
            '<h2>從老店學藝、獨立經營，到第三代協作與第四代品牌整理</h2>',
            '<h2>從老店學藝、獨立經營，到第三代承接與第四代品牌整理</h2>'
          )

          marker = '''    <article class="card reveal">
      <p class="eyebrow">仙加味品牌</p>
      <h3>把家族經驗整理成清楚的品牌資訊</h3>
      <p>「仙加味」成為面向消費者的品牌名稱，保留傳統食補的核心，同時把產品資訊、使用方式與生活情境整理得更清楚。</p>
    </article>'''

          succession = '''    <article class="card reveal">
      <p class="eyebrow">約2000年前後</p>
      <h3>鹿角伯辭世，第三代正式承接</h3>
      <p>父親原已長期在祖父身邊協助家族事業與代工加工；鹿角伯辭世後，第三代正式承接原料處理、工序與日常經營，延續家族累積的專業與信用。</p>
    </article>'''

          if succession not in text:
            text = text.replace(marker, succession + '\n' + marker)

          text = text.replace('site.css?v=298.1', 'site.css?v=298.2')
          text = text.replace('site.js?v=298.1', 'site.js?v=298.2')
          path.write_text(text, encoding='utf-8')

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/v298-2-succession-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.2: add approximate 鹿角伯 succession milestone"
          git push origin main
