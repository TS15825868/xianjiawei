name: 仙加味官網目前權威完整驗收（手動）

# 全面整理期間維持手動；目前官網公開產品為六項。
# 暫緩對外產品不得由舊七項資料重新加入官網、AI/GEO、FAQ或公開貼文。
# 龜鹿飲30cc最新正式用法為每日 1–2 罐。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-current-release-audit
  cancel-in-progress: true

jobs:
  current-authority-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate six-product current authority
        run: |
          set -euo pipefail
          python -m json.tool public-product-master.json >/dev/null
          python -m json.tool ai-answers.json >/dev/null
          python -m json.tool geo-data.json >/dev/null
          python -m json.tool assets/data/official-products.json >/dev/null
          python -m json.tool config/official-products.json >/dev/null
          python tools/validate-current-authority-no-stale-blockers.py
          python tools/validate-ai-geo-current-v20260820.py

      - name: Check current runtime syntax
        run: |
          set -euo pipefail
          for file in site.js site-core-v410.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-public-content-cleanup-v20260809.js site-public-image-retirement-v20260812.js site-mascot-placement-v20260812.js site-stability-v20260814.js; do
            node --check "$file"
          done

      - name: Validate current compatibility sync without writing
        run: python tools/sync-current-derived-authority.py

      - name: Public safety spot-check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          current='每日 1–2 罐'
          deferred_name='柒玄茶・龜鹿調飲粉'
          deferred_id='qixuan-guilu-drink-powder'
          master=json.loads(Path('public-product-master.json').read_text(encoding='utf-8'))
          assert master['productCount']==6
          assert len(master['products'])==6
          assert next(p for p in master['products'] if p['id']=='guilu-drink-30')['usage'][0]==current
          for rel in ['public-product-master.json','ai-answers.json','geo-data.json','llms.txt','llms-full.txt','index.html','products.html','faq.html','brand-facts.html']:
              text=Path(rel).read_text(encoding='utf-8')
              assert deferred_name not in text, rel
              assert deferred_id not in text, rel
          print('PASS: six public products only; deferred product absent from public surfaces; 30cc daily 1–2 cans.')
          PY

      - name: Maintenance guard policy check
        run: |
          node <<'NODE'
          const mode=require('./config/guard-mode.json');
          if(mode.mode!=='paused_for_full_system_update'||mode.blocking!==false||mode.keep_minimum_safety!==true)throw new Error('maintenance guard mode changed unexpectedly');
          console.log('PASS: automatic blockers remain paused; current-authority audits stay manual during cleanup.');
          NODE

      - name: Ensure audit is read-only
        run: git diff --exit-code
