name: 仙加味官網目前權威完整驗收（手動）

# 全面整理期間維持手動；只依目前正式 authority 驗證資料、媒體、公開頁、AIO／SEO／GEO與貼文圖文能力。
# 文字／AI知識為七項目前正式產品；正式產品圖／DM媒體目前為六項。30cc最新正式用法為每日 1–2 罐。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-current-release-audit
  cancel-in-progress: true

jobs:
  current-authority-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate current seven-product text authority
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool public-product-master.json >/dev/null
          python -m json.tool ai-answers.json >/dev/null
          python -m json.tool geo-data.json >/dev/null
          python -m json.tool assets/data/official-products.json >/dev/null
          python -m json.tool config/official-products.json >/dev/null
          python tools/validate-ai-geo-current-v20260820.py
          python tools/validate-current-authority-no-stale-blockers.py
          python - <<'PY'
          import json
          from pathlib import Path

          CURRENT_30='每日 1–2 罐'
          master=json.loads(Path('public-product-master.json').read_text(encoding='utf-8'))
          public=json.loads(Path('assets/data/official-products.json').read_text(encoding='utf-8'))
          config=json.loads(Path('config/official-products.json').read_text(encoding='utf-8'))
          expected={
            'guilu-gao':'100g／罐',
            'guilu-drink-30':'30cc／罐（小玻璃罐）',
            'guilu-drink-180':'180cc／包（鋁袋）',
            'guilu-tangkuai':'75g （2兩）／盒｜8塊裝',
            'guilu-jiao':'600g （1斤）／盒｜32塊裝',
            'luerong-fen':'75g／罐',
            'qixuan-guilu-drink-powder':'2g／小包；20g／包（10小包）',
          }
          assert master.get('authority')=='user-confirmed-current'
          assert master.get('productCount')==7 and len(master.get('products') or [])==7
          mb={p['id']:p for p in master['products']}
          pb={p['id']:p for p in public.get('products') or []}
          cb={p['id']:p for p in config.get('products') or []}
          assert set(mb)==set(expected)==set(pb)==set(cb)
          for pid,spec in expected.items():
            assert mb[pid]['specification']==spec, (pid,'public master',mb[pid].get('specification'))
            public_spec=pb[pid].get('specification')
            config_spec=cb[pid].get('spec')
            assert public_spec==spec, (pid,'public authority',public_spec)
            assert config_spec==spec, (pid,'config authority',config_spec)
          assert mb['guilu-drink-30']['usage'][0]==CURRENT_30
          assert pb['guilu-drink-30']['usage_primary']==CURRENT_30
          assert cb['guilu-drink-30']['usage_primary']==CURRENT_30
          assert mb['guilu-drink-180']['usage'][0]=='每日一包'
          assert len(public.get('approved_media_product_ids') or [])==6
          assert len(config.get('approved_media_product_ids') or [])==6
          assert pb['qixuan-guilu-drink-powder']['media_status']=='formal-product-image-pending'
          print('PASS: seven-product text authority + six-approved-media model + current 30cc daily 1–2 cans.')
          PY

      - name: Run current public surface validators
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate-site-production-release-v20260809.py
          python tools/validate-public-customer-pages-v20260809.py
          python tools/validate-visual-cohesion-v20260809.py
          python tools/validate_public_aio_seo.py
          python tools/validate-public-boundary-v20260808.py
          python tools/validate-publishing-content-match-v20260809.py
          python tools/validate-post-bank-current-authority-v20260809.py

      - name: Validate current product image DM and trial authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const J=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const local=p=>String(p||'').split('?')[0].replace(/^\//,'');
          const kind=p=>{if(!fs.existsSync(p))return'';const b=fs.readFileSync(p);if(b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return'jpeg';if(b.subarray(0,8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a])))return'png';if(b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP')return'webp';if(b.subarray(4,16).toString().includes('ftypavif'))return'avif';return''};
          const a=J('data/formal-media-authority-v20260810.json');
          const m=J('images/formal-display/manifest.json');
          const official=J('assets/data/official-products.json');
          const byOfficial=new Map((official.products||[]).map(x=>[x.id,x]));
          const idMap={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'};
          const manifestKeys={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'};
          must(a.runtime===m.runtime,'authority與manifest runtime不同步');
          must(a.approval_batch===m.approval_batch,'authority與manifest approval batch不同步');
          must(Array.isArray(a.products)&&a.products.length===6,'正式媒體產品不是六項');
          must(byOfficial.size===7,'目前文字／AI產品權威不是七項');
          must((official.approved_media_product_ids||[]).length===6,'目前核准媒體產品數不是六項');
          for(const p of a.products){
            const current=byOfficial.get(idMap[p.id]);
            must(current,`找不到目前正式產品 ${p.id}`);
            must(p.spec===current.specification,`媒體authority主規格未同步 ${p.id}: ${p.spec} != ${current.specification}`);
            const image=local(p.image),dm=local(p.dm),mk=manifestKeys[p.id];
            must(['jpeg','png','webp','avif'].includes(kind(image)),`產品主圖不可解碼 ${image}`);
            must(['jpeg','png','webp','avif'].includes(kind(dm)),`詳細DM不可解碼 ${dm}`);
            must(image!==dm,`產品主圖與詳細DM角色混用 ${p.id}`);
            must(local(m.products?.[mk]?.path)===image,`manifest產品主圖不同步 ${p.id}`);
          }
          const p30=a.products.find(x=>x.id==='guilu-drink-30cc');
          must(p30.name==='龜鹿飲30cc玻璃罐'&&!/玻璃瓶|30cc／瓶|瓶裝/.test(JSON.stringify(p30)),'30cc正式名稱／規格回退成瓶');
          must(local(p30.dm)==='images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg','30cc詳細DM不是目前核准JPG');
          const p180=a.products.find(x=>x.id==='guilu-drink-180cc');
          must(local(p180.image)==='images/customer-display-v20260812/guilu-drink-180cc-product.jpg','180cc產品主圖角色錯誤');
          must(local(p180.dm)!==local(p180.image),'180cc產品主圖被詳細DM取代');
          if(p180.sha256){const b=fs.readFileSync(local(p180.image));must(crypto.createHash('sha256').update(b).digest('hex')===p180.sha256,'180cc核准產品原圖hash不符');}
          must(a.trial?.render_mode==='poster'&&a.trial?.status==='approved_user_original','試喝目前不是核准海報模式');
          const trialPath=local(a.trial.image||a.trial.path),manifestTrial=local(m.trial?.path);
          must(trialPath===manifestTrial,'authority與manifest試喝海報不同步');
          must(trialPath==='images/trial/trial-poster-small-boss-official-v20260814.jpg','試喝不是目前核准正式海報');
          must(kind(trialPath)==='jpeg','正式試喝海報不可解碼');
          console.log('PASS: seven-product authority + six separated product/DM media + approved trial poster.');
          NODE

      - name: Validate runtime authority and current 30cc behavior
        shell: bash
        run: |
          set -euo pipefail
          for file in site.js site-core-v410.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-public-content-cleanup-v20260809.js site-public-image-retirement-v20260812.js site-mascot-placement-v20260812.js site-stability-v20260814.js publishing-center-data-v16-actual-product-photos.js publishing-center-data-v18-content-media-match.js publishing-center-data-current-authority-guard.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs=require('fs');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const authorityJs=fs.readFileSync('site-product-data-authority.js','utf8');
          const customerDisplay=fs.readFileSync('site-customer-display-v20260812.js','utf8');
          const p30=fs.readFileSync('product-guilu-drink-30cc.html','utf8');
          const faq=fs.readFileSync('faq.html','utf8');
          const guide=fs.readFileSync('guide.html','utf8');
          const CURRENT='每日 1–2 罐';
          must(authorityJs.includes(`const CURRENT_30_USAGE='${CURRENT}'`),'前端產品權威沒有鎖定30cc每日1–2罐');
          must(!authorityJs.includes("['每日 1-2罐','每日一罐']"),'前端仍會把1–2罐覆寫成每日一罐');
          must(customerDisplay.includes(`const CURRENT_30_USAGE='${CURRENT}'`),'顧客顯示層沒有鎖定30cc目前用法');
          must(customerDisplay.includes('trial-poster-small-boss-official-v20260814.jpg'),'顧客顯示層仍使用舊試喝元件／圖片');
          must(customerDisplay.includes('每塊約18.75g'),'顧客顯示層龜鹿膠約重不是目前格式');
          for(const [name,text] of [['30cc產品頁',p30],['FAQ',faq],['使用指南',guide]])must(text.includes(CURRENT),`${name}缺少目前30cc用法`);
          const trial=fs.readFileSync('trial.html','utf8');
          must(trial.includes('trial-poster-small-boss-official-v20260814.jpg'),'trial.html不是目前試喝主圖');
          const dm=fs.readFileSync('dm.html','utf8');
          must(dm.includes('02_guilu-drink-30cc-dm-official-v20260814.jpg'),'dm.html 30cc不是目前正式DM');
          console.log('PASS: runtime no longer downgrades current product facts or media roles.');
          NODE

      - name: Verify retired write-back workflows are gone
        run: |
          node <<'NODE'
          const fs=require('fs');const retired=[
            '.github/workflows/install-trial-poster-v9.yml',
            '.github/workflows/install-trial-poster-v10.yml',
            '.github/workflows/install-trial-poster-v11.yml',
            '.github/workflows/install-trial-poster-v12.yml',
            '.github/workflows/install-trial-poster-v14.yml',
            '.github/workflows/audit-square-trial-assets-v12.yml',
            '.github/workflows/bump-site-entry-cache-v20260812.yml',
            'tools/bump_site_entry_cache_v20260812.py',
          ];
          for(const file of retired)if(fs.existsSync(file))throw new Error(`退役舊版寫回工具仍存在：${file}`);
          console.log('PASS: retired trial/cache write-back paths are removed.');
          NODE

      - name: Maintenance guard policy check
        run: |
          node <<'NODE'
          const mode=require('./config/guard-mode.json');
          if(mode.mode!=='paused_for_full_system_update'||mode.blocking!==false||mode.keep_minimum_safety!==true)throw new Error('maintenance guard mode changed unexpectedly');
          console.log('PASS: automatic blockers remain paused; current-authority audits stay manual during cleanup.');
          NODE

      - name: Ensure audit is read-only
        run: git diff --exit-code
