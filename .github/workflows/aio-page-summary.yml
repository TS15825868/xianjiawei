name: 【暫停自動】官網 AIO 摘要與結構化資料守門員

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aio-page-summary-manual
  cancel-in-progress: true

jobs:
  verify-manually:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - name: Verify AIO summaries manually
        run: python3 tools/enforce_aio_page_summaries.py
