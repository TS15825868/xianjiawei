name: Stage original 龍鳳登古飲 two physical package photos
on:
  push:
    branches: [main]
    paths:
      - 'ops/stage-longfeng-denggu-two-photos-v20261016.py'
      - '.github/workflows/stage-longfeng-two-real-packages-v20261016.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xjw-longfeng-physical-photo-stage
  cancel-in-progress: true
jobs:
  stage-true-box-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare deterministic photo masks
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "opencv-python-headless>=4.9,<5" "numpy>=1.26,<3"
      - name: Stage original blue/pink photographs without invented ingredients
        run: python ops/stage-longfeng-denggu-two-photos-v20261016.py
      - name: Check both variants are independent photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re
          base=Path("images/partner-products/longfeng-denggu-review-v20261016-v2")
          x=json.loads((base/"manifest.json").read_text())
          assert len(x["products"])==2
          assert {p["variant"] for p in x["products"]}=={"男方","女方"}
          assert len({p["sha256"] for p in x["products"]})==2
          for p in x["products"]:
              assert p["ingredients"] is None and p["usage"] is None
              assert re.fullmatch(r"[0-9a-f]{64}",p["sha256"])
              assert Path(p["source"]).is_file()
              with Image.open(p["image"]) as image: assert image.size==(1122,1402)
          print("Two unmodified source packages staged separately")
          PY
      - name: Commit new versioned review photos only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/partner-products/longfeng-denggu-review-v20261016-v2/
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "assets: stage two genuine 龍鳳登古飲 package variants for visual review"
          git pull --rebase origin main
          git push origin HEAD:main
