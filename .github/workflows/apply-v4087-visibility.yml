name: Apply visibility and product layout v408.7

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-v4087-visibility
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_VISIBILITY_V408_7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply website improvements
        run: |
          set -euo pipefail
          python3 -m pip install --quiet beautifulsoup4
          python3 tools/apply_v4087_visibility.py

      - name: Replace permanent verification workflow
        run: |
          cat > .github/workflows/verify-site-and-catalog.yml <<'YML'
          name: Verify website and shared catalog

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Static syntax and data checks
                  run: |
                    set -euo pipefail
                    python3 -m pip install --quiet beautifulsoup4
                    node --check site.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool catalog-public.json >/dev/null
                    python3 -m json.tool deploy-version.json >/dev/null
                    grep -q '"version": "408.7"' deploy-version.json
                    grep -q '"id": "guilu-drink-30"' data.json
                    grep -q '"id": "guilu-drink-180"' data.json
                    grep -q '@762jybnm' data.json
                    test "$(grep -c '<url>' sitemap.xml)" -eq 20
                    grep -q 'OAI-SearchBot' robots.txt
                    grep -q '# 仙加味' llms.txt
                    test "$(grep -c 'product-link-card' products.html)" -eq 6
                    test "$(grep -R -l '內容版本 v408.7' product-*.html | wc -l)" -eq 6
                - name: Internal link audit
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    from bs4 import BeautifulSoup
                    for page in Path('.').glob('*.html'):
                        soup=BeautifulSoup(page.read_text(encoding='utf-8'),'html.parser')
                        if page.name != 'googlec5c2af289948c263.html':
                            assert soup.find('meta',attrs={'name':'robots'}), page
                        for tag,attr in [('a','href'),('img','src'),('script','src'),('link','href')]:
                            for el in soup.find_all(tag):
                                value=el.get(attr)
                                if not value or value.startswith(('http://','https://','mailto:','tel:','data:','#','javascript:')): continue
                                target=value.split('#')[0].split('?')[0]
                                if target: assert (page.parent/target).exists(), (page,target)
                    print('internal link audit passed')
                    PY
                - name: HTTP smoke tests
                  run: |
                    set -euo pipefail
                    python3 -m http.server 8080 >/tmp/xianjiawei-http.log 2>&1 &
                    PID=$!
                    trap 'kill $PID' EXIT
                    sleep 2
                    for path in index.html products.html choose.html dm.html guide.html brand.html faq.html contact.html sitemap.xml robots.txt llms.txt data.json catalog-public.json site.js site.css product-guilu-gao.html product-guilu-drink-30cc.html product-guilu-drink-180cc.html product-guilu-tangkuai.html product-guilu-jiao.html product-luerong-fen.html; do
                      curl --fail --silent --show-error "http://127.0.0.1:8080/$path" >/dev/null
                    done
          YML

      - name: Replace GitHub Pages deployment workflow
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YML'
          name: Deploy 仙加味網站

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout main
                  uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 1
                - name: Validate production website v408.7
                  run: |
                    set -euo pipefail
                    node --check site.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool catalog-public.json >/dev/null
                    python3 -m json.tool deploy-version.json >/dev/null
                    grep -q '"version": "408.7"' deploy-version.json
                    grep -q '仙加味網站核心｜整合正式版 v408.7' site.js
                    grep -q 'site.css?v=408.7' index.html
                    grep -q 'site.js?v=408.7' index.html
                    test "$(grep -c '<url>' sitemap.xml)" -eq 20
                    test "$(grep -c 'product-link-card' products.html)" -eq 6
                    test "$(grep -o 'class="dm-image-v2"' dm.html | wc -l)" -eq 6
                    grep -q 'Sitemap: https://ts15825868.github.io/xianjiawei/sitemap.xml' robots.txt
                    grep -q '# 仙加味' llms.txt
                    echo 'ab92c43f68c2d11f33b036e99e9bc31dde3c199c187ead2032fd72bccfdac58b  images/dm-final/01_guilu-gao-100g-dm.jpg' | sha256sum -c -
                    echo 'e46b71ca2265adf544087ba3badbf430821896961c0deb4d1dbde13478d39f49  images/dm-final/02_guilu-drink-30cc-dm.jpg' | sha256sum -c -
                    echo '81f10bb54c66bb273ddbb040f3e634db3239ac4a85931916ce234f099228e5f1  images/dm-final/03_guilu-drink-180cc-dm.jpg' | sha256sum -c -
                    echo 'cdac8d1a3484e941224d3c7725b0d55b073b94286e6f4a000a7ae80e18def121  images/dm-final/04_luerong-fen-75g-dm.jpg' | sha256sum -c -
                    echo 'e5d2d0ce9413f21a0507fcee8e90a1990d408c26b39667008d68046043448d99  images/dm-final/05_guilu-tangkuai-75g-dm.jpg' | sha256sum -c -
                    echo 'f3e6a24fc83f385feb5dda38a24a310de13c46150929d6ea45cb5050caa562a9  images/dm-final/06_guilu-jiao-600g-dm.jpg' | sha256sum -c -
                - name: Prepare static website
                  run: |
                    set -euo pipefail
                    rm -rf _site
                    mkdir -p _site
                    rsync -a ./ _site/ \
                      --exclude='.git/' \
                      --exclude='.github/' \
                      --exclude='_site/' \
                      --exclude='tools/' \
                      --exclude='node_modules/' \
                      --exclude='assets/' \
                      --exclude='_upload/' \
                      --exclude='_trigger/' \
                      --exclude='.website-*/' \
                      --exclude='tmp-test*.txt' \
                      --exclude='*.zip' \
                      --exclude='*.tar' \
                      --exclude='*.tar.gz' \
                      --exclude='*.b64' \
                      --exclude='*.md' \
                      --exclude='APPLY_*' \
                      --exclude='RUN_*' \
                      --exclude='INSTALL_*' \
                      --exclude='FIX_*' \
                      --exclude='AUDIT_*' \
                      --exclude='BUTTON_AUDIT_REPORT.json' \
                      --exclude='WEBSITE_LINE_*' \
                      --exclude='rich-menu-actions-v307.json' \
                      --exclude='site-fix-v317.js'
                    touch _site/.nojekyll
                    test -s _site/index.html
                    test -s _site/products.html
                    test -s _site/dm.html
                    test -s _site/sitemap.xml
                    test -s _site/robots.txt
                    test -s _site/llms.txt
                    grep -q 'site.js?v=408.7' _site/index.html
                    grep -q 'site.css?v=408.7' _site/index.html
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - name: Deploy Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
                - name: Notify IndexNow
                  if: success()
                  continue-on-error: true
                  run: |
                    python3 - <<'PY'
                    import json, urllib.request
                    from xml.etree import ElementTree as ET
                    root=ET.parse('sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
                    urls=[n.text for n in root.findall('s:url/s:loc',ns)]
                    payload=json.dumps({'host':'ts15825868.github.io','key':'a2f6d4e8c9b14750a831d7624f90bc15','keyLocation':'https://ts15825868.github.io/xianjiawei/a2f6d4e8c9b14750a831d7624f90bc15.txt','urlList':urls}).encode()
                    req=urllib.request.Request('https://api.indexnow.org/indexnow',data=payload,headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
                    try:
                        with urllib.request.urlopen(req,timeout=20) as r: print('IndexNow',r.status)
                    except Exception as e: print('IndexNow notice failed without blocking deployment:',e)
                    PY
          YML

      - name: Remove obsolete files and workflows
        run: |
          rm -rf .website-sprite8 .website-upload .website-upload20
          rm -f AUDIT_ALL_BUTTONS_TRIGGER.txt AUDIT_ALL_BUTTONS_TRIGGER_B.txt AUDIT_STATUS.txt BUTTON_AUDIT_REPORT.json README_上傳說明.txt _upload-test.txt
          rm -f WEBSITE_LINE_INTENT_FINAL2_TRIGGER.txt WEBSITE_LINE_INTENT_FINAL3_TRIGGER.txt WEBSITE_LINE_INTENT_FINAL_TRIGGER.txt WEBSITE_LINE_INTENT_TRIGGER.txt WEBSITE_LINE_LABELS_TRIGGER.txt WEBSITE_LINE_LABELS_TRIGGER_2.txt
          rm -f rich-menu-actions-v307.json site-fix-v317.js
          rm -f .github/workflows/site-v303-push.yml .github/workflows/apply-v408-simple.yml .github/workflows/trigger-v408-once.yml .github/workflows/site-v302-publish.yml
          rm -f .github/workflows/report-deploy-v4086.yml .github/workflows/diagnose-q32-all-commits.yml .github/workflows/install-approved-dm-from-drive.yml
          rm -f .github/workflows/audit-all-website-buttons-v300-3.yml .github/workflows/apply-line-button-label-match-v300-2.yml .github/workflows/test-drive-download.yml .github/workflows/test-issue-trigger-v408.yml
          rm -f .github/workflows/report-deploy-v4086-error.yml .github/workflows/confirm-deploy-v4086-success.yml
          rm -f tools/apply_v4087_visibility.py .github/workflows/apply-v4087-visibility.yml

      - name: Final validation
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.7"' deploy-version.json
          test "$(grep -c '<url>' sitemap.xml)" -eq 20
          test "$(grep -c 'product-link-card' products.html)" -eq 6
          test "$(grep -R -l '內容版本 v408.7' product-*.html | wc -l)" -eq 6
          test -s llms.txt
          test -s a2f6d4e8c9b14750a831d7624f90bc15.txt

      - name: Commit directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '整站搜尋可見性與產品介紹精簡正式版 v408.7'
          git push origin HEAD:main

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.7_SUCCESS｜已統一五大型態六項規格、精簡六個產品完整介紹頁、補齊 sitemap／robots／結構化資料／AI 讀取資料、加入 IndexNow、自動驗收與清理舊流程，並推送 main。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.7_FAILURE｜本次未宣稱完成，請查看失敗步驟後再修正。'
