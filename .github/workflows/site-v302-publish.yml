name: Publish website v302

on:
  pull_request:
    branches:
      - main
    paths:
      - SITE_V302_PR_TRIGGER.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build integrated mascot scenes and clean public content
        run: |
          python -m pip install --quiet pillow beautifulsoup4
          rm -f V302_RUN.log
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/site_v302_cleanup.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '        for tag in list(soup.find_all(href=True)):\n            if REMOVED_PAGE in tag.get("href", "") or REMOVED_ID in tag.get("href", ""):\n                parent = tag.find_parent(["article", "li"])\n                (parent or tag).decompose()',
              '        for tag in list(soup.find_all(href=True)):\n            if not getattr(tag, "attrs", None):\n                continue\n            href = tag.attrs.get("href", "")\n            if REMOVED_PAGE in href or REMOVED_ID in href:\n                parent = tag.find_parent(["article", "li"])\n                (parent or tag).decompose()'
          )
          p.write_text(s, encoding='utf-8')
          PY
          set +e
          python tools/site_v302_cleanup.py > V302_RUN.log 2>&1
          status=$?
          cat V302_RUN.log
          if [ $status -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add V302_RUN.log
            git commit -m "記錄網站 v302 執行錯誤" || true
            git push origin HEAD:${{ github.head_ref }} || true
            exit $status
          fi

      - name: Validate public files
        run: |
          node --check site.js
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('data.json','catalog-public.json'):
              if Path(name).exists():
                  json.loads(Path(name).read_text(encoding='utf-8'))
          print('public files validated')
          PY
          ! grep -RniE 'guilu-drink-180|product-guilu-drink-180cc|180cc' --include='*.html' --include='*.json' --include='site.js' --include='sitemap.xml' .

      - name: Remove trigger and debug files
        run: |
          rm -f SITE_V302_TRIGGER.txt SITE_V302_PR_TRIGGER.txt V302_RUN.log

      - name: Commit website update to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v302：小老闆情境整合、移除舊規格與公開雜項" || exit 0
          git push origin HEAD:${{ github.head_ref }}
