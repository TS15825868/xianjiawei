name: Publish website v302

on:
  pull_request:
    branches:
      - main
    paths:
      - SITE_V302_PR_TRIGGER.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build integrated mascot scenes and clean public content
        run: |
          python -m pip install --quiet pillow beautifulsoup4
          python tools/site_v302_cleanup.py

      - name: Validate public files
        run: |
          node --check site.js
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('data.json','catalog-public.json'):
              if Path(name).exists():
                  json.loads(Path(name).read_text(encoding='utf-8'))
          print('public files validated')
          PY
          ! grep -RniE 'guilu-drink-180|product-guilu-drink-180cc|180cc' --include='*.html' --include='*.json' --include='site.js' --include='sitemap.xml' .

      - name: Remove trigger files
        run: |
          rm -f SITE_V302_TRIGGER.txt SITE_V302_PR_TRIGGER.txt

      - name: Commit website update to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v302：小老闆情境整合、移除舊規格與公開雜項" || exit 0
          git push origin HEAD:${{ github.head_ref }}
