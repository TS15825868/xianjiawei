name: Bump site entry cache 20260812

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-site-entry-cache-v20260812.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cache-bust and mobile visual fixes
        run: python tools/bump_site_entry_cache_v20260812.py

      - name: Validate current mobile visual fix
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version='20260812-mobile-visual-fix-v5'
          pattern=re.compile(r'(?:src|href)=["\'](site(?:-[^?"\']+)?\.(?:js|css))\?v=([^"\']+)["\']',re.I)
          stale=[]
          refs=0
          retired=[
            'images/brand/approved-v405/home-brand.webp',
            'images/brand/approved-v405/products-all.webp',
            'images/brand/approved-v405/contact-line.webp',
            'images/brand/approved-v405/combo.webp',
            'images/brand/approved-v405/guide-how-to-use.webp',
          ]
          bad_meta=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for file, value in pattern.findall(text):
                  refs+=1
                  if value!=version: stale.append((p.name,file,value))
              for old in retired:
                  for line in text.splitlines():
                      if old in line and ('og:image' in line or 'twitter:image' in line):
                          bad_meta.append((p.name,old))
          if stale:
              raise SystemExit('stale site cache refs: '+repr(stale[:20]))
          if bad_meta:
              raise SystemExit('retired public preview images remain: '+repr(bad_meta[:20]))
          if refs==0:
              raise SystemExit('no site runtime/style refs found')

          # High-resolution safe public mascot sources restored from the approved original batch.
          hd={
            'images/brand/hd-v20260812/brand-story.png': 1000000,
            'images/brand/hd-v20260812/faq.png': 1000000,
            'images/brand/hd-v20260812/choose.jpg': 500000,
          }
          for name,min_bytes in hd.items():
              p=Path(name)
              if not p.is_file() or p.stat().st_size < min_bytes:
                  raise SystemExit(f'high-resolution source missing/too small: {name} {p.stat().st_size if p.exists() else 0}')

          hotfix=Path('site-ux-v4104.css').read_text(encoding='utf-8')
          required_css=[
            'body.ux-v410 .hero__content::after',
            'content:none!important',
            'background-image:none!important',
            'body.ux-v410 .brand-hero-v410__copy',
            'order:1!important',
            'body.ux-v410 .brand-hero-v410__media',
            'order:2!important',
          ]
          for token in required_css:
              if token not in hotfix:
                  raise SystemExit('missing visual hotfix token: '+token)

          mascot=Path('site-mascot-placement-v20260812.js').read_text(encoding='utf-8')
          for required in ['hd-v20260812/choose.jpg','hd-v20260812/faq.png']:
              if required not in mascot:
                  raise SystemExit('high-resolution mascot source missing: '+required)
          if 'homeLine:' in mascot or 'contact-line.webp?v=' in mascot:
              raise SystemExit('retired contact-line mascot runtime still active')

          brand=Path('brand.html').read_text(encoding='utf-8')
          if 'images/brand/hd-v20260812/brand-story.png' not in brand:
              raise SystemExit('brand hero is not using high-resolution brand story source')
          media_match=re.search(r'<div class="brand-hero-v410__media"[^>]*>(.*?)</div>',brand,re.S)
          if not media_match or 'images/logo.png' in media_match.group(1):
              raise SystemExit('brand hero still contains oversized logo layout')

          core=Path('site-core-v410.js').read_text(encoding='utf-8')
          if 'images/brand/approved-v405/home-brand.webp' in core:
              raise SystemExit('dormant home-brand composite remains in site core')
          if 'images/brand/hd-v20260812/brand-story.png' not in core:
              raise SystemExit('high-resolution brand story fallback missing from site core')

          retirement=Path('site-public-image-retirement-v20260812.js').read_text(encoding='utf-8')
          for required in ['guilu-gao.webp','guilu-drink-30cc.webp','guilu-drink-180cc.webp','guilu-tangkuai.webp','guilu-jiao.webp','luerong-fen.webp']:
              if required not in retirement:
                  raise SystemExit('missing formal product replacement '+required)

          print('PASS unified refs',refs,'version',version)
          print('PASS transparent hero circle disabled globally')
          print('PASS high-resolution choose/faq/brand sources')
          print('PASS brand mobile reading order copy then image')
          print('PASS current product/DM/trial separation guard retained')
          PY

      - name: Commit mobile visual cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' site-core-v410.js
          if git diff --cached --quiet; then
            echo 'No generated entry changes required.'
            exit 0
          fi
          git commit -m 'fix(ui): refresh mobile visual layout and sharp image entries'
          git push origin HEAD:main
