name: 仙加味官網快取與公開媒體驗證 v8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate generator syntax
        run: python -m py_compile tools/bump_site_entry_cache_v20260812.py
      - name: Apply current cache generator
        run: python tools/bump_site_entry_cache_v20260812.py
      - name: Validate current v8 public roles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,re
          from pathlib import Path
          V='20260813-trial-product-role-fix-v8'
          P='images/customer-display-v20260812/guilu-drink-180cc-product.jpg'
          b=Path(P).read_bytes()
          assert len(b)==315576
          assert hashlib.sha256(b).hexdigest()=='719bd0a0823693c17e288ee2e4445874c9730710ce08de722c2d54c66e840e62'
          assert b[:3]==b'\xff\xd8\xff'
          site=Path('site.js').read_text(encoding='utf-8'); assert f'const VERSION = "{V}"' in site
          pattern=re.compile(r'(?:src|href)=["\']site(?:-[^?"\']+)?\.(?:js|css)\?v=([^"\']+)["\']',re.I)
          refs=[(p.name,v) for p in Path('.').glob('*.html') for v in pattern.findall(p.read_text(encoding='utf-8'))]
          assert refs and not [(n,v) for n,v in refs if v!=V]
          for name in ['site-customer-display-v20260812.js','site-product-image-safety.js','site-product-data-authority.js','site-public-image-retirement-v20260812.js','product-guilu-drink-180cc.html','trial.html']:
              text=Path(name).read_text(encoding='utf-8'); assert P in text and 'images/products-v2/guilu-drink-180.jpeg' not in text
          trial=Path('trial.html').read_text(encoding='utf-8')
          for bad in ['trial.webp','trial-clean-v4.svg','trial-small-boss.webp','trial-small-boss.jpg','trial-small-boss.png']: assert bad not in trial
          assert 'object-fit:cover!important' not in trial
          assert all(x in trial for x in ['trial-product-card__media','trial-product-card__content','trial-product-card__actions','height:auto!important','object-fit:contain!important'])
          ux=Path('site-ux-v4104.css').read_text(encoding='utf-8'); assert 'body.ux-v410 .hero__content::after' in ux and 'content:none!important' in ux
          print('PASS v8 public cache/media validation:',len(refs),'runtime/style refs')
          PY
      - name: Commit cache changes only when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' site-core-v410.js
          if git diff --cached --quiet; then echo 'No cache changes required.'; exit 0; fi
          git commit -m 'chore(cache): refresh current v8 public entries'
          git push origin HEAD:main
