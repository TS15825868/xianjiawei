name: Bump site entry cache 20260812

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-site-entry-cache-v20260812.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cache-bust to all root HTML entry points
        run: python tools/bump_site_entry_cache_v20260812.py

      - name: Validate no stale site runtime/style cache keys remain
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version='20260812-formal-image-fix-v3'
          pattern=re.compile(r'(?:src|href)=["\'](site(?:-[^?"\']+)?\.(?:js|css))\?v=([^"\']+)["\']',re.I)
          stale=[]
          refs=0
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for file, value in pattern.findall(text):
                  refs+=1
                  if value!=version: stale.append((p.name,file,value))
          if stale:
              raise SystemExit('stale site cache refs: '+repr(stale[:20]))
          if refs==0:
              raise SystemExit('no site runtime/style refs found')
          print('PASS unified refs',refs,'version',version)
          PY

      - name: Commit HTML cache keys
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML cache changes required.'
            exit 0
          fi
          git commit -m 'fix(cache): refresh all site entry runtime keys'
          git push origin HEAD:main
