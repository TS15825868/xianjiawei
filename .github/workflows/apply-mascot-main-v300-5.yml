name: Apply mascot to main v300.5

on:
  push:
    branches: [main]
    paths: [MASCOT_APPLY_MAIN.txt]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply mascot
        run: |
          node --check tools/apply_mascot_integration_v300_5.js
          node tools/apply_mascot_integration_v300_5.js
          node --check site.js
          test -s images/brand/xianjiawei-mascot.jpg
      - name: Verify website
        run: |
          python3 tools/site_maintenance.py
          python3 tools/audit_all_buttons.py
          node tools/check_line_intents.js
          node tools/check_line_button_labels.js
          grep -F 'function renderMascotGuide()' site.js >/dev/null
          grep -F 'mascot-guide-card' site.css >/dev/null
      - name: Commit
        run: |
          rm -rf .asset-stage
          rm -f MASCOT_APPLY_MAIN.txt
          rm -f tools/apply_mascot_integration_v300_5.js
          rm -f .github/workflows/apply-mascot-main-v300-5.yml
          rm -f .github/workflows/apply-mascot-integration-v300-5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v300.5: publish 仙加味小老闆 website guide'
          git push origin main
