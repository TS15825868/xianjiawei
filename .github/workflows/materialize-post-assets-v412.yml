name: 正式貼文圖 v412 上線

on:
  push:
    branches: [main]
    paths:
      - 'staging/post-assets-v412/assets.zip'
      - 'staging/post-assets-v412/RELEASE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-post-assets-v412
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 22 張正式貼文圖
        shell: bash
        run: |
          set -euo pipefail
          test -f staging/post-assets-v412/assets.zip
          rm -rf images/posts/approved-v411
          mkdir -p images/posts/approved-v411
          unzip -q staging/post-assets-v412/assets.zip -d images/posts/approved-v411
          test "$(find images/posts/approved-v411 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 22
          test -f images/posts/approved-v411/manifest.json
      - name: 套用長期試喝與買10送1政策
        run: node tools/finalize-trial-and-post-assets-v411.mjs
      - name: 驗證網站正式資料
        shell: bash
        run: |
          node --check site.js
          grep -q '買10送1，共11罐500元' trial.html
          grep -q '00-trial-evergreen.jpg' trial.html
          ! grep -R -n -E '買10送2|共12罐500元|共12包2,000元' --include='*.html' --include='*.json' --include='*.txt' .
          test "$(find images/posts/approved-v411 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 22
      - name: 提交正式結果
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/approved-v411 trial.html index.html data.json site.js sitemap.xml llms.txt geo-data.json 2>/dev/null || true
          git add -u
          git rm -r --ignore-unmatch staging/post-assets-v412
          if git diff --cached --quiet; then
            echo 'No website changes.'
          else
            git commit -m 'feat(site): publish 22 approved post assets and evergreen trial v412'
            git push origin HEAD:main
          fi
