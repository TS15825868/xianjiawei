name: Report v408.7 exact failure

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_V4087_EXACT_FAILURE'
    runs-on: ubuntu-latest
    steps:
      - name: Collect exact failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 29244015680 --repo "${{ github.repository }}" --log-failed > /tmp/failed.log 2>&1
          {
            echo 'V4087_EXACT_FAILURE_REPORT'
            echo '```text'
            tail -180 /tmp/failed.log
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
