name: one-shot usage schedule and trial spacing 20260815
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-schedule-trial-gap-v20260815.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply latest confirmed wording and UI spacing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          roots = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          suffixes = {'.html','.js','.mjs','.json','.py','.txt','.md','.yml','.yaml','.css'}
          workflow = '.github/workflows/one-shot-usage-schedule-trial-gap-v20260815.yml'
          replacements = [
              ('一般建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
              ('建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
              ('每日早上及下午各一小匙','可依個人使用習慣與作息時間安排'),
              ('建議白天飲用','可依個人使用習慣與作息時間飲用'),
              ('每日一罐','每日 1-2罐'),
              ('避免接近睡前食用','依個人作息彈性調整'),
              ('20260814-site-refresh-v4','20260815-usage-schedule-v1'),
          ]
          changed=[]
          for rel in roots:
              if rel == workflow:
                  continue
              p=Path(rel)
              if p.suffix.lower() not in suffixes:
                  continue
              try:
                  old=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new=old
              for a,b in replacements:
                  new=new.replace(a,b)
              if rel == 'trial.html':
                  new=new.replace(
                      '.trial-product-card__actions{padding:8px 20px 20px;margin-top:auto}',
                      '.trial-product-card__actions{display:grid;gap:12px;padding:8px 20px 20px;margin-top:auto}'
                  )
                  if 'display:grid;gap:12px;padding:8px 20px 20px' not in new:
                      raise SystemExit('trial button spacing patch did not apply')
              if rel == 'site-product-data-authority.js':
                  # Keep the current product authority concise and explicitly non-clock-time based.
                  new=new.replace(
                      "normalized.usage=['可依個人使用習慣與作息時間安排','初次可先從半匙開始','可直接取用或加入約100～300mL溫熱水化開','依個人作息彈性調整'];",
                      "normalized.usage=['可依個人使用習慣與作息時間安排','初次可先從半匙開始','可直接取用或加入約100～300mL溫熱水化開'];"
                  )
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(rel)
          print('changed files:', len(changed))
          print('\n'.join(changed))

          # Hard validation of the current authority and the exact requested UI fix.
          authority=Path('site-product-data-authority.js').read_text(encoding='utf-8')
          trial=Path('trial.html').read_text(encoding='utf-8')
          assert "normalized.usage=['每日 1-2罐'" in authority
          assert '建議白天飲用' not in authority
          assert '每日早上及下午各一小匙' not in authority
          assert "normalized.usage=['可依個人使用習慣與作息時間安排'" in authority
          assert 'display:grid;gap:12px;padding:8px 20px 20px' in trial
          PY
      - name: Run available release checks
        shell: bash
        run: |
          set -e
          if [ -f tools/validate-site-release.py ]; then python3 tools/validate-site-release.py; fi
          if [ -f tools/validate-canonical-facts-v20260808.py ]; then python3 tools/validate-canonical-facts-v20260808.py; fi
          if [ -f tools/validate-public-customer-pages-v20260809.py ]; then python3 tools/validate-public-customer-pages-v20260809.py; fi
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/one-shot-usage-schedule-trial-gap-v20260815.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: align product usage wording and trial CTA spacing'
          git push origin HEAD:main
