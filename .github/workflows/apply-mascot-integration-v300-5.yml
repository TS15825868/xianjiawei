name: Apply mascot integration v300.5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: startsWith(github.head_ref, 'mascot-integration-v300-5')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply mascot integration
        run: |
          node --check tools/apply_mascot_integration_v300_5.js
          node tools/apply_mascot_integration_v300_5.js
          node --check site.js
          test -s images/brand/xianjiawei-mascot.jpg

      - name: Verify website routing and assets
        run: |
          python3 tools/site_maintenance.py
          python3 tools/audit_all_buttons.py
          node tools/check_line_intents.js
          node tools/check_line_button_labels.js
          grep -F 'function renderMascotGuide()' site.js >/dev/null
          grep -F 'mascot-guide-card' site.css >/dev/null
          grep -F 'images/brand/xianjiawei-mascot.jpg?v=300.5' site.js >/dev/null

      - name: Browser smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 >/tmp/mascot-site.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 2
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const pageName of ['index.html','choose.html','combo.html','brand.html']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              await page.goto('http://127.0.0.1:8080/' + pageName, { waitUntil: 'networkidle' });
              const guide = page.locator('#mascot-guide');
              if (await guide.count() !== 1) throw new Error(pageName + ' 缺少小老闆導覽');
              const img = guide.locator('img');
              if (!(await img.getAttribute('src')).includes('xianjiawei-mascot.jpg')) throw new Error(pageName + ' 圖片錯誤');
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit verified website update
        run: |
          rm -rf node_modules package.json package-lock.json .asset-stage
          rm -f tools/apply_mascot_integration_v300_5.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.js site.css *.html images/brand/xianjiawei-mascot.jpg BUTTON_AUDIT_REPORT.md
          git add -u
          git commit -m 'v300.5: add 仙加味小老闆 website guide'
          git push origin HEAD:${{ github.head_ref }}
