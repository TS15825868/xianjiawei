name: Deploy contextual mascot poses v2

on:
  push:
    paths:
      - MASCOT_POSE_V2_TRIGGER.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate pose variants and update website placement
        run: |
          python -m pip install --quiet pillow
          python tools/deploy_contextual_mascots.py

      - name: Validate website JavaScript
        run: node --check site.js

      - name: Remove temporary deployment files
        run: |
          rm -rf .mascot-upload
          rm -f MASCOT_POSE_TRIGGER.txt MASCOT_POSE_V2_TRIGGER.txt
          rm -f .github/workflows/mascot-pose-deploy.yml
          rm -f .github/workflows/mascot-pose-deploy-v2.yml

      - name: Commit contextual mascot update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v301.0：依頁面情境配置小老闆不同構圖與文案" || exit 0
          git push origin HEAD:main
