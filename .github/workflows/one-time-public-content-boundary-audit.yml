name: ONE_TIME_PUBLIC_CONTENT_BOUNDARY_AUDIT_20260806

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-public-content-boundary-audit.yml'
      - 'content/**'
      - 'tools/validate-site-release.py'
      - 'data.json'
      - 'deploy-version.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public copy, images and privacy boundary
        run: python3 tools/validate-site-release.py
