name: 仙加味社群二進位素材重組

on:
  push:
    branches: [main]
    paths:
      - 'staging/social-media-b64/ready.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-social-binary-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Reconstruct verified media
        shell: bash
        run: |
          set -euo pipefail
          READY='staging/social-media-b64/ready.json'
          if [ ! -f "$READY" ]; then
            echo 'No ready manifest; nothing to reconstruct.'
            exit 0
          fi
          python - <<'PY'
          import base64, hashlib, json, pathlib, re
          root = pathlib.Path('.')
          ready = root / 'staging/social-media-b64/ready.json'
          data = json.loads(ready.read_text(encoding='utf-8'))
          images = data.get('images') or []
          if not images:
              raise SystemExit('ready.json has no images[]')
          allowed_target = re.compile(r'^images/social/20261015-1031/[A-Za-z0-9._-]+\.webp$')
          allowed_chunk = re.compile(r'^staging/social-media-b64/[A-Za-z0-9._-]+\.part\d{2}\.b64$')
          for item in images:
              target = str(item['target'])
              chunks = [str(x) for x in item.get('chunks') or []]
              expected = str(item['sha256']).lower()
              if not allowed_target.fullmatch(target):
                  raise SystemExit(f'unsafe target: {target}')
              if not chunks or any(not allowed_chunk.fullmatch(x) for x in chunks):
                  raise SystemExit(f'unsafe/missing chunks for {target}')
              encoded = ''.join((root / p).read_text(encoding='ascii').strip() for p in chunks)
              raw = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'sha256 mismatch for {target}: {actual} != {expected}')
              if not (len(raw) >= 12 and raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'):
                  raise SystemExit(f'not a WEBP file: {target}')
              out = root / target
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(raw)
              print(f'OK {target} bytes={len(raw)} sha256={actual}')
          PY

      - name: Commit reconstructed media and remove staging
        shell: bash
        run: |
          set -euo pipefail
          READY='staging/social-media-b64/ready.json'
          if [ ! -f "$READY" ]; then
            exit 0
          fi
          rm -rf staging/social-media-b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/social/20261015-1031 staging/social-media-b64 || true
          if git diff --cached --quiet; then
            echo 'No reconstructed media changes.'
            exit 0
          fi
          git commit -m 'assets: add reviewed next-cycle social media candidates'
          git push
