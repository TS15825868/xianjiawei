name: 安裝用料原則正式貼文圖

on:
  push:
    branches: [main]
    paths:
      - "artifacts/uploads/post-ingredient-principle.complete"
      - ".github/workflows/install-ingredient-principle-post-image.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-ingredient-principle-post-image
  cancel-in-progress: true

jobs:
  decode-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 解碼、診斷、驗證並寫回
        shell: bash
        run: |
          set -uo pipefail

          expected_parts=8
          expected_sha='03d268a22a121c4695045cd0919fb7e3d03ee3430b1723586772f7560a59d7f8'
          expected_bytes=100932
          image='images/posts/generated/post-ingredient-principle.webp'
          diagnostic='artifacts/uploads/post-ingredient-principle-diagnostic.txt'
          decode_error='artifacts/uploads/post-ingredient-principle-decode-error.txt'

          mkdir -p images/posts/generated artifacts/uploads
          rm -f "$image" "$diagnostic" "$decode_error"

          actual_parts=$(find artifacts/uploads -maxdepth 1 -type f -name 'post-ingredient-principle.webp.b64.part-*' | wc -l | tr -d ' ')
          missing=''
          for index in $(seq -w 0 7); do
            part="artifacts/uploads/post-ingredient-principle.webp.b64.part-${index}"
            if [ ! -s "$part" ]; then
              missing="${missing}${index},"
            fi
          done

          decode_ok=false
          if [ "$actual_parts" = "$expected_parts" ] && [ -z "$missing" ]; then
            if cat artifacts/uploads/post-ingredient-principle.webp.b64.part-* | base64 --decode > "$image" 2>"$decode_error"; then
              decode_ok=true
            fi
          fi

          actual_sha='missing'
          actual_bytes=0
          riff_webp=false
          if [ -s "$image" ]; then
            actual_sha=$(sha256sum "$image" | awk '{print $1}')
            actual_bytes=$(wc -c < "$image" | tr -d ' ')
            if python3 - "$image" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          raise SystemExit(0 if data.startswith(b'RIFF') and data[8:12] == b'WEBP' else 1)
          PY
            then
              riff_webp=true
            fi
          fi

          {
            echo "expected_parts=${expected_parts}"
            echo "actual_parts=${actual_parts}"
            echo "missing_parts=${missing:-none}"
            echo "decode_ok=${decode_ok}"
            echo "expected_sha256=${expected_sha}"
            echo "actual_sha256=${actual_sha}"
            echo "expected_bytes=${expected_bytes}"
            echo "actual_bytes=${actual_bytes}"
            echo "riff_webp=${riff_webp}"
          } > "$diagnostic"
          cat "$diagnostic"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$decode_ok" = true ] \
            && [ "$actual_sha" = "$expected_sha" ] \
            && [ "$actual_bytes" = "$expected_bytes" ] \
            && [ "$riff_webp" = true ]; then
            echo 'PASS 1254x1254 用料原則正式貼文圖二進位驗證'
            rm -f artifacts/uploads/post-ingredient-principle.webp.b64.part-* \
                  artifacts/uploads/post-ingredient-principle.complete \
                  "$diagnostic" "$decode_error" \
                  .github/workflows/install-ingredient-principle-post-image.yml
            git add -A
            git commit -m 'assets(site): add verified ingredient principle post image'
            git pull --rebase origin main
            git push origin HEAD:main
            exit 0
          fi

          rm -f "$image"
          git add "$diagnostic"
          if [ -s "$decode_error" ]; then
            git add "$decode_error"
          fi
          git commit -m 'diagnostic(site): record ingredient image install failure' || true
          git pull --rebase origin main
          git push origin HEAD:main
          exit 1
