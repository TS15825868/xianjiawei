name: 仙加味龜鹿飲明確文案產品實物補強

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-explicit-drink-coverage-v20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Assemble approved mascot and formal product source canvases
        shell: bash
        run: |
          set -euo pipefail
          cat assets/reference/mascot-sprite-v20260816.part0 assets/reference/mascot-sprite-v20260816.part1 assets/reference/mascot-sprite-v20260816.part2 assets/reference/mascot-sprite-v20260816.part3 assets/reference/mascot-sprite-v20260816.part4 > assets/reference/mascot-sprite-v20260816.txt
          python - <<'PY'
          import base64,io
          from PIL import Image,ImageOps,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          raw=open('assets/reference/mascot-sprite-v20260816.txt',encoding='utf-8').read().strip(); Image.open(io.BytesIO(base64.b64decode(raw,validate=True))).verify()
          pairs={
            'guilu-gao.jpg':'images/dm-final/01_guilu-gao-100g-dm.jpg',
            'guilu-drink-30.jpg':'images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg',
            'guilu-drink-180.jpg':'images/dm-final/03_guilu-drink-180cc-dm.jpg',
            'luerong-fen.jpg':'images/dm-final/04_luerong-fen-75g-dm.jpg',
            'guilu-tangkuai.jpg':'images/dm-final/05_guilu-tangkuai-75g-dm.jpg',
            'guilu-jiao.jpg':'images/dm-final/06_guilu-jiao-600g-dm.jpg'}
          for dst,src in pairs.items():
            im=Image.open(src).convert('RGB'); im=ImageOps.fit(im,(1122,1402),method=Image.Resampling.LANCZOS,centering=(0.5,0.5)); im.save('images/products-v3/'+dst,'JPEG',quality=96,optimize=True)
          PY
      - name: Patch runtime for exact product coverage
        shell: bash
        run: |
          python - <<'PY'
          p='tools/generate-post-rebuild-v20260816.py'
          s=open(p,encoding='utf-8').read()
          s=s.replace('from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps\n','from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps, ImageFile\nImageFile.LOAD_TRUNCATED_IMAGES=True\n',1)
          needle="    with urllib.request.urlopen(MANIFEST_URL,timeout=30) as r: manifest=json.load(r)\n"
          patch="    with urllib.request.urlopen(MANIFEST_URL,timeout=30) as r: manifest=json.load(r)\n    for row in manifest.get('posts',[]):\n        if row.get('id') in {'POST-DRINK','XJW-SOCIAL-20260815-01-warm-drink'}:\n            row['products']=['drink30','drink180']\n"
          if needle not in s: raise SystemExit('manifest load marker missing')
          open(p,'w',encoding='utf-8').write(s.replace(needle,patch,1))
          PY
      - name: Regenerate visuals
        run: python tools/generate-post-rebuild-v20260816.py
      - name: Commit only generated visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore images/products-v3 tools/generate-post-rebuild-v20260816.py assets/reference/mascot-sprite-v20260816.txt || true
          git add images/posts/rebuild-v20260816
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(posts): add formal 30cc and 180cc to explicit drink visuals'
          git pull --rebase origin main
          git push origin HEAD:main
