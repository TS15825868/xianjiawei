name: Fix website mascot images

on:
  push:
    branches: [fix-website-mascot-images]
    paths:
      - RUN_FIX_WEBSITE_MASCOT_IMAGES.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-website-mascot-images
          fetch-depth: 0

      - name: Download approved website mascot images
        run: |
          python3 -m pip install --quiet gdown
          gdown --id 1Fo0MhGFyUhnQd14COzo3ZjkzPsl2JDOL -O /tmp/website-mascots.zip
          test $(wc -c < /tmp/website-mascots.zip) -gt 1000000
          unzip -t /tmp/website-mascots.zip

      - name: Install images and update mapping
        run: |
          mkdir -p /tmp/website-mascots images/brand
          unzip -o /tmp/website-mascots.zip -d /tmp/website-mascots
          cp /tmp/website-mascots/xianjiawei-scene-*.jpg images/brand/

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path('site-core.js'), Path('site.js')]
          target = next((p for p in candidates if p.exists() and 'const MASCOT_IMAGES' in p.read_text(encoding='utf-8')), None)
          if target is None:
              raise SystemExit('Mascot mapping file not found')

          s = target.read_text(encoding='utf-8')
          block = """const MASCOT_IMAGES = {
            welcome: 'images/brand/xianjiawei-scene-welcome.jpg?v=317.0',
            products: 'images/brand/xianjiawei-scene-products.jpg?v=317.0',
            guide: 'images/brand/xianjiawei-scene-guide.jpg?v=317.0',
            combo: 'images/brand/xianjiawei-scene-combo.jpg?v=317.0',
            usage: 'images/brand/xianjiawei-scene-usage.jpg?v=317.0',
            service: 'images/brand/xianjiawei-scene-service.jpg?v=317.0',
            brand: 'images/brand/xianjiawei-scene-brand.jpg?v=317.0'
          };"""
          s, count = re.subn(r"const MASCOT_IMAGES = \{.*?\n\};", block, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Mascot mapping block not replaced')

          s = s.replace("image: 'products', scene: 'products', eyebrow: '搭配組合'", "image: 'combo', scene: 'combo', eyebrow: '搭配組合'")
          s = s.replace("image: 'welcome', scene: 'welcome', eyebrow: '品牌故事'", "image: 'brand', scene: 'brand', eyebrow: '品牌故事'")
          target.write_text(s, encoding='utf-8')
          PY

      - name: Verify images
        run: |
          for f in welcome products guide combo usage service brand; do
            test -s "images/brand/xianjiawei-scene-${f}.jpg"
            file "images/brand/xianjiawei-scene-${f}.jpg" | grep -q 'JPEG image data'
          done
          node --check site-core.js || node --check site.js
          grep -R -q 'xianjiawei-scene-welcome.jpg?v=317.0' site-core.js site.js

      - name: Commit fixed website images
        run: |
          rm -f RUN_FIX_WEBSITE_MASCOT_IMAGES.txt
          rm -f .github/workflows/fix-website-mascot-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修正網站小老闆圖片黑畫面並換成高畫質版本'
          git push origin fix-website-mascot-images
