name: 仙加味正式母本手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-manual-formal-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate 2026-08-09 formal product, scale, trial and publishing authority
        run: python tools/validate-formal-v20260809.py

      - name: Validate base 23-post image review state
        run: python tools/validate-base-post-library-v20260809.py

      - name: Validate 5 mascot reuses and 115 remaining character generations
        run: python tools/validate-character-regeneration-v20260809.py

      - name: Validate publishing center needs-generation UI
        run: python tools/validate-publishing-center-ui-v20260809.py

      - name: Validate formal JSON authorities parse cleanly
        run: |
          python -m json.tool brand-character-spec.json >/dev/null
          python -m json.tool content/product-physical-scale-authority-v20260809.json >/dev/null
          python -m json.tool content/character-regeneration-authority-v20260809.json >/dev/null
          python -m json.tool content/character-generation-batches-v20260809.json >/dev/null
          python -m json.tool content/public-content-policy.json >/dev/null
          python -m json.tool content/public-asset-status-overrides-v20260809.json >/dev/null
          python -m json.tool content/image-generation-queue-v20260808.json >/dev/null
          python -m json.tool content/public-post-library.json >/dev/null

      - name: Validate publishing runtime JavaScript syntax
        run: |
          node --check publishing-center-v2.js
          node --check publishing-center-data-v8-fixes.js
          node --check publishing-center-data-v12-auto-candidates.js
          node --check publishing-center-data-v13-character-scenes.js
          node --check publishing-center-data-v14-boss-daily.js
          node --check publishing-center-data-v15-companions.js
          node --check publishing-center-data-v16-actual-product-photos.js
          node --check publishing-center-ai-tools.js
          node --check publishing-center-guardian.js
          node --check publishing-center-erp-bridge.js

      - name: Ensure audit makes no repository changes
        run: git diff --exit-code
