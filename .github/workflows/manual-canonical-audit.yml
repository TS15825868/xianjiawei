name: 仙加味官網正式版手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-manual-website-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate public customer pages
        run: python tools/validate-public-customer-pages-v20260809.py

      - name: Validate website production release
        run: python tools/validate-site-production-release-v20260809.py

      - name: Validate website visual cohesion
        run: python tools/validate-visual-cohesion-v20260809.py

      - name: Validate public AIO SEO and GEO
        run: python tools/validate_public_aio_seo.py

      - name: Validate public JSON authorities parse cleanly
        run: |
          python -m json.tool data.json >/dev/null
          python -m json.tool catalog-public.json >/dev/null
          python -m json.tool geo-data.json >/dev/null
          python -m json.tool content/product-physical-scale-authority-v20260809.json >/dev/null
          python -m json.tool content/public-content-policy.json >/dev/null
          python -m json.tool assets/data/official-products.json >/dev/null

      - name: Validate website JavaScript syntax
        run: |
          node --check site.js
          node --check site-core-v410.js
          node --check site-product-data-authority.js
          node --check site-product-image-safety.js
          node --check site-public-content-cleanup-v20260809.js

      - name: Ensure audit makes no repository changes
        run: git diff --exit-code
