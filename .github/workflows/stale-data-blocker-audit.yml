name: 仙加味舊資料回流守門

# 只檢查目前正式 authority 與會參與顯示／同步／貼文生成／發布驗收的檔案。
# 歷史紀錄可保留，但不得重新成為產品、文案、媒體或守門員權威。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-product-master.json'
      - 'assets/data/official-products.json'
      - 'config/official-products.json'
      - 'config/public-content-policy.json'
      - 'data/formal-media-authority-v20260810.json'
      - 'images/brand/approved-v405-manifest.json'
      - 'ai-answers.json'
      - 'geo-data.json'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'index.html'
      - 'products.html'
      - 'guide.html'
      - 'faq.html'
      - 'contact.html'
      - 'brand-facts.html'
      - 'product-guilu-*.html'
      - 'product-luerong-fen.html'
      - 'content/public-post-library.json'
      - 'content/social-content-bank-v20260911.json'
      - 'content/social-schedule-20260911-0924.json'
      - 'content/social-schedule-20261001-1014.json'
      - 'content/social-next-cycle-media-v20260911.json'
      - 'content/social-plan-20261015-1031-candidates.json'
      - 'tools/validate-current-authority-no-stale-blockers.py'
      - 'tools/validate-site-production-release-v20260809.py'
      - 'tools/validate-ai-geo-current-v20260820.py'
      - 'tools/validate-public-boundary-v20260808.py'
      - '.github/workflows/stale-data-blocker-audit.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-stale-data-blocker-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate current authority and reject stale blockers
        run: |
          set -euo pipefail
          python tools/validate-current-authority-no-stale-blockers.py
          python tools/validate-site-production-release-v20260809.py
          python tools/validate-ai-geo-current-v20260820.py
          python tools/validate-public-boundary-v20260808.py
      - name: Current service-hours authority check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          policy=json.loads(Path('config/public-content-policy.json').read_text(encoding='utf-8'))
          hours=policy.get('serviceHours') or {}
          assert hours.get('storefront')=='週一至週五 10:30－20:00'
          assert hours.get('closed')=='週六、週日店休'
          assert hours.get('website')=='24 小時可瀏覽'
          assert str(hours.get('lineOA','')).startswith('24 小時可留言')
          current='週一至週五 10:30－20:00'
          for rel in ['contact.html','faq.html','ai-answers.json']:
              text=Path(rel).read_text(encoding='utf-8')
              assert current in text, f'{rel} 缺最新營業時間'
              for retired in ['週一至週日 09:30','週一至週六 09:30','下一個營業時段','非服務時間一律下一營業日回覆']:
                  assert retired not in text, f'{rel} 出現退役服務時間／回覆規則：{retired}'
          ai=json.loads(Path('ai-answers.json').read_text(encoding='utf-8'))
          assert any(x.get('id')=='business-hours' for x in ai.get('answers',[])), 'AI營業時間問答缺失'
          routing=policy.get('contactRouting') or {}
          assert routing.get('primaryChannel')=='仙加味官方 LINE OA', '主要客服入口必須是官方LINE OA'
          assert routing.get('lineId')=='@762jybnm', 'LINE OA ID回退'
          assert routing.get('lineUrl')=='https://lin.ee/sHZW7NkR', 'LINE OA URL回退'
          community=routing.get('lineCommunity') or {}
          assert community.get('defaultCta') is False, 'LINE社群不得成為官網預設CTA'
          contact=Path('contact.html').read_text(encoding='utf-8')
          assert 'https://lin.ee/sHZW7NkR' in contact, '聯絡頁缺官方LINE OA入口'
          assert 'line.me/ti/g2' not in contact, '聯絡頁不得把LINE社群當主要客服／交易入口'
          assert ai.get('officialContact',{}).get('primaryChannel')=='LINE OA', 'AI回答主要聯絡入口不是LINE OA'
          print('PASS: current service-hours authority + LINE OA primary routing; community is not default transaction CTA.')
          PY

      - name: Ensure audit is read-only
        run: git diff --exit-code
