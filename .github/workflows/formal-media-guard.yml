name: 仙加味正式內容與圖片守門（手動）

# 全面整理期間只保留手動驗證，不自動阻擋新版正確內容。
# 以 assets/data/official-products.json 的目前正式資料為規格來源；媒體守門只檢查圖／DM／試喝與比例角色，不鎖舊版規格或舊使用時段。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate current formal media capabilities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const J=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const local=p=>String(p||'').split('?')[0].replace(/^\//,'');
          const kind=p=>{if(!fs.existsSync(p))return'';const b=fs.readFileSync(p);if(b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return'jpeg';if(b.subarray(0,8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a])))return'png';if(b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP')return'webp';if(b.subarray(4,16).toString().includes('ftypavif'))return'avif';return''};
          const a=J('data/formal-media-authority-v20260810.json');
          const m=J('images/formal-display/manifest.json');
          const official=J('assets/data/official-products.json');
          const byOfficial=new Map((official.products||[]).map(x=>[x.id,x]));
          const idMap={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'};
          const keys={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'};
          must(a.runtime===m.runtime,'authority/manifest runtime不同步');
          must(Array.isArray(a.products)&&a.products.length===6,'正式產品不是六項');
          must(byOfficial.size===6,'目前產品權威不是六項');
          for(const p of a.products){
            const current=byOfficial.get(idMap[p.id]);
            must(current,`找不到目前產品權威 ${p.id}`);
            must(p.spec===current.specification,`媒體authority規格未跟目前權威同步 ${p.id}: ${p.spec} != ${current.specification}`);
            if(current.detail_unit_approx)must(p.detail_unit_approx===current.detail_unit_approx,`每塊約重未跟目前權威同步 ${p.id}`);
            const image=local(p.image),dm=local(p.dm);
            must(['jpeg','png','webp','avif'].includes(kind(image)),`產品主圖不可解碼 ${image}`);
            must(['jpeg','png','webp','avif'].includes(kind(dm)),`DM不可解碼 ${dm}`);
            must(image!==dm,`產品主圖與DM角色混用 ${p.id}`);
            must(local(m.products?.[keys[p.id]]?.path)===image,`manifest產品路徑不同步 ${p.id}`);
          }
          const p30=a.products.find(x=>x.id==='guilu-drink-30cc');
          must(p30.name==='龜鹿飲30cc玻璃罐','30cc正式名稱錯誤');
          must(!/玻璃瓶|30cc／瓶|瓶裝/.test(JSON.stringify(p30)),'30cc又回到瓶字');
          must(local(p30.dm)==='images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg','30cc目前詳細DM錯誤');
          const p180=a.products.find(x=>x.id==='guilu-drink-180cc');
          must(local(p180.image)==='images/customer-display-v20260812/guilu-drink-180cc-product.jpg','180cc目前產品圖錯誤');
          must(local(p180.image)!==local(p180.dm),'180cc詳細DM被用成產品主圖');
          must(String(a.customer_text_spec_policy||'').includes('顧客產品頁'),'顧客完整文字規格政策缺失');
          must(String(a.customer_text_spec_policy||'').includes('不得因此自行加字'),'文字規格政策沒有保護正式產品圖／DM');
          const trial=local(a.trial?.image||a.trial?.path);
          must(a.trial?.render_mode==='poster'&&trial==='images/trial/trial-poster-small-boss-official-v20260814.jpg','試喝海報不是目前核准版本');
          must(kind(trial)==='jpeg','試喝海報不可解碼');
          must(local(m.trial?.path)===trial,'manifest試喝不同步');
          must((a.image_rules||[]).some(x=>String(x).includes('不得AI重畫')),'禁止AI重畫產品規則被移除');
          must((a.image_rules||[]).some(x=>String(x).includes('產品圖／DM／試喝圖三層分離')),'媒體角色分離規則被移除');
          console.log('PASS: current product authority + product/DM/trial/physical media roles are consistent.');
          NODE

      - name: Validate active public safety layers
        run: |
          node --check site-product-image-safety.js
          node --check site-public-image-retirement-v20260812.js
          node --check site-media-modal-final-v20260814.js
          node <<'NODE'
          const fs=require('fs');const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const safety=fs.readFileSync('site-product-image-safety.js','utf8');
          must(safety.includes("isDetailedDm")&&safety.includes("objectFit','contain"),'產品圖片安全層缺少DM分離或contain能力');
          const retirement=fs.readFileSync('site-public-image-retirement-v20260812.js','utf8');
          must(retirement.includes('guilu-drink-180cc-product.jpg'),'舊圖退役層沒有180cc正式產品圖');
          const modal=fs.readFileSync('site-media-modal-final-v20260814.js','utf8');
          must(modal.includes('trial-poster-small-boss-official-v20260814.jpg'),'Modal媒體層沒有目前試喝主圖');
          must(modal.includes('02_guilu-drink-30cc-dm-official-v20260814.jpg'),'Modal媒體層沒有目前30cc正式DM');
          console.log('PASS: public media safety layers preserve current roles and contain scaling.');
          NODE

      - name: Confirm cleanup mode remains nonblocking
        run: |
          node <<'NODE'
          const mode=require('./config/guard-mode.json');
          if(mode.mode!=='paused_for_full_system_update'||mode.blocking!==false||mode.keep_minimum_safety!==true)throw new Error('maintenance guard mode changed unexpectedly');
          console.log('PASS: guard remains manual-only during full cleanup.');
          NODE
