name: 仙加味正式內容與圖片守門 v8

# 整套系統仍在整理階段：只保留手動驗證，不自動阻擋新版正確內容。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate latest product / DM / trial authority only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const J=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const local=p=>String(p||'').split('?')[0].replace(/^\//,'');
          const kind=p=>{if(!fs.existsSync(p))return'';const b=fs.readFileSync(p);if(b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return'jpeg';if(b.subarray(0,8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a])))return'png';if(b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP')return'webp';if(b.subarray(4,16).toString().includes('ftypavif'))return'avif';return''};
          const V='20260813-trial-product-role-fix-v8';
          const P='images/customer-display-v20260812/guilu-drink-180cc-product.jpg';
          const specs={'guilu-gao':'100g／罐','guilu-drink-30cc':'30cc／罐（小玻璃罐）','guilu-drink-180cc':'180cc／包（鋁袋）','guilu-tangkuai':'75g／盒｜8塊裝','guilu-jiao':'600g（1斤）／盒｜32塊裝','luerong-fen':'75g／罐'};
          const keys={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'};
          const a=J('data/formal-media-authority-v20260810.json'),m=J('images/formal-display/manifest.json');
          must(a.runtime===V&&m.runtime===V,'authority/manifest 不是目前 v8');
          must(a.products.length===6,'正式產品不是六項');
          for(const p of a.products){
            must(p.spec===specs[p.id],`規格錯誤 ${p.id}`);
            const image=local(p.image),dm=local(p.dm);
            must(['jpeg','png','webp','avif'].includes(kind(image)),`產品主圖不可解碼 ${image}`);
            must(['jpeg','png','webp'].includes(kind(dm)),`DM不可解碼 ${dm}`);
            must(image!==dm,`產品主圖與DM角色混用 ${p.id}`);
            must(local(m.products[keys[p.id]].path)===image,`manifest不同步 ${p.id}`);
          }
          const p180=a.products.find(x=>x.id==='guilu-drink-180cc');
          must(local(p180.image)===P,'180cc產品主圖不是正式高清產品圖');
          must(local(p180.dm)==='images/dm-approved-v20260810/guilu-drink-180cc.webp','180cc DM角色錯誤');
          const b=fs.readFileSync(P);must(b.length===315576,'180cc高清主圖大小不符');must(crypto.createHash('sha256').update(b).digest('hex')==='719bd0a0823693c17e288ee2e4445874c9730710ce08de722c2d54c66e840e62','180cc高清主圖內容不符');
          must(a.trial.render_mode==='component'&&a.trial.component_id==='trial-showcase-v20260813','trial不是目前正式元件');
          const trial=fs.readFileSync('trial.html','utf8');
          for(const bad of ['trial.webp','trial-clean-v4.svg','trial-small-boss.webp','trial-small-boss.jpg','trial-small-boss.png'])must(!trial.includes(bad),`退役trial素材回歸 ${bad}`);
          must(trial.includes('trial-product-card__media')&&trial.includes('trial-product-card__content')&&trial.includes('trial-product-card__actions'),'trial卡片結構倒退');
          must(trial.includes('object-fit:contain!important')&&!trial.includes('object-fit:cover!important'),'trial圖片比例規則倒退');
          must(trial.includes(P),'trial 180cc沒有使用正式高清產品圖');
          const customer=fs.readFileSync('site-customer-display-v20260812.js','utf8'),safety=fs.readFileSync('site-product-image-safety.js','utf8');
          must(customer.includes(P)&&safety.includes(P),'產品runtime未使用180cc正式高清圖');
          must(!customer.includes("'guilu-drink-180':'images/customer-display-v20260812/guilu-drink-180cc.jpg'"),'錯誤180cc DM海報又被設成主圖');
          const ux=fs.readFileSync('site-ux-v4104.css','utf8');must(ux.includes('body.ux-v410 .hero__content::after')&&ux.includes('content:none!important'),'透明灰黑Hero圓形修正倒退');
          must((a.image_rules||[]).some(x=>String(x).includes('不得AI重畫')),'禁止AI重畫產品規則被移除');
          console.log('PASS v8 latest authority only; no old-version lock.');
          NODE
