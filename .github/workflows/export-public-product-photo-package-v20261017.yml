name: 仙加味｜整理所有公開商品正反面與內容物原照
on:
  push:
    paths:
      - ".github/workflows/export-public-product-photo-package-v20261017.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build authentic images-only ZIP
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          base=Path(".")
          output=Path("仙加味_產品正面背面與內容物_20261017_補全背面版.zip")
          root="仙加味產品圖"
          products=[
            ("01_龜鹿膏","guilu-gao","images/catalog-owner-final-v20261017/guilu-gao-main.webp",[],[("外盒與罐身實拍","images/catalog-user-original-v20261017/guilu-gao-box-jar-owner-selected-detail-v20261017.webp")],[]),
            ("02_龜鹿飲30cc玻璃罐","guilu-drink-30","images/catalog-owner-final-v20261017/guilu-drink-30-main.webp",[],[],[("裸罐封口實拍","images/catalog-clean-studio-v20261016-v5/guilu-drink-30-closed-detail.webp")]),
            ("03_龜鹿飲180cc鋁袋","guilu-drink-180","images/catalog-owner-final-v20261017/guilu-drink-180-main.webp",[],[],[("密封鋁袋實拍","images/catalog-clean-studio-v20261016-v5/guilu-drink-180-closed-detail.webp")]),
            ("04_鹿茸粉75g","luerong-fen","images/catalog-owner-final-v20261017/luerong-fen-main.webp",[],[],[("密封罐實拍","images/catalog-clean-studio-v20261016-v5/luerong-fen-closed-detail.webp")]),
            ("05_參仲四物飲","jinan-sisheng-siwuyin","images/catalog-owner-final-v20261017/jinan-sisheng-siwuyin-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/siwuyin-original-back.webp")],[],[]),
            ("06_丹參系列/01_臺灣丹參玫瑰果茶","jianfeng-rose-fruit-tea","images/catalog-owner-final-v20261017/danshen-tea-collection-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-rose-fruit-original-back.webp")],[("三角茶包實拍","images/catalog-user-original-v20261017/rose-fruit-real-teabag.webp")],[]),
            ("06_丹參系列/02_臺灣丹參懈悠活養生茶","jianfeng-leisure-tea","images/catalog-owner-final-v20261017/tea-leisure-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-leisure-original-back.webp")],[],[]),
            ("06_丹參系列/03_武大漢丹參茶","jianfeng-wudahan-tea","images/catalog-owner-final-v20261017/tea-wudahan-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-wudahan-original-back.webp")],[],[]),
            ("06_丹參系列/04_臺灣丹參纖體茶","jianfeng-fiber-tea","images/catalog-owner-final-v20261017/tea-fiber-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-fiber-original-back.webp")],[],[]),
            ("06_丹參系列/05_臺灣白茶丹參飲","jianfeng-white-tea","images/catalog-owner-final-v20261017/tea-white-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-white-original-back.webp")],[],[]),
            ("06_丹參系列/06_臺灣丹參舒活茶","jianfeng-refresh-tea","images/catalog-owner-final-v20261017/tea-refresh-main.webp",[("原廠背面標示局部","images/catalog-user-detail-cutouts-v20261017/tea-refresh-original-back.webp")],[],[]),
            ("07_龜鹿活力飲","guilu-vitality","images/catalog-owner-final-v20261017/guilu-vitality-main.webp",[("原廠標示局部","images/catalog-user-detail-cutouts-v20261017/vitality-original-label-closeup.webp")],[("玻璃罐實拍","images/catalog-clean-studio-v20261016-v5/vitality-real-jar-detail.webp")],[]),
            ("08_四珍寶","uboss-sizhenbao","images/catalog-owner-final-v20261017/uboss-sizhenbao-main.webp",[(f"原廠標示局部{i}","images/catalog-labels-v20261016-v7/uboss-sizhenbao-label-"+str(i)+".webp") for i in range(1,5)],[("原廠八塊膏塊實拍","images/catalog-user-original-v20261017/sizhenbao-actual-8-blocks.webp")],[]),
            ("09_二珍寶","royalherb-erzhenbao-64","images/catalog-owner-final-v20261017/royalherb-erzhenbao-64-main.webp",[(f"原廠標示局部{i}","images/catalog-labels-v20261016-v7/royalherb-erzhenbao-64-label-"+str(i)+".webp") for i in range(1,5)],[("單盤八塊實拍","images/catalog-user-original-v20261017/erzhenbao-single-tray-8-pieces-owner-v20261017.webp"),("完整開盒雙盤實拍","images/catalog-user-original-v20261017/erzhenbao-open-box-2-trays-owner-v20261017.webp")],[])
          ]
          assert len(products)==14
          # Recover whole ORIGINAL back-label photo, while retaining separately
          # cropped label detail. These files are source photographs with their
          # original shooting scene; never represent a crop as a whole rear.
          back_originals={
            "jinan-sisheng-siwuyin":"images/partner-products/jinan-siwuyin-label.jpg",
            "jianfeng-rose-fruit-tea":"images/partner-products/tea-rose-fruit-label-source.jpg",
            "jianfeng-leisure-tea":"images/partner-products/tea-danshen-leisure-label-source.jpg",
            "jianfeng-wudahan-tea":"images/partner-products/tea-wudahan-label-source.jpg",
            "jianfeng-fiber-tea":"images/partner-products/tea-danshen-lotus-label-source.jpg",
            "jianfeng-white-tea":"images/partner-products/tea-white-danshen-label-source.jpg",
            "jianfeng-refresh-tea":"images/partner-products/tea-danshen-refresh-label-source.jpg",
            "guilu-vitality":"images/partner-products/jinan-vitality-label-original.jpg"
          }
          for folder,id,front,backs,contents,others in products:
            if id in back_originals:
              label="原廠整張背面實拍（可能含正面及現場背景）"
              backs.append((label,back_originals[id]))
            if id=="uboss-sizhenbao":
              contents.extend([
                ("原廠封膜內盤實拍","images/partner-products/supplements-v20261016/four-treasures-sealed-tray.jpg"),
                ("八塊內盤背面實拍","images/partner-products/supplements-v20261016/four-treasures-tray-back.jpg")
              ])
          rows=[];missing=[]
          def name_for(role,label,path):
            ext=Path(path).suffix
            return role+"/"+label+ext
          def writepic(z,id,folder,role,label,src):
            f=base/src
            if not f.is_file():raise FileNotFoundError(src)
            raw=f.read_bytes()
            if len(raw)<3000:raise ValueError("Photo too small: "+src)
            target=f"{root}/{folder}/{name_for(role,label,src)}"
            z.writestr(target,raw)
            rows.append((id,folder,role,label,src,hashlib.sha256(raw).hexdigest(),str(len(raw))))
          with ZipFile(output,"w",ZIP_DEFLATED,compresslevel=6) as z:
            for folder,id,front,backs,contents,others in products:
              writepic(z,id,folder,"01_正面","正式完整主圖",front)
              for label,src in backs:writepic(z,id,folder,"02_背面與標示",label,src)
              for label,src in contents:writepic(z,id,folder,"03_內容物與實物",label,src)
              for label,src in others:writepic(z,id,folder,"04_其他完整包裝實拍",label,src)
              if not backs:missing.append((id,folder,"尚無確認可公開的背面原廠標示照片"))
              elif all("局部" in label for label,_ in backs): missing.append((id,folder,"只有原廠標示局部，尚無完整背面整張照片"))
              if not contents:missing.append((id,folder,"尚無此品項獨立內容物實拍；密封罐/袋不拆封造圖"))
            out=io.StringIO();w=csv.writer(out);w.writerow(["商品ID","商品名稱","圖片類別","照片名稱","正式GitHub來源","SHA256","位元組數"]);w.writerows(rows)
            z.writestr(f"{root}/圖片對照表.csv", "\ufeff"+out.getvalue())
            out=io.StringIO();w=csv.writer(out);w.writerow(["商品ID","商品名稱","待補完整照片狀態"]);w.writerows(missing)
            z.writestr(f"{root}/缺少或只有局部的照片清單.csv","\ufeff"+out.getvalue())
            z.writestr(f"{root}/閱讀說明.txt","仙加味｜產品正面、背面標示、內容物實拍整理包\n來源：TS15825868/xianjiawei main；只取正式公開商品。\n共 9 款／系列商品卡：4 款仙加味商品、5 款其他來源商品／系列，其中丹參 6 款分開，共 14 個品項資料夾。\n正面一律採最新 2026-10-17 使用者指定正式主圖；反面無完整照片者只提供已核對的局部標示，絕不拼接當作完整背面。\n龜鹿膏盒＋罐為細節圖，二珍寶及四珍寶內容物是實拍；鹿茸粉與密封飲品沒有任意拆封內容物圖。\n六款丹參只玫瑰果茶有確認的獨立茶包實拍，其餘不能共用。\n圖片原樣保存，不改動產品本體與標籤；請參考「缺少或只有局部的照片清單.csv」。\n")
          with ZipFile(output) as z:
            bad=z.testzip()
            assert bad is None
            assert len([n for n in z.namelist() if n.lower().endswith((".webp",".png",".jpg",".jpeg"))])==len(rows)
          print("SUCCESS",output,len(rows),"photos",len(products),"SKUs","bytes",output.stat().st_size)
          PY
      - name: Upload user-downloadable ZIP file
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-product-front-back-content-full-back-20261017
          path: 仙加味_產品正面背面與內容物_20261017_補全背面版.zip
          if-no-files-found: error
          retention-days: 30
