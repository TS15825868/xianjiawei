name: Capture repository tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-tree-sha.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record current tree
        run: |
          git rev-parse 'HEAD^{tree}' > .tree-sha.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tree-sha.txt
          git commit -m "記錄網站正式清理基準"
          git push origin main
