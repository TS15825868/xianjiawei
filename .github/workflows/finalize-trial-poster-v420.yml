name: 官網試喝海報正式定稿 v420

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/finalize-trial-poster-v420.py"
      - ".github/workflows/finalize-trial-poster-v420.yml"

permissions:
  contents: write

concurrency:
  group: site-trial-poster-v420
  cancel-in-progress: false

jobs:
  finalize-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Finalize bright poster and exact production wording
        run: python tools/finalize-trial-poster-v420.py

      - name: Verify poster contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          image_path = Path('images/posts/approved-v412/guilu-drink-trial-evergreen.jpg')
          report_path = Path('diagnostics/trial-poster-v420.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status') != 'success':
              raise SystemExit('poster diagnostic is not successful')
          if report.get('line_1') != '接單後安排製作加工':
              raise SystemExit('poster first line is incorrect')
          if report.get('line_2') != '製作加工約需5～7個工作天，完成後才安排出貨':
              raise SystemExit('poster second line is incorrect')
          digest = hashlib.sha256(image_path.read_bytes()).hexdigest()
          if report.get('after_sha256') != digest:
              raise SystemExit('poster digest does not match diagnostic')
          with Image.open(image_path) as image:
              if image.width != image.height or image.width < 1000:
                  raise SystemExit(f'unexpected poster size: {image.size}')
          print(report)
          PY
          git diff --check

      - name: Commit final poster
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/approved-v412/guilu-drink-trial-evergreen.jpg diagnostics/trial-poster-v420.json
          if git diff --cached --quiet; then
            echo 'Poster is already final.'
          else
            git commit -m 'fix(site): finalize bright trial poster production wording v420'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
