name: Real original-product catalog photography
on:
  push:
    branches: [main]
    paths:
      - 'ops/build-real-catalog-photos-v20261016.py'
      - '.github/workflows/real-product-photo-refresh-v20261016.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-real-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare image processor
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Build nine box-first real-product scenes
        run: python ops/build-real-catalog-photos-v20261016.py
      - name: Validate no new AI generated packaging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path("images/catalog-real-v20261016/manifest.json").read_text())
          assert len(m["products"])==9
          ids=[i["id"] for i in m["products"]]
          assert len(set(ids))==9
          for i in m["products"]:
              p=Path(i["mainImage"])
              assert p.is_file(),p
              with Image.open(p) as im: assert im.size==(1122,1402)
              assert "source" in i and i["sha256"] and len(i["sha256"])==64
          for id in ["guilu-gao","guilu-drink-30","guilu-drink-180","luerong-fen"]:
              assert id in ids
          print("Nine original-packaging scenes verified")
          PY
      - name: Commit freshly produced asset files without touching old files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/catalog-real-v20261016/
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "assets: add nine provenance-checked real product packaging scenes"
          git pull --rebase origin main
          git push origin HEAD:main
