name: Install approved website mascot v405.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-approved-v405.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-approved-v405
  cancel-in-progress: false

jobs:
