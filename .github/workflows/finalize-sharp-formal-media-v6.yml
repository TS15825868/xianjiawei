name: Finalize sharp formal media v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-sharp-formal-media-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved HD masters before changing runtime
        shell: bash
        run: |
          set -euo pipefail
          declare -A SHA=(
            [guilu-drink-30cc]='a57ce8e03a867e8162065ae380dae97248c85f6923eb74578d72349610e435d8'
            [guilu-gao]='6958c71f7d1d8cac4df348511fca2e2f4983eace279126444174589798d46ff2'
            [guilu-jiao]='091145c925a3579e53b75468555c07ecbeeb45d4176028ec5e0879ccb0fdafee'
            [guilu-tangkuai]='0d54fbb42d2d6d875713295ff6c53cecc7dd5f753f8d5e5b0fc54f6cf40677bf'
            [luerong-fen]='d9312b796007cbead43d9525867c759b265a089c5424e3de24a1afd8b1f16fc3'
          )
          for name in guilu-drink-30cc guilu-gao guilu-jiao guilu-tangkuai luerong-fen; do
            file="images/customer-display-v20260812/${name}.avif"
            test -f "$file"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${SHA[$name]}"
            echo "PASS $name $actual"
          done
          test -f images/dm-v3/guilu-drink-180.jpg
          test "$(wc -c < images/dm-v3/guilu-drink-180.jpg)" -gt 50000
          test "$(xxd -p -l 3 images/dm-v3/guilu-drink-180.jpg)" = 'ffd8ff'
          echo 'PASS 180cc vetted high-resolution JPEG source'

      - name: Finalize HD product role separation and v6 runtime
        shell: bash
        run: |
          set -euo pipefail
          cp images/dm-v3/guilu-drink-180.jpg images/customer-display-v20260812/guilu-drink-180cc.jpg
          python - <<'PY'
          from pathlib import Path
          import json, re

          V='20260813-sharp-formal-media-v6'
          root=Path('.')
          product_paths={
            'guilu-gao':'images/customer-display-v20260812/guilu-gao.avif',
            'guilu-drink-30':'images/customer-display-v20260812/guilu-drink-30cc.avif',
            'guilu-drink-180':'images/customer-display-v20260812/guilu-drink-180cc.jpg',
            'guilu-tangkuai':'images/customer-display-v20260812/guilu-tangkuai.avif',
            'guilu-jiao':'images/customer-display-v20260812/guilu-jiao.avif',
            'luerong-fen':'images/customer-display-v20260812/luerong-fen.avif',
          }
          old_paths={
            'guilu-gao':'images/customer-display-v20260812/guilu-gao.webp',
            'guilu-drink-30':'images/customer-display-v20260812/guilu-drink-30cc.webp',
            'guilu-drink-180':'images/customer-display-v20260812/guilu-drink-180cc.webp',
            'guilu-tangkuai':'images/customer-display-v20260812/guilu-tangkuai.webp',
            'guilu-jiao':'images/customer-display-v20260812/guilu-jiao.webp',
            'luerong-fen':'images/customer-display-v20260812/luerong-fen.webp',
          }

          def replace_text(path, replacements):
            p=root/path
            text=p.read_text(encoding='utf-8')
            updated=text
            for a,b in replacements:
              updated=updated.replace(a,b)
            if updated!=text:
              p.write_text(updated,encoding='utf-8')
              print('UPDATED',path)

          # Customer display authority.
          replacements=[("const VERSION='20260812-formal-image-fix-v3';",f"const VERSION='{V}';")]
          replacements += [(old_paths[k],product_paths[k]) for k in product_paths]
          replacements += [
            ("productMainImageSource:'20260812-formal-image-fix-v3'",f"productMainImageSource:'{V}'"),
            ("productMainImageSource:'20260812-formal-image-fix-v3'",f"productMainImageSource:'{V}'"),
            ("產品圖只用六張正式WebP","產品圖只用六張正式高解析產品母圖"),
            ("20260812-formal-image-fix-v3",V),
          ]
          replace_text(Path('site-customer-display-v20260812.js'),replacements)

          # Product safety layer: it must never restore low-resolution WebPs.
          replacements=[("const VERSION='20260812-formal-image-fix-v3';",f"const VERSION='{V}';")]
          replacements += [(old_paths[k],product_paths[k]) for k in product_paths]
          replacements += [
            ('official-product-image-formal-image-fix-v3','official-product-image-sharp-formal-media-v6'),
            ('20260812-formal-image-fix-v3',V),
          ]
          replace_text(Path('site-product-image-safety.js'),replacements)

          # Old generated product composites are retired to the same HD product authority.
          replacements=[("const VERSION='20260812-public-image-hotfix-v4';",f"const VERSION='{V}';")]
          mapping={
            'product-guilu-gao-100g.webp':product_paths['guilu-gao'],
            'product-guilu-drink-30cc.webp':product_paths['guilu-drink-30'],
            'product-guilu-drink-180cc.webp':product_paths['guilu-drink-180'],
            'product-guilu-tangkuai-75g.webp':product_paths['guilu-tangkuai'],
            'product-guilu-jiao-600g.webp':product_paths['guilu-jiao'],
            'product-luerong-fen-75g.webp':product_paths['luerong-fen'],
          }
          for legacy,new in mapping.items():
            pattern=re.compile(rf"('{re.escape(legacy)}':`) + re.compile(r'').pattern)
          p=root/'site-public-image-retirement-v20260812.js'
          text=p.read_text(encoding='utf-8')
          text=text.replace("const VERSION='20260812-public-image-hotfix-v4';",f"const VERSION='{V}';")
          for legacy,new in mapping.items():
            text=re.sub(rf"('{re.escape(legacy)}':)`images/customer-display-v20260812/[^`?]+\?v=\$\{{VERSION\}}`",rf"\1`{new}?v=${{VERSION}}`",text)
          p.write_text(text,encoding='utf-8')
          print('UPDATED site-public-image-retirement-v20260812.js')

          # Manifest: product main / detailed DM / trial stay three different roles.
          mp=root/'images/formal-display/manifest.json'
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['runtime']=V
          formats={k:('jpeg' if k=='guilu-drink-180' else 'avif') for k in product_paths}
          for key,path in product_paths.items():
            obj=m['products'][key]
            obj['path']='/'+path
            obj['format']=formats[key]
            obj['binary_status']='verified_high_resolution_1122x1402'
            obj['status']='approved_display'
          m['rules']['product_authority']='six user-confirmed high-resolution product masters are the customer-facing product image authority; products-v3 remains physical identity reference only'
          m['rules']['customer_main_visual']='six HD official product masters for product surfaces; valid detailed DMs only for DM surfaces; user-provided small-boss trial poster only for trial surfaces'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('UPDATED manifest')

          ap=root/'data/formal-media-authority-v20260810.json'
          a=json.loads(ap.read_text(encoding='utf-8'))
          a['runtime']=V
          a['product_image_authority']='six user-confirmed 1122x1402 high-resolution product masters; products-v3 remains immutable real-product identity reference only'
          id_to_key={'guilu-gao':'guilu-gao','guilu-drink-30cc':'guilu-drink-30','guilu-drink-180cc':'guilu-drink-180','guilu-tangkuai':'guilu-tangkuai','guilu-jiao':'guilu-jiao','luerong-fen':'luerong-fen'}
          for item in a['products']:
            key=id_to_key[item['id']]
            item['image']='/'+product_paths[key]
            item['binary_status']='verified_high_resolution_1122x1402'
            item['status']='approved_display'
          a['principle']='six user-confirmed high-resolution product masters, valid detailed DMs, and the user-provided small-boss trial image are three separate media roles; products-v3 remains immutable real-product identity reference only'
          ap.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('UPDATED formal media authority')

          # Formal media helper must use DM paths on the DM page, never product-main paths.
          p=root/'site-formal-media-v20260810.js'
          text=p.read_text(encoding='utf-8')
          text=re.sub(r"const V='[^']+';",f"const V='{V}';",text,count=1)
          old=re.search(r" if\(/\\/dm\\\\\.html\$/.test\(location\.pathname\)\)\{.*?\}\n if\(/\\/trial",text,re.S)
          if old:
            block=""" if(/\\/dm\\.html$/.test(location.pathname)){
  const entries=['guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'];
  document.querySelectorAll('img').forEach(img=>{
   const box=img.closest('article,section,figure,div');
   const t=((img.alt||'')+' '+(box?.textContent||'')).replace(/\\s+/g,' ');
   for(const key of entries){const p=m.products?.[key];if(p&&(t.includes(p.name)||t.includes(p.spec))){const dm=m.dm?.paths?.[key];if(dm)replace(img,dm);break;}}
  });
 }
 if(/\\/trial"""
            text=text[:old.start()]+block+text[old.end():]
          else:
            # Current one-line implementation fallback.
            text=text.replace("for(const p of Object.values(m.products||{})){if(t.includes(p.name)||t.includes(p.spec)){replace(img,p.path);break;}}","for(const [key,p] of Object.entries(m.products||{})){if(t.includes(p.name)||t.includes(p.spec)){const dm=m.dm?.paths?.[key];if(dm)replace(img,dm);break;}}")
          p.write_text(text,encoding='utf-8')
          print('UPDATED site-formal-media-v20260810.js')

          # Main loader and all root HTML entry cache keys.
          replace_text(Path('site.js'),[("20260812-mobile-visual-fix-v5",V)])
          pattern=re.compile(r'(?P<prefix>(?:src|href)=["\'])(?P<file>site(?:-[^?"\']+)?\.(?:js|css))\?v=[^"\']+(?P<suffix>["\'])',re.I)
          html_changed=0
          for p in root.glob('*.html'):
            text=p.read_text(encoding='utf-8')
            updated=pattern.sub(lambda x:f"{x.group('prefix')}{x.group('file')}?v={V}{x.group('suffix')}",text)
            updated=updated.replace('v=20260812-mobile-visual-fix-v5','v='+V)
            if updated!=text:
              p.write_text(updated,encoding='utf-8');html_changed+=1
          print('UPDATED HTML',html_changed)

          # Prevent the legacy cache helper from restoring v5 later.
          replace_text(Path('tools/bump_site_entry_cache_v20260812.py'),[
            ('VERSION = "20260812-mobile-visual-fix-v5"',f'VERSION = "{V}"'),
            ('?v=20260812-mobile-visual-fix-v5',f'?v={V}'),
          ])
          replace_text(Path('.github/workflows/bump-site-entry-cache-v20260812.yml'),[
            ("version='20260812-mobile-visual-fix-v5'",f"version='{V}'"),
            ("'guilu-gao.webp','guilu-drink-30cc.webp','guilu-drink-180cc.webp','guilu-tangkuai.webp','guilu-jiao.webp','luerong-fen.webp'","'guilu-gao.avif','guilu-drink-30cc.avif','guilu-drink-180cc.jpg','guilu-tangkuai.avif','guilu-jiao.avif','luerong-fen.avif'"),
          ])
          PY

      - name: Validate no runtime can restore low-resolution product WebPs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          V='20260813-sharp-formal-media-v6'
          paths=[
            'images/customer-display-v20260812/guilu-gao.avif',
            'images/customer-display-v20260812/guilu-drink-30cc.avif',
            'images/customer-display-v20260812/guilu-drink-180cc.jpg',
            'images/customer-display-v20260812/guilu-tangkuai.avif',
            'images/customer-display-v20260812/guilu-jiao.avif',
            'images/customer-display-v20260812/luerong-fen.avif',
          ]
          for path in paths:
            p=Path(path)
            if not p.is_file() or p.stat().st_size < 10000: raise SystemExit(f'HD product master missing/too small: {path}')
          if Path(paths[2]).read_bytes()!=Path('images/dm-v3/guilu-drink-180.jpg').read_bytes(): raise SystemExit('180cc customer master is not exact vetted source')
          for script in ['site-customer-display-v20260812.js','site-product-image-safety.js','site-public-image-retirement-v20260812.js']:
            text=Path(script).read_text(encoding='utf-8')
            if V not in text: raise SystemExit(f'v6 missing: {script}')
            for old in ['guilu-gao.webp','guilu-drink-30cc.webp','guilu-drink-180cc.webp','guilu-tangkuai.webp','guilu-jiao.webp','luerong-fen.webp']:
              if 'customer-display-v20260812/'+old in text: raise SystemExit(f'low-res product runtime remains: {script} {old}')
          m=json.loads(Path('images/formal-display/manifest.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/formal-media-authority-v20260810.json').read_text(encoding='utf-8'))
          if m['runtime']!=V or a['runtime']!=V: raise SystemExit('formal media runtime not v6')
          if m['trial']['path']!='/images/customer-display-v20260812/trial-small-boss.webp': raise SystemExit('trial authority regressed')
          if a['trial']['image']!='/images/customer-display-v20260812/trial-small-boss.webp': raise SystemExit('trial authority regressed')
          formal=Path('site-formal-media-v20260810.js').read_text(encoding='utf-8')
          if 'm.dm?.paths?.[key]' not in formal: raise SystemExit('DM page is not using separate DM paths')
          css=Path('site-ux-v4104.css').read_text(encoding='utf-8')
          if 'body.ux-v410 .hero__content::after' not in css or 'content:none!important' not in css: raise SystemExit('transparent hero circle guard missing')
          brand=Path('brand.html').read_text(encoding='utf-8')
          if 'images/brand/hd-v20260812/brand-story.png' not in brand: raise SystemExit('brand HD hero regressed')
          pattern=re.compile(r'(?:src|href)=["\']site(?:-[^?"\']+)?\.(?:js|css)\?v=([^"\']+)',re.I)
          stale=[]
          for p in Path('.').glob('*.html'):
            for value in pattern.findall(p.read_text(encoding='utf-8')):
              if value!=V: stale.append((p.name,value))
          if stale: raise SystemExit('stale HTML cache refs '+repr(stale[:20]))
          print('PASS six sharp formal product masters')
          print('PASS low-resolution product WebPs retired from runtime')
          print('PASS product / detailed DM / trial remain separate roles')
          print('PASS transparent hero circle guard and brand HD layout retained')
          print('PASS all root HTML cache refs',V)
          PY

      - name: Commit final sharp formal media release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No final media changes required.'
            exit 0
          fi
          git commit -m 'fix(images): switch public site to sharp formal media v6'
          git pull --rebase origin main
          git push origin HEAD:main
