name: Install exact 180cc HD formal product v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-180cc-hd-product-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore exact approved 180cc master from repository history
        shell: bash
        run: |
          set -euo pipefail
          source_commit='493adecbbd371fa8ba052673357cc0131c0502af'
          source_path='images/products-v3/guilu-drink-180.jpg'
          expected_sha256='719bd0a0823693c17e288ee2e4445874c9730710ce08de722c2d54c66e840e62'
          expected_bytes='315576'

          git cat-file -e "${source_commit}:${source_path}"
          git show "${source_commit}:${source_path}" > /tmp/guilu-drink-180-hd.jpg

          actual_bytes=$(wc -c < /tmp/guilu-drink-180-hd.jpg | tr -d ' ')
          actual_sha256=$(sha256sum /tmp/guilu-drink-180-hd.jpg | awk '{print $1}')
          test "$actual_bytes" = "$expected_bytes" || { echo "unexpected bytes: $actual_bytes" >&2; exit 1; }
          test "$actual_sha256" = "$expected_sha256" || { echo "unexpected sha256: $actual_sha256" >&2; exit 1; }
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/guilu-drink-180-hd.jpg')
          b=p.read_bytes()
          assert b[:3]==b'\xff\xd8\xff', 'not JPEG'
          print('PASS exact historical 180cc master:', len(b), 'bytes')
          PY

          mkdir -p images/products-v3 images/customer-display-v20260812
          cp /tmp/guilu-drink-180-hd.jpg images/products-v3/guilu-drink-180.jpg
          cp /tmp/guilu-drink-180-hd.jpg images/customer-display-v20260812/guilu-drink-180cc-product.jpg
          rm -f _upload/180cc-hd-v7.part-* _upload/180cc-hd-v7.ready

      - name: Commit exact HD 180cc product image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/products-v3/guilu-drink-180.jpg images/customer-display-v20260812 _upload
          if git diff --cached --quiet; then
            echo 'No binary changes required.'
            exit 0
          fi
          git commit -m 'fix(images): restore exact HD 180cc formal product master v7'
          git push origin HEAD:main
