name: Final clean approved website mascot v405.1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: final-clean-v405
  cancel-in-progress: false

jobs:
  clean:
    if: github.event.issue.title == 'CLEAN_FINAL_APPROVED_V405_1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete mascot code and files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('site-core.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('    renderMascotGuide();\n','')
          start=text.find('const MASCOT_IMAGES = {')
          end=text.find('function renderHome() {',start)
          if start >= 0 and end > start:
              text=text[:start]+'// v405.1：頁面小老闆情境統一由 approved-mascot-v405.js 管理。\n\n'+text[end:]
          path.write_text(text,encoding='utf-8')

          version='405.1'
          for page in Path('.').glob('*.html'):
              html=page.read_text(encoding='utf-8')
              html=re.sub(r'site\.css\?v=[^"\']+',f'site.css?v={version}',html)
              html=re.sub(r'site-v321\.css\?v=[^"\']+',f'site-v321.css?v={version}',html)
              html=re.sub(r'site\.js\?v=[^"\']+',f'site.js?v={version}',html)
              page.write_text(html,encoding='utf-8')

          css=Path('site-v405.css').read_text(encoding='utf-8')
          css=css.replace('/* v405.0：完整使用核准小老闆原圖；不裁切、不拉伸、不重複。 */','/* v405.1：完整使用15張核准小老闆原圖；不裁切、不拉伸、不重複。 */')
          css=re.sub(r'\n?#mascot-guide \{\n  display: none !important;\n\}\n','\n',css,count=1)
          Path('site-v405.css').write_text(css,encoding='utf-8')
          PY

          rm -f \
            images/brand/scene-brand-all.svg \
            images/brand/scene-choose-forms.svg \
            images/brand/scene-guilu-drink-180cc.svg \
            images/brand/scene-guilu-drink-30cc.svg \
            images/brand/scene-guilu-gao-100g.svg \
            images/brand/scene-guilu-jiao-600g.svg \
            images/brand/scene-guilu-tangkuai-75g.svg \
            images/brand/scene-luerong-fen-75g.svg \
            images/brand/scene-products-all.svg \
            images/brand/xianjiawei-scene-guide.jpg \
            images/brand/xianjiawei-scene-products.jpg \
            images/brand/xianjiawei-scene-service.jpg \
            images/brand/xianjiawei-scene-usage.jpg \
            images/brand/xianjiawei-scene-welcome.jpg \
            images/brand/xianjiawei-web-scenes-sprite.part01.txt \
            images/brand/xianjiawei-web-scenes-sprite.part02.txt \
            images/brand/xianjiawei-web-scenes-v324.webp \
            mascot-source-audit.json \
            website-mascot-sprite.js

          node --check site-core.js
          node --check approved-mascot-v405.js
          ! grep -q 'renderMascotGuide' site-core.js
          ! grep -q 'MASCOT_IMAGES' site-core.js
          ! grep -R -q 'scene-guilu\|scene-products-all\|scene-choose-forms' --include='*.js' --include='*.html' .
          grep -q 'site.js?v=405.1' index.html
          grep -q 'site.js?v=405.1' choose.html
          test "$(find images/brand/approved-v405 -maxdepth 1 -type f | wc -l)" -eq 15

      - name: Commit clean final source to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "清理舊版小老闆素材並統一官網版本 v405.1"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages deployment and verify public site
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          run_id=''
          for attempt in $(seq 1 60); do
            runs="$(curl --fail-with-body -sS "${auth[@]}" "${api}/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=10")"
            run_id="$(RUNS="$runs" SHA="$SOURCE_SHA" python3 - <<'PY'
          import json,os
          for run in json.loads(os.environ['RUNS']).get('workflow_runs',[]):
              if run.get('head_sha')==os.environ['SHA']:
                  print(run['id']); break
          PY
          )"
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ]
          for attempt in $(seq 1 120); do
            run="$(curl --fail-with-body -sS "${auth[@]}" "${api}/actions/runs/${run_id}")"
            status="$(RUN="$run" python3 -c 'import json,os; print(json.loads(os.environ["RUN"])["status"])')"
            conclusion="$(RUN="$run" python3 -c 'import json,os; print(json.loads(os.environ["RUN"]).get("conclusion") or "")')"
            [ "$status" = completed ] && break
            sleep 5
          done
          [ "$conclusion" = success ]

          base='https://ts15825868.github.io/xianjiawei'
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          files=(home-brand.png products-all.png choose.jpg combo.png guide-how-to-use.png recipes.png brand-story.png faq.png contact-line.png product-guilu-gao-100g.png product-guilu-drink-30cc.png product-guilu-drink-180cc.png product-guilu-tangkuai-75g.png product-guilu-jiao-600g.png product-luerong-fen-75g.png)
          public_ok=0
          for attempt in $(seq 1 30); do
            curl -fsSL "${base}/index.html?final=${stamp}-${attempt}" -o /tmp/index.html || true
            curl -fsSL "${base}/choose.html?final=${stamp}-${attempt}" -o /tmp/choose.html || true
            if grep -q 'site.js?v=405.1' /tmp/index.html \
              && grep -q 'approved-v405/home-brand.png?v=405.1' /tmp/index.html \
              && grep -q '龜鹿食補怎麼選？先看你想怎麼使用' /tmp/choose.html \
              && grep -q 'site.js?v=405.1' /tmp/choose.html; then
              checked=0
              for file in "${files[@]}"; do
                curl -fsSL "${base}/images/brand/approved-v405/${file}?final=${stamp}-${attempt}" -o "/tmp/image-${checked}"
                [ "$(wc -c < "/tmp/image-${checked}")" -gt 20000 ]
                checked=$((checked+1))
              done
              [ "$checked" -eq 15 ] && public_ok=1 && break
            fi
            sleep 10
          done
          [ "$public_ok" -eq 1 ]
          echo "FINAL_CLEAN_PUBLIC_SUCCESS: deployment=${run_id}, images=15/15"

      - name: Report and close issue
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const success = process.env.VERIFY_OUTCOME === 'success';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:success?'FINAL_CLEAN_PUBLIC_SUCCESS｜舊素材已清除，公開網站與15張圖片已驗收。':'FINAL_CLEAN_PUBLIC_FAILURE｜請查看本次 Actions 執行紀錄。'});
            if (success) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
