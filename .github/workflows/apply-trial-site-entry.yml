name: 套用龜鹿飲長期試喝入口

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/apply-trial-site-entry.mjs'
      - 'docs/trial-site-entry-trigger.md'

permissions:
  contents: write

concurrency:
  group: xianjiawei-trial-site-entry
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply evergreen trial entry
        run: node tools/apply-trial-site-entry.mjs
      - name: Verify public trial rules
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const home = readFileSync('index.html', 'utf8');
          const trial = readFileSync('trial.html', 'utf8');
          const site = readFileSync('site.js', 'utf8');
          const required = ['30cc小玻璃罐×3罐','運費60元','運費100元','5～7個工作天','12罐500元','https://lin.ee/sHZW7NkR'];
          for (const value of required) {
            if (!home.includes(value) && !trial.includes(value)) throw new Error(`缺少試喝規則：${value}`);
          }
          if (!existsSync('trial.html')) throw new Error('缺少trial.html');
          if (!site.includes('{ href: "trial.html", label: "申請試喝"')) throw new Error('全站選單缺少申請試喝');
          if (!site.includes('<a href="trial.html">申請試喝</a>')) throw new Error('頁尾缺少申請試喝');
          if (!site.includes('trial: "我想申請龜鹿飲30cc試喝組。"')) throw new Error('試喝頁LINE預填訊息缺失');
          if (/30cc玻璃瓶|小玻璃瓶|30cc／瓶/.test(home + trial)) throw new Error('試喝頁仍殘留玻璃瓶舊稱');
          console.log('PASS：網站首頁、選單、頁尾、價格、運費、交期與LINE OA導流一致。');
          NODE
      - name: Commit website result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trial.html site.js
          if git diff --cached --quiet; then
            echo 'No website changes.'
          else
            git commit -m 'feat(site): expose evergreen trial across website navigation'
            git push origin HEAD:main
          fi
