name: 仙加味剩餘66篇完整生活場景圖產出

on:
  push:
    branches: [main]
    paths:
      - 'asset-staging/remainder66-v20260817/TRIGGER.txt'
      - 'tools/render-remainder66-v20260817.mjs'
      - 'tools/render-scene-poster-core-v20260817.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install renderer
        run: npm install --no-audit --no-fund --no-package-lock sharp
      - name: Render 66 full lifestyle scenes
        run: node tools/render-remainder66-v20260817.mjs
      - name: Validate 66 formal full-scene images and content
        shell: bash
        run: |
          set -euo pipefail
          test "$(find images/posts/remainder66-v20260817 -maxdepth 1 -name '*.webp' | wc -l)" -eq 66
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('images/posts/remainder66-v20260817/manifest.json','utf8'));
          if(m.count!==66||m.posts?.length!==66) throw new Error(`manifest ${m.count}/${m.posts?.length}`);
          if(!String(m.version).includes('scene-v2')) throw new Error('old remainder66 manifest version');
          const sets=[new Set(m.posts.map(p=>p.id)),new Set(m.posts.map(p=>p.title)),new Set(m.posts.map(p=>p.copy)),new Set(m.posts.map(p=>p.image_url))];
          if(sets.some(s=>s.size!==66)) throw new Error(`uniqueness ${sets.map(s=>s.size).join('/')}`);
          for(const p of m.posts){
            const n=fs.statSync(p.image_path).size;
            if(n<50000) throw new Error(`${p.id}: image too small ${n}`);
            if(!p.copy.includes('仙加味')) throw new Error(`${p.id}: missing brand link`);
            if((p.title+p.copy+p.image_alt).includes('台興山產')) throw new Error(`${p.id}: blocked name`);
            if(!Array.isArray(p.bullets)||p.bullets.length<3) throw new Error(`${p.id}: missing scene bullets`);
            if(!p.scene) throw new Error(`${p.id}: missing scene`);
            if(!String(p.image_url).includes('v=20260817-scene3')) throw new Error(`${p.id}: stale cache url`);
            if(!String(p.image_source).includes('完整生活場景重製v3')) throw new Error(`${p.id}: stale image source`);
            if(!String(p.image_source).includes('無內嵌文字')) throw new Error(`${p.id}: rendered image may still contain generated Chinese text`);
          }
          console.log('PASS 66/66: full lifestyle scenes, no generated text overlays, products-v3 official product photos, unique copy/image');
          NODE
      - name: Commit formal full-scene assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/remainder66-v20260817
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'feat(posts): rebuild remaining 66 with full lifestyle scenes'
          git pull --rebase origin main
          git push
