name: 仙加味剩餘66篇正式生活情境圖產出

on:
  push:
    branches: [main]
    paths:
      - 'asset-staging/remainder66-v20260817/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Traditional Chinese renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin webp fonts-noto-cjk
      - name: Build 66 unique scene SVG sources
        run: node tools/render-remainder66-v20260817.mjs
      - name: Render 1080x1350 WebP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf images/posts/remainder66-v20260817
          mkdir -p images/posts/remainder66-v20260817 /tmp/remainder66-png
          for f in asset-staging/remainder66-v20260817/svg/*.svg; do
            id="$(basename "$f" .svg)"
            rsvg-convert -w 1080 -h 1350 "$f" -o "/tmp/remainder66-png/${id}.png"
            cwebp -quiet -q 88 "/tmp/remainder66-png/${id}.png" -o "images/posts/remainder66-v20260817/${id}.webp"
          done
          cp asset-staging/remainder66-v20260817/manifest.json images/posts/remainder66-v20260817/manifest.json
      - name: Validate 66 formal images and content
        shell: bash
        run: |
          set -euo pipefail
          test "$(find images/posts/remainder66-v20260817 -maxdepth 1 -name '*.webp' | wc -l)" -eq 66
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const m=JSON.parse(fs.readFileSync('images/posts/remainder66-v20260817/manifest.json','utf8'));
          if(m.count!==66||m.posts?.length!==66) throw new Error(`manifest ${m.count}/${m.posts?.length}`);
          const sets=[new Set(m.posts.map(p=>p.id)),new Set(m.posts.map(p=>p.title)),new Set(m.posts.map(p=>p.copy)),new Set(m.posts.map(p=>p.image_url))];
          if(sets.some(s=>s.size!==66)) throw new Error(`uniqueness ${sets.map(s=>s.size).join('/')}`);
          for(const p of m.posts){
            const f=`images/posts/remainder66-v20260817/${p.id}.webp`;
            const n=fs.statSync(f).size;
            if(n<50000) throw new Error(`${p.id}: image too small ${n}`);
            if(!p.copy.includes('仙加味')) throw new Error(`${p.id}: missing brand link`);
            if((p.title+p.copy+p.image_alt).includes('台興山產')) throw new Error(`${p.id}: blocked name`);
            if(!Array.isArray(p.bullets)||p.bullets.length<3) throw new Error(`${p.id}: missing scene bullets`);
            if(!p.scene) throw new Error(`${p.id}: missing scene`);
          }
          console.log('PASS 66/66: unique copy, unique image URL, concrete scene, brand/product link');
          NODE
      - name: Commit formal assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/remainder66-v20260817 asset-staging/remainder66-v20260817/manifest.json
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'feat(posts): publish remaining 66 matched lifestyle scenes'
          git push
