name: User ZIP 3 Drive Sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/userzip3-drive-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current uploaded lifestyle package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 'https://drive.google.com/uc?export=download&id=1D3JeI09rvaHej8zc2eQ6rQ16F5Q3m4AQ' -o /tmp/userzip3-assets.tar.gz
          echo '1540da1dd3885a298d2fac1b51dd306ee8a9e947bc2c20a46825c4916320a9d5  /tmp/userzip3-assets.tar.gz' | sha256sum -c -
      - name: Extract and verify 15 uploaded lifestyle assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/post-library/userzip3-v20260811
          tar -xzf /tmp/userzip3-assets.tar.gz -C images/post-library/userzip3-v20260811
          cd images/post-library/userzip3-v20260811
          echo 'afeb5a335bcaf0618586bd5649be2aa5f2a2a4474be44d033f3615c013294823  warm-rhythm.webp' | sha256sum -c -
          echo '6f9066214e2ca09aa2f01330076976a899394254df01648756053013536fb229  storage.webp' | sha256sum -c -
          echo 'ad9865ae1063ce6218e192a47d5b73439d7cd38518cd91042628ac06a40e5e00  warm-water.webp' | sha256sum -c -
          echo '3ca1418242fcb567d897ee042c440829a7037c7bd2ec35a1e084cc6ddbb9f937  work-break.webp' | sha256sum -c -
          echo '75f2be36b9598f076f2f5a6415969c483f964c7afafc4dcc03b73b57424dfcb4  rainy-warm.webp' | sha256sum -c -
          echo 'e63ccd5f354ada30c2a55129eee333d1afdf4bcfddd9c4fde7b5ca4fccf2b0b3  hot-weather-hydration.webp' | sha256sum -c -
          echo '890a1231723c968a399cf24f459fbb04c002d118448da75b94e8e2670bb716ba  daily-hydration.webp' | sha256sum -c -
          echo '4d76284d6e32895516e28ebf17319aef3f45b142c588f1befe07d30023c9ae6a  self-care-family.webp' | sha256sum -c -
          echo '39befcd7464d85b7050d7067fdeceaaf8ba76169d9d141c48616a8ee41b942e1  hot-weather-hydration-2.webp' | sha256sum -c -
          echo 'bafa64dc4df5dda4f4adeb9bf4ad1f6723dbefaa47163f7c2965e053bbba9d6d  temperature-coat.webp' | sha256sum -c -
          echo '9461b46cc24ef19319bf0ce9868328d931a0c5f926eed5db5cf0f3b1301a253d  choose-by-routine.webp' | sha256sum -c -
          echo '4c771b510877141844e78c0e98cfe9a2fda01bf6c888ce1c8dec102e65880d07  rainy-home.webp' | sha256sum -c -
          echo 'a89e411e4503b8b2117b7d91cb8497a36a427a2cbb0a0c6f06c8346c909ab8ea  work-break-2.webp' | sha256sum -c -
          echo '6e81f0eac71d3b168d33cd9c8f46a9c5a667ec36252b94d479261c63f4ac1c0e  self-care-family-2.webp' | sha256sum -c -
          echo 'b424f0fbde1007a6940390be93996b8b079aa6730a287078ce990f8084cd42b6  temperature-coat-2.webp' | sha256sum -c -
      - name: Commit synced assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/userzip3-drive-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'media: publish 15 current uploaded lifestyle assets'
          git pull --rebase origin main
          git push origin HEAD:main
