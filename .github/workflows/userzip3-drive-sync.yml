name: User ZIP 3 Drive Sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/userzip3-drive-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current ZIP lifestyle package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1Jvr24IWbtSDcTrcmLqMtZAaIhUQbMlXH' -o /tmp/userzip3-assets.tar.gz
          echo 'cd405e019c2cb867057551f51b68eddb92a5ee38ba882a3f0d17365feb736fe0  /tmp/userzip3-assets.tar.gz' | sha256sum -c -
      - name: Extract and verify assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/post-library/userzip3-v20260811
          tar -xzf /tmp/userzip3-assets.tar.gz -C images/post-library/userzip3-v20260811
          cd images/post-library/userzip3-v20260811
          echo '149e5ec357d7130317bcbdaaacc24d6d8bc225df3dce53aedda4b9055c920b61  choose-by-routine.webp' | sha256sum -c -
          echo 'a400409addf2ca5195bfdf6ea14c265c54ce8eb57a3f17589e35b76912041982  daily-hydration.webp' | sha256sum -c -
          echo '820220fb10cf118041e3eb5e90997df7f079425bd07d1795b553b586d6c9df69  hot-weather-hydration-2.webp' | sha256sum -c -
          echo '3f588c601a5572df44a55119bc1874de5f8778ec9e827e8da2a92e8a05133120  hot-weather-hydration.webp' | sha256sum -c -
          echo '180fc9e584d0243f0df56e10e4c041fdc3c83ea15bcefe1dcbe342b931d00402  rainy-home.webp' | sha256sum -c -
          echo '068ca7de06587a146b36d33b5a6f04874cc4e8800e084d26651d9acbaa5c2488  rainy-warm.webp' | sha256sum -c -
          echo '4a583f80c726f3d2bacf68fa77b691247c7d051ea1a7a00b9df3de01969e16f1  self-care-family-2.webp' | sha256sum -c -
          echo '5bd85d4fe3f034ac308fbc83f96b3bf5d4624559f8dc91f131291d756c07f330  self-care-family.webp' | sha256sum -c -
          echo 'cb10742f5cb5f2d97e56ed779514c8f7821a9ed7c595b2c25afd27d487c332dd  storage.webp' | sha256sum -c -
          echo 'dbb84765673b1ec1ce4dab762cdb8e4ac62d979a980e0062809cef1aa289ad77  temperature-coat-2.webp' | sha256sum -c -
          echo 'eaf7d0c13e468248ca0a3367287b0d1f9b6335f32b8b04aabc866efb2d4ed2bf  temperature-coat.webp' | sha256sum -c -
          echo '72fe46e786d18e90db49793c0135db56bb66114fcb337befc435b20907af74ac  warm-rhythm.webp' | sha256sum -c -
          echo 'c847fd22b60ed6fa4cbe9755f92c25e5408408f3dfb540f8e10fc164e7c99b0b  warm-water.webp' | sha256sum -c -
          echo '528838b2fe42159e7965bc0796e3dbf72b4852c1e8e671d61729d17de9fbf961  work-break-2.webp' | sha256sum -c -
          echo '396e79cc51f877ab6294947d147129128c10430d3b401b527cd69e52f85658a7  work-break.webp' | sha256sum -c -
      - name: Commit synced assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/userzip3-drive-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'media: publish current ZIP lifestyle assets'
          git push
