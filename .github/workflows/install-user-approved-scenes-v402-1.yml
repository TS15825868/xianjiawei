name: Install user approved website scenes v402.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-user-approved-scenes-v402-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-user-approved-scenes-v402-1
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved image package
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://drive.google.com/uc?export=download&id=1Bb1Ks3SQcIIakJqDzhC0k5sCV2sWD5w1&confirm=t" \
            -o /tmp/approved-scenes-v402.1.zip
          unzip -t /tmp/approved-scenes-v402.1.zip

      - name: Install exact approved scenes
        run: |
          set -euo pipefail
          unzip -o /tmp/approved-scenes-v402.1.zip -d .
          sed -i 's/402\.0/402.1/g' site.js site-fix-v317.js .github/workflows/deploy-pages.yml
          sed -i 's/400\.2/402.1/g' site-core.js
          for f in home products choose combo guide recipes faq contact brand dm video knowledge hanfang-baike sources; do
            test -s "images/brand/website-mascot-${f}.jpg"
            test "$(stat -c%s "images/brand/website-mascot-${f}.jpg")" -gt 600000
            file "images/brand/website-mascot-${f}.jpg" | grep -q 'JPEG image data'
          done
          test -s images/hero/home-brand-guilu-series.jpg
          grep -q 'const VERSION = "402.1"' site-fix-v317.js
          grep -q 'site-fix-v317.js?v=402.1' site.js
          grep -q '"version": "402.1"' deploy-version.json
          grep -q 'user-approved-original-scene' images/brand/website-mascot-manifest.json
          rm -f .github/workflows/install-user-approved-scenes-v402-1.yml

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網全站改用使用者核准原圖場景 v402.1"
          git push origin main
