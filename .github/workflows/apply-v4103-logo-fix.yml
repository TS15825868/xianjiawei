name: 修正 Logo 與圖片比例 v410.3

on:
  push:
    branches: [main]
    paths:
      - 'site-ux-v4103.css'
      - 'tools/apply_v4103_logo_fix.py'
      - '.github/workflows/apply-v4103-logo-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-logo-fix-v4103
  cancel-in-progress: true

jobs:
  apply-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 套用 Logo、圖片比例與 FAQ 修復
        run: python3 tools/apply_v4103_logo_fix.py

      - name: 驗證網站核心
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          git diff --check

      - name: 提交並更新 main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '全站已符合 v410.3。'
          else
            git commit -m 'fix: 修正頁首選單 Logo 與全站圖片比例 v410.3'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
