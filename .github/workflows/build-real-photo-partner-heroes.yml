name: 仙加味｜實拍商品正式主圖素材建置
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_real_photo_partner_heroes.py
      - .github/workflows/build-real-photo-partner-heroes.yml
permissions:
  contents: write
concurrency:
  group: xjw-real-photo-partner-hero-build
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pillow>=10,<13'
      - name: Preserve real product pixels, never redraw packaging
        run: python tools/build_real_photo_partner_heroes.py
      - name: Review evidence
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-real-photo-hero-contact
          path: |
            images/partner-product-design-review/site-hero-v20261016-contact.jpg
            images/partner-products/site-hero-v20261016/
          retention-days: 30
      - name: Save candidates on main without changing public product references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/partner-products/site-hero-v20261016/ images/partner-product-design-review/site-hero-v20261016-contact.jpg
          if git diff --cached --quiet; then
            echo "No new image bytes"
            exit 0
          fi
          git commit -m "assets(images): preserve eight real-photo premium product hero candidates [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
