name: Apply website v305 restore

on:
  pull_request:
    branches: [main]
    paths:
      - SITE_V305_TRIGGER.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore product and update public website
        run: |
          python -m pip install --quiet beautifulsoup4
          python tools/site_v305_restore.py
      - name: Validate
        run: |
          node --check site.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert any(p.get('id')=='guilu-drink-180' for p in data['products'])
          assert Path('product-guilu-drink-180cc.html').exists()
          assert '週一至週六 09:30–18:30' in Path('site.js').read_text(encoding='utf-8')
          print('website v305 validated')
          PY
      - name: Commit branch update
        run: |
          rm -f SITE_V305_TRIGGER.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "網站 v305：恢復龜鹿飲180cc、更新營業時間與完整角色圖" || exit 0
          git push origin HEAD:${{ github.head_ref }}
