name: 仙加味全系統健康監控

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n8n-monitor-scheduler.yml'
  schedule:
    # GitHub Actions 使用 UTC。每小時第 8 分執行，避開整點高峰。
    - cron: '8 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-system-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 驗證官網、LINE OA、ERP／貼文中心邊界與 n8n
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local name="$1" url="$2" body="/tmp/${3:-body}"
            echo "檢查：$name"
            local code
            code="$(curl -LsS --retry 2 --retry-delay 4 --connect-timeout 20 --max-time 120 -o "$body" -w '%{http_code}' "$url")"
            echo "$name -> HTTP $code"
            test "$code" = '200'
            test -s "$body"
          }

          check_boundary() {
            local name="$1" url="$2"
            echo "檢查：$name"
            local code
            code="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/boundary -w '%{http_code}' "$url" || true)"
            echo "$name -> HTTP $code"
            test -n "$code"
            test "$code" -ge 200
            test "$code" -lt 500
            test "$code" != '404'
          }

          wait_ready_200() {
            local name="$1" url="$2" body="/tmp/${3:-ready}"
            echo "檢查：$name"
            local code='000'
            # 2026-10-24: 12 x 45s probes repeatedly timed out against the
            # existing 512 MiB Render n8n, without making it ready.
            # Keep genuine 5xx/timeout failures visible, but do not spend
            # eleven minutes probing an unhealthy service. Independent
            # n8n monitoring and read-only fallback remain in the ERP repo.
            for attempt in 1 2 3; do
              code="$(curl -LsS --retry 0 --connect-timeout 7 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
              echo "$name attempt $attempt/3 -> HTTP $code"
              if [[ "$code" == '200' ]] && [[ -s "$body" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
            done
            echo "$name 在有限重試後仍未 ready；沒有將故障當作成功（HTTP $code）" >&2
            return 1
          }

          site='https://ts15825868.github.io/xianjiawei'

          # 每小時驗證顧客最常用入口、四項仙加味品牌商品與目前核准公開的其他廠牌系列頁。
          core_pages=(
            index.html products.html why-guilu.html
            product-guilu-gao.html product-guilu-drink-30cc.html product-guilu-drink-180cc.html
            product-luerong-fen.html product-jinan-siwuyin.html product-danshen-tea.html
            trial.html choose.html faq.html brand.html contact.html
          )
          for page in "${core_pages[@]}"; do
            key="${page//[^a-zA-Z0-9]/-}"
            check_200 "官網 $page" "$site/$page" "site-$key"
          done

          check_200 '公開產品母資料' "$site/public-product-master.json" productmaster
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/productmaster','utf8'));
          if(d.brand?.name!=='仙加味') throw new Error('官網公開品牌不是仙加味');
          if(!Array.isArray(d.products) || !d.products.length || Number(d.productCount)!==d.products.length || new Set(d.products.map(p=>p.id)).size!==d.products.length) throw new Error('仙加味品牌公開產品母資料數量或 ID 異常');
          const names=d.products.map(x=>x.name);
          const expected=['龜鹿膏','龜鹿飲30cc玻璃罐','龜鹿飲180cc鋁袋','鹿茸粉'];
          if(d.products.some(p=>['guilu-jiao','guilu-tangkuai'].includes(p.id))) throw new Error('暫緩產品回流公開');
          if(!expected.every(name=>names.includes(name))) throw new Error(`官網產品名稱異常 ${JSON.stringify(names)}`);
          const text=JSON.stringify(d);
          if(text.includes('台興山產')) throw new Error('官網公開產品母資料含舊品牌名');
          const drink30=d.products.find(x=>x.id==='guilu-drink-30');
          if(!drink30 || !/^每日\s*1[～–-]2\s*罐/.test(String(drink30.usage?.[0]||'')) || !JSON.stringify(drink30.usage).includes('可依個人需求調整')) throw new Error('30cc最新用法未生效：應為每日 1～2 罐，可依個人需求調整');
          if(!String(drink30.package||'').includes('裸罐') || !String(drink30.package||'').includes('無貼紙')) throw new Error('30cc正式包裝規則缺漏');
          const made=[...(d.fulfillmentPolicy?.madeToOrderProducts||[])].sort();
          const expectedMade=['guilu-drink-180','guilu-drink-30'].sort();
          if(JSON.stringify(made)!==JSON.stringify(expectedMade)) throw new Error('5～7工作天範圍不是僅兩款龜鹿飲');
          if(d.contact?.lineId!=='@762jybnm' || d.contact?.lineUrl!=='https://lin.ee/sHZW7NkR') throw new Error('LINE 導流資料異常');
          NODE

          # 其他廠牌公開清單以 partner-catalog.json 的 public=true 為準；不得用舊固定產品數覆蓋。
          check_200 '其他廠牌公開產品目錄' "$site/partner-catalog.json" partnercatalog
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/partnercatalog','utf8'));
          const publicProducts=(d.products||[]).filter(p=>p.public===true);
          const ids=publicProducts.map(p=>p.id);
          if(ids.length<1) throw new Error('其他廠牌公開清單空白');
          if(ids.some(id=>typeof id!=='string'||!id.trim())) throw new Error('其他廠牌公開產品缺合法 ID');
          if(new Set(ids).size!==ids.length) throw new Error('其他廠牌公開產品 ID 重複');
          // 新版核准商品可持續增加；舊版固定兩品數量不可阻止公開食品更新。
          // 仍須防止沒有藥品刊播資格的藥物被當成一般食品公開。
          for(const p of publicProducts){
            if(/藥品|中藥成藥|中藥製劑/.test(String(p.category||''))&&
               !(p.licenseVerification?.licenseNo&&p.medicineAdvertisingApproved===true))
              throw new Error('未核准藥品不應進入一般公開商品卡：'+p.id);
          }
          for(const p of publicProducts){
            if(!p.page || !p.image) throw new Error(`其他廠牌公開產品缺頁面或主圖：${p.id}`);
            if(p.onlineTransactionEligible===true) throw new Error(`資訊型其他廠牌商品不得誤開線上交易：${p.id}`);
          }
          fs.writeFileSync('/tmp/partner-public-pages',publicProducts.map(p=>p.page).join('\n')+'\n');
          fs.writeFileSync('/tmp/partner-public-media',publicProducts.map(p=>p.image).join('\n')+'\n');
          NODE
          while IFS= read -r page; do
            key="${page//[^a-zA-Z0-9]/-}"
            check_200 "其他廠牌公開頁 $page" "$site/$page" "partner-page-$key"
          done < /tmp/partner-public-pages

          # 正式主圖不可斷鏈；自有品牌只巡查目前四項，其他廠牌由公開目錄動態產生。
          product_media=(
            images/product-main/guilu-gao.jpg
            images/product-main/guilu-drink-30.jpg
            images/product-main/guilu-drink-180.jpg
            images/product-main/luerong-fen.jpg
          )
          for asset in "${product_media[@]}"; do
            key="${asset//[^a-zA-Z0-9]/-}"
            check_200 "正式產品圖 $asset" "$site/$asset" "media-$key"
          done
          while IFS= read -r asset; do
            key="${asset//[^a-zA-Z0-9]/-}"
            check_200 "其他廠牌正式產品圖 $asset" "$site/$asset" "partner-media-$key"
          done < /tmp/partner-public-media

          # LINE OA：同時驗 root、health 與正式營運旗標。
          check_200 'LINE OA root' 'https://ts-line.onrender.com/' lineroot
          check_200 'LINE OA 健康檢查' 'https://ts-line.onrender.com/healthz' linehealth
          node - <<'NODE'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('/tmp/lineroot','utf8'));
          const h=JSON.parse(fs.readFileSync('/tmp/linehealth','utf8'));
          if(root.ok!==true || root.service!=='仙加味 LINE OA') throw new Error('LINE root live 異常');
          if(h.ok!==true) throw new Error('LINE healthz ok=false');
          if(h.credentialsConfigured!==true) throw new Error('LINE credentials 未配置');
          if(h.orderOpen!==true) throw new Error('LINE orderOpen=false');
          if(Number(h.productCount)!==JSON.parse(fs.readFileSync('/tmp/productmaster','utf8')).productCount) throw new Error('LINE 自有品牌 productCount 與公開產品母資料不一致');
          if(h.mascotAssetsReady!==true) throw new Error('LINE mascotAssetsReady=false');
          NODE

          # Cloudflare Access 未登入時應是受保護邊界；404/5xx 一律視為故障。
          internal='https://xianjiawei-internal.tung314069.workers.dev'
          check_boundary '內部系統入口' "$internal/"
          check_boundary 'ERP' "$internal/erp.html"
          check_boundary '貼文中心' "$internal/publishing.html"
          check_boundary 'ERP／貼文中心 healthz/core' "$internal/healthz/core"

          # Render 512 MiB 舊版 n8n 尚未更新，已知 hourly 冷啟動一直逾時。
          # 官網／LINE／ERP 檢查照常執行；只有人員手動驗收才喚醒 n8n。
          # n8n 的狀態不得在例行巡檢中誤報為已通過，待新 LIVE 版再復驗。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            wait_ready_200 'n8n 存活檢查' 'https://xianjiawei-n8n-longterm.onrender.com/healthz' n8n-live
            wait_ready_200 'n8n readiness' 'https://xianjiawei-n8n-longterm.onrender.com/healthz/readiness' n8n-ready
            node - <<'NODE'
          const fs=require('fs');
          for (const file of ['/tmp/n8n-live','/tmp/n8n-ready']) {
            const v=JSON.parse(fs.readFileSync(file,'utf8'));
            if(v.status!=='ok') throw new Error(`${file} status != ok`);
          }
          NODE
            n8n_checked=true
          else
            n8n_checked=false
            echo 'NOTICE：n8n 未經本次驗證，已知 Render 舊版不穩定；未觸發冷啟動。'
          fi

          # 慢變資料與全 sitemap 每 6 小時完整巡檢一次；手動執行一定檢查。
          hour="$(date -u +%H)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( 10#$hour % 6 == 0 )); then
            check_200 'Sitemap' "$site/sitemap.xml" sitemap
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/sitemap').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('s:url/s:loc',ns) if x.text and x.text.strip()]
          if not urls or len(urls) != len(set(urls)):
              raise SystemExit(f'sitemap URL數不足：{len(urls)}')
          open('/tmp/sitemap-urls','w',encoding='utf-8').write('\n'.join(urls)+'\n')
          print('sitemap URLs',len(urls))
          PY
            while IFS= read -r url; do
              code="$(curl -LsS --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 90 -o /tmp/sitemap-body -w '%{http_code}' "$url")"
              echo "sitemap $url -> HTTP $code"
              test "$code" = '200'
              test -s /tmp/sitemap-body
            done < /tmp/sitemap-urls

            for asset in welcome recommend usage faq service; do
              check_200 "LINE 小老闆素材 $asset" "https://raw.githubusercontent.com/TS15825868/TS-LINE/main/public/mascot/$asset.jpg" "line-mascot-$asset"
            done
          fi

          if [[ "$n8n_checked" == true ]]; then
            echo 'PASS 仙加味官網／LINE／ERP 與 n8n 人工觸發驗收'
          else
            echo 'PASS 仙加味官網／LINE／ERP 例行巡檢；n8n 尚未驗證（待新版成功部署）'
            echo 'NOTICE n8n is not verified; hourly cron intentionally avoids known unhealthy Render cold starts.' >> "$GITHUB_STEP_SUMMARY"
          fi

