name: 仙加味 n8n 監控排程

on:
  schedule:
    # GitHub Actions 使用 UTC。每小時第 8 分執行，避開整點高峰。
    # 正式排程由 Metricool 承接；此流程只做健康監控，不需要每 15 分鐘喚醒免費 n8n。
    - cron: '8 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-n8n-monitor-scheduler
  cancel-in-progress: true

jobs:
  trigger-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 觸發仙加味只讀監控
        shell: bash
        run: |
          set -euo pipefail

          call_webhook() {
            local name="$1"
            local url="$2"
            echo "觸發：${name}"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --location \
                --connect-timeout 20 --max-time 120 \
                "$url" >/dev/null; then
                echo "完成：${name}"
                return 0
              fi
              echo "${name} 第 ${attempt} 次未完成，15 秒後重試"
              sleep 15
            done
            echo "失敗：${name}"
            return 1
          }

          LINE_URL='https://xianjiawei-n8n-longterm.onrender.com/webhook/xjw-line-health-a7f8c2'
          SYSTEM_URL='https://xianjiawei-n8n-longterm.onrender.com/webhook/xjw-system-health-d4b6e1'
          AI_GEO_URL='https://xianjiawei-n8n-longterm.onrender.com/webhook/xjw-ai-geo-9c3f75'

          call_webhook 'LINE OA 健康監控' "$LINE_URL"
          call_webhook '系統健康總監控' "$SYSTEM_URL"

          # AI／GEO 母資料一致性屬慢變資料，每 6 小時檢查一次即可；手動執行時一定檢查。
          hour="$(date -u +%H)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( 10#$hour % 6 == 0 )); then
            call_webhook '產品母資料 AI GEO 一致性檢查' "$AI_GEO_URL"
          fi
