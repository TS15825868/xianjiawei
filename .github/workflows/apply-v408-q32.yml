name: Apply v408.1 latest product and DM assets

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - '_upload/v408-q32-ready.txt'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: v408-q32-assets
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.issue.title == 'RUN_V408_Q32_FULL_UPDATE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/v408
          cat _upload/v408-q32-parts/part-*.txt | base64 -d > /tmp/v408/assets.zip
          unzip -t /tmp/v408/assets.zip
          unzip -q /tmp/v408/assets.zip -d /tmp/v408/unpacked
          python3 - <<'PY'
          from pathlib import Path
          expected=[
            'products-v3/guilu-gao.avif','products-v3/guilu-drink-30.avif',
            'products-v3/guilu-drink-180.avif','products-v3/guilu-tangkuai.avif',
            'products-v3/guilu-jiao.avif','products-v3/luerong-fen.avif',
            'dm-final/01_guilu-gao-100g-dm.avif','dm-final/02_guilu-drink-30cc-dm.avif',
            'dm-final/03_guilu-drink-180cc-dm.avif','dm-final/04_luerong-fen-75g-dm.avif',
            'dm-final/05_guilu-tangkuai-75g-dm.avif','dm-final/06_guilu-jiao-600g-dm.avif']
          root=Path('/tmp/v408/unpacked')
          for rel in expected:
              p=root/rel
              assert p.is_file() and p.stat().st_size > 15000,(rel,p.stat().st_size if p.exists() else 0)
          print('verified 12 latest images')
          PY

      - name: Install six product images and six DM images
        run: |
          set -euo pipefail
          cp -f /tmp/v408/unpacked/products-v3/*.avif images/products-v3/
          cp -f /tmp/v408/unpacked/dm-final/*.avif images/dm-final/
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          v='408.1'
          stems=['guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen']
          dm=['01_guilu-gao-100g-dm','02_guilu-drink-30cc-dm','03_guilu-drink-180cc-dm','04_luerong-fen-75g-dm','05_guilu-tangkuai-75g-dm','06_guilu-jiao-600g-dm']
          repl={}
          for s in stems:
              for ext in ('jpg','jpeg','png','webp','avif'):
                  repl[f'images/products-v3/{s}.{ext}']=f'images/products-v3/{s}.avif'
          for s in dm:
              for ext in ('jpg','jpeg','png','webp','avif'):
                  repl[f'images/dm-final/{s}.{ext}']=f'images/dm-final/{s}.avif'
          targets=list(Path('.').glob('*.html'))+[Path('data.json'),Path('site-core.js'),Path('approved-mascot-v405.js')]
          for p in targets:
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              for old,new in repl.items(): text=text.replace(old,new)
              text=re.sub(r'(?<=\.avif)\?v=[0-9.]+',f'?v={v}',text)
              text=re.sub(r'(site(?:-v\d+)?\.(?:css|js))\?v=[0-9.]+',lambda m:m.group(1)+f'?v={v}',text)
              p.write_text(text,encoding='utf-8')
          info={'version':v,'updated':'2026-07-13','status':'latest-six-product-and-six-dm-images-installed','catalog':'five-types-six-specifications','imagePolicy':{'productCards':'product-image','quickViewModal':'dm-image','detailHero':'product-image','detailMascot':'product-specific-mascot','dmPage':'dm-image'},'frontend':'consolidation-next'}
          Path('deploy-version.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node --check site-core.js
          python3 -m json.tool data.json >/dev/null
          test "$(grep -o 'class=\"dm-image-v2\"' dm.html | wc -l)" -eq 6
          grep -q 'guilu-gao.avif?v=408.1' data.json
          grep -q '01_guilu-gao-100g-dm.avif?v=408.1' data.json

      - name: Commit latest product and DM assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/products-v3 images/dm-final '*.html' data.json site-core.js approved-mascot-v405.js deploy-version.json
          git commit -m '更新六項產品主圖與六張DM原圖 v408.1'
          git push origin HEAD:main

      - name: Consolidate JavaScript and CSS safely
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          v='408.1'
          core=Path('site-core.js').read_text(encoding='utf-8').strip()
          mascot=Path('approved-mascot-v405.js').read_text(encoding='utf-8').strip()
          core=re.sub(r'^\s*["\']use strict["\'];?\s*','',core)
          mascot=re.sub(r'^\s*["\']use strict["\'];?\s*','',mascot)
          core=re.sub(r'data\.json\?v=[0-9.]+',f'data.json?v={v}',core)
          mascot=re.sub(r'const VERSION = ["\'][0-9.]+["\'];',f'const VERSION = "{v}";',mascot)
          Path('site.js').write_text('"use strict";\n\n/* 仙加味網站核心｜整合正式版 v408.1 */\n'+core+'\n\n/* 15張核准小老闆頁面配置 */\n'+mascot+'\n',encoding='utf-8')
          base=Path('site.css').read_text(encoding='utf-8')
          mobile=Path('site-v321.css').read_text(encoding='utf-8')
          mascot_css=Path('site-v405.css').read_text(encoding='utf-8')
          base=re.sub(r'/\* BEGIN CONSOLIDATED FRONTEND \*/.*?/\* END CONSOLIDATED FRONTEND \*/\s*','',base,flags=re.S)
          Path('site.css').write_text(base.rstrip()+'\n\n/* BEGIN CONSOLIDATED FRONTEND */\n/* 手機版與互動修正 */\n'+mobile.strip()+'\n\n/* 核准小老闆圖片樣式 */\n'+mascot_css.strip()+'\n/* END CONSOLIDATED FRONTEND */\n',encoding='utf-8')
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              text=re.sub(r'\s*<link[^>]+href="site-v(?:321|405)\.css[^>]*>\s*','\n',text)
              text=re.sub(r'\s*<script[^>]+src="(?:site-core|approved-mascot-v405)\.js[^>]*></script>\s*','\n',text)
              text=re.sub(r'site\.css\?v=[0-9.]+',f'site.css?v={v}',text)
              text=re.sub(r'site\.js\?v=[0-9.]+',f'site.js?v={v}',text)
              p.write_text(text,encoding='utf-8')
          info=json.loads(Path('deploy-version.json').read_text(encoding='utf-8'))
          info['frontend']='single-site-js-and-single-site-css'
          info['status']='production-ready'
          Path('deploy-version.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f site-core.js approved-mascot-v405.js site-v321.css site-v405.css
          node --check site.js
          grep -q '仙加味網站核心｜整合正式版 v408.1' site.js
          grep -q 'BEGIN CONSOLIDATED FRONTEND' site.css
          for p in *.html; do ! grep -qE 'site-v321\.css|site-v405\.css|site-core\.js|approved-mascot-v405\.js' "$p"; done

      - name: Install durable deployment workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          text=p.read_text(encoding='utf-8') if p.exists() else ''
          text=text.replace('407.1','408.1').replace('.webp','.avif')
          p.write_text(text,encoding='utf-8')
          PY
          git add -A
          git commit -m '整合網站JS與CSS並更新自動部署 v408.1'
          git push origin HEAD:main

      - name: Remove temporary payload and experimental workflows
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -rf _upload
          rm -f .github/workflows/apply-v408-q32.yml .github/workflows/apply-v408-assets.yml
          rm -f .github/workflows/run-v408-now.yml .github/workflows/apply-product-assets-v408.yml
          rm -f .github/workflows/debug-v408.yml .github/workflows/apply-v408-safe.yml
          rm -f .github/workflows/consolidate-frontend-v408.yml .github/workflows/test-drive-download-v408.yml
          rm -f .github/workflows/apply-v408-from-comments.yml .github/workflows/patch-v408-chunk-count.yml
          git add -A
          git commit -m '清理v408暫存與失敗測試流程'
          git push origin HEAD:main

      - name: Report completion
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408_UPDATE_SUCCESS｜六項產品圖、六張DM、跳窗、詳細頁、單一JS/CSS與部署均已完成。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
