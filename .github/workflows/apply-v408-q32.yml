name: 完成仙加味官網 v408.2 更新

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: xianjiawei-production-update
  cancel-in-progress: false

jobs:
  apply-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_XIANJIAWEI_V408_2_COMPLETE'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 驗證正式原圖與小老闆素材
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          product_files=[
              'images/products-v3/guilu-gao.jpg',
              'images/products-v3/guilu-drink-30.jpg',
              'images/products-v3/guilu-drink-180.jpg',
              'images/products-v3/guilu-tangkuai.jpg',
              'images/products-v3/guilu-jiao.jpg',
              'images/products-v3/luerong-fen.jpg',
          ]
          dm_files=[
              'images/dm-final/01_guilu-gao-100g-dm.jpg',
              'images/dm-final/02_guilu-drink-30cc-dm.jpg',
              'images/dm-final/03_guilu-drink-180cc-dm.jpg',
              'images/dm-final/04_luerong-fen-75g-dm.jpg',
              'images/dm-final/05_guilu-tangkuai-75g-dm.jpg',
              'images/dm-final/06_guilu-jiao-600g-dm.jpg',
          ]
          for filename in product_files:
              p=Path(filename)
              assert p.is_file(), p
              assert p.stat().st_size > 10000, (p,p.stat().st_size)
          for filename in dm_files:
              p=Path(filename)
              assert p.is_file(), p
              assert p.stat().st_size > 100000, (p,p.stat().st_size)

          manifest=json.loads(Path('images/brand/approved-v405-manifest.json').read_text(encoding='utf-8'))
          mascot_files=list(manifest['corePages'].values())+list(manifest['productPages'].values())
          assert len(mascot_files)==15
          assert len(set(mascot_files))==15
          for filename in mascot_files:
              p=Path('images/brand/approved-v405')/filename
              assert p.is_file(), p
              assert p.stat().st_size > 20000, (p,p.stat().st_size)
          print('正式素材驗證完成')
          PY

      - name: 整合單一 JavaScript 與 CSS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          version='408.2'
          core_path=Path('site-core.js')
          mascot_path=Path('approved-mascot-v405.js')
          mobile_css_path=Path('site-v321.css')
          mascot_css_path=Path('site-v405.css')
          assert core_path.is_file()
          assert mascot_path.is_file()
          assert mobile_css_path.is_file()
          assert mascot_css_path.is_file()

          core=core_path.read_text(encoding='utf-8').strip()
          mascot=mascot_path.read_text(encoding='utf-8').strip()
          core=re.sub(r'^\s*["\']use strict["\'];?\s*','',core)
          mascot=re.sub(r'^\s*["\']use strict["\'];?\s*','',mascot)
          core=re.sub(r'data\.json\?v=[0-9.]+',f'data.json?v={version}',core)
          mascot=re.sub(r'const VERSION = ["\'][0-9.]+["\'];',f'const VERSION = "{version}";',mascot)
          Path('site.js').write_text(
              '"use strict";\n\n/* 仙加味網站核心｜整合正式版 v408.2 */\n'
              +core+'\n\n/* 15張核准小老闆頁面配置 */\n'+mascot+'\n',
              encoding='utf-8'
          )

          base=Path('site.css').read_text(encoding='utf-8')
          mobile=mobile_css_path.read_text(encoding='utf-8').strip()
          mascot_css=mascot_css_path.read_text(encoding='utf-8').strip()
          base=re.sub(r'/\* BEGIN CONSOLIDATED FRONTEND \*/.*?/\* END CONSOLIDATED FRONTEND \*/\s*','',base,flags=re.S)
          Path('site.css').write_text(
              base.rstrip()+'\n\n/* BEGIN CONSOLIDATED FRONTEND */\n'
              +'/* 手機版與高畫質顯示修正 */\n'+mobile
              +'\n\n/* 15張核准小老闆圖片樣式 */\n'+mascot_css
              +'\n/* END CONSOLIDATED FRONTEND */\n',
              encoding='utf-8'
          )

          asset_pattern=re.compile(r'(\.(?:css|js|jpg|jpeg|png|webp|avif))\?v=[0-9.]+')
          for page in Path('.').glob('*.html'):
              text=page.read_text(encoding='utf-8')
              text=re.sub(r'\s*<link[^>]+href="site-v(?:321|405)\.css[^>]*>\s*','\n',text)
              text=re.sub(r'\s*<script[^>]+src="(?:site-core|approved-mascot-v405)\.js[^>]*></script>\s*','\n',text)
              text=asset_pattern.sub(lambda m:m.group(1)+f'?v={version}',text)
              text=re.sub(r'site\.css(?:\?v=[0-9.]+)?',f'site.css?v={version}',text)
              text=re.sub(r'site\.js(?:\?v=[0-9.]+)?',f'site.js?v={version}',text)
              page.write_text(text,encoding='utf-8')

          data_path=Path('data.json')
          data_text=data_path.read_text(encoding='utf-8')
          data_text=asset_pattern.sub(lambda m:m.group(1)+f'?v={version}',data_text)
          data_path.write_text(data_text,encoding='utf-8')

          info={
              'version':version,
              'updated':'2026-07-13',
              'status':'production-ready',
              'catalog':'five-types-six-specifications',
              'imagePolicy':{
                  'productCards':'original-product-image',
                  'quickViewModal':'original-dm-image',
                  'detailHero':'original-product-image',
                  'detailMascot':'approved-page-specific-mascot',
                  'dmPage':'original-dm-image'
              },
              'frontend':'single-site-js-and-single-site-css',
              'automation':'main-only-auto-deploy-and-trusted-pr-auto-merge'
          }
          Path('deploy-version.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -f site-core.js approved-mascot-v405.js site-v321.css site-v405.css
          rm -rf _upload
          rm -f .github/workflows/apply-v408-assets.yml
          rm -f .github/workflows/run-v408-now.yml
          rm -f .github/workflows/apply-product-assets-v408.yml
          rm -f .github/workflows/debug-v408.yml
          rm -f .github/workflows/apply-v408-safe.yml
          rm -f .github/workflows/consolidate-frontend-v408.yml
          rm -f .github/workflows/test-drive-download-v408.yml
          rm -f .github/workflows/apply-v408-from-comments.yml
          rm -f .github/workflows/patch-v408-chunk-count.yml
          rm -f .github/workflows/apply-v408-q32.yml

      - name: 正式上線前驗收
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '仙加味網站核心｜整合正式版 v408.2' site.js
          grep -q 'BEGIN CONSOLIDATED FRONTEND' site.css
          grep -q '"status": "production-ready"' deploy-version.json
          test ! -e site-core.js
          test ! -e approved-mascot-v405.js
          test ! -e site-v321.css
          test ! -e site-v405.css
          test ! -e _upload
          for page in *.html; do
            ! grep -qE 'site-v321\.css|site-v405\.css|site-core\.js|approved-mascot-v405\.js' "$page"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(data['products'])==6
          for product in data['products']:
              assert product['image'].endswith('.jpg?v=408.2'), product['image']
              assert product['dmImage'].endswith('.jpg?v=408.2'), product['dmImage']
          dm=Path('dm.html').read_text(encoding='utf-8')
          assert dm.count('class="dm-image-v2"')==6
          print('程式、產品頁、DM與素材引用驗收完成')
          PY

      - name: Commit and push main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成仙加味官網正式整合與上線 v408.2'
          git push origin HEAD:main

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='_upload/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site.js
          test -s _site/site.css
          grep -q 'site.js?v=408.2' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回報並關閉觸發 Issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.2_UPDATE_SUCCESS｜已使用正式產品原圖與DM原圖，完成六項產品資料、15張核准小老闆、單一site.js／site.css、清理暫存流程、推送main並部署GitHub Pages。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
