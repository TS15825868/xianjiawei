name: Install corrected additional website mascot scenes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-additional-mascot-scenes.yml"

permissions:
  contents: write

concurrency:
  group: install-corrected-additional-website-mascot-scenes
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download corrected scene package
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://drive.google.com/uc?export=download&id=18d3HUeCNaxwvjAwdsWJUYQPBVsccX-Yi&confirm=t" \
            -o /tmp/xjw-additional-scenes-v401.1.zip
          unzip -t /tmp/xjw-additional-scenes-v401.1.zip

      - name: Install files directly into main working tree
        run: |
          set -euo pipefail
          unzip -o /tmp/xjw-additional-scenes-v401.1.zip -d .
          for f in dm video knowledge hanfang-baike sources; do
            test -s "images/brand/website-mascot-${f}.jpg"
            test "$(stat -c%s "images/brand/website-mascot-${f}.jpg")" -gt 250000
            file "images/brand/website-mascot-${f}.jpg" | grep -q 'JPEG image data'
          done
          grep -q 'const VERSION = "401.1"' site-fix-v317.js
          grep -q 'website-mascot-sources.jpg' site-fix-v317.js
          grep -q '"version": "401.1"' deploy-version.json
          grep -q '"version": "401.1"' images/brand/website-mascot-manifest.json
          rm -f .additional-mascot-install-trigger
          rm -f .github/workflows/install-additional-mascot-scenes.yml

      - name: Commit corrected files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "補齊官網其他頁面小老闆圖並移除失敗觸發檔"
          git push origin main
