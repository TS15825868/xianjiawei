name: Restore full retail-box main images
on:
  push:
    branches: [main]
    paths:
      - 'ops/build-clean-retail-boxes-20261017.py'
      - '.github/workflows/restore-full-retail-boxes-20261017.yml'
permissions:
  contents: write
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Crop real complete product cartons, remove non-product debris, sync all site sources
        run: python ops/build-clean-retail-boxes-20261017.py
      - name: Verify correct image identity, size, and every product page
        run: node tools/audit-pure-product-hero.cjs
      - name: Publish matching original-photo full boxes to main
        run: |
          git config user.name "xianjiawei-actions"
          git config user.email "xianjiawei-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: crop authentic full cartons and remove four-treasures background bag"
            git push origin HEAD:main
          fi
