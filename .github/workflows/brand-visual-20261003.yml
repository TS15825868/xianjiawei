name: 仙加味品牌圖示與 Chrome Safari 視覺驗收
on:
  push:
    branches: [main]
    paths: ['**/*.html', '**/*.css', '**/*.webmanifest', '*icon*', 'android-chrome*', 'images/brand/landscape-v20261003.svg', '.github/workflows/brand-visual-20261003.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8765 > /tmp/site-server.log 2>&1 &
      - name: Verify desktop and mobile Chromium and WebKit
        run: node tools/audit-brand-visual-20261003.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-browser-verification
          path: diagnostics/brand-20261003/
