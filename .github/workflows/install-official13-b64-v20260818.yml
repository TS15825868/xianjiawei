          )
          for i in $(seq -w 1 13); do
            var="URL${i}"
            idx=$((10#$i - 1))
            curl -LfsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 "${!var}" -o "/tmp/official13/${names[$idx]}"
