              assert im.size==size, (name,im.size,size)
              im.verify()
              print('PASS',name,size)
          PY

      - name: Install the 13-image formal authority only
        shell: bash
        run: |
          set -euo pipefail
          target='images/posts/official-v20260818'
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/official13/*.webp "$target"/
          (cd "$target" && sha256sum *.webp > SHA256SUMS.txt)
          cat > "$target/manifest.json" <<'JSON'
          {
            "version":"2026-08-19-official13-installed",
            "brand":"仙加味",
            "count":13,
            "status":"installed",
            "fallback_policy":"forbidden",
            "rule":"圖文一對一；正式圖片缺失時不得以FAQ、怎麼使用、priority、rebuild、generated或其他舊圖替代",
            "review":"未發布11篇回待審核；已發布試喝與仙加味從萬華開始維持已發布"
          }
          JSON
          git rm -r --ignore-unmatch images/posts/priority10-v20260817 images/posts/rebuild-v20260816 images/posts/current-v20260815 images/posts/generated-v20260806 images/posts/generated-v20260808-preflight images/posts/generated-v20260808-priority1 images/posts/generated
          git add "$target"

      - name: Commit exact formal images to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No change needed; exact official13 already installed.'
            exit 0
          fi
          git commit -m 'fix(posts): install 13 exact owner-confirmed posting images'
          git pull --rebase origin main
          git push origin HEAD:main
