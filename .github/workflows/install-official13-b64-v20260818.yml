name: 安裝仙加味貼文中心13張正式圖 20260818

on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/official13-package.zip'
      - 'assets/staging/official13-b64/INSTALL.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xjw-install-official13-20260818
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official image ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f assets/staging/official13-package.zip ]; then
            cp assets/staging/official13-package.zip /tmp/official13.zip
          else
            test -d assets/staging/official13-b64
            count="$(find assets/staging/official13-b64 -maxdepth 1 -type f -name 'part*.txt' | wc -l)"
            test "$count" -ge 1
            find assets/staging/official13-b64 -maxdepth 1 -type f -name 'part*.txt' -print | sort | xargs cat | tr -d '\n\r ' | base64 -d > /tmp/official13.zip
          fi
          unzip -t /tmp/official13.zip
          rm -rf /tmp/official13
          mkdir -p /tmp/official13
          unzip -q /tmp/official13.zip -d /tmp/official13
          find /tmp/official13 -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Validate exact 13 formal images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/official13')
          names=[
            '01-work-30cc.webp','02-home-180cc.webp','03-gao-storage.webp','04-tangkuai-soup.webp','05-jiao-600g.webp',
            '06-lurong-75g.webp','07-line-consult.webp','08-home-out.webp','09-organize-cabinet.webp','10-office-warm-drink.webp',
            '11-audience-needs.webp','12-trial-group-published.webp','13-brand-story-wanhua-published.webp'
          ]
          found=sorted(p.name for p in root.glob('*.webp'))
          if found!=sorted(names): raise SystemExit(f'wrong files: {found}')
          for name in names:
              p=root/name
              im=Image.open(p)
              if im.format!='WEBP': raise SystemExit(f'not webp: {name}')
              min_height=450 if name=='13-brand-story-wanhua-published.webp' else 500
              if im.width<600 or im.height<min_height: raise SystemExit(f'too small: {name} {im.size}')
              im.verify()
              print('PASS',name)
          PY
      - name: Install as single formal posting-image authority
        shell: bash
        run: |
          set -euo pipefail
          target='images/posts/official-v20260818'
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/official13/*.webp "$target"/
          sha256sum "$target"/*.webp > "$target/SHA256SUMS.txt"
          cat > "$target/manifest.json" <<'JSON'
          {
            "version": "2026-08-18-official13-final",
            "brand": "仙加味",
            "count": 13,
            "status": "installed",
            "rule": "圖文一對一；不得以FAQ、怎麼使用、舊priority、rebuild或其他fallback圖替代",
            "review": "未發布內容換圖後一律回待審核；已發布品牌故事與試喝貼文保留已發布狀態"
          }
          JSON
          git rm -r --ignore-unmatch images/posts/priority10-v20260817
          git rm -r --ignore-unmatch images/posts/rebuild-v20260816
          git rm -r --ignore-unmatch images/posts/current-v20260815
          git rm -r --ignore-unmatch images/posts/generated-v20260806
          git rm -r --ignore-unmatch images/posts/generated-v20260808-preflight
          git rm -r --ignore-unmatch images/posts/generated-v20260808-priority1
          git rm -r --ignore-unmatch images/posts/generated
          git add "$target"
          git rm -f --ignore-unmatch assets/staging/official13-package.zip
          git rm -r --ignore-unmatch assets/staging/official13-b64
      - name: Commit official images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No image changes'
            exit 0
          fi
          git commit -m 'fix(posts): install 13 user-confirmed formal posting images'
          git pull --rebase origin main
          git push origin HEAD:main
