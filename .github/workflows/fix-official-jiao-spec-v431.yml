name: 官網正式產品規格一次修復 v431

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-official-jiao-spec-v431.yml'

permissions:
  contents: write

concurrency:
  group: site-official-spec-v431
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the user-confirmed canonical product wording
        run: python3 tools/enforce_canonical_public_product_wording.py --write

      - name: Verify official website contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enforce_canonical_public_product_wording.py --check
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' assets/data/official-products.json
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' data.json
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' product-guilu-jiao.html
          if grep -RIn --exclude-dir=.git --exclude='fix-official-jiao-spec-v431.yml' '600g（1斤）／盒' .; then
            echo '仍含錯誤的龜鹿膠規格。' >&2
            exit 1
          fi
          node tools/audit-site.mjs

      - name: Persist repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-official-jiao-spec-v431.yml
          git add -A
          if git diff --cached --quiet; then
            echo '正式規格已完全一致。'
          else
            git commit -m 'fix(site): restore official guilu-jiao 600g box specification'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
