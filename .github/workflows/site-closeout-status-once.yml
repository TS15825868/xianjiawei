name: Website Closeout Status Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-closeout-status-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current website release
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate-site-production-release-v20260809.py
          python tools/validate-site-release.py
          python tools/validate-canonical-facts-v20260808.py
          python tools/validate-public-customer-pages-v20260809.py
          python tools/validate-post-bank-current-authority-v20260809.py
          node tools/validate-post-bank-runtime-v20260809.js
          python tools/validate-publishing-content-match-v20260809.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/post-library-userzip3-v20260811.json').read_text(encoding='utf-8'))
          safe=[x for x in d['items'] if x.get('editable_copy_safe')]
          assert len(safe)==15
          assert all(x.get('availability')=='online' and x.get('online_src') for x in safe)
          for x in safe:
            p=Path('.'+x['online_src'])
            assert p.is_file(), p
          PY
      - name: Verify live GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          base='https://ts15825868.github.io/xianjiawei'
          for p in / /publishing-center.html /dm.html /trial.html /data/post-library-userzip3-v20260811.json /images/post-library/userzip3-v20260811/warm-rhythm.webp /images/dm-approved-v20260810/guilu-drink-30cc.webp /images/dm-approved-v20260810/guilu-drink-trial.webp; do
            curl -fsSL --retry 5 --retry-delay 3 "$base$p" -o /tmp/site-check
            test -s /tmp/site-check
          done
      - name: Record status and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > closeout-status.json <<'JSON'
          {
            "version": "website-closeout-v20260811",
            "verified_at": "2026-08-11T15:15:00+08:00",
            "repository_release_audit": "passed",
            "github_pages_live": "passed",
            "current_zip_lifestyle_scenes_online": 15,
            "blocking_guards": "paused_pending_owner_confirmation"
          }
          JSON
          rm -f .github/workflows/site-closeout-status-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'audit: record verified website closeout'
          git push
