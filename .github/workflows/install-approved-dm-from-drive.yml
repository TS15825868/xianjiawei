name: Install approved DM from Drive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-approved-dm-from-drive.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: install-approved-dm
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick tesseract-ocr tesseract-ocr-chi-tra

      - name: Download approved source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --max-time 180 \
            -o /tmp/approved-dm-source \
            'https://drive.usercontent.google.com/download?id=11rBLrjxeDX8W_jcKRAfIj4B9Z8q9aQql&export=download&confirm=t'
          file /tmp/approved-dm-source
          unzip -t /tmp/approved-dm-source
          rm -rf /tmp/approved-dm
          mkdir -p /tmp/approved-dm
          unzip -q /tmp/approved-dm-source -d /tmp/approved-dm

      - name: Identify and map six approved DM images
        run: |
          set -euo pipefail
          mkdir -p /tmp/mapped images/dm-final
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, shutil

          candidates=[]
          for p in Path('/tmp/approved-dm').rglob('*'):
              if not p.is_file() or p.name.startswith('._') or '__MACOSX' in p.parts:
                  continue
              if p.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue
              try:
                  wh=subprocess.check_output(['identify','-format','%w %h',str(p)],text=True).strip()
              except Exception:
                  continue
              if wh == '1122 1402':
                  candidates.append(p)
          if len(candidates) != 6:
              raise SystemExit(f'Expected 6 approved 1122x1402 images, got {len(candidates)}: {candidates}')

          mapped={}
          reports=[]
          for p in candidates:
              text=subprocess.check_output(['tesseract',str(p),'stdout','-l','chi_tra+eng','--psm','6'],stderr=subprocess.DEVNULL,text=True,errors='ignore')
              compact=re.sub(r'\s+','',text)
              reports.append((p.name,compact[:500]))
              key=None
              if '鹿茸粉' in compact or ('鹿茸' in compact and '75g' in compact and '龜鹿' not in compact):
                  key='04_luerong-fen-75g-dm.webp'
              elif '龜鹿膠' in compact or ('龜鹿' in compact and '600g' in compact):
                  key='06_guilu-jiao-600g-dm.webp'
              elif '湯塊' in compact or ('龜鹿' in compact and '8塊' in compact):
                  key='05_guilu-tangkuai-75g-dm.webp'
              elif '180cc' in compact or '180CC' in compact:
                  key='03_guilu-drink-180cc-dm.webp'
              elif '30cc' in compact or '30CC' in compact:
                  key='02_guilu-drink-30cc-dm.webp'
              elif '龜鹿膏' in compact or ('龜鹿' in compact and '100g' in compact):
                  key='01_guilu-gao-100g-dm.webp'
              if not key:
                  raise SystemExit(f'Could not classify {p}: {compact[:1000]}')
              if key in mapped:
                  raise SystemExit(f'Duplicate mapping {key}: {mapped[key]} and {p}')
              mapped[key]=p

          expected={
              '01_guilu-gao-100g-dm.webp','02_guilu-drink-30cc-dm.webp',
              '03_guilu-drink-180cc-dm.webp','04_luerong-fen-75g-dm.webp',
              '05_guilu-tangkuai-75g-dm.webp','06_guilu-jiao-600g-dm.webp'
          }
          if set(mapped) != expected:
              raise SystemExit(f'Mapping incomplete: {mapped}')

          for name,src in mapped.items():
              out=Path('images/dm-final')/name
              subprocess.check_call(['magick',str(src),'-strip','-quality','88',str(out)])
              wh=subprocess.check_output(['identify','-format','%w %h',str(out)],text=True).strip()
              if wh != '1122 1402' or out.stat().st_size < 80000:
                  raise SystemExit(f'Bad output {out}: {wh} {out.stat().st_size}')
          Path('/tmp/ocr-report.txt').write_text('\n\n'.join(f'{n}: {t}' for n,t in reports),encoding='utf-8')
          PY

      - name: Update site references and version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          V='408.5'
          dm={
            'guilu-gao':'images/dm-final/01_guilu-gao-100g-dm.webp',
            'guilu-drink-30':'images/dm-final/02_guilu-drink-30cc-dm.webp',
            'guilu-drink-180':'images/dm-final/03_guilu-drink-180cc-dm.webp',
            'luerong-fen':'images/dm-final/04_luerong-fen-75g-dm.webp',
            'guilu-tangkuai':'images/dm-final/05_guilu-tangkuai-75g-dm.webp',
            'guilu-jiao':'images/dm-final/06_guilu-jiao-600g-dm.webp',
          }
          old={
            'images/dm-final/01_guilu-gao-100g-dm.jpg':dm['guilu-gao'],
            'images/dm-final/02_guilu-drink-30cc-dm.jpg':dm['guilu-drink-30'],
            'images/dm-final/03_guilu-drink-180cc-dm.jpg':dm['guilu-drink-180'],
            'images/dm-final/04_luerong-fen-75g-dm.jpg':dm['luerong-fen'],
            'images/dm-final/05_guilu-tangkuai-75g-dm.jpg':dm['guilu-tangkuai'],
            'images/dm-final/06_guilu-jiao-600g-dm.jpg':dm['guilu-jiao'],
          }
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          for p in data['products']:
              p['image']=re.sub(r'\?v=[0-9.]+$',f'?v={V}',p['image'])
              p['dmImage']=f"{dm[p['id']]}?v={V}"
              p['detailImages']=[p['dmImage']]
          Path('data.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          paths=[Path('dm.html'),Path('site.js'),Path('.github/workflows/deploy-pages.yml')]+list(Path('.').glob('product-*.html'))
          for path in paths:
              text=path.read_text(encoding='utf-8')
              for a,b in old.items(): text=text.replace(a,b)
              text=re.sub(r'(\.(?:css|js|json|jpg|jpeg|png|webp|avif))\?v=[0-9.]+',lambda m:m.group(1)+f'?v={V}',text)
              text=re.sub(r'v408\.4',f'v{V}',text)
              text=re.sub(r'"version": "408\.4"',f'"version": "{V}"',text)
              path.write_text(text,encoding='utf-8')
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              text=re.sub(r'(\.(?:css|js|json|jpg|jpeg|png|webp|avif))\?v=[0-9.]+',lambda m:m.group(1)+f'?v={V}',text)
              path.write_text(text,encoding='utf-8')
          site=Path('site.js').read_text(encoding='utf-8')
          site=re.sub(r'仙加味網站核心｜整合正式版 v[0-9.]+',f'仙加味網站核心｜整合正式版 v{V}',site)
          site=re.sub(r'data\.json\?v=[0-9.]+',f'data.json?v={V}',site)
          assert 'const detailImage = p.image' in site
          Path('site.js').write_text(site,encoding='utf-8')
          deploy={
            'version':V,'updated':'2026-07-13','status':'production-ready',
            'catalog':'five-types-six-specifications',
            'imagePolicy':{
              'productCards':'verified-original-product-image',
              'quickViewModal':'verified-original-product-image',
              'detailHero':'verified-original-product-image',
              'detailDM':'six-user-approved-final-dm-webp',
              'detailMascot':'approved-page-specific-mascot',
              'dmPage':'six-user-approved-final-dm-webp'},
            'frontend':'single-site-js-and-single-site-css',
            'automation':'main-only-auto-deploy-and-trusted-pr-auto-merge',
            'safety':'approved-dm-source-downloaded-and-ocr-classified'}
          Path('deploy-version.json').write_text(json.dumps(deploy,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f images/dm-final/*-dm.jpg

      - name: Validate final content
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.5"' deploy-version.json
          grep -q '仙加味網站核心｜整合正式版 v408.5' site.js
          grep -q 'const detailImage = p.image' site.js
          test "$(find images/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          for f in images/dm-final/*.webp; do
            test "$(identify -format '%w %h' "$f")" = '1122 1402'
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(d['products'])==6
          for p in d['products']:
              assert p['image'].startswith('images/products-v3/')
              assert p['dmImage'].startswith('images/dm-final/') and p['dmImage'].endswith('.webp?v=408.5')
              assert p['detailImages']==[p['dmImage']]
          h=Path('dm.html').read_text(encoding='utf-8')
          assert h.count('class="dm-image-v2"')==6
          assert h.count('.webp?v=408.5')>=12
          PY

      - name: Clean temporary tooling
        run: |
          rm -rf _upload
          rm -f tools/apply_dm_v4085_final.py
          rm -f .github/workflows/drive-inspect-on-push.yml
          rm -f .github/workflows/test-drive-public-v2.yml
          rm -f .github/workflows/test-drive-download.yml
          rm -f .github/workflows/diagnose-q32-all-commits.yml
          rm -f .github/workflows/report-approved-dm-v4085.yml
          rm -f .github/workflows/apply-approved-dm-binary-v4085.yml
          rm -f .github/workflows/apply-approved-dm-v4085-final.yml
          rm -f .github/workflows/diagnose-q32-all-commits.yml
          rm -f .github/workflows/install-approved-dm-from-drive.yml

      - name: Commit and deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '實際替換六張使用者核准正式DM v408.5'
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 128 --repo "${{ github.repository }}" --body 'V408.5_DM_INSTALL_SUCCESS｜六張1122×1402正式DM已從核准來源下載、OCR辨識對應、實際替換並推送到main；產品卡與快速查看維持真實產品原圖。'
          gh issue close 128 --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 128 --repo "${{ github.repository }}" --body 'V408.5_DM_INSTALL_FAILED｜Drive來源仍無法由GitHub Actions下載或內容驗證未通過，未提交任何錯誤DM。'
