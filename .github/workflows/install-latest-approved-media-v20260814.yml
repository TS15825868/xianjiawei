name: Install latest approved media v20260814
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-latest-approved-media-v20260814.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact user-approved originals
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p images/dm-final images/trial
          curl -L --fail --retry 3 -o images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg 'https://oaisdmntprnorthcentralus.blob.core.windows.net/files/00000000-372c-822f-9be0-9f6536443bb2/raw?se=2026-08-14T01%3A31%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=019ffdc7-b348-7d46-b7f0-70342001598c&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T00%3A29%3A22Z&ske=2026-08-15T00%3A29%3A22Z&sks=b&skv=2026-02-06&sig=TL0LM9kpcj0vMU7P/aeB5EnKZqN%2B1EVLicMy2rXlPkI%3D'
          curl -L --fail --retry 3 -o images/trial/trial-poster-small-boss-official-v20260814.jpg 'https://oaisdmntprindiasocentral.blob.core.windows.net/files/00000000-3174-8211-93c9-4f7a82bd85cb/raw?se=2026-08-14T01%3A32%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=019ffdc7-b348-7d46-b7f0-70342001598c&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T18%3A56%3A33Z&ske=2026-08-14T18%3A56%3A33Z&sks=b&skv=2026-02-06&sig=HlT8VZfYDsYc198DcgZTqIFgXACIQf6COz8ehK5/Rjw%3D'
          echo '07ae80fbf54dbaff663b61f9b591f34c8c0016f797d1a91b15563632071edf35  images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg' | sha256sum -c -
          echo 'f12081e88209917b0319a32f50fba44a65a89ea8a0adbe7022325643e5121442  images/trial/trial-poster-small-boss-official-v20260814.jpg' | sha256sum -c -
          test "$(stat -c%s images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg)" -eq 533277
          test "$(stat -c%s images/trial/trial-poster-small-boss-official-v20260814.jpg)" -eq 710800
      - name: Verify JPEG dimensions
        shell: python
        run: |
          from pathlib import Path
          import struct
          def jpeg_size(path):
              data=Path(path).read_bytes()
              i=2
              while i < len(data)-9:
                  if data[i] != 0xFF:
                      i += 1; continue
                  marker=data[i+1]; i += 2
                  if marker in (0xD8,0xD9): continue
                  if i+2 > len(data): break
                  length=int.from_bytes(data[i:i+2],'big')
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h=int.from_bytes(data[i+3:i+5],'big'); w=int.from_bytes(data[i+5:i+7],'big'); return w,h
                  i += length
              raise RuntimeError(path)
          assert jpeg_size('images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg') == (1122,1402)
          assert jpeg_size('images/trial/trial-poster-small-boss-official-v20260814.jpg') == (1254,1254)
      - name: Promote latest media authority and cache
        shell: python
        run: |
          from pathlib import Path
          import json,re
          V='20260814-product-modal-media-v3'
          DM='images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg'
          TR='images/trial/trial-poster-small-boss-official-v20260814.jpg'
          text_files=[
            Path('dm.html'),Path('trial.html'),Path('site.js'),Path('site-media-modal-final-v20260814.js'),
            Path('site-formal-media-v20260810.js'),Path('site-dm-authority-v20260811.js'),Path('publishing-center-guardian.js')
          ]
          dm_old=[
            'images/dm-final/02_guilu-drink-30cc-dm-v20260814.webp',
            'images/dm-final/02_guilu-drink-30cc-dm.jpg',
            'images/dm-approved-v20260810/guilu-drink-30cc.webp'
          ]
          tr_old=['images/trial/trial-poster-small-boss-v20260814.webp']
          for p in text_files:
              if not p.exists(): continue
              s=p.read_text()
              for old in dm_old:
                  s=s.replace(old,DM).replace('/'+old,'/'+DM)
              for old in tr_old:
                  s=s.replace(old,TR).replace('/'+old,'/'+TR)
              for oldv in ['20260814-product-modal-media-v2','20260814-dm-trial-modal-v1','20260813-dm-trial-display-fix-v1']:
                  s=s.replace(oldv,V)
              if p.name=='site-dm-authority-v20260811.js':
                  s=s.replace("trialMediaOwnedBy:'trial-showcase-v20260813'", "trialMediaOwnedBy:'trial-poster-small-boss-official-v20260814'")
                  s=s.replace("trialMediaOwnedBy:'trial-showcase-v20260813',", "trialMediaOwnedBy:'trial-poster-small-boss-official-v20260814',")
              p.write_text(s)
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              s=re.sub(r'site\.js\?v=[^\"\']+',f'site.js?v={V}',s)
              s=re.sub(r'site-formal-media-v20260810\.js\?v=[^\"\']+',f'site-formal-media-v20260810.js?v={V}',s)
              p.write_text(s)
          manifest=Path('images/formal-display/manifest.json')
          if manifest.exists():
              m=json.loads(manifest.read_text())
              m['runtime']=V; m['approval_batch']=V
              m.setdefault('dm',{})['version']=V
              m['dm']['status']='approved_user_original_high_resolution'
              m['dm'].setdefault('paths',{})['guilu-drink-30']='/'+DM
              m['dm'].setdefault('binary_status',{})['guilu-drink-30']='exact_user_approved_jpeg_1122x1402_533277_bytes'
              m['trial']={
                'render_mode':'poster','status':'approved_user_original','path':'/'+TR,
                'binary_status':'exact_user_approved_jpeg_1254x1254_710800_bytes',
                'role':'separate-trial-poster-not-product-image-or-dm',
                'rules':{'free_samples':3,'shipping_paid_by_customer':True,'seven_eleven':60,'postal':100,'limit':'每位顧客、電話及地址限申請一次','lead_time':'約5～7個工作天','apply_via':'LINE OA'}
              }
              manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          authority=Path('data/formal-media-authority-v20260810.json')
          if authority.exists():
              a=json.loads(authority.read_text())
              a['runtime']=V; a['approval_batch']=V
              for product in a.get('products',[]):
                  if product.get('id')=='guilu-drink-30cc':
                      product['dm']='/'+DM
                      product['dm_status']='exact_user_approved_jpeg_1122x1402'
              a['trial']={
                'title':'龜鹿飲試喝組｜先試喝，再決定','render_mode':'poster','status':'approved_user_original',
                'image':'/'+TR,'do_not_use_as_product_image':True,'do_not_use_as_dm':True,
                'free':'3罐試喝品免費','shipping':['7-11店到店60元','郵局宅配100元'],
                'limit':'每位顧客、電話及地址限申請一次','lead_time':'接單後安排製作，約5～7個工作天出貨',
                'order_channel':'所有試喝申請與正式下單皆在LINE OA完成'
              }
              authority.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
      - name: Validate current public roles
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '30cc／罐（小玻璃罐）' dm.html
          grep -q '02_guilu-drink-30cc-dm-official-v20260814.jpg' dm.html
          grep -q 'trial-poster-small-boss-official-v20260814.jpg' trial.html
          grep -q 'data-product-intro="1"' dm.html
          grep -q 'site-media-modal-final-v20260814.js' site.js
          ! grep -q '02_guilu-drink-30cc-dm-v20260814.webp' dm.html
          ! grep -q 'trial-poster-small-boss-v20260814.webp' trial.html
          node --check site.js
          node --check site-media-modal-final-v20260814.js
      - name: Commit installed media
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg images/trial/trial-poster-small-boss-official-v20260814.jpg dm.html trial.html site.js site-media-modal-final-v20260814.js site-formal-media-v20260810.js site-dm-authority-v20260811.js publishing-center-guardian.js images/formal-display/manifest.json data/formal-media-authority-v20260810.json *.html
          git commit -m 'fix(media): install approved 30cc DM and trial poster'
          git push
