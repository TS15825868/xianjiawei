name: Diagnose 180cc AVIF chunks v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-180-v2-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record chunk and reassembly diagnostics
        shell: bash
        run: |
          set -euo pipefail
          out='_upload/avif-v6-180-v2-diagnostic.txt'
          : > "$out"
          for f in _upload/avif-v6-180-v2/001 _upload/avif-v6-180-v2/002 _upload/avif-v6-180-v2/003 _upload/avif-v6-180-v2/004 _upload/avif-v6-180-v2/005 _upload/avif-v6-180-v2/006; do
            printf '%s bytes=%s sha256=' "$f" "$(wc -c < "$f")" >> "$out"
            sha256sum "$f" | awk '{print $1}' >> "$out"
          done
          cat _upload/avif-v6-180-v2/001 _upload/avif-v6-180-v2/002 _upload/avif-v6-180-v2/003 _upload/avif-v6-180-v2/004 _upload/avif-v6-180-v2/005 _upload/avif-v6-180-v2/006 | base64 -d > /tmp/180.avif
          printf 'reassembled bytes=%s sha256=' "$(wc -c < /tmp/180.avif)" >> "$out"
          sha256sum /tmp/180.avif | awk '{print $1}' >> "$out"
          printf 'ffprobe=' >> "$out"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt -of csv=s=x:p=0 /tmp/180.avif >> "$out" 2>&1 || true
          printf '\nfull_decode=' >> "$out"
          if ffmpeg -v error -i /tmp/180.avif -f null - >/tmp/decode.log 2>&1; then echo 'PASS' >> "$out"; else echo 'FAIL' >> "$out"; cat /tmp/decode.log >> "$out"; fi
          cat "$out"
      - name: Commit diagnostic record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _upload/avif-v6-180-v2-diagnostic.txt
          git commit -m 'chore(images): record 180cc AVIF chunk diagnostics'
          git push origin HEAD:main
