name: Landscape rebuild visual evidence
on:
  push:
    branches: [main, visual-landscape-20261008]
    paths: ['**/*.html', '**/*.css', '**/*.js', '**/*.cjs', 'images/**', '.github/workflows/landscape-visual-verification.yml']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: xianjiawei-landscape-visual-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - run: npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Start preview server
        run: python3 -m http.server 8765 > /tmp/site-server.log 2>&1 &
      - name: Wait for official Pages release
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          expected="$(sha256sum site.css | cut -d ' ' -f 1)"
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 5 --max-time 10 \
              "https://ts15825868.github.io/xianjiawei/site.css?release=${{ github.sha }}" \
              -o /tmp/xjw-live-site.css; then
              actual="$(sha256sum /tmp/xjw-live-site.css | cut -d ' ' -f 1)"
              if [ "$actual" = "$expected" ]; then
                echo "Official Pages CSS matches this checkout."
                exit 0
              fi
            fi
            echo "Waiting for current CSS: attempt $attempt/12"
            sleep 5
          done
          echo "Official Pages CSS differs from current checkout." >&2
          exit 1
      - name: Audit full pages and interactions
        env:
          XJW_BROWSER_ENGINE: ${{ matrix.engine }}
          XJW_AUDIT_BASE: ${{ github.ref == 'refs/heads/main' && 'https://ts15825868.github.io/xianjiawei/' || 'http://127.0.0.1:8765/' }}
        run: node tools/visual-audit.cjs
      - name: Audit rendered text against landscape pixels and interaction states
        env:
          XJW_BROWSER_ENGINE: ${{ matrix.engine }}
          XJW_AUDIT_BASE: ${{ github.ref == 'refs/heads/main' && 'https://ts15825868.github.io/xianjiawei/' || 'http://127.0.0.1:8765/' }}
        run: node tools/audit-text-readability.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-evidence-${{ matrix.engine }}
          path: |
            visual-evidence-${{ matrix.engine }}/
            text-evidence-${{ matrix.engine }}/
          retention-days: 14
