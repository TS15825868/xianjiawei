name: Landscape rebuild visual evidence
on:
  push:
    branches: [main, visual-landscape-20261008]
    paths: ['**/*.html', '**/*.css', '**/*.js', '**/*.cjs', 'images/**', '.github/workflows/landscape-visual-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Start preview server
        run: python3 -m http.server 8765 > /tmp/site-server.log 2>&1 &
      - name: Audit full pages and interactions
        env:
          XJW_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/visual-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-evidence-${{ matrix.engine }}
          path: visual-evidence-${{ matrix.engine }}/
          retention-days: 14
