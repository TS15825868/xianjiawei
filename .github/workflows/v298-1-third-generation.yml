name: v298.1 third generation history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update third-generation history
        shell: python
        run: |
          from pathlib import Path

          path = Path('brand.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
            '<h3>父親｜守住品質，也讓工序持續精進</h3>\n      <p>父親接手後，延續家族對原料與製程的要求，持續調整來源、處理方式、火候與成品穩定度。第三代在市場與環境快速變化的過程中，持續守住家族熟悉的專業、處理細節與成品穩定度。</p>',
            '<h3>父親｜從協助祖父開始，延續第三代的實務經驗</h3>\n      <p>父親於1964年出生，後來也在祖父身邊協助家族事業與代工加工工作，從日常實務中逐步累積對原料、工序與成品的理解。接手後，持續調整來源、處理方式、火候與成品穩定度，延續家族對品質與細節的要求。</p>'
          )

          text = text.replace(
            '<p class="eyebrow">1974年</p>\n      <h3>因家庭安排分家，持續專注代工與加工</h3>\n      <p>分家後，祖父延續熟悉的代工、加工與原料處理工作，逐步建立獨立經營的基礎，也持續累積客戶與同業間的信用。</p>',
            '<p class="eyebrow">1974年</p>\n      <h3>開始獨立經營，持續專注代工與加工</h3>\n      <p>祖父延續熟悉的代工、加工與原料處理工作，逐步建立獨立經營的基礎，也持續累積客戶與同業間的信用。</p>'
          )

          marker = '''    <article class="card reveal">
      <p class="eyebrow">1974年</p>
      <h3>開始獨立經營，持續專注代工與加工</h3>
      <p>祖父延續熟悉的代工、加工與原料處理工作，逐步建立獨立經營的基礎，也持續累積客戶與同業間的信用。</p>
    </article>'''

          third_card = '''    <article class="card reveal">
      <p class="eyebrow">1964年</p>
      <h3>第三代出生，日後加入家族事業協助祖父</h3>
      <p>父親於1964年出生，後來在祖父身邊協助家族事業與代工加工，從實際工作中累積第三代對原料、工序與成品的理解。</p>
    </article>'''

          if third_card not in text:
            text = text.replace(marker, third_card + '\n' + marker)

          text = text.replace('site.css?v=298.0', 'site.css?v=298.1')
          text = text.replace('site.js?v=298.0', 'site.js?v=298.1')
          path.write_text(text, encoding='utf-8')

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/v298-1-third-generation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.1: add father 1964 history and neutralize 1974 wording"
          git push origin main
