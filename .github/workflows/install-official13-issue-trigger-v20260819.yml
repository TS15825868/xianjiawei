          sizes=(49620 53070 47502 50334 48654 46950 52640 50190 49092 49882 50280 57232 27672)
          for n in $(seq 1 13); do
            key=$(printf 'URL%02d' "$n")
            idx=$((n-1))
            out="$tmp/${names[$idx]}"
            curl -LfsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 "${!key}" -o "$out"
            test "$(stat -c%s "$out")" -eq "${sizes[$idx]}"
            echo "${hashes[$idx]}  $out" | sha256sum -c -
          done
          rm -rf "$target"
          mkdir -p "$target"
          cp "$tmp"/*.webp "$target"/
          (cd "$target" && sha256sum *.webp > SHA256SUMS.txt)
          cat > "$target/manifest.json" <<'JSON'
          {"version":"2026-08-19-official13-installed","brand":"仙加味","count":13,"status":"installed","fallback_policy":"forbidden","review":"未發布11篇回待審核；已發布試喝與仙加味從萬華開始維持已發布"}
