name: 官網試喝海報製作天數文字修正 v416

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/fix-trial-poster-lead-time-v416.py"
      - ".github/workflows/fix-trial-poster-lead-time-v416.yml"

permissions:
  contents: write

concurrency:
  group: site-trial-poster-lead-time-v416
  cancel-in-progress: false

jobs:
  repair-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update to latest main
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Repair trial poster wording
        run: python tools/fix-trial-poster-lead-time-v416.py

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          image_path = Path('images/posts/approved-v412/guilu-drink-trial-evergreen.jpg')
          diagnostic_path = Path('diagnostics/trial-poster-v416.json')
          if not image_path.exists() or not diagnostic_path.exists():
              raise SystemExit('missing repaired poster or diagnostic')
          with Image.open(image_path) as image:
              if image.width != image.height or image.width < 1000:
                  raise SystemExit(f'unexpected poster size: {image.size}')
          report = json.loads(diagnostic_path.read_text(encoding='utf-8'))
          if report.get('status') != 'success':
              raise SystemExit('poster diagnostic is not successful')
          if report.get('replacement_text') != '製作加工約需5～7個工作天，完成後出貨':
              raise SystemExit('poster replacement text is incorrect')
          print(report)
          PY
          git diff --check

      - name: Commit corrected poster
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/approved-v412/guilu-drink-trial-evergreen.jpg diagnostics/trial-poster-v416.json
          if git diff --cached --quiet; then
            echo 'Poster is already correct.'
          else
            git commit -m 'fix(site): correct trial poster production lead time v416'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
