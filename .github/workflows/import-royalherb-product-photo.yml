name: 仙加味原廠產品實物照片匯入
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-royalherb-product-photo.yml"
      - "ops/import-royalherb-erzhenbao.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xjw-royalherb-official-original
  cancel-in-progress: false
jobs:
  import-official-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch unchanged manufacturer original (WebP)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          cfg = json.loads(pathlib.Path("ops/import-royalherb-erzhenbao.json").read_text(encoding="utf-8"))
          url = cfg["image"]["url"]
          dest = cfg["image"]["target"]
          prefix = "https://royalherb.com.tw/wp-content/uploads/2026/08/"
          assert url.startswith(prefix) and url.endswith(".webp"), "Official image source required"
          assert dest == "images/partner-products/er-zhen-bao-royalherb-original.webp", "Only approved output path"
          sources = [
            url,
            "https://i0.wp.com/" + url.removeprefix("https://")
          ]
          tmp = pathlib.Path("/tmp/royalherb-erzhenbao-download.webp")
          payload = None
          for candidate in sources:
              try:
                  subprocess.run(["curl","-4","-fLsS","--connect-timeout","8","--max-time","27",
                      "-A","Mozilla/5.0 XianjiaweiProductOriginal/1.0",
                      "--output",str(tmp),candidate],check=True,timeout=33)
                  data = tmp.read_bytes()
                  if len(data) < 8000 or len(data)>9_000_000:
                      raise ValueError("Unexpected original image size")
                  if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                      raise ValueError("Returned content is not the official WebP image")
                  payload = data
                  print("Original image obtained using verified source",candidate.split("/")[2])
                  break
              except Exception as exc:
                  print("Image source unavailable:",candidate.split("/")[2],str(exc)[:220])
          if payload is None:
              raise RuntimeError("Manufacturer photo could not be imported; cannot publish without a valid image")
          output = pathlib.Path(dest)
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_bytes(payload)
          print("Original product photo bytes:",len(payload))
          PY
      - name: Commit authenticated manufacturer original
        shell: bash
        run: |
          git add -- images/partner-products/er-zhen-bao-royalherb-original.webp
          if git diff --cached --quiet; then
            echo "Original unchanged; no duplicate commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(food): import unchanged Royalherb 二珍寶 original product photography"
          git push origin HEAD:main
