name: "仙加味茶包實拍圖片匯入 v8（一次性）"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-tea-real-scenic-v8.yml'
permissions:
  contents: write
jobs:
  import-verified-original-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact verified tea photography with integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, urllib.request
          root=pathlib.Path("images/catalog-real-scenic-v20261016-v8")
          root.mkdir(parents=True,exist_ok=True)
          base="https://d2ol7oe51mr4n9.cloudfront.net/user_3I7cZELbKfOMYPcVd2g8GfqVrb4/"
          items=[
          ("tea-rose-fruit-real-scenic-detail.webp", "da229a5e-f7c6-4833-ab1e-753418a92007", "e478a1f51d2ac56b4fbb870b38aa19e61f43ff15b9875b3b0e824edd28e39e2c"),
          ("tea-leisure-real-scenic-detail.webp", "0c1bb41b-d710-45d4-8324-82c996bfc0c0", "95535164319db15fd01d5bbb763b264cada86e2eb8573bf2584911361543f071"),
          ("tea-wudahan-real-scenic-detail.webp", "c1d35b6d-9887-4478-8a00-de9d2eb0d840", "d0ad2e04f7ec799af57a70f8942deecd3cc6888ea7956e2b4460df79c3d36bc9"),
          ("tea-fiber-real-scenic-detail.webp", "43a21eb5-0e79-4293-8bf1-308f2d4d4eb1", "5d5b4620b84c00595054f7734706321b4c30520302a153215b8170b16b4fd8b2"),
          ("tea-white-real-scenic-detail.webp", "b74b8e27-5ad3-4fd8-8daf-72ae2ccd6e51", "c3b4489d22f91f3c177aadc6b38aa99d4bbd0f73308c3874caaabe8ece27f1dd"),
          ("tea-refresh-real-scenic-detail.webp", "f6eba07e-31f0-4a2a-b390-c0f6500e2582", "276453163ee30a832dc47ad6e462618274a1b6d969fb831230aa20491c74e4d2"),
          ("tea-bag-pouch-real-scenic-detail.webp", "0b812aa8-528b-4d25-b006-15aae9bddb5b", "dd99472deabc5f689e7fd16ed5c31176a88e3f8f539217647487e96278e3fae8"),
          ("tea-bag-with-string-real-scenic-detail.webp", "f10b503d-a8b0-4aef-83e9-90ebfb7f6305", "4457de773aa8110c576d922023a48957b7a674f849e525cd886c87f2e42d8c6f"),
          ]
          for name,photo_id,digest in items:
              url=base+photo_id+".webp"
              req=urllib.request.Request(url,headers={"User-Agent":"Xianjiawei-Media-Import/1.0"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  data=response.read()
              if hashlib.sha256(data).hexdigest()!=digest:
                  raise RuntimeError("Photo SHA-256 differs from verified original: "+name)
              if not (data[:4]==b'RIFF' and data[8:12]==b'WEBP'):
                  raise RuntimeError("Invalid WebP original: "+name)
              (root/name).write_bytes(data)
              print("Verified and stored",name,len(data))
          PY
      - name: Commit only verified original-photograph composites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/catalog-real-scenic-v20261016-v8/
          if ! git diff --cached --quiet; then
            git commit -m "assets: add eight verified original-photo scenic tea gallery images"
            git push origin HEAD:main
          fi
