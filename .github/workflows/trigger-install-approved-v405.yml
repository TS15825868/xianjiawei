name: Trigger approved website deployment

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  trigger:
    if: github.event.issue.title == 'DEPLOY_APPROVED_V405_1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Confirm trigger
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'DEPLOY_V405_1_DISPATCHED'
            });
