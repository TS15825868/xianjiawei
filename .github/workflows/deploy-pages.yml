name: 官網手動正式發布檢查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core-v410.js
          node --check site-product-image-safety.js

      - name: Validate official website release
        run: python3 tools/validate-site-release.py
