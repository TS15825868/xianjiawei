name: Deploy仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site.js
          test -s _site/site-fix-v317.js
          test -s _site/images/hero/home-brand-guilu-series.jpg
          test -s _site/images/brand/website-mascot-home.jpg
          grep -q '402.0' _site/site.js
          grep -q '402.0' _site/site-fix-v317.js
          grep -q '"version": "402.0"' _site/deploy-version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
