name: Deploy仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Automatically install approved 14-image package when needed
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(python3 -c 'import json; print(json.load(open("deploy-version.json", encoding="utf-8")).get("version", ""))')"
          if [ "$CURRENT" != "405.0" ]; then
            python3 -m pip install --quiet gdown pillow
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
            gdown --id 1FtMZhegJS2tkio_4OZgjtPBP9GixGidd -O /tmp/approved-website-mascot.zip
            unzip -t /tmp/approved-website-mascot.zip
            python3 tools/install_approved_mascot_v405.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "完整套用14張核准官網小老闆原圖 v405.0"
            git push origin main
          fi

      - name: Verify website v405.0
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core.js
          node --check approved-mascot-v405.js
          node --check site-fix-v317.js
          grep -q '405.0' site.js
          grep -q 'site.js?v=405.0' index.html
          grep -q 'approved-v405/home-brand.png?v=405.0' index.html
          grep -q '"version": "405.0"' deploy-version.json
          test "$(find images/brand/approved-v405 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 15
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('images/brand/approved-v405').glob('*.png'))
          assert len(files)==15, len(files)
          for f in files:
              with Image.open(f) as im:
                  assert im.size==(1448,1086), (f,im.size)
          PY
          grep -q 'images/products-v3/guilu-gao.jpg' data.json
          grep -q 'images/products-v3/guilu-drink-30.jpg' data.json
          grep -q 'images/products-v3/guilu-drink-180.jpg' data.json
          grep -q 'images/products-v3/guilu-tangkuai.jpg' data.json
          grep -q 'images/products-v3/guilu-jiao.jpg' data.json
          grep -q 'images/products-v3/luerong-fen.jpg' data.json

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site.js
          test -s _site/approved-mascot-v405.js
          test -s _site/images/brand/approved-v405/home-brand.png
          grep -q 'site.js?v=405.0' _site/index.html
          grep -q 'site.js?v=405.0' _site/products.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
