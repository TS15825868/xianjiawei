name: Deploy 仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 驗收正式網站 v408.2
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.2"' deploy-version.json
          grep -q '"status": "production-ready"' deploy-version.json
          grep -q '仙加味網站核心｜整合正式版 v408.2' site.js
          grep -q 'BEGIN CONSOLIDATED FRONTEND' site.css
          test ! -e site-core.js
          test ! -e approved-mascot-v405.js
          test ! -e site-v321.css
          test ! -e site-v405.css
          test ! -e _upload
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path('images/brand/approved-v405-manifest.json').read_text(encoding='utf-8'))
          mascot_files=list(manifest['corePages'].values())+list(manifest['productPages'].values())
          assert len(mascot_files)==15, len(mascot_files)
          assert len(set(mascot_files))==15, mascot_files
          for filename in mascot_files:
              path=Path('images/brand/approved-v405')/filename
              assert path.is_file(), path
              assert path.stat().st_size > 20000, (path,path.stat().st_size)

          product_files=[
              'images/products-v3/guilu-gao.jpg',
              'images/products-v3/guilu-drink-30.jpg',
              'images/products-v3/guilu-drink-180.jpg',
              'images/products-v3/guilu-tangkuai.jpg',
              'images/products-v3/guilu-jiao.jpg',
              'images/products-v3/luerong-fen.jpg',
          ]
          dm_files=[
              'images/dm-final/01_guilu-gao-100g-dm.jpg',
              'images/dm-final/02_guilu-drink-30cc-dm.jpg',
              'images/dm-final/03_guilu-drink-180cc-dm.jpg',
              'images/dm-final/04_luerong-fen-75g-dm.jpg',
              'images/dm-final/05_guilu-tangkuai-75g-dm.jpg',
              'images/dm-final/06_guilu-jiao-600g-dm.jpg',
          ]
          for filename in product_files:
              path=Path(filename)
              assert path.is_file(), path
              assert path.stat().st_size > 10000, (path,path.stat().st_size)
          for filename in dm_files:
              path=Path(filename)
              assert path.is_file(), path
              assert path.stat().st_size > 100000, (path,path.stat().st_size)

          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(data['products'])==6, len(data['products'])
          for product in data['products']:
              assert product['image'].endswith('.jpg?v=408.2'), product['image']
              assert product['dmImage'].endswith('.jpg?v=408.2'), product['dmImage']

          dm=Path('dm.html').read_text(encoding='utf-8')
          assert dm.count('class="dm-image-v2"')==6
          assert '<h1>六項產品 DM</h1>' in dm
          print('正式驗收完成：15張小老闆、6張產品主圖、6張DM、單一JS/CSS')
          PY

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='_upload/' \
            --exclude='tmp-test*.txt' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          python3 - <<'PY'
          from pathlib import Path
          import re

          version='408.2'
          pattern=re.compile(r'(\.(?:css|js|jpg|jpeg|png|webp|avif))\?v=[^"\']+')
          for page in Path('_site').glob('*.html'):
              text=page.read_text(encoding='utf-8')
              text=pattern.sub(lambda m:m.group(1)+f'?v={version}',text)
              page.write_text(text,encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/choose.html
          test -s _site/dm.html
          test -s _site/site.js
          test -s _site/site.css
          grep -q 'site.js?v=408.2' _site/index.html
          grep -q 'site.css?v=408.2' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
