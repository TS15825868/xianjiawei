name: Deploy仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify website v404.3
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core.js
          node --check mascot-v404.js
          node --check site-fix-v317.js
          grep -q '404.3' site.js
          grep -q 'site.js?v=404.3' index.html
          grep -q 'images/brand/mascot-v404/home.jpg?v=404.3' index.html
          grep -q '"version": "404.3"' deploy-version.json
          for page in home products choose combo guide recipes brand faq contact; do
            test -s "images/brand/mascot-v404/${page}.jpg"
          done
          grep -q 'images/products-v3/guilu-gao.jpg' data.json
          grep -q 'images/products-v3/guilu-drink-30.jpg' data.json
          grep -q 'images/products-v3/guilu-drink-180.jpg' data.json
          grep -q 'images/products-v3/guilu-tangkuai.jpg' data.json
          grep -q 'images/products-v3/guilu-jiao.jpg' data.json
          grep -q 'images/products-v3/luerong-fen.jpg' data.json

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site.js
          test -s _site/mascot-v404.js
          test -s _site/images/brand/mascot-v404/home.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
