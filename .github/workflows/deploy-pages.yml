name: Deploy仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify website v406.0
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core.js
          node --check approved-mascot-v405.js
          node --check site-fix-v317.js
          grep -q '406.0' site.js
          grep -q '"version": "406.0"' deploy-version.json
          expected=(
            home-brand.webp products-all.webp choose.webp combo.webp guide-how-to-use.webp recipes.webp
            brand-story.webp faq.webp contact-line.webp product-guilu-gao-100g.webp
            product-guilu-drink-30cc.webp product-guilu-drink-180cc.webp
            product-guilu-tangkuai-75g.webp product-guilu-jiao-600g.webp product-luerong-fen-75g.webp
          )
          test "$(find images/brand/approved-v405 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 15
          for image in "${expected[@]}"; do
            test -s "images/brand/approved-v405/$image"
          done
          test ! -e assets/approved-v405-assets.zip
          test ! -e images/brand/mascot-v404
          test ! -e mascot-v404.js
          test ! -e site-v404.css
          grep -q 'product-guilu-drink-180cc.html' choose.html

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site.js
          test -s _site/approved-mascot-v405.js
          test -s _site/site-v405.css
          grep -q 'site.js?v=406.0' _site/index.html
          grep -q 'site.js?v=406.0' _site/products.html
          grep -q 'approved-v405/home-brand.webp?v=406.0' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
