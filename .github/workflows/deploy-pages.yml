name: Deploy 仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 驗收正式網站 v408.6
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.6"' deploy-version.json
          grep -q '仙加味網站核心｜整合正式版 v408.6' site.js
          grep -q 'site.css?v=408.6' index.html
          grep -q 'site.js?v=408.6' index.html
          test "$(grep -o 'class="dm-image-v2"' dm.html | wc -l)" -eq 6
          grep -q '01_guilu-gao-100g-dm.jpg?v=408.6' dm.html
          grep -q '02_guilu-drink-30cc-dm.jpg?v=408.6' dm.html
          grep -q '03_guilu-drink-180cc-dm.jpg?v=408.6' dm.html
          grep -q '04_luerong-fen-75g-dm.jpg?v=408.6' dm.html
          grep -q '05_guilu-tangkuai-75g-dm.jpg?v=408.6' dm.html
          grep -q '06_guilu-jiao-600g-dm.jpg?v=408.6' dm.html
          echo 'ab92c43f68c2d11f33b036e99e9bc31dde3c199c187ead2032fd72bccfdac58b  images/dm-final/01_guilu-gao-100g-dm.jpg' | sha256sum -c -
          echo 'e46b71ca2265adf544087ba3badbf430821896961c0deb4d1dbde13478d39f49  images/dm-final/02_guilu-drink-30cc-dm.jpg' | sha256sum -c -
          echo '81f10bb54c66bb273ddbb040f3e634db3239ac4a85931916ce234f099228e5f1  images/dm-final/03_guilu-drink-180cc-dm.jpg' | sha256sum -c -
          echo 'cdac8d1a3484e941224d3c7725b0d55b073b94286e6f4a000a7ae80e18def121  images/dm-final/04_luerong-fen-75g-dm.jpg' | sha256sum -c -
          echo 'e5d2d0ce9413f21a0507fcee8e90a1990d408c26b39667008d68046043448d99  images/dm-final/05_guilu-tangkuai-75g-dm.jpg' | sha256sum -c -
          echo 'f3e6a24fc83f385feb5dda38a24a310de13c46150929d6ea45cb5050caa562a9  images/dm-final/06_guilu-jiao-600g-dm.jpg' | sha256sum -c -

      - name: Prepare static website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='_upload/' \
            --exclude='_trigger/' \
            --exclude='tmp-test*.txt' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/dm.html
          test -s _site/site.js
          test -s _site/site.css
          grep -q 'site.js?v=408.6' _site/index.html
          grep -q 'site.css?v=408.6' _site/index.html
          grep -q '01_guilu-gao-100g-dm.jpg?v=408.6' _site/dm.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
