name: Deploy仙加味網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify website and shared catalog
        run: |
          python3 tools/site_maintenance.py
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js
          python3 -m json.tool data.json >/dev/null
          test -s images/brand/xianjiawei-web-scenes-v324.webp
          grep -q 'guilu-drink-30' data.json
          grep -q 'guilu-drink-180' data.json

      - name: Prepare public website
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='node_modules/' \
            --exclude='.website-*' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.b64' \
            --exclude='*.md' \
            --exclude='APPLY_*' \
            --exclude='RUN_*' \
            --exclude='INSTALL_*' \
            --exclude='FIX_*'
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '324.0'
          root = Path('_site')
          pages = list(root.glob('*.html'))
          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'site\.css\?v=[^"\']+', f'site.css?v={version}', text)
              text = re.sub(r'site\.js\?v=[^"\']+', f'site.js?v={version}', text)
              text = re.sub(
                  r'資料更新：\d{4}-\d{2}-\d{2}｜內容版本 v[\d.]+',
                  f'資料更新：2026-07-11｜內容版本 v{version}',
                  text,
              )
              if 'site-v321.css' not in text:
                  text = text.replace(
                      '</head>',
                      f'<link rel="stylesheet" href="site-v321.css?v={version}"/>\n</head>',
                  )
              else:
                  text = re.sub(r'site-v321\.css\?v=[^"\']+', f'site-v321.css?v={version}', text)
              page.write_text(text, encoding='utf-8')

          required = {
              'index.html','products.html','choose.html','combo.html','guide.html',
              'recipes.html','video.html','knowledge.html','hanfang-baike.html',
              'sources.html','dm.html','brand.html','faq.html','contact.html',
              'product-guilu-gao.html','product-guilu-drink-30cc.html',
              'product-guilu-drink-180cc.html','product-guilu-tangkuai.html',
              'product-guilu-jiao.html','product-luerong-fen.html',
          }
          missing = sorted(required - {page.name for page in pages})
          if missing:
              raise SystemExit('缺少網站頁面：' + ', '.join(missing))

          for required_file in (
              'site.js','site-core.js','site-fix-v317.js','site.css','site-v321.css',
              'data.json','catalog-public.json',
              'images/brand/xianjiawei-web-scenes-v324.webp',
          ):
              target = root / required_file
              if not target.exists() or target.stat().st_size == 0:
                  raise SystemExit('缺少發布檔案：' + required_file)

          print(f'準備完成：{len(pages)} 個頁面，v{version} 八種小老闆情境與龜鹿飲雙規格。')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
