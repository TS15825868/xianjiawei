name: Manual release check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate website release
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json

          version = json.loads(Path('deploy-version.json').read_text(encoding='utf-8'))['version']
          assert version, 'deploy-version.json 缺少 version'

          required = [
              'index.html', 'products.html', 'choose.html', 'dm.html', 'guide.html',
              'brand.html', 'faq.html', 'contact.html', 'site.css', 'site.js',
              'data.json', 'catalog-public.json', 'sitemap.xml', 'robots.txt'
          ]
          missing = [name for name in required if not Path(name).is_file()]
          assert not missing, f'缺少必要檔案: {missing}'

          data = json.loads(Path('data.json').read_text(encoding='utf-8'))
          products = data.get('products', [])
          required_product_ids = {
              'guilu-gao', 'guilu-drink-30', 'guilu-drink-180',
              'guilu-tangkuai', 'guilu-jiao', 'luerong-fen'
          }
          active_ids = {item.get('id') for item in products if isinstance(item, dict)}
          missing_product_ids = sorted(required_product_ids - active_ids)
          assert not missing_product_ids, f'缺少正式產品規格: {missing_product_ids}'
          assert '2008年' in Path('brand.html').read_text(encoding='utf-8'), '品牌頁缺少 2008 年品牌註冊節點'
          print(f'release validation passed: v{version}; official products present: {len(required_product_ids)}; catalog rows: {len(products)}')
          PY

      - name: Build static preview
        run: python3 tools/build_static_v4087.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-static-preview
          path: _site
          if-no-files-found: error
          retention-days: 7
