name: 六項正式產品驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/official-products.json'
      - 'config/official-products.json'
      - 'data.json'
      - 'catalog-public.json'
      - 'geo-data.json'
      - 'index.html'
      - 'products.html'
      - 'dm.html'
      - 'product-guilu-*.html'
      - 'tools/apply-official-product-specs.mjs'
      - 'tools/validate-official-products.mjs'
      - '.github/workflows/official-products.yml'

permissions:
  contents: write

concurrency:
  group: official-products-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 統一六項正式產品文字
        run: node tools/apply-official-product-specs.mjs
      - name: 驗證六項正式產品
        run: node tools/validate-official-products.mjs
      - name: 寫回安全正規化結果
        run: |
          if git diff --quiet; then
            echo 'No normalization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json catalog-public.json geo-data.json index.html products.html dm.html brand-facts.html llms.txt llms-full.txt product-guilu-drink-30cc.html product-guilu-drink-180cc.html product-guilu-tangkuai.html product-guilu-jiao.html
          git commit -m 'fix(site): normalize official product specifications [skip ci]'
          git push
