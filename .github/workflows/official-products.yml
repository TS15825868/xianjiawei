name: 六項正式產品驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/official-products.json'
      - 'config/official-products.json'
      - 'data.json'
      - 'catalog-public.json'
      - 'geo-data.json'
      - 'index.html'
      - 'products.html'
      - 'dm.html'
      - 'product-guilu-*.html'
      - 'images/products-v3/guilu-drink-30-clean.svg'
      - 'site.js'
      - 'site-core-v410.js'
      - 'site-product-image-safety.js'
      - 'site-ux-v409.js'
      - 'tools/apply_v4091_official_packaging_v2.py'
      - 'tools/apply-official-product-specs.mjs'
      - 'tools/validate-official-products.mjs'
      - '.github/workflows/official-products.yml'

permissions:
  contents: write

concurrency:
  group: official-products-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 檢查網站核心與圖片守門語法
        run: |
          node --check site.js
          node --check site-core-v410.js
          node --check site-product-image-safety.js
          node --check site-ux-v409.js
          python -m py_compile tools/apply_v4091_official_packaging_v2.py
      - name: 統一六項正式產品文字與30cc圖片
        run: node tools/apply-official-product-specs.mjs
      - name: 驗證六項正式產品
        run: node tools/validate-official-products.mjs
      - name: 驗證30cc正確圖片存在
        run: |
          test -s images/products-v3/guilu-drink-30-clean.svg
          grep -q '龜鹿飲30cc小玻璃罐' images/products-v3/guilu-drink-30-clean.svg
          ! grep -R -E '龜鹿飲30cc玻璃瓶|30cc／瓶（小玻璃瓶）' data.json catalog-public.json geo-data.json index.html products.html dm.html product-guilu-drink-30cc.html
      - name: 寫回安全正規化結果
        run: |
          if git diff --quiet; then
            echo 'No normalization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json catalog-public.json geo-data.json index.html products.html dm.html brand-facts.html llms.txt llms-full.txt product-guilu-drink-30cc.html product-guilu-drink-180cc.html product-guilu-tangkuai.html product-guilu-jiao.html
          git commit -m 'fix(site): normalize official product specifications and artwork [skip ci]'
          git push
