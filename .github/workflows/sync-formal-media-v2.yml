name: 仙加味正式DM與試喝素材同步 v2

# MAINTENANCE MODE: manual only until full-system update is reviewed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-formal-media-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maintenance mode notice
        run: echo "PAUSED automatic formal-media sync; this run is manual maintenance verification only."
      - name: Sync current approved customer media
        run: python tools/sync-formal-media.py
      - name: Validate current formal customer display
        shell: bash
        run: |
          test -f images/formal-display/manifest.json
          test -f site-formal-media-v20260810.js
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/formal-media-authority-v20260810.json','utf8'));
          const m=JSON.parse(fs.readFileSync('images/formal-display/manifest.json','utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(String(a.approval_batch||'').length>0,'正式權威缺少目前核准批次');
          must(m.approval_batch===a.approval_batch,'顧客顯示層沒有跟目前核准批次同步');
          must(Object.keys(m.products||{}).length===6,'顧客顯示層必須維持六項產品');
          for(const spec of ['100g／罐','30cc／罐（小玻璃罐）','180cc／包（鋁袋）','75g／盒｜8塊裝','600g／盒｜32塊裝','75g／罐']) must(JSON.stringify(m).includes(spec),`顯示層缺少正式規格：${spec}`);
          must(m.rules?.no_ai_product_redraw===true&&m.rules?.no_crop===true&&m.rules?.no_stretch===true,'顯示層不得放寬產品圖硬規則');
          must(m.rules?.zip_first_for_lifestyle===true&&m.rules?.regenerate_only_if_no_match===true&&Number(m.rules?.review_after_media_change)===16,'顯示層必須維持ZIP優先／真缺圖才生成／16項重審');
          for(const p of Object.values(m.products||{})) must(['jpeg','png','webp'].includes(String(p.format||'')),`正式顯示媒體格式未辨識：${p.path}`);
          must(['jpeg','png','webp'].includes(String(m.trial?.format||'')),'試喝顯示媒體格式未辨識');
          console.log('PASS: current approval batch, raster media and formal display capabilities are synchronized.');
          NODE
          ! grep -R -F '30cc／瓶' --include='*.html' .
          ! grep -R -F '五種產品使用方式' --include='*.html' .
      - name: Commit synchronized output
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Formal media already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/formal-display/manifest.json site-formal-media-v20260810.js index.html dm.html products.html trial.html guide.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit after safe staging.'
            exit 0
          fi
          git commit -m 'deploy: sync current approved formal display media'
          git push origin HEAD:main
