name: Apply website LINE intents v300.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.head_ref, 'website-line-intents-final')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical LINE intents
        run: node tools/apply_line_intent_integration_v300_1.js
      - name: Verify
        run: |
          node --check site.js
          node tools/check_line_intents.js
          python3 tools/site_maintenance.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js tools/check_line_intents.js
          git commit -m "v300.1: align website LINE buttons with bot intents"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
