name: 套用仙加味全站 v410.1
# 2026-07-28：正式觸發全站版面、圖片比例與年份時間軸套用。

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v4101_full_site.py'
      - '.github/workflows/apply-v4101-full-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-full-site-v4101
  cancel-in-progress: true

jobs:
  apply-audit-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 套用全站版面、品牌時間軸與正式規格
        run: python3 tools/apply_v4101_full_site.py

      - name: 安裝稽核套件
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: 執行全站稽核
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          python3 tools/audit_site_v4101.py

      - name: 提交並自動上傳 main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '全站已是 v410.1 正式狀態。'
          else
            git commit -m 'feat: 完成全站文案圖片比例與年份時間軸 v410.1 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
