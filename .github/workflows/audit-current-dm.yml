name: Audit current product DM

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == 'AUDIT_CURRENT_DM_20260713'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra imagemagick

      - name: Audit six DM files
        id: audit
        continue-on-error: true
        run: |
          set +e
          exec > >(tee /tmp/dm-audit.log) 2>&1
          files=(
            images/dm-final/01_guilu-gao-100g-dm.jpg
            images/dm-final/02_guilu-drink-30cc-dm.jpg
            images/dm-final/03_guilu-drink-180cc-dm.jpg
            images/dm-final/04_luerong-fen-75g-dm.jpg
            images/dm-final/05_guilu-tangkuai-75g-dm.jpg
            images/dm-final/06_guilu-jiao-600g-dm.jpg
          )
          echo '=== DM PAGE REFERENCES ==='
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if grep -q "$name" dm.html; then echo "DM_PAGE YES $name"; else echo "DM_PAGE NO  $name"; fi
          done
          echo
          echo '=== FILE METADATA AND OCR ==='
          for f in "${files[@]}"; do
            echo "----- $f -----"
            if [ ! -s "$f" ]; then
              echo 'MISSING'
              continue
            fi
            identify -format 'DIMENSIONS %wx%h\n' "$f"
            stat -c 'BYTES %s' "$f"
            sha256sum "$f" | awk '{print "SHA256 "$1}'
            git log -1 --format='LAST_COMMIT %H%nLAST_DATE %cI%nLAST_MESSAGE %s' -- "$f"
            echo 'OCR_BEGIN'
            tesseract "$f" stdout -l chi_tra+eng --psm 6 2>/dev/null | sed -n '1,80p'
            echo 'OCR_END'
          done

      - name: Report audit
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/dm-audit.log') ? fs.readFileSync('/tmp/dm-audit.log','utf8') : 'No log';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `DM_AUDIT_${process.env.OUTCOME.toUpperCase()}\n\n\`\`\`\n${log.slice(-60000)}\n\`\`\``
            });
