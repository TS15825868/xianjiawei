name: 安裝用料原則正式貼文圖 v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-ingredient-principle-post-image-v2.yml"
      - "artifacts/uploads/post-ingredient-principle.safe.part-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-ingredient-principle-post-image-v2
  cancel-in-progress: false

jobs:
  decode-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得最新 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 從安全傳輸檔還原並驗證正式 WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/posts/generated
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          output = Path('images/posts/generated/post-ingredient-principle.webp')
          expected_size = 100932
          expected_sha = '03d268a22a121c4695045cd0919fb7e3d03ee3430b1723586772f7560a59d7f8'

          def valid_webp(data: bytes) -> bool:
              return (
                  len(data) == expected_size
                  and hashlib.sha256(data).hexdigest() == expected_sha
                  and data.startswith(b'RIFF')
                  and data[8:12] == b'WEBP'
              )

          if output.exists() and valid_webp(output.read_bytes()):
              print(f'PASS 已存在正式圖片：{output}')
              raise SystemExit(0)

          def part_number(path: Path) -> int:
              match = re.search(r'part-(\d+)$', path.name)
              if not match:
                  raise SystemExit(f'傳輸檔名稱不正確：{path}')
              return int(match.group(1))

          parts = sorted(
              Path('artifacts/uploads').glob('post-ingredient-principle.safe.part-*'),
              key=part_number,
          )
          if not parts:
              raise SystemExit('找不到用料原則圖片安全傳輸檔，且正式圖片尚未存在')

          numbers = [part_number(part) for part in parts]
          expected_numbers = list(range(len(numbers)))
          if numbers != expected_numbers:
              raise SystemExit(f'傳輸分片不完整，應為 {expected_numbers}，目前為 {numbers}')

          encoded = ''.join(part.read_text(encoding='utf-8') for part in parts)
          encoded = ''.join(encoded.split())
          if len(encoded) % 4:
              raise SystemExit(f'Base64 長度不完整：{len(encoded)}')

          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 解碼失敗：{exc}') from exc

          if not valid_webp(data):
              raise SystemExit(
                  f'圖片驗證失敗：size={len(data)} sha256={hashlib.sha256(data).hexdigest()}'
              )

          output.write_bytes(data)
          print(f'PASS {output}：{len(data)} bytes，SHA-256 {expected_sha}')
          PY

      - name: 清除一次性傳輸檔與安裝工作流程
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/uploads/post-ingredient-principle.safe.part-* \
                artifacts/uploads/post-ingredient-principle.webp.b64.part-* \
                artifacts/uploads/post-ingredient-principle.complete \
                artifacts/uploads/post-ingredient-principle-diagnostic.txt \
                artifacts/uploads/post-ingredient-principle-decode-error.txt \
                artifacts/uploads/chunk-size-test-4000.txt \
                .github/workflows/install-ingredient-principle-post-image.yml \
                .github/workflows/install-ingredient-principle-post-image-v2.yml

      - name: 提交正式圖片到 main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo '沒有需要提交的變更'; exit 0; }
          git commit -m 'assets(site): install verified ingredient principle post image'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "PASS 已提交正式圖片（第 ${attempt} 次）"
              exit 0
            fi
            echo "遠端 main 已更新，重新套用本次提交後重試（第 ${attempt} 次）"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done

          echo '無法在三次重試內提交正式圖片' >&2
          exit 1
