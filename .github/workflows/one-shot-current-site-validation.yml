name: 仙加味官網目前正式版一次性驗收

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-site-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate current site release authority
        run: python tools/validate-site-release.py
      - name: Validate public customer pages
        run: python tools/validate-public-customer-pages-v20260809.py
      - name: Validate visual cohesion
        run: python tools/validate-visual-cohesion-v20260809.py
      - name: Validate AIO SEO and GEO
        run: python tools/validate_public_aio_seo.py
      - name: Validate public boundary
        run: python tools/validate-public-boundary-v20260808.py
      - name: Validate publishing content and image match
        run: python tools/validate-publishing-content-match-v20260809.py
      - name: Validate active JavaScript syntax
        run: |
          for file in site.js site-core-v410.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-public-content-cleanup-v20260809.js site-public-image-retirement-v20260812.js site-mascot-placement-v20260812.js site-stability-v20260814.js publishing-center-guardian.js; do
            node --check "$file"
          done
      - name: Confirm validation only
        run: |
          git diff --exit-code
          echo 'PASS: repository validation only; no media install, no publication, no external write.'
