name: Install user-approved mascot scenes v404.0

on:
  push:
    branches: [main]
    paths:
      - "RUN_MASCOT_V404_APPROVED.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-user-approved-mascot-v404
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved package
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown pillow
          gdown --id 1AY7qDfDIHavVVTs7xHFvr2PWy8lRHzPb -O /tmp/xianjiawei-mascot-v404.zip
          echo "cdb2258350c7c689705c717574dfed564f067a59a35e249b23c7b2b9853dce88  /tmp/xianjiawei-mascot-v404.zip" | sha256sum -c -
          unzip -t /tmp/xianjiawei-mascot-v404.zip

      - name: Install exact user-approved images
        run: |
          set -euo pipefail
          rm -rf images/brand/website-mascot-v404
          unzip -o /tmp/xianjiawei-mascot-v404.zip -d . >/dev/null
          python3 install_v404.py

      - name: Verify website
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js
          python3 tools/site_maintenance.py
          test "$(find images/brand/website-mascot-v404 -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" -eq 14
          grep -q 'site.js?v=404.0' index.html
          grep -q '"version": "404.0"' deploy-version.json
          ! grep -R "images/brand/scene-" --include='*.html' --include='*.js' .
          ! grep -R "website-mascot-.*\.jpg" --include='*.html' --include='*.js' .

      - name: Commit directly to main and clean temporary files
        run: |
          set -euo pipefail
          rm -f RUN_MASCOT_V404_APPROVED.txt
          rm -f install_v404.py
          rm -f .github/workflows/install-mascot-v404.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網核准小老闆原圖與正確產品完整上線 v404.0"
          git push origin main
