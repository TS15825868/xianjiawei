name: Consolidate mascot pages v403.1

on:
  push:
    branches: [main]
    paths:
      - "RUN_CONSOLIDATE_MASCOT_403_1.txt"

permissions:
  contents: write

concurrency:
  group: consolidate-mascot-pages-v403-1
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate page mapping and cache versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '403.1'
          core = Path('site-core.js')
          text = core.read_text(encoding='utf-8')

          mascot_block = '''const MASCOT_IMAGES = {
            products: 'images/brand/scene-products-all.svg?v=403.1',
            guide: 'images/brand/scene-choose-forms.svg?v=403.1',
            combo: 'images/brand/scene-guilu-gao-100g.svg?v=403.1',
            usage: 'images/brand/scene-guilu-drink-180cc.svg?v=403.1',
            recipes: 'images/brand/scene-guilu-tangkuai-75g.svg?v=403.1',
            faq: 'images/brand/scene-luerong-fen-75g.svg?v=403.1',
            service: 'images/brand/scene-guilu-drink-30cc.svg?v=403.1',
            brand: 'images/brand/scene-guilu-jiao-600g.svg?v=403.1'
          };'''

          text, count = re.subn(
              r'const MASCOT_IMAGES = \{.*?\n\};',
              mascot_block,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('找不到 MASCOT_IMAGES 區塊')

          text, count = re.subn(
              r'\n\s*home:\s*\{.*?\n\s*\},\n\s*products:',
              '\n    products:',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('找不到首頁重複小老闆設定')

          text = text.replace('?v=403.0', '?v=403.1')
          core.write_text(text, encoding='utf-8')

          for page in Path('.').glob('*.html'):
              html = page.read_text(encoding='utf-8')
              html = re.sub(r'site\.css\?v=[^"\']+', f'site.css?v={version}', html)
              html = re.sub(r'site-v321\.css\?v=[^"\']+', f'site-v321.css?v={version}', html)
              html = re.sub(r'site\.js\?v=[^"\']+', f'site.js?v={version}', html)
              if page.name == 'index.html':
                  html = re.sub(
                      r'images/(?:hero/home-brand-guilu-series\.jpg|brand/scene-brand-all\.svg)(?:\?v=[^"\']+)?',
                      f'images/brand/scene-brand-all.svg?v={version}',
                      html,
                  )
              page.write_text(html, encoding='utf-8')
          PY

      - name: Remove obsolete duplicate mascot JPG assets
        run: |
          set -euo pipefail
          if grep -R "website-mascot-" --include='*.js' --include='*.html' --exclude='website-mascot-manifest.json' .; then
            echo "仍有舊小老闆圖參照，停止刪除"
            exit 1
          fi
          rm -f images/brand/website-mascot-*.jpg

      - name: Verify final unique mapping
        run: |
          set -euo pipefail
          node --check site-core.js
          node --check site-fix-v317.js
          grep -q "scene-products-all.svg?v=403.1" site-core.js
          grep -q "scene-guilu-jiao-600g.svg?v=403.1" site-core.js
          ! grep -q "welcome: 'images/brand/website-mascot-home.jpg" site-core.js
          grep -q 'site.js?v=403.1' index.html
          grep -q 'scene-brand-all.svg?v=403.1' index.html
          test "$(find images/brand -maxdepth 1 -name 'scene-*.svg' | wc -l | tr -d ' ')" -eq 9

      - name: Commit directly to main and remove temporary files
        run: |
          set -euo pipefail
          rm -f RUN_CONSOLIDATE_MASCOT_403_1.txt
          rm -f .github/workflows/consolidate-mascot-pages-v403-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網小老闆與圖片去重整合完成 v403.1"
          git push origin main
