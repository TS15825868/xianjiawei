name: Verify public website v405.1

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: github.event.issue.title == 'VERIFY_PUBLIC_APPROVED_V405_1'
    runs-on: ubuntu-latest
    steps:
      - name: Verify actual public pages and all 15 images
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -u
          base='https://ts15825868.github.io/xianjiawei'
          verify="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          files=(
            home-brand.png products-all.png choose.jpg combo.png guide-how-to-use.png recipes.png
            brand-story.png faq.png contact-line.png product-guilu-gao-100g.png
            product-guilu-drink-30cc.png product-guilu-drink-180cc.png
            product-guilu-tangkuai-75g.png product-guilu-jiao-600g.png product-luerong-fen-75g.png
          )
          success=0
          detail=''
          for attempt in $(seq 1 30); do
            rm -f /tmp/index.html /tmp/choose.html /tmp/mascot.js
            index_code="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${base}/index.html?verify=${verify}-${attempt}" || true)"
            choose_code="$(curl -L -sS -o /tmp/choose.html -w '%{http_code}' "${base}/choose.html?verify=${verify}-${attempt}" || true)"
            js_code="$(curl -L -sS -o /tmp/mascot.js -w '%{http_code}' "${base}/approved-mascot-v405.js?verify=${verify}-${attempt}" || true)"
            if [ "$index_code" = 200 ] && [ "$choose_code" = 200 ] && [ "$js_code" = 200 ] \
              && grep -q '四代龜鹿工序，整理成今天容易使用的日常食補' /tmp/index.html \
              && grep -q 'approved-v405/home-brand.png?v=405.1' /tmp/index.html \
              && grep -q 'site.js?v=405.1' /tmp/index.html \
              && grep -q '龜鹿食補怎麼選？先看你想怎麼使用' /tmp/choose.html \
              && grep -q 'product-guilu-drink-180cc.html' /tmp/choose.html \
              && grep -q 'site.js?v=405.1' /tmp/choose.html \
              && grep -q 'const VERSION = "405.1"' /tmp/mascot.js; then
              images_ok=1
              checked=0
              for file in "${files[@]}"; do
                path="/tmp/v405-${checked}"
                code="$(curl -L -sS -o "$path" -w '%{http_code}' "${base}/images/brand/approved-v405/${file}?verify=${verify}-${attempt}" || true)"
                size="$(wc -c < "$path" 2>/dev/null || echo 0)"
                if [ "$code" != 200 ] || [ "$size" -le 20000 ]; then
                  images_ok=0
                  detail="image failure: ${file}, http=${code}, bytes=${size}"
                  break
                fi
                checked=$((checked+1))
              done
              if [ "$images_ok" = 1 ] && [ "$checked" -eq 15 ]; then
                success=1
                detail="public pages and 15 images verified on attempt ${attempt}"
                break
              fi
            else
              detail="attempt ${attempt}: index=${index_code}, choose=${choose_code}, js=${js_code}, expected v405.1 text not all present"
            fi
            sleep 10
          done

          if [ "$success" = 1 ]; then
            body="PUBLIC_V405_1_SUCCESS\n${detail}\nindex: ${base}/index.html\nchoose: ${base}/choose.html\nimages: 15/15"
          else
            body="PUBLIC_V405_1_FAILURE\n${detail}"
          fi
          BODY="$body" python3 - <<'PY'
          import json,os,urllib.request
          data=json.dumps({'body':f"```\n{os.environ['BODY']}\n```"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",data=data,method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          urllib.request.urlopen(req).read()
          PY
          test "$success" = 1
