name: 官網全站按鈕檢查與修正

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-site-button-audit-fix.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: full-site-button-audit-fix
  cancel-in-progress: false

jobs:
  audit-fix-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install audit support
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Audit and fix all website buttons
        run: |
          cat > /tmp/audit_buttons.py <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json, re

          ROOT = Path('.')
          VERSION = '407.0'
          report = {
              'version': VERSION,
              'scope': 'all root HTML pages plus dynamically generated buttons in site-core.js',
              'htmlPages': 0,
              'clickableElements': 0,
              'lineButtons': 0,
              'internalLinks': 0,
              'externalLinks': 0,
              'buttons': 0,
              'fixes': [],
              'warnings': [],
              'brokenInternalLinks': []
          }

          site_core = ROOT / 'site-core.js'
          text = site_core.read_text(encoding='utf-8')

          old_labels = re.search(r"const labels = \{.*?\n\s*\};", text, flags=re.S)
          if not old_labels:
              raise SystemExit('Cannot find lineIntentButtonLabel labels block')
          new_labels = """const labels = {
              '看產品': 'LINE 詢問產品',
              '直接下單': 'LINE 下單',
              '幫我推薦': 'LINE 幫我推薦',
              '搭配組合': 'LINE 詢問搭配',
              '怎麼使用': 'LINE 詢問用法',
              '價格方案': 'LINE 詢問價格',
              '品牌故事': 'LINE 詢問品牌',
              '人工客服': 'LINE 聯絡客服',
              '料理搭配': 'LINE 詢問搭配'
            };"""
          text = text[:old_labels.start()] + new_labels + text[old_labels.end():]

          replacements = {
              "if (action === '產品詳情') return `看${productName}`;": "if (action === '產品詳情') return `LINE 詢問${productName}`;",
              "if (action === '使用方式') return `${productName}使用方式`;": "if (action === '使用方式') return `LINE 詢問${productName}用法`;",
              "if (action === '選擇數量') return '選擇數量';": "if (action === '選擇數量') return 'LINE 選擇數量';",
              "if (action === '加入購物車') return '加入購物車';": "if (action === '加入購物車') return 'LINE 加入購物車';",
              "if (action === '搭配方案') return '搭配組合';": "if (action === '搭配方案') return 'LINE 詢問搭配';",
              "if (action === '搭配組數') return '選擇組數';": "if (action === '搭配組數') return 'LINE 選擇組數';",
              "if (action === '加入組合') return '加入購物車';": "if (action === '加入組合') return 'LINE 加入組合';",
              "return cleaned || '看產品';": "return cleaned ? (cleaned.startsWith('LINE') ? cleaned : `LINE ${cleaned}`) : 'LINE 詢問產品';"
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  report['fixes'].append(f'site-core.js: {old} → {new}')

          old_float = "link.innerHTML = `<span class=\"floating-line-cta__dot\" aria-hidden=\"true\">LINE</span><span>${visibleLabel}</span>`;"
          new_float = "link.innerHTML = `<span class=\"floating-line-cta__dot\" aria-hidden=\"true\">LINE</span><span>${visibleLabel.replace(/^LINE\\s*/, '')}</span>`;"
          if old_float in text:
              text = text.replace(old_float, new_float)
              report['fixes'].append('site-core.js: 浮動按鈕避免重複顯示 LINE LINE')

          site_core.write_text(text, encoding='utf-8')

          line_hosts = ('line.me', 'lin.ee')
          html_files = sorted(ROOT.glob('*.html'))
          existing = {p.name for p in html_files}

          def clear_line_label(existing_text, message, page_name, body_page):
              source = f'{existing_text} {message}'.lower()
              if '價格' in source or '價錢' in source or '多少錢' in source:
                  return 'LINE 詢問價格'
              if '下單' in source or '購買' in source or '選擇數量' in source or '加入購物車' in source:
                  return 'LINE 詢問／下單'
              if '是否符合' in source or '適合' in source or '推薦' in source or body_page == 'choose':
                  return 'LINE 幫我推薦'
              if '搭配' in source or '套餐' in source or body_page in ('combo', 'recipes'):
                  return 'LINE 詢問搭配'
              if '使用方式' in source or '怎麼使用' in source or '怎麼用' in source or body_page == 'guide':
                  return 'LINE 詢問用法'
              if '客服' in source or '聯絡' in source or body_page in ('contact', 'faq'):
                  return 'LINE 聯絡客服'
              if body_page == 'product-detail' or page_name.startswith('product-'):
                  return 'LINE 詢問／下單'
              if '品牌' in source or body_page == 'brand':
                  return 'LINE 詢問品牌'
              return 'LINE 詢問產品'

          for page in html_files:
              raw = page.read_text(encoding='utf-8')
              soup = BeautifulSoup(raw, 'html.parser')
              report['htmlPages'] += 1
              changed = False
              body_page = (soup.body or {}).get('data-page', '') if soup.body else ''

              for element in soup.find_all(['a', 'button']):
                  report['clickableElements'] += 1
                  classes = set(element.get('class') or [])
                  text_value = ' '.join(element.get_text(' ', strip=True).split())
                  href = (element.get('href') or '').strip()
                  is_line = ('btn-line' in classes or element.has_attr('data-line-url') or any(host in href for host in line_hosts))

                  if element.name == 'button':
                      report['buttons'] += 1
                      if not element.get('type') and element.find_parent('form') is None:
                          element['type'] = 'button'
                          changed = True
                          report['fixes'].append(f'{page.name}: 為按鈕「{text_value or "未命名"}」補上 type=button')

                  if is_line:
                      report['lineButtons'] += 1
                      message = element.get('data-line-message', '')
                      label = clear_line_label(text_value, message, page.name, body_page)
                      if text_value != label:
                          element.clear()
                          element.string = label
                          changed = True
                          report['fixes'].append(f'{page.name}: LINE 按鈕「{text_value or "未命名"}」→「{label}」')
                      desired_aria = f'前往 LINE 官方帳號｜{label.replace("LINE ", "")}'
                      if element.get('aria-label') != desired_aria:
                          element['aria-label'] = desired_aria
                          changed = True
                      if element.name == 'a':
                          if element.get('target') != '_blank':
                              element['target'] = '_blank'; changed = True
                          rel = set(element.get('rel') or [])
                          if not {'noopener', 'noreferrer'}.issubset(rel):
                              element['rel'] = sorted(rel | {'noopener', 'noreferrer'}); changed = True
                      continue

                  if element.name == 'a':
                      if href.startswith(('http://', 'https://')):
                          report['externalLinks'] += 1
                          if element.get('target') == '_blank':
                              rel = set(element.get('rel') or [])
                              if 'noopener' not in rel:
                                  element['rel'] = sorted(rel | {'noopener', 'noreferrer'})
                                  changed = True
                                  report['fixes'].append(f'{page.name}: 外部連結「{text_value}」補上安全 rel')
                      elif href and not href.startswith(('#', 'mailto:', 'tel:', 'javascript:')):
                          report['internalLinks'] += 1
                          target = href.split('#', 1)[0].split('?', 1)[0]
                          if target.endswith('.html') and target not in existing:
                              report['brokenInternalLinks'].append({'page': page.name, 'text': text_value, 'href': href})

                      if href in ('#', 'javascript:void(0)', 'javascript:void(0);'):
                          has_control = any([
                              element.has_attr('data-close-modal'), element.has_attr('data-open-modal'),
                              element.has_attr('data-close-menu'), element.has_attr('onclick'),
                              'dm-lightbox-link' in classes
                          ])
                          if not has_control:
                              report['warnings'].append({'page': page.name, 'type': 'placeholder-link', 'text': text_value, 'href': href})

                  if not text_value and not element.get('aria-label') and not element.find('img', alt=True):
                      report['warnings'].append({'page': page.name, 'type': 'unlabelled-control', 'tag': element.name, 'href': href})

              if changed:
                  rendered = str(soup)
                  if raw.lstrip().lower().startswith('<!doctype html>') and not rendered.lstrip().lower().startswith('<!doctype html>'):
                      rendered = '<!DOCTYPE html>\n' + rendered
                  page.write_text(rendered, encoding='utf-8')

          # Keep cache versions synchronized and ensure every product detail points to latest DM set.
          dm_names = [
              '01_guilu-gao-100g-dm.jpg',
              '02_guilu-drink-30cc-dm.jpg',
              '03_guilu-drink-180cc-dm.jpg',
              '04_luerong-fen-75g-dm.jpg',
              '05_guilu-tangkuai-75g-dm.jpg',
              '06_guilu-jiao-600g-dm.jpg'
          ]
          for path in list(ROOT.glob('*.html')) + [ROOT/'data.json', ROOT/'catalog-public.json']:
              if not path.exists():
                  continue
              content = path.read_text(encoding='utf-8')
              original = content
              for name in dm_names:
                  content = re.sub(rf'(images/dm-final/{re.escape(name)})(?:\?v=[^\"\'<> ]+)?', rf'\1?v={VERSION}', content)
              content = re.sub(r'(site(?:-v321)?\.css\?v=)[^\"\'<> ]+', rf'\g<1>{VERSION}', content)
              content = re.sub(r'(site\.js\?v=)[^\"\'<> ]+', rf'\g<1>{VERSION}', content)
              if content != original:
                  path.write_text(content, encoding='utf-8')

          # Ensure DM overview has all six official items, including 180cc.
          dm_page = ROOT / 'dm.html'
          dm_text = dm_page.read_text(encoding='utf-8')
          for name in dm_names:
              if name not in dm_text:
                  report['warnings'].append({'page': 'dm.html', 'type': 'missing-dm-card', 'asset': name})

          report['status'] = 'PASS' if not report['brokenInternalLinks'] and not report['warnings'] else 'PASS_WITH_WARNINGS'
          (ROOT / 'BUTTON_AUDIT_REPORT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          python3 /tmp/audit_buttons.py

      - name: Validate website code and button audit
        run: |
          set -euo pipefail
          node --check site-core.js
          node --check site.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('BUTTON_AUDIT_REPORT.json').read_text(encoding='utf-8'))
          if report['brokenInternalLinks']:
              raise SystemExit(f"Broken internal links: {report['brokenInternalLinks']}")
          if report['lineButtons'] < 1:
              raise SystemExit('No LINE buttons detected')
          print(f"Checked {report['htmlPages']} HTML pages, {report['clickableElements']} clickable elements, {report['lineButtons']} LINE buttons")
          PY

      - name: Commit audited button labels
        run: |
          set -euo pipefail
          rm -f .github/workflows/full-site-button-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "全站按鈕檢查：明確標示 LINE 導向並修正連結" || true
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated website
        uses: actions/deploy-pages@v4
