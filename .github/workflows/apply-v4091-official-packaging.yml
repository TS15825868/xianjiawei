name: 同步龜鹿飲30cc小玻璃瓶正式名稱

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_v4091_official_packaging_v2.py"
      - ".github/workflows/apply-v4091-official-packaging.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-v4091-official-packaging
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize official 30cc glass bottle wording
        run: python3 tools/apply_v4091_official_packaging_v2.py

      - name: Validate official public catalog without deleting product sizes
        run: |
          set -euo pipefail
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          for filename in ('data.json', 'catalog-public.json'):
              source = json.loads(Path(filename).read_text(encoding='utf-8'))
              products = {item['id']: item for item in source['products']}
              drink = products['guilu-drink-30']
              assert drink['name'] == '龜鹿飲30cc玻璃瓶'
              assert drink['displayName'] == '龜鹿飲30cc玻璃瓶'
              assert drink['size'] == '30cc／瓶（小玻璃瓶）'
              if 'unit' in drink:
                  assert drink['unit'] == '瓶'

          text = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in Path('.').iterdir()
              if path.is_file() and path.suffix in {'.html', '.json', '.txt'}
          )
          for forbidden in ('龜鹿飲30cc玻璃罐', '30cc／罐（小玻璃罐）', '30cc小玻璃罐'):
              assert forbidden not in text, f'仍含舊稱：{forbidden}'
          print('PASS 30cc小玻璃瓶正式名稱；既有產品規格未被刪除')
          PY

      - name: Commit synchronized files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "正式名稱已同步"
          else
            git commit -m "fix(site): synchronize 30cc glass bottle wording [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
