name: 同步龜鹿飲30cc玻璃罐與龜鹿湯塊唯一規格

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_v4091_official_packaging_v2.py"
      - ".github/workflows/apply-v4091-official-packaging.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-v4091-official-packaging
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply official packaging and specification policy
        run: python3 tools/apply_v4091_official_packaging_v2.py

      - name: Validate official public catalog
        run: |
          set -euo pipefail
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          for filename in ('data.json', 'catalog-public.json'):
              source = json.loads(Path(filename).read_text(encoding='utf-8'))
              products = {item['id']: item for item in source['products']}
              drink = products['guilu-drink-30']
              soup = products['guilu-tangkuai']
              assert drink['name'] == '龜鹿飲30cc玻璃罐'
              assert drink['displayName'] == '龜鹿飲30cc玻璃罐'
              assert drink['size'] == '30cc／罐（小玻璃罐）'
              assert soup['size'] == '75g／盒｜8塊裝｜每塊約9.375g'

          text = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in Path('.').iterdir()
              if path.is_file() and path.suffix in {'.html', '.json', '.txt'}
          )
          assert '龜鹿飲30cc玻璃瓶' not in text
          assert '30cc／瓶（玻璃瓶）' not in text
          assert not re.search(r'龜鹿湯塊\s*(?:300|600)\s*g', text, re.I)
          print('PASS 官方包裝與唯一規格')
          PY

      - name: Commit synchronized files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "官方規格已同步"
          else
            git commit -m "正式同步龜鹿飲30cc玻璃罐與龜鹿湯塊75g唯一規格"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
