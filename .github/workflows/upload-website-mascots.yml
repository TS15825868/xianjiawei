name: Upload website mascot images

on:
  push:
    branches: [main]
    paths:
      - RUN_UPLOAD_WEBSITE_MASCOTS.txt

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode uploaded mascot archive
        run: |
          cat .mascot-upload/chunk-* | tr -d '\n\r ' | base64 -d > /tmp/website-mascots.tar.gz
          mkdir -p /tmp/website-mascots images/brand
          tar -xzf /tmp/website-mascots.tar.gz -C /tmp/website-mascots
          cp /tmp/website-mascots/xianjiawei-scene-*.jpg images/brand/

      - name: Verify files
        run: |
          for name in welcome products guide combo usage service brand; do
            test -s "images/brand/xianjiawei-scene-${name}.jpg"
            file "images/brand/xianjiawei-scene-${name}.jpg" | grep -q 'JPEG image data'
          done
          node --check site-core.js
          node --check site-fix-v317.js

      - name: Commit uploaded images
        run: |
          rm -rf .mascot-upload
          rm -f RUN_UPLOAD_WEBSITE_MASCOTS.txt
          rm -f .github/workflows/upload-website-mascots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '上傳網站專用小老闆高畫質圖片並修復黑畫面'
          git pull --rebase origin main
          git push origin main
