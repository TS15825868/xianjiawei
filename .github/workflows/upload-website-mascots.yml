name: Upload website mascot images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode uploaded mascot images
        run: |
          mkdir -p images/brand
          for name in welcome products guide combo usage service brand; do
            base64 -d ".mascot-upload/${name}.b64" > "images/brand/xianjiawei-scene-${name}.jpg"
          done
      - name: Verify files
        run: |
          for name in welcome products guide combo usage service brand; do
            test -s "images/brand/xianjiawei-scene-${name}.jpg"
            file "images/brand/xianjiawei-scene-${name}.jpg" | grep -q 'JPEG image data'
          done
      - name: Commit
        run: |
          rm -rf .mascot-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '上傳網站專用小老闆高畫質圖片'
          git push
