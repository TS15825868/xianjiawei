name: 清理暫存圖橋接議題
on:
  push:
    branches: [main]
    paths: ['data/cleanup-temp-asset-issues-v20260818.trigger']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close temporary asset bridge issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title > /tmp/issues.json
          node - <<'NODE' >/tmp/numbers.txt
          const rows=require('/tmp/issues.json');
          for(const x of rows){
            if(x.title==='tmp'||x.title==='XJW-TEMP-ASSET-BRIDGE-20260818-1123') console.log(x.number);
          }
          NODE
          while IFS= read -r n; do
            [ -n "$n" ] && gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment '暫存圖橋接已完成，關閉清理。'
          done </tmp/numbers.txt
