name: Apply mascot v400 by PR

on:
  pull_request:
    branches: [main]
    paths:
      - APPLY_MASCOT_V400_PR.txt

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Generate website and LINE OA sets
        run: python3 tools/generate-mascot-v400.py

      - name: Verify generated images
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          website = ['home','products','choose','combo','guide','recipes','faq','contact','brand']
          line = ['welcome','products','recommend','combo','usage','faq','service','brand','cart']
          wh, lh = set(), set()
          for name in website:
              p = Path(f'images/brand/website-mascot-{name}.jpg')
              assert p.exists(), p
              with Image.open(p) as im: assert im.size == (1448,1086), (p,im.size)
              assert p.stat().st_size > 100000, (p,p.stat().st_size)
              wh.add(p.read_bytes())
          for name in line:
              p = Path(f'images/line-mascot/xianjiawei-mascot-line-{name}.jpg')
              assert p.exists(), p
              with Image.open(p) as im: assert im.size == (1448,1086), (p,im.size)
              assert p.stat().st_size > 100000, (p,p.stat().st_size)
              lh.add(p.read_bytes())
          assert len(wh) >= 8
          assert len(lh) == 9
          assert wh.isdisjoint(lh)
          PY

      - name: Commit generated images to PR branch
        run: |
          rm -f APPLY_MASCOT_V400_PR.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/brand/website-mascot-*.jpg images/line-mascot/xianjiawei-mascot-line-*.jpg APPLY_MASCOT_V400_PR.txt
          git diff --cached --quiet || git commit -m '產生網站與 LINE OA 兩套高解析小老闆圖'
          git push origin HEAD:${{ github.head_ref }}
