name: Finalize site v292

on:
  push:
    branches:
      - site-unify-v292

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: site-unify-v292
          fetch-depth: 0

      - name: Synchronize internal versions and audit
        run: python tools/finalize_internal_versions_v292.py

      - name: Commit finalized site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js site-v287-core.js data.json '*.html' SITE_AUDIT_v292.txt
          if git diff --cached --quiet; then
            echo "No final changes to commit."
          else
            git commit -m "v292: synchronize internal data and cache versions"
            git push origin HEAD:site-unify-v292
          fi
