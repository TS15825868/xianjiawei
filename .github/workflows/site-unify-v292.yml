name: Unify site v292

on:
  push:
    branches:
      - site-unify-v292

permissions:
  contents: write

jobs:
  normalize-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: site-unify-v292
          fetch-depth: 0

      - name: Normalize and audit
        run: python tools/unify_site_v292.py

      - name: Commit normalized site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' SITE_AUDIT_v292.txt
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "v292: unify full site content, versions and public information"
            git push origin HEAD:site-unify-v292
          fi
