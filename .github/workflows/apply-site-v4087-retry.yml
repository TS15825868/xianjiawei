name: Apply site v408.7 final

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: apply-site-v4087-final
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_SITE_V4087_FINAL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified update script
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown beautifulsoup4 pillow
          gdown '1JFafCAXXmcpCpf15nKTqi-dmC9-dtZk4' -O /tmp/apply_v4087.py
          echo '3d1736577a3ff8a75141e0d2316af7a266ea97391b871c01520963bb739a1fef  /tmp/apply_v4087.py' | sha256sum -c -

      - name: Apply v408.7 website update
        run: |
          set -euo pipefail
          python3 /tmp/apply_v4087.py

      - name: Commit, rebase and push main
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成整站SEO AIO產品頁與效能優化 v408.7'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 3
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          echo '[]' > /tmp/runs.json
          for i in $(seq 1 42); do
            gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --commit "$TARGET_SHA" --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json || true
            status=$(python3 - <<'PY'
          import json
          try:
              runs=json.load(open('/tmp/runs.json'))
              print(runs[0].get('status','') if runs else '')
          except Exception:
              print('')
          PY
            )
            [ "$status" = 'completed' ] && break
            sleep 10
          done
          conclusion=$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json'))
          print(runs[0].get('conclusion','') if runs else '')
          PY
          )
          cat /tmp/runs.json
          test "$conclusion" = 'success'

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_SUCCESS｜首頁、產品總覽、六項完整產品頁、正式DM、SEO/AIO、sitemap、robots、llms、機器可讀產品資料、WebP圖片與精簡部署全部驗收並正式上線。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_FINAL_FAILURE｜最終流程未完成，不宣稱上線；請查看失敗步驟。'
