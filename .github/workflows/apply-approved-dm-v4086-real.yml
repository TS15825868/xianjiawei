name: Apply approved DM v408.6 real

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-approved-dm-v4086-real
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_APPROVED_DM_V4086_REAL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the exact approved archive
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown pillow
          gdown '1EBfcN1O4d4ffD9g5MEjYlnj9Z5ELNUOS' -O /tmp/approved-dm-v4086.zip
          echo '635c15232d2057cd1aa2622d0bbcba0a233e20b74e87f960963394803b076e99  /tmp/approved-dm-v4086.zip' | sha256sum -c -
          rm -rf /tmp/approved-dm-v4086
          mkdir -p /tmp/approved-dm-v4086
          unzip -q /tmp/approved-dm-v4086.zip -d /tmp/approved-dm-v4086

      - name: Verify and install all six approved DM images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, shutil

          src = Path('/tmp/approved-dm-v4086')
          dst = Path('images/dm-final')
          dst.mkdir(parents=True, exist_ok=True)
          expected = {
            '01_guilu-gao-100g-dm.jpg': 'ab92c43f68c2d11f33b036e99e9bc31dde3c199c187ead2032fd72bccfdac58b',
            '02_guilu-drink-30cc-dm.jpg': 'e46b71ca2265adf544087ba3badbf430821896961c0deb4d1dbde13478d39f49',
            '03_guilu-drink-180cc-dm.jpg': '81f10bb54c66bb273ddbb040f3e634db3239ac4a85931916ce234f099228e5f1',
            '04_luerong-fen-75g-dm.jpg': 'cdac8d1a3484e941224d3c7725b0d55b073b94286e6f4a000a7ae80e18def121',
            '05_guilu-tangkuai-75g-dm.jpg': 'e5d2d0ce9413f21a0507fcee8e90a1990d408c26b39667008d68046043448d99',
            '06_guilu-jiao-600g-dm.jpg': 'f3e6a24fc83f385feb5dda38a24a310de13c46150929d6ea45cb5050caa562a9',
          }
          found = {p.name for p in src.iterdir() if p.is_file()}
          if found != set(expected):
              raise SystemExit(f'archive file set mismatch: {sorted(found)}')
          for name, digest in expected.items():
              p = src / name
              raw = p.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != digest:
                  raise SystemExit(f'hash mismatch for {name}: {actual}')
              with Image.open(p) as im:
                  if im.size != (1122, 1402):
                      raise SystemExit(f'dimension mismatch for {name}: {im.size}')
              shutil.copyfile(p, dst / name)
          print('Six exact approved DM images installed.')
          PY

      - name: Bust caches and record v408.6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          for pattern in ('*.html', '*.js', '*.css', '*.json'):
              for p in Path('.').glob(pattern):
                  try:
                      s = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  original = s
                  for old in ('?v=408.1','?v=408.2','?v=408.3','?v=408.4','?v=408.5'):
                      s = s.replace(old, '?v=408.6')
                  s = s.replace('正式版 v408.4', '正式版 v408.6')
                  if s != original:
                      p.write_text(s, encoding='utf-8')

          dv = Path('deploy-version.json')
          data = json.loads(dv.read_text(encoding='utf-8')) if dv.exists() else {}
          data.update({
              'version': '408.6',
              'updated': '2026-07-13',
              'status': 'production-ready',
              'dmAssets': 'six-user-approved-1122x1402-jpg-files-sha256-verified',
              'cacheVersion': '408.6'
          })
          dv.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = {
              'version': '408.6',
              'source': 'approved-dm-v4086-public.zip',
              'dimensions': [1122, 1402],
              'files': [
                  '01_guilu-gao-100g-dm.jpg',
                  '02_guilu-drink-30cc-dm.jpg',
                  '03_guilu-drink-180cc-dm.jpg',
                  '04_luerong-fen-75g-dm.jpg',
                  '05_guilu-tangkuai-75g-dm.jpg',
                  '06_guilu-jiao-600g-dm.jpg'
              ]
          }
          Path('images/dm-final/approved-dm-v4086-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Final validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected = {
            '01_guilu-gao-100g-dm.jpg': 'ab92c43f68c2d11f33b036e99e9bc31dde3c199c187ead2032fd72bccfdac58b',
            '02_guilu-drink-30cc-dm.jpg': 'e46b71ca2265adf544087ba3badbf430821896961c0deb4d1dbde13478d39f49',
            '03_guilu-drink-180cc-dm.jpg': '81f10bb54c66bb273ddbb040f3e634db3239ac4a85931916ce234f099228e5f1',
            '04_luerong-fen-75g-dm.jpg': 'cdac8d1a3484e941224d3c7725b0d55b073b94286e6f4a000a7ae80e18def121',
            '05_guilu-tangkuai-75g-dm.jpg': 'e5d2d0ce9413f21a0507fcee8e90a1990d408c26b39667008d68046043448d99',
            '06_guilu-jiao-600g-dm.jpg': 'f3e6a24fc83f385feb5dda38a24a310de13c46150929d6ea45cb5050caa562a9',
          }
          for name, digest in expected.items():
              p = Path('images/dm-final') / name
              assert p.is_file(), name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, name
          html = Path('dm.html').read_text(encoding='utf-8')
          assert html.count('class="dm-image-v2"') == 6
          for name in expected:
              assert f'images/dm-final/{name}?v=408.6' in html, name
          assert json.loads(Path('deploy-version.json').read_text(encoding='utf-8'))['version'] == '408.6'
          print('Final validation passed.')
          PY

      - name: Remove temporary test workflows and notes
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-approved-dm-v4086-real.yml
          rm -f .github/workflows/report-dm-v4086-failure.yml
          rm -f .github/workflows/drive-inspect-on-push.yml
          rm -f .github/workflows/test-drive-public-v2.yml
          rm -f .github/workflows/test-drive-download-v408.yml
          rm -f .github/workflows/diagnose-all-32-dm-parts.yml
          rm -f .github/workflows/diagnose-v408-q32.yml
          rm -f .github/workflows/apply-approved-dm-v4085-final.yml
          rm -f .github/workflows/apply-approved-dm-binary-v4085.yml
          rm -f .github/workflows/report-approved-dm-v4085.yml
          rm -f .github/workflows/report-approved-dm-failure.yml
          rm -f .github/workflows/report-approved-dm-failure-2.yml
          rm -f tools/v4086-source-note.txt tools/v4086-trigger-ready.txt

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '實際替換六張核准正式DM並部署 v408.6'
          git push origin HEAD:main

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'DM_V4086_REAL_SUCCESS｜六張使用者核准DM已依固定SHA-256實際替換、尺寸1122×1402驗證通過、快取版本已升至408.6並推送main。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'DM_V4086_REAL_FAILURE｜本次未宣稱完成，請查看失敗步驟與日誌。'
