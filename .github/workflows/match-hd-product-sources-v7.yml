name: Match HD formal product sources v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-hd-product-sources-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image comparison dependency
        run: python -m pip install --quiet pillow

      - name: Compare current formal product images against larger repository sources
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageFilter
          from pathlib import Path
          import json, math

          targets = {
            'guilu-gao': Path('images/customer-display-v20260812/guilu-gao.webp'),
            'guilu-drink-30cc': Path('images/customer-display-v20260812/guilu-drink-30cc.webp'),
            'guilu-drink-180cc': Path('images/customer-display-v20260812/guilu-drink-180cc.webp'),
            'guilu-tangkuai': Path('images/customer-display-v20260812/guilu-tangkuai.webp'),
            'guilu-jiao': Path('images/customer-display-v20260812/guilu-jiao.webp'),
            'luerong-fen': Path('images/customer-display-v20260812/luerong-fen.webp'),
          }
          name_tokens = {
            'guilu-gao': ('guilu-gao','guilu_gao'),
            'guilu-drink-30cc': ('guilu-drink-30','guilu_drink_30'),
            'guilu-drink-180cc': ('guilu-drink-180','guilu_drink_180'),
            'guilu-tangkuai': ('guilu-tangkuai','guilu_tangkuai'),
            'guilu-jiao': ('guilu-jiao','guilu_jiao'),
            'luerong-fen': ('luerong-fen','lurong-fen','luerong_fen','lurong_fen'),
          }
          candidate_roots = [
            Path('images/dm-approved-v20260810'),
            Path('images/dm-final'),
            Path('images/formal-display'),
            Path('images/products-v2'),
            Path('images/products-v3'),
            Path('images/hero'),
            Path('images'),
          ]
          exts={'.png','.jpg','.jpeg','.webp'}

          def load(path):
            with Image.open(path) as src:
              src.seek(0)
              im=src.convert('RGB').copy()
            return ImageOps.exif_transpose(im)

          def canvas(im, size=96):
            bg=Image.new('RGB',(size,size),'white')
            fit=ImageOps.contain(im,(size,size),Image.Resampling.LANCZOS)
            bg.paste(fit,((size-fit.width)//2,(size-fit.height)//2))
            return bg

          def mse(a,b):
            aa=list(a.convert('L').getdata()); bb=list(b.convert('L').getdata())
            return sum((x-y)*(x-y) for x,y in zip(aa,bb))/len(aa)/(255*255)

          def score(a,b):
            ca,cb=canvas(a),canvas(b)
            base=mse(ca,cb)
            ea=ca.convert('L').filter(ImageFilter.FIND_EDGES)
            eb=cb.convert('L').filter(ImageFilter.FIND_EDGES)
            edge=mse(ea,eb)
            ar_a=a.width/a.height; ar_b=b.width/b.height
            ar=min(abs(math.log(max(ar_a,1e-6)/max(ar_b,1e-6))),1.0)
            return base*0.52 + edge*0.38 + ar*0.10

          all_files=[]; seen=set()
          for root in candidate_roots:
            if not root.exists(): continue
            for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in exts and p not in seen:
                seen.add(p); all_files.append(p)

          report={'version':'20260813-hd-source-match-v7.1','targets':{}}
          for key,t in targets.items():
            entry={'current':{'path':str(t),'bytes':t.stat().st_size},'decode_ok':False,'decode_error':None,'best':[]}
            try:
              base=load(t)
              entry['decode_ok']=True
              entry['current'].update({'width':base.width,'height':base.height})
            except Exception as exc:
              entry['decode_error']=f'{type(exc).__name__}: {exc}'
              report['targets'][key]=entry
              continue
            rows=[]; tokens=name_tokens[key]
            for p in all_files:
              if p.resolve()==t.resolve(): continue
              low=str(p).lower().replace('cc','')
              if not any(tok.replace('cc','') in low for tok in tokens): continue
              try:
                im=load(p)
              except Exception:
                continue
              rows.append({
                'path':str(p),'score':round(score(base,im),6),
                'width':im.width,'height':im.height,'bytes':p.stat().st_size,
                'larger_than_current':p.stat().st_size > t.stat().st_size*2,
              })
            rows.sort(key=lambda r:r['score'])
            entry['best']=rows[:10]
            report['targets'][key]=entry
          Path('hd-source-match-v7.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(Path('hd-source-match-v7.json').read_text(encoding='utf-8'))
          PY

      - name: Commit comparison report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hd-source-match-v7.json
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'chore(images): record HD source match report v7'
          git push origin HEAD:main
