name: 仙加味官網目前正式資料一次性完整驗收

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-full-current-site-audit-v20260815.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Repair stale validators to current authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_public_aio_seo.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"75g／盒"','SOUP_MAIN_SPEC')
          s=s.replace('if SOUP_DETAIL not in soup_rule or "詳細資料" not in soup_rule: fail(errors,"catalog-public.json龜鹿湯塊每塊約重沒有維持detail-only規則")','if SOUP_DETAIL not in soup_rule or "顧客文字可顯示完整規格" not in soup_rule: fail(errors,"catalog-public.json龜鹿湯塊完整顧客文字規格政策不同步")')
          s=s.replace('for marker in [SOUP_MAIN_SPEC,JIAO_MAIN_SPEC,SOUP_DETAIL,JIAO_DETAIL,"僅詳細資料"]:','for marker in [SOUP_MAIN_SPEC,JIAO_MAIN_SPEC,SOUP_DETAIL,JIAO_DETAIL]:')
          s=s.replace('正式規格顯示層缺少目前主規格／詳細資料規則','正式規格顯示層缺少目前主規格／詳細約重')
          s=s.replace('PASS AIO／SEO／GEO：','PASS AIO／SEO／GEO（目前權威）：')
          p.write_text(s,encoding='utf-8')

          p=Path('tools/validate-public-boundary-v20260808.py')
          s=p.read_text(encoding='utf-8')
          if 'import re\n' not in s:s=s.replace('from pathlib import Path\n','from pathlib import Path\nimport re\n')
          s=s.replace('assert "75g／盒" in source','assert "75g （2兩）／盒｜8塊裝" in source\n            assert "每塊約9.375g" in source')
          s=s.replace('assert "600g（1斤）／盒" in source\n            assert "32塊裝" in source','assert "600g （1斤）／盒｜32塊裝" in source\n            assert re.search(r"每塊約18\\.75\\s*g", source)')
          s=s.replace('湯塊舊容量、龜鹿膠1斤／32塊規格與產品頁媒體角色均未越界。','湯塊75g（2兩）／8塊與龜鹿膠600g（1斤）／32塊完整文字規格、產品頁媒體角色均未越界。')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/validate_public_aio_seo.py tools/validate-public-boundary-v20260808.py
      - name: Run current public customer validators
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate-public-customer-pages-v20260809.py
          python tools/validate-site-production-release-v20260809.py
          python tools/validate-visual-cohesion-v20260809.py
          python tools/validate_public_aio_seo.py
          python tools/validate-public-boundary-v20260808.py
          python tools/validate-publishing-content-match-v20260809.py
      - name: Validate current authority JSON and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data.json >/dev/null
          python -m json.tool catalog-public.json >/dev/null
          python -m json.tool geo-data.json >/dev/null
          python -m json.tool assets/data/official-products.json >/dev/null
          python -m json.tool data/formal-media-authority-v20260810.json >/dev/null
          node --check site.js
          node --check site-product-data-authority.js
          node --check site-product-image-safety.js
          node --check site-media-modal-final-v20260814.js
      - name: Commit validator repairs and remove one-shot workflow after successful audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_public_aio_seo.py tools/validate-public-boundary-v20260808.py
          git rm .github/workflows/one-shot-full-current-site-audit-v20260815.yml
          git diff --cached --check
          git commit -m 'fix(site): align public validators with current product authority'
          git pull --rebase origin main
          git push origin HEAD:main
