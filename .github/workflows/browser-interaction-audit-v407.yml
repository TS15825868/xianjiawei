name: Browser interaction audit v407

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == 'BROWSER_INTERACTION_AUDIT_V407_20260713'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install puppeteer core
        run: npm install --no-save --silent puppeteer-core@24
      - name: Run mobile interaction audit
        env:
          SITE_BASE: https://ts15825868.github.io/xianjiawei
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          cat > browser-audit.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const base=process.env.SITE_BASE;
          const executable=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          const expected={
            'guilu-gao':'01_guilu-gao-100g-dm.jpg',
            'guilu-drink-30':'02_guilu-drink-30cc-dm.jpg',
            'guilu-drink-180':'03_guilu-drink-180cc-dm.jpg',
            'guilu-tangkuai':'05_guilu-tangkuai-75g-dm.jpg',
            'guilu-jiao':'06_guilu-jiao-600g-dm.jpg',
            'luerong-fen':'04_luerong-fen-75g-dm.jpg'};
          (async()=>{
            const lines=['# 手機版實際點擊驗收']; const problems=[];
            if(!executable) throw new Error('Runner 找不到 Chrome');
            const browser=await puppeteer.launch({executablePath:executable,headless:true,args:['--no-sandbox','--disable-setuid-sandbox']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2});
            await page.goto(base+'/index.html?audit='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            const count=await page.$$eval('.product-card[data-product-id]',x=>x.length);
            lines.push(`\n- 首頁產品卡：${count} 張`);
            if(count!==6) problems.push(`首頁產品卡應為 6 張，目前 ${count}`);
            for(const [id,dm] of Object.entries(expected)){
              const card=await page.$(`.product-card[data-product-id="${id}"]`);
              if(!card){problems.push(`${id} 缺少產品卡`);continue;}
              const actions=await card.$$eval('.product-card__actions a,.product-card__actions button',els=>els.map(e=>({text:e.textContent.trim(),href:e.getAttribute('href')})));
              const full=actions.find(x=>x.text==='完整介紹');
              const quick=actions.find(x=>x.text==='快速查看');
              if(!full) problems.push(`${id} 缺少完整介紹`);
              if(!quick) problems.push(`${id} 缺少快速查看`);
              await card.$eval('.product-card__img',el=>el.click());
              await page.waitForSelector('#product-modal[aria-hidden="false"] #product-modal-body img',{timeout:10000});
              const img1=await page.$eval('#product-modal-body img',e=>e.getAttribute('src'));
              if(!img1.includes(dm)) problems.push(`${id} 點圖片顯示錯圖：${img1}`);
              await page.click('#product-modal-close');
              await page.waitForFunction(()=>document.querySelector('#product-modal')?.getAttribute('aria-hidden')==='true');
              await card.$eval('[data-quick-view]',el=>el.click());
              await page.waitForSelector('#product-modal[aria-hidden="false"] #product-modal-body img',{timeout:10000});
              const img2=await page.$eval('#product-modal-body img',e=>e.getAttribute('src'));
              if(!img2.includes(dm)) problems.push(`${id} 快速查看顯示錯圖：${img2}`);
              await page.click('#product-modal-close');
              const p2=await browser.newPage();
              await p2.setViewport({width:390,height:844,deviceScaleFactor:2});
              await p2.goto(base+'/'+full.href+'?audit='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
              const hero=await p2.$eval('.product-detail-hero__media img',e=>e.getAttribute('src')).catch(()=>null);
              const dmHref=await p2.$eval('.dm-lightbox-link',e=>e.getAttribute('href')).catch(()=>null);
              if(!dmHref || !dmHref.includes(dm)) problems.push(`${id} 完整介紹頁 DM 連結錯誤：${dmHref}`);
              lines.push(`- **${id}**：點圖片→\`${img1}\`；快速查看→\`${img2}\`；完整介紹頁首→\`${hero}\`；DM 按鈕→\`${dmHref}\``);
              await p2.close();
            }
            await page.goto(base+'/dm.html?audit='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            const dmImgs=await page.$$eval('.dm-image-v2',els=>els.map(e=>e.getAttribute('src')));
            lines.push(`\n- dm.html 實際顯示：${dmImgs.length} 張`);
            for(const dm of Object.values(expected)) if(!dmImgs.some(x=>x.includes(dm))) problems.push(`dm.html 缺少 ${dm}`);
            if(dmImgs.length!==6) problems.push(`dm.html 應為 6 張，目前 ${dmImgs.length}`);
            lines.push('\n## 結果');
            if(problems.length) problems.forEach(x=>lines.push('- ❌ '+x));
            else lines.push('- ✅ 六項產品的點圖片、快速查看、完整介紹 DM 連結及 dm.html 均正確');
            fs.writeFileSync('/tmp/browser-report.md',lines.join('\n'));
            await browser.close();
          })().catch(e=>{fs.writeFileSync('/tmp/browser-report.md','# 手機版實際點擊驗收\n\n- ❌ '+e.stack);});
          JS
          node browser-audit.cjs
      - name: Publish report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const body=fs.existsSync('/tmp/browser-report.md')?fs.readFileSync('/tmp/browser-report.md','utf8'):'未產生報告';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
