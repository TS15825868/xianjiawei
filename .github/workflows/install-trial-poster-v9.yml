name: Install latest approved trial poster v9

on:
  push:
    paths:
      - '_tmp/trial-poster/install-v9.trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Assemble and install latest user-approved trial poster
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, json, re

          VERSION='20260813-trial-poster-user-final-v9'
          REL='images/trial/trial-poster-user-final-v20260813.jpg'
          WEB='https://ts15825868.github.io/xianjiawei/'+REL+'?v='+VERSION
          EXPECTED_SHA='4c90e692c9687a72c90a3ddddde9b0da7216bf60084e4b38f422e44897975d92'
          chunks=sorted(Path('_tmp/trial-poster').glob('part-*.b64'))
          assert chunks, 'trial poster chunks missing'
          raw=base64.b64decode(''.join(p.read_text().strip() for p in chunks))
          assert hashlib.sha256(raw).hexdigest()==EXPECTED_SHA, 'trial poster checksum mismatch'
          out=Path(REL); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(raw)
          with Image.open(out) as im:
              assert im.size==(1254,1254), im.size
              im.verify()

          # trial.html: only replace the top trial visual; preserve both product cards below.
          p=Path('trial.html'); s=p.read_text()
          old='20260813-trial-product-role-fix-v8'
          s=s.replace(old,VERSION)
          s=s.replace('https://ts15825868.github.io/xianjiawei/images/customer-display-v20260812/guilu-drink-30cc.avif?v='+VERSION,WEB)
          section='''<section class="section section--narrow" aria-labelledby="trial-visual-title"><div class="section-heading reveal" style="text-align:center"><p class="eyebrow">試喝活動</p><h2 id="trial-visual-title">龜鹿飲試喝組｜先試喝，再決定</h2><p>先從30cc小玻璃罐試喝組開始，再依自己的使用習慣決定是否繼續選購。</p></div><figure class="trial-poster reveal"><img src="'''+REL+'''?v='''+VERSION+'''" alt="仙加味龜鹿飲試喝組｜先試喝，再決定" fetchpriority="high" decoding="async"/></figure></section>'''
          pattern=r'<section class="section section--narrow" aria-labelledby="trial-visual-title">.*?</section>'
          s,n=re.subn(pattern,section,s,count=1,flags=re.S)
          assert n==1, 'trial visual section not replaced'
          css='''.trial-poster{max-width:900px;margin:0 auto;padding:10px;border:1px solid rgba(11,31,59,.08);border-radius:24px;background:#fff;box-shadow:0 16px 40px rgba(33,24,16,.08);overflow:hidden}.trial-poster img{display:block;width:100%;height:auto!important;max-width:100%;object-fit:contain!important;object-position:center!important;border-radius:16px;background:#fff}@media(max-width:700px){.trial-poster{padding:6px;border-radius:18px}.trial-poster img{border-radius:13px}}'''
          if '.trial-poster{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          assert 'guilu-drink-30cc.avif?v='+VERSION in s, '30cc product card changed unexpectedly'
          assert 'guilu-drink-180cc-product.jpg?v='+VERSION in s, '180cc product card changed unexpectedly'
          assert REL+'?v='+VERSION in s
          p.write_text(s)

          # Public manifest: product / DM / trial stay separate.
          p=Path('images/formal-display/manifest.json'); m=json.loads(p.read_text())
          m['runtime']=VERSION
          m['trial']={
            'render_mode':'poster','path':'/'+REL,'version':VERSION,
            'status':'approved_user_provided_final','format':'jpeg','dimensions':'1254x1254',
            'binary_status':'verified_decodable_user_upload_recompressed_for_web_without_content_change',
            'source':'user-upload-20260813-latest-approved-trial-poster',
            'character':'仙加味小老闆＋小鹿＋小烏龜','role':'separate-approved-trial-poster-not-product-or-dm',
            'do_not_use_as_product_image':True,'do_not_use_as_dm':True,
            'retired_paths':['/images/customer-display-v20260812/trial.webp','/images/customer-display-v20260812/trial-clean-v4.svg','/images/customer-display-v20260812/trial-small-boss.webp','/images/customer-display-v20260812/trial-small-boss.jpg','/images/customer-display-v20260812/trial-small-boss.png','trial-showcase-v20260813'],
            'rules':{'free_samples':3,'shipping_paid_by_customer':True,'seven_eleven':60,'postal':100,'limit':'每位顧客、電話及地址限申請一次','lead_time':'約5～7個工作天','apply_via':'LINE OA','price_30':'60元／罐；買10送1，11罐600元','price_180':'200元／包；買10送1，11包2,000元'}
          }
          m.setdefault('rules',{})['trial_fixed_to_current_master']=True
          m['rules']['customer_main_visual']='六張正式產品主圖只用於產品版位；六張詳細DM只用於DM版位；試喝版位固定使用使用者20260813最新指定正式試喝主圖'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          # Canonical authority.
          p=Path('data/formal-media-authority-v20260810.json'); a=json.loads(p.read_text())
          a['runtime']=VERSION
          a['approval_batch']='20260813-user-final-trial-poster-v1'
          a['trial']={
            'title':'龜鹿飲試喝組｜先試喝，再決定','render_mode':'poster','path':'/'+REL,
            'version':VERSION,'status':'approved_user_provided_final','format':'jpeg','dimensions':'1254x1254',
            'sha256':EXPECTED_SHA,'source':'user-upload-20260813-latest-approved-trial-poster',
            'do_not_use_as_product_image':True,'do_not_use_as_dm':True,'do_not_regenerate':True,
            'retired_trial_paths':['/images/customer-display-v20260812/trial.webp','/images/customer-display-v20260812/trial-clean-v4.svg','/images/customer-display-v20260812/trial-small-boss.webp','/images/customer-display-v20260812/trial-small-boss.jpg','/images/customer-display-v20260812/trial-small-boss.png'],
            'free':'3罐試喝品免費','shipping':['7-11店到店60元','郵局宅配100元'],'limit':'每位顧客、電話及地址限申請一次','lead_time':'接單後安排製作，約5～7個工作天出貨','order_channel':'所有試喝申請與正式下單皆在LINE OA完成','prices':{'30cc':'60元／罐；買10送1，11罐600元','180cc':'200元／包；買10送1，11包2,000元'}
          }
          a['image_rules']=[x for x in a.get('image_rules',[]) if '試喝' not in x or '產品' in x]
          a['image_rules'] += ['試喝類固定使用使用者20260813最新指定的正式試喝主圖','產品主圖、詳細DM、試喝主圖三個媒體角色禁止互換']
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')

          # Customer display runtime: no legacy trial component can override the new poster.
          p=Path('site-customer-display-v20260812.js'); s=p.read_text().replace('20260813-trial-product-role-fix-v8',VERSION)
          s=re.sub(r"const TRIAL=Object\.freeze\(\{.*?\}\);", "const TRIAL=Object.freeze({mode:'poster',path:'"+REL+"',retired:['images/customer-display-v20260812/trial.webp','images/customer-display-v20260812/trial-clean-v4.svg','images/customer-display-v20260812/trial-small-boss.webp','images/customer-display-v20260812/trial-small-boss.jpg','images/customer-display-v20260812/trial-small-boss.png']});", s, count=1, flags=re.S)
          s=re.sub(r"trialMode:TRIAL\.mode,\s*trialComponent:TRIAL\.id,\s*trialMascotSupport:`\$\{TRIAL\.mascot\}\?v=\$\{VERSION\}`,\s*trialProductImage:`\$\{TRIAL\.product\}\?v=\$\{VERSION\}`,", "trialMode:TRIAL.mode,\n      trialImage:`${TRIAL.path}?v=${VERSION}`,", s, count=1)
          s=s.replace('產品主圖／詳細DM／trial元件完全分開；180cc產品主圖不得使用DM；已知花圖trial二進位不得再進網站runtime','產品主圖／詳細DM／試喝主圖完全分開；試喝固定使用20260813使用者最新指定正式主圖；180cc產品主圖不得使用DM')
          p.write_text(s)

          # Formal media runtime: manifest path is the single trial authority.
          p=Path('site-formal-media-v20260810.js'); s=p.read_text().replace('20260813-trial-product-role-fix-v8',VERSION)
          s=re.sub(r"/\* trial\.html 自 v7 起.*?\n \}", "/* trial.html 固定使用 manifest.trial.path；不得由任何舊 trial binary / component 覆寫。 */\n if(/\\/trial\\.html$/.test(location.pathname)&&m.trial?.path){\n   const poster=document.querySelector('.trial-poster img');\n   if(poster){replace(poster,m.trial.path);document.documentElement.dataset.trialMediaMode='poster-v9';}\n }", s, count=1, flags=re.S)
          p.write_text(s)

          # Remove temporary chunks/trigger from the resulting commit.
          for q in Path('_tmp/trial-poster').glob('part-*.b64'): q.unlink()
          Path('_tmp/trial-poster/install-v9.trigger').unlink(missing_ok=True)
          print('installed',REL,hashlib.sha256(raw).hexdigest())
          PY
      - name: Validate product/DM/trial role separation
        run: |
          grep -q 'trial-poster-user-final-v20260813.jpg' trial.html
          grep -q 'guilu-drink-180cc-product.jpg' trial.html
          grep -q 'guilu-drink-30cc.avif' trial.html
          ! grep -q 'dm-approved-v20260810/guilu-drink-180cc.webp' trial.html
          python -m json.tool images/formal-display/manifest.json >/dev/null
          python -m json.tool data/formal-media-authority-v20260810.json >/dev/null
          node --check site-customer-display-v20260812.js
          node --check site-formal-media-v20260810.js
      - name: Commit website v9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trial.html images/trial/trial-poster-user-final-v20260813.jpg images/formal-display/manifest.json data/formal-media-authority-v20260810.json site-customer-display-v20260812.js site-formal-media-v20260810.js _tmp/trial-poster || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(trial): install latest user-approved trial poster v9'
          git push origin HEAD:main
