name: v297b apply trust copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply professional public copy
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')
          version = '297.1'
          replacements = {
            '這個適合我嗎？':'LINE 諮詢產品',
            '怎麼選龜鹿？':'LINE 比較產品',
            'LINE 幫我比較產品':'LINE 比較產品',
            '我想看龜鹿怎麼選，幫我整理一個方向。':'我想了解仙加味產品差異、規格與使用方式。',
            '我想知道哪一種龜鹿比較適合我。':'我想依使用方式與規格比較仙加味產品。',
            '我不知道怎麼選，請依我的使用習慣幫我比較產品。':'我想依使用習慣、產品型態與規格比較仙加味產品。',
            '不知道從哪一款開始？':'依使用情境比較產品',
            '還不確定從哪一款開始？':'需要協助比較產品？',
            '從平常怎麼使用，找到適合先了解的產品':'依日常使用方式比較產品型態',
            '這裡的用途方向是指產品如何放進日常飲食與生活，不是疾病治療用途。':'網站所稱用途方向，指產品型態、飲用方式與料理情境；健康相關問題請依專業人員建議。',
            '30cc適合輕巧攜帶；180cc適合一次飲用較完整容量。':'30cc玻璃瓶適合輕巧即飲；180cc鋁袋適合偏好較大容量的日常安排。',
            '先從好執行開始':'使用方式與保存資訊',
            '把實際步驟與保存方式理解清楚，買回去才知道怎麼使用。':'清楚整理沖泡、即飲、燉湯與保存方式，方便依產品型態安排。',
            '先解決常見疑問':'常見問題一次整理',
            '告訴我們偏好的使用方式與產品規格，我們協助整理比較方向。':'提供偏好的使用情境、產品規格與數量，我們協助整理產品差異與購買資訊。',
            '先從生活方式理解，再決定哪一種比較適合你，不需要一次看完全部。':'依使用情境、產品型態與規格比較，快速掌握各項產品差異。',
            '先看你平常比較接近哪一種生活方式，會比直接看一堆產品更清楚。':'從固定取用、方便即飲、沖泡燉湯、家庭大規格與自行調飲五個方向比較。',
            '不想自己慢慢比，也可以先看常見搭配方向，再透過 LINE 讓我們幫你整理。':'可先查看常見搭配方向，再透過官方 LINE 確認規格、使用方式與購買資訊。',
            '把型態、作息與日常安排理解清楚，會比一次追求太多更容易持續。':'依產品型態、使用方式與日常作息安排，讓產品資訊更清楚。',
            '不知道怎麼選也沒關係':'依使用情境比較產品',
            '直接跟我們說你的生活方式，我們幫你整理比較適合的方式。':'提供偏好的使用情境、規格與數量，我們協助整理產品差異與購買資訊。',
            '看六大產品':'查看產品系列',
            '第一次了解，可先從食補用途方向選，不一定要一次看完全部。':'可依使用情境、產品型態與規格比較，選擇符合日常安排的品項。',
            '價格、活動、購買與配送方式由官方 LINE 協助確認。':'價格、活動、付款與配送資訊請透過官方 LINE 取得最新確認。',
            '方便客人詢問時不會漏掉。':'完整呈現兩種規格，便於比較容量與使用情境。',
            '適合體驗、外出與工作空檔':'適合輕巧即飲、外出與工作空檔',
            '適合輕巧體驗、外出與工作空檔。':'適合輕巧即飲、外出與工作空檔。',
            '想方便即飲、外出攜帶、工作空檔或第一次了解龜鹿飲的人':'想方便即飲、外出攜帶或在工作空檔飲用的人',
            '適合第一次了解、外出攜帶或工作空檔，希望開瓶即可飲用的人。':'適合外出攜帶、工作空檔或偏好開瓶即飲的人。',
            '180cc容量較完整，適合居家或想一次安排一份龜鹿飲的人。':'180cc鋁袋適合偏好較大容量即飲或居家安排的人。',
            '30cc玻璃瓶適合體驗、外出與工作空檔；180cc鋁袋適合想一次安排一份龜鹿飲的人。':'30cc玻璃瓶適合輕巧即飲、外出與工作空檔；180cc鋁袋適合偏好較大容量即飲或居家安排。',
            '想大包裝、固定安排、家庭共用或長期備用的人':'想選擇家庭大規格、固定安排或家庭共用的人',
            '建議安排於早上或下午，避免接近睡前':'可依日常作息安排於早上或下午',
            '建議由少量開始，逐步找到自己的日常方式':'可依個人飲食習慣調整使用份量',
            '先看用途方向，再解決龜鹿食補常見問題':'龜鹿產品常見問題與使用資訊',
            '從產品怎麼選、食補用途、實際用法、保存與購買開始整理；健康與用藥問題再交由專業人員判斷。':'整理產品差異、規格、使用方式、保存、購買與配送資訊；涉及健康、用藥或特殊狀況，請以醫師、中醫師或藥師的專業判斷為準。',
            '第一次了解龜鹿食補，建議先看哪一款？':'如何依使用情境選擇產品？',
            '這裡的用途是指產品怎麼放進飲食與生活，不是疾病治療用途。':'網站所稱用途，指產品型態、飲用方式與料理情境；健康相關問題請依專業人員建議。',
            '可直接取用，也可取1～2小匙加入約100～300mL熱水化開，調至適合溫度後飲用。可依個人習慣安排於早上或下午，避免接近睡前。':'可直接取用，也可取1～2小匙加入約100～300mL熱水化開，調至適合溫度後飲用；可依日常作息安排於早上或下午。',
            '沒有所有人都適用的固定時間，重點是選擇容易持續、飲用起來舒服的安排。龜鹿膏可放在早上或下午；腸胃較敏感者可依個人情況安排在餐後。':'可依日常作息與飲食習慣安排。龜鹿膏可安排於早上或下午；其他產品可依食用方式與個人習慣調整。',
            '平常沒有特別不適，也可以安排龜鹿食補嗎？':'日常飲食中如何安排龜鹿食補？',
            '可以依自己的飲食習慣與生活節奏了解不同型態。有人選擇固定取用，有人偏好即飲、沖泡或燉湯；重點是選擇自己方便持續的方式。':'可依產品型態與日常飲食習慣安排：固定取用可看龜鹿膏、即飲可看龜鹿飲、沖泡或燉湯可看龜鹿湯塊與龜鹿膠、自行調飲可看鹿茸粉。',
            '網站所說的食補，是把龜鹿產品放進日常飲食、熱飲、沖泡與燉湯的安排，重點在產品型態與使用方式，不代表針對疾病或症狀的治療。':'網站所稱食補，是將龜鹿產品安排於日常飲食、熱飲、沖泡與燉湯，重點在產品型態、規格與一般使用方式。',
            '官網為什麼不直接公開價格？':'如何確認價格、活動與配送方式？',
            '官網先讓客人認識產品、用途方向、規格與使用方式；實際價格、活動、配送與付款，可透過官方 LINE 由客服協助確認。':'價格、活動、付款與配送會依產品規格及訂購方式確認，請透過官方 LINE 取得最新資訊。',
            '古籍主治或藥典規格不直接當作仙加味產品功效。':'古籍內容與藥典規格用於文化、品名與品質標準的理解，不作為產品效果說明。',
            '有疾病或症狀問題時，產品資訊應怎麼看？':'特殊健康狀況下，如何確認是否適合使用？',
            '官網與 LINE OA 可說明產品成分、用途方向、規格與一般使用方式；涉及疾病、症狀、孕哺、兒童、服藥或特殊體質，建議將產品標示提供給醫師、中醫師或藥師確認。':'官網與 LINE OA 提供產品成分、規格與一般使用方式；孕哺、兒童、用藥、慢性疾病、手術前後、過敏或特殊體質，建議將產品標示提供給醫師、中醫師或藥師確認。',
            '兩者用途不同，也都不能直接當成仙加味產品的療效證明。':'兩者用途不同，分別用於理解本草文化與品質標準；產品資訊仍以實際標示、規格與一般使用方式為準。',
            '古籍中的主治文字不直接轉寫成食品功效。':'古籍內容用於名稱、來源與本草文化背景。',
            '不是一般食品的療效證明。':'用於品質標準與檢驗方法的理解。',
            '不能直接把原藥材條目等同成品功效。':'應清楚區分原藥材、萃取原料與成品標示。',
            '本頁不把藥典條目轉寫成產品療效。':'本頁以品名、基原與品質規格的閱讀為主。',
            '不將古籍主治轉換成仙加味食品功效。':'引用內容保留原始條目脈絡，並與產品標示及一般使用資訊分開呈現。',
            '引用時不把藥品規格直接套用成食品功效。':'引用時以品質標準與檢驗方法的理解為主。',
            '<h2>不會怎麼使用</h2>':'<h2>引用原則</h2>',
            '不寫「藥典證明本產品有效」。':'藥典資料用於理解品質標準與檢驗方法。',
            '不把古籍主治直接變成食品療效宣稱。':'古籍內容用於名稱、來源與本草文化背景。',
            '不把粉光蔘直接等同所有人參條目。':'粉光蔘以西洋參相關正式資料核對。',
            '不把鹿茸與鹿角、龜甲與龜板萃取物混為一談。':'清楚區分鹿茸與鹿角、龜甲與龜板萃取物。',
            '仙加味不是把傳統說得更神祕，也不是用誇大的話替產品增加想像。品牌想做的是，把家族熟悉的龜鹿食補重新整理，讓客人能看懂原料、理解產品差異，知道買回家後應該怎麼安排。':'仙加味以清楚、可理解的方式整理家族熟悉的龜鹿食補，讓客人能看懂原料、理解產品差異，並掌握產品規格與日常使用方式。',
            '不把傳統只當成一句模糊的故事。':'以具體原料、規格與工序呈現家族經驗。',
            '<h3>產品用途不誇大</h3>':'<h3>產品資訊清楚有依據</h3>',
            '仙加味介紹的是傳統食補文化、產品型態、成分與一般使用方式；涉及疾病、症狀與用藥，交由醫師、中醫師或藥師判斷。':'仙加味清楚呈現產品型態、成分、規格與一般使用方式；涉及健康、用藥或特殊狀況，請以醫師、中醫師或藥師的專業判斷為準。',
            '從固定取用、方便即飲、熱水沖泡、家常燉湯到自行調飲，依不同生活方式整理產品，而不是要求每個人使用同一種方法。':'從固定取用、方便即飲、熱水沖泡、家常燉湯到自行調飲，依不同生活方式提供清楚的使用選擇。',
            '產品詢問先從 LINE 開始，也可以查看萬華門市':'官方 LINE 與萬華門市服務資訊',
            '先認識用途方向，再選擇做得到的方式。':'清楚認識產品型態、規格與使用方式。',
            '想了解產品用途方向、使用方式與搭配方向，歡迎透過官方 LINE 詢問。':'想了解產品規格、成分、使用方式與購買資訊，歡迎透過官方 LINE 詢問。'
          }

          files = list(root.glob('*.html')) + [root/'data.json', root/'site-v287-core.js', root/'site.js']
          for path in files:
            if not path.exists(): continue
            text = path.read_text(encoding='utf-8')
            for old, new in replacements.items():
              text = text.replace(old, new)
            text = re.sub(r'site\.css\?v=[^\"\']+', f'site.css?v={version}', text)
            text = re.sub(r'site\.js\?v=[^\"\']+', f'site.js?v={version}', text)
            text = re.sub(r"data\.json\?v=[^'\"]+", f'data.json?v={version}', text)
            text = re.sub(r"site-v287-core\.js\?v=[^'\"]+", f'site-v287-core.js?v={version}', text)
            path.write_text(text, encoding='utf-8')

          data_path = root/'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = version
          for p in data.get('products', []):
            if p.get('id') == 'guilu-gao':
              p['usage'] = ['每日可依個人習慣安排1～2次','每次取1～2小匙','可直接食用','或加入約100～300mL熱水化開','調至適合溫度後飲用','可依日常作息安排於早上或下午']
            elif p.get('id') == 'guilu-drink-30':
              p['fit'] = '想方便即飲、外出攜帶或在工作空檔飲用的人'
              p['purposeDirection'] = '適合外出攜帶、工作空檔或偏好開瓶即飲的人。'
            elif p.get('id') == 'guilu-jiao':
              p['fit'] = '想選擇家庭大規格、固定安排或家庭共用的人'
              p['purposeDirection'] = '適合熟悉龜鹿產品、偏好一斤大規格、家庭安排或搭配湯品的人。'
            elif p.get('id') == 'luerong-fen':
              p['usage'] = ['依個人習慣取適量鹿茸粉','加入溫開水、牛奶、豆漿或其他飲品','攪拌均勻後飲用','可依個人飲食習慣調整使用份量']
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          css_path = root/'site.css'
          css = css_path.read_text(encoding='utf-8')
          if '/* v297.1｜首頁品牌圖完整顯示 */' not in css:
            css += '''\n\n/* v297.1｜首頁品牌圖完整顯示 */\n.home-story-main .story-photo{display:block;width:100%;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center center!important;margin:0!important;border-radius:0!important;background:#f7f4ed}\n@media(max-width:1100px){.home-local-grid{grid-template-columns:1fr!important}.home-side-stack{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}}\n@media(max-width:760px){.home-side-stack{grid-template-columns:1fr}.home-story-main .story-photo{height:auto!important;min-height:0!important}}\n'''
          css_path.write_text(css, encoding='utf-8')

          # 將仍需人工留意的詞彙寫到 Actions log，不阻擋這次修正提交。
          check_terms = ['這個適合我嗎','不需要一次看完全部','不一定要一次看全部','不想自己慢慢比','一堆產品','避免接近睡前','腸胃較敏感','適合體驗','療效證明','食品功效','產品功效','官網為什麼不直接公開價格','平常沒有特別不適','長期備用']
          for path in files:
            if not path.exists(): continue
            text = path.read_text(encoding='utf-8')
            for term in check_terms:
              if term in text:
                print(f'REVIEW: {path} still contains {term}')

      - name: Remove internal and temporary public files
        shell: bash
        run: |
          find . -maxdepth 1 -type f \( -name 'LIVE_STATUS_*.json' -o -name 'UPLOAD_MAPPING_*.json' -o -name 'UPLOAD_MANIFEST_*.json' -o -name 'TMP_*.txt' -o -name '*更新報告*.md' -o -name '*檢查報告*.md' -o -name '*文案修正報告*.md' \) -print -delete
          rm -f .github/workflows/v296-home-responsive-image.yml
          rm -f .github/workflows/v297-trust-copy-audit.yml
          rm -f .github/workflows/v297b-apply-trust-copy.yml

      - name: Commit public-site cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v297.1: professionalize public copy and remove internal files"
          git push origin main
