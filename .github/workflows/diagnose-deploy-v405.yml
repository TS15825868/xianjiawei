name: Diagnose v405.1 Pages deployment

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  diagnose:
    if: github.event.issue.title == 'DIAG_DEPLOY_APPROVED_V405_1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment and report result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body -sS -X POST "${auth[@]}" \
            "${api}/actions/workflows/deploy-pages.yml/dispatches" -d '{"ref":"main"}'

          run_id=""
          for i in $(seq 1 50); do
            sleep 3
            runs="$(curl --fail-with-body -sS "${auth[@]}" "${api}/actions/workflows/deploy-pages.yml/runs?event=workflow_dispatch&per_page=10")"
            run_id="$(RUNS="$runs" STARTED="$started" python3 - <<'PY'
          import json,os
          for run in json.loads(os.environ['RUNS']).get('workflow_runs',[]):
              if run.get('created_at','') >= os.environ['STARTED']:
                  print(run['id']); break
          PY
          )"
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo 'DEPLOY_DIAG_FAILURE: run not found' > /tmp/report.txt
          else
            status='queued'; conclusion=''
            for i in $(seq 1 150); do
              run="$(curl --fail-with-body -sS "${auth[@]}" "${api}/actions/runs/${run_id}")"
              status="$(RUN="$run" python3 -c 'import json,os; print(json.loads(os.environ["RUN"])["status"])')"
              conclusion="$(RUN="$run" python3 -c 'import json,os; print(json.loads(os.environ["RUN"]).get("conclusion") or "")')"
              [ "$status" = completed ] && break
              sleep 4
            done
            jobs="$(curl --fail-with-body -sS "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")"
            RUN_ID="$run_id" STATUS="$status" CONCLUSION="$conclusion" JOBS="$jobs" python3 - <<'PY' > /tmp/report.txt
          import json,os
          print('DEPLOY_DIAG_RESULT')
          print('run_id:',os.environ['RUN_ID'])
          print('status:',os.environ['STATUS'])
          print('conclusion:',os.environ['CONCLUSION'] or 'none')
          for job in json.loads(os.environ['JOBS']).get('jobs',[]):
              print(f"job: {job['name']} | {job['conclusion']} | id={job['id']}")
              for step in job.get('steps',[]):
                  if step.get('conclusion') not in (None,'success','skipped'):
                      print(f"failed_step: {step['number']} {step['name']} | {step['conclusion']}")
          PY
            if [ "$conclusion" != success ]; then
              mkdir -p /tmp/runlogs
              if curl -L -sS "${auth[@]}" "${api}/actions/runs/${run_id}/logs" -o /tmp/logs.zip; then
                unzip -q /tmp/logs.zip -d /tmp/runlogs || true
                echo >> /tmp/report.txt
                echo 'errors:' >> /tmp/report.txt
                grep -R -i -E 'error|failed|failure|not found|assert' /tmp/runlogs 2>/dev/null | tail -n 80 >> /tmp/report.txt || true
              fi
            fi
          fi

          python3 - <<'PY'
          import json,os,urllib.request
          body=open('/tmp/report.txt',encoding='utf-8',errors='replace').read()[-50000:]
          data=json.dumps({'body':f'```\n{body}\n```'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",data=data,method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          urllib.request.urlopen(req).read()
          PY
