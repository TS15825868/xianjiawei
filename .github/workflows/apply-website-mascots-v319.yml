name: Apply website mascots v319

on:
  push:
    branches:
      - main
      - mascot-v319-fix
    paths:
      - APPLY_WEBSITE_MASCOTS_V319.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download high-resolution website mascot package
        run: |
          python3 -m pip install --quiet gdown pillow
          gdown --id 1Fo0MhGFyUhnQd14COzo3ZjkzPsl2JDOL -O /tmp/website-mascots.zip
          test $(wc -c < /tmp/website-mascots.zip) -gt 1000000
          unzip -t /tmp/website-mascots.zip

      - name: Install and verify high-resolution images
        run: |
          rm -rf /tmp/website-mascots
          mkdir -p /tmp/website-mascots images/brand
          unzip -o /tmp/website-mascots.zip -d /tmp/website-mascots
          find /tmp/website-mascots -type f -name 'xianjiawei-scene-*.jpg' -exec cp {} images/brand/ \;
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          names = ['welcome','products','guide','combo','usage','service','brand']
          for name in names:
              p = Path(f'images/brand/xianjiawei-scene-{name}.jpg')
              if not p.exists() or p.stat().st_size < 120000:
                  raise SystemExit(f'Image missing or too small: {p}')
              with Image.open(p) as im:
                  if im.width < 1200 or im.height < 900:
                      raise SystemExit(f'Image resolution too low: {p} {im.size}')
                  im.verify()
          PY

      - name: Restore individual scene mapping and cache version
        run: |
          cat > site-fix-v317.js <<'JS'
          "use strict";

          (() => {
            const SCENES = {
              home: "images/brand/xianjiawei-scene-welcome.jpg?v=319.0",
              products: "images/brand/xianjiawei-scene-products.jpg?v=319.0",
              choose: "images/brand/xianjiawei-scene-guide.jpg?v=319.0",
              combo: "images/brand/xianjiawei-scene-combo.jpg?v=319.0",
              guide: "images/brand/xianjiawei-scene-usage.jpg?v=319.0",
              recipes: "images/brand/xianjiawei-scene-usage.jpg?v=319.0",
              faq: "images/brand/xianjiawei-scene-service.jpg?v=319.0",
              contact: "images/brand/xianjiawei-scene-service.jpg?v=319.0",
              brand: "images/brand/xianjiawei-scene-brand.jpg?v=319.0"
            };

            function makeImage(page) {
              const image = document.createElement("img");
              image.src = SCENES[page] || SCENES.home;
              image.alt = "仙加味小老闆情境導覽";
              image.width = 1600;
              image.height = 1200;
              image.loading = page === "home" ? "eager" : "lazy";
              image.decoding = "async";
              Object.assign(image.style, {
                width: "100%",
                height: "auto",
                objectFit: "contain",
                display: "block",
                background: "#efe4d2"
              });
              image.addEventListener("error", () => {
                if (!image.dataset.fallback) {
                  image.dataset.fallback = "1";
                  image.src = SCENES.choose;
                }
              });
              return image;
            }

            function applyMascotFix() {
              const page = document.body?.dataset?.page || "home";
              const media = document.querySelector("#mascot-guide .mascot-guide-card__media");
              if (!media) return false;
              const expected = SCENES[page] || SCENES.home;
              const current = media.querySelector("img");
              if (!current || !current.getAttribute("src")?.includes(expected.split("?")[0])) {
                media.replaceChildren(makeImage(page));
              } else {
                current.src = expected;
                current.width = 1600;
                current.height = 1200;
                Object.assign(current.style, {
                  width: "100%",
                  height: "auto",
                  objectFit: "contain",
                  display: "block",
                  background: "#efe4d2"
                });
              }
              media.style.background = "#efe4d2";
              return true;
            }

            function installStyles() {
              if (document.getElementById("site-fix-v319-style")) return;
              const style = document.createElement("style");
              style.id = "site-fix-v319-style";
              style.textContent = `
                .mascot-guide-card__media{overflow:hidden;background:#efe4d2!important;display:block!important}
                .mascot-guide-card__media::after{display:none!important;content:none!important}
                .mascot-guide-card__media img{width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;object-fit:contain!important;object-position:center!important;display:block!important;filter:none!important;opacity:1!important;transform:none!important;image-rendering:auto!important}
                @media (max-width:760px){
                  .mascot-guide-card__media{height:auto!important;min-height:0!important}
                  .mascot-guide-card__copy{padding-bottom:5.5rem}
                  .floating-line-cta{right:.85rem;bottom:calc(.85rem + env(safe-area-inset-bottom));transform:scale(.92);transform-origin:right bottom}
                }
              `;
              document.head.appendChild(style);
            }

            function start() {
              installStyles();
              if (applyMascotFix()) return;
              const observer = new MutationObserver(() => {
                if (applyMascotFix()) observer.disconnect();
              });
              observer.observe(document.documentElement, {childList:true, subtree:true});
              window.setTimeout(() => { applyMascotFix(); observer.disconnect(); }, 10000);
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", start, {once:true});
            } else {
              start();
            }
          })();
          JS

          cat > site.js <<'JS'
          "use strict";

          // 網站使用獨立高解析度 JPG；保留龜鹿飲 30cc 玻璃瓶與 180cc 鋁袋兩種規格。
          document.write('<script src="site-core.js?v=319.0"><\/script>');
          document.write('<script src="site-fix-v317.js?v=319.0"><\/script>');
          JS

          node --check site-core.js
          node --check site-fix-v317.js
          node --check site.js

      - name: Commit high-resolution website mascots
        run: |
          rm -f APPLY_WEBSITE_MASCOTS_V319.txt
          rm -f .github/workflows/apply-website-mascots-v319.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修復網站小老闆模糊並恢復高解析度獨立情境圖 v319'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
