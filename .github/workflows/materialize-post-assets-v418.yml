name: 【暫停自動】官網22張正式貼文圖手動安裝 v418
run-name: 官網 v418｜手動解壓與驗證22張正式候選圖

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-post-assets-v418-manual
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and unzip 22 candidate images
        shell: bash
        run: |
          set -euo pipefail
          ZIP='staging/post-assets-v412/assets.zip'
          OUT='images/posts/approved-v418'
          test -s "$ZIP"
          unzip -tq "$ZIP"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -oq "$ZIP" -d "$OUT"
          cp images/posts/approved-v412/guilu-drink-trial-evergreen.jpg "$OUT/00-trial-evergreen.jpg"
          COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')"
          test "$COUNT" = '22'
          test -s "$OUT/manifest.json"
          test -s "$OUT/00-trial-evergreen.jpg"
          test -s "$OUT/01-work-rest.jpg"
          test -s "$OUT/21-rain-home-c.jpg"
          mkdir -p diagnostics
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dir = 'images/posts/approved-v418';
          const images = fs.readdirSync(dir).filter((name) => name.endsWith('.jpg')).sort();
          if (images.length !== 22) throw new Error(`expected 22 images, got ${images.length}`);
          const files = images.map((name) => {
            const data = fs.readFileSync(`${dir}/${name}`);
            if (data.length < 50000) throw new Error(`${name} is unexpectedly small: ${data.length}`);
            return { name, bytes: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex') };
          });
          const duplicateHashes = files.filter((file, index) => files.findIndex((item) => item.sha256 === file.sha256) !== index);
          const report = {
            status: 'success',
            version: 'v418',
            checked_at: new Date().toISOString(),
            directory: dir,
            image_count: images.length,
            files,
            exact_duplicate_count: duplicateHashes.length,
            owner_review_required: true,
            publish_posts: false,
            publishing_policy: 'Facebook and Instagram only after owner review; LINE VOOM manual',
          };
          fs.writeFileSync('diagnostics/post-assets-v418.json', JSON.stringify(report, null, 2) + '\n');
          console.log(report);
          NODE

      - name: Commit installed images and consume trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/approved-v418 diagnostics/post-assets-v418.json
          git rm -r --ignore-unmatch staging/post-assets-v418
          git commit -m 'assets(site): publish 22 official candidate post images v418'
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
