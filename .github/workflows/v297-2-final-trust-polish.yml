name: v297.2 final trust polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final public-copy polish
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')
          version = '297.2'
          replacements = {
            # FAQ 與產品規格
            '30cc適合輕巧體驗、外出與工作空檔；180cc適合想一次飲用較完整容量或居家方便安排的人。':'30cc適合輕巧即飲、外出與工作空檔；180cc適合偏好較大容量即飲或居家安排的人。',
            '建議由少量開始。':'可依個人飲食習慣調整使用份量。',
            '適合體驗':'適合輕巧即飲',

            # 資料來源與漢方百科
            '用於名稱、來源、採集、炮製與本草文化的歷史閱讀。引用時保留書名與條目脈絡，引用內容保留原始條目脈絡，並與產品標示及一般使用資訊分開呈現。':'用於名稱、來源、採集、炮製與本草文化的歷史閱讀；引用時保留書名與條目脈絡，並與產品標示及一般使用資訊分開呈現。',
            '《本草綱目》適合閱讀歷史名稱與本草文化；《臺灣中藥典》與《中華藥典》主要用於理解官方品質標準與檢驗規範。兩者用途不同，分別用於理解本草文化與品質標準；產品資訊仍以實際標示、規格與一般使用方式為準。':'《本草綱目》用於理解歷史名稱與本草文化；《臺灣中藥典》與《中華藥典》用於理解官方品質標準與檢驗規範。產品資訊仍以實際標示、規格與一般使用方式為準。',
            '用於整理古代名稱、部位、來源、採集與本草文化。古籍內容用於名稱、來源與本草文化背景。':'用於整理古代名稱、部位、來源、採集與本草文化背景。',
            '由食品藥物管理署編修，屬藥品品質標準與檢驗方法的重要技術規範；用於品質標準與檢驗方法的理解。':'由食品藥物管理署編修，屬藥品品質標準與檢驗方法的重要技術規範。',
            '現代常見名稱可能包含龜甲、龜板與加工原料名稱；引用時要明確區分，應清楚區分原藥材、萃取原料與成品標示。':'現代常見名稱可能包含龜甲、龜板與加工原料名稱；引用時應清楚區分原藥材、萃取原料與成品標示。',
            '以下對照用來協助查資料，不表示萃取物、原藥材與藥典品目完全等同。':'以下對照用於協助檢索；萃取物、原藥材與藥典品目仍應分別理解。',
            '現代萃取原料名稱與原藥材名稱不可直接視為同一規格':'現代萃取原料名稱與原藥材名稱應分別核對規格',
            '不可直接套用人參條目的全部內容':'查閱時以西洋參相關條目為主要對照',
            '資料更新：2026-07-08｜內容版本 v287':'資料更新：2026-07-09｜內容版本 v297.2',
            '"dateModified":"2026-07-08"':'"dateModified":"2026-07-09"',

            # 品牌故事：移除可能引起疑問或未經確認的精確日期與負面句型
            '後來因土地與環境條件改變，無法繼續自行養鹿，家族便把重心轉向更熟悉也更能長久累積的專業：':'隨著土地與環境條件轉變，家族將重心轉向更熟悉、也更能長久累積的專業：',
            '四代不是一句口號，而是一段由不同世代共同完成的過程。':'四代傳承，是一段由不同世代共同完成的過程。',
            '這一代留下的，不只是生意，更是「原料要看得懂、品質要負責」的基本態度。':'這一代留下了原料要看得懂、品質要負責的基本態度。',
            '第三代的重要任務，是在市場與環境快速變化的過程中，仍然守住家族熟悉的專業，不因求快而省略該做的細節。':'第三代在市場與環境快速變化的過程中，持續守住家族熟悉的專業、處理細節與成品穩定度。',
            '到了第四代，傳承不只是把原本的做法照著做，更要回答現代客人真正關心的問題：':'到了第四代，傳承也包含回應現代客人真正關心的問題：',
            '<p class="eyebrow">1978</p>\n      <h3>家族事業正式成立</h3>\n      <p>在前兩代累積的行口經驗、鹿角知識與工序基礎上，家族事業於1978年正式成立，持續深耕鹿角、山產原料與龜鹿相關製作。</p>':'<p class="eyebrow">家族事業</p>\n      <h3>從行口經驗走向專業經營</h3>\n      <p>在前兩代累積的行口經驗、鹿角知識與工序基礎上，家族逐步形成以鹿角、山產原料與龜鹿相關製作為核心的事業。</p>',
            '<p class="eyebrow">2008</p>\n      <h3>仙加味品牌正式成立</h3>\n      <p>「仙加味」正式成為面向消費者的品牌名稱。品牌希望保留傳統食補的核心，同時把產品資訊、使用方式與生活情境說得更清楚，讓傳統不只被保存，也能真正被使用。</p>':'<p class="eyebrow">仙加味品牌</p>\n      <h3>把家族經驗整理成清楚的品牌資訊</h3>\n      <p>「仙加味」成為面向消費者的品牌名稱，保留傳統食補的核心，同時把產品資訊、使用方式與生活情境整理得更清楚。</p>',

            # 食補搭配
            '固定取用與即飲、沖泡與燉湯、完整體驗及家庭大規格安排。':'固定取用與即飲、沖泡與燉湯、完整比較及家庭大規格安排。',
            '不是把產品堆在一起，而是依固定取用、方便即飲、沖泡燉湯與家庭大規格等生活情境整理。':'依固定取用、方便即飲、沖泡燉湯與家庭大規格等生活情境整理產品搭配。',
            '適合第一次完整了解仙加味不同產品型態，先比較固定、即飲、沖泡燉湯與自行調飲的差異。':'適合完整比較仙加味不同產品型態，掌握固定、即飲、沖泡燉湯與自行調飲的差異。',
            '把偏好的使用情境、產品與數量傳給我們，我們協助整理比較方向。':'提供偏好的使用情境、產品與數量，我們協助整理產品差異與購買資訊。',

            # 影片頁
            '想請你幫我整理適合了解的龜鹿產品。':'想了解龜鹿產品、規格與使用方式。',
            '>LINE 幫我整理<':'>LINE 諮詢產品<',
            '這裡不是直接替你做判斷，而是把公開內容整理成更容易瀏覽的入口。想看產品規格、成分與使用方式，建議回到產品頁與使用頁。':'本頁提供公開內容的分類入口；產品規格、成分與使用方式請以產品頁與使用頁為準。',
            '<p class="eyebrow">提醒</p>':'<p class="eyebrow">專業諮詢</p>',
            '<h2>個人狀況請先詢問專業人員</h2>':'<h2>特殊狀況請依專業建議</h2>',
            '若有孕哺、正在用藥或個人疑慮，建議先詢問專業醫師或藥師；也可以先透過官方 LINE 告訴我們想了解的產品，我們協助整理產品資訊。':'孕哺、用藥或其他特殊狀況，請以醫師、中醫師或藥師的專業建議為準；官方 LINE 可協助提供產品標示、規格與一般使用資訊。',
            '以下以分類方式整理，避免頁面過長。點擊後會開啟原影片。':'以下依分類呈現，點擊後會開啟原影片平台。',

            # 知識館
            '先認識每款產品的食補用途方向，再看成分、規格、實際使用與保存方式；古籍和藥典放在延伸閱讀，不搶走產品介紹的主線。':'先認識每款產品的用途方向、成分、規格、使用與保存方式；古籍與藥典資料另於延伸閱讀中清楚呈現。',
            '<h3>買回去怎麼安排</h3>':'<h3>產品怎麼使用</h3>',
            '第一次了解仙加味，可以照這三個步驟看，就不會被產品名稱或成分名稱弄混。':'可依以下三個步驟閱讀，快速掌握產品型態、成分與使用方式。',
            '成分百科會用產品標示與常見搭配的角度說明，不用艱深詞彙，也不使用誇張說法。':'成分百科以產品標示、正式名稱與常見搭配角度，使用清楚、可核對的文字整理。',
            '看完官網仍不確定，可以把你的生活習慣、想買的規格與使用方式傳到官方 LINE。':'需要進一步確認時，可將偏好的使用情境、規格與數量傳至官方 LINE。',
            '龜鹿食補的第一步不是先追求複雜說法，而是先理解產品型態、成分與用途方向：固定取用、即飲、沖泡燉湯、大規格或自行調飲。':'先理解產品型態、成分與用途方向：固定取用、即飲、沖泡燉湯、家庭大規格或自行調飲。',
            '<h3>交給專業人員判斷</h3>':'<h3>由專業人員提供建議</h3>',
            '<h3>沒有所有人都適用的最佳時間</h3>':'<h3>依日常作息安排使用時間</h3>',
            '不把「空腹最佳」當成固定規則；依產品標示、個人習慣與身體狀況安排，腸胃敏感者可改在餐後。':'使用時間以產品標示、日常作息、個人習慣與專業建議為準。',

            # 怎麼選
            '不用先猜哪一款比較好，先選固定取用、即飲、沖泡燉湯、大規格或自行搭配，再比較產品規格。':'可先依固定取用、即飲、沖泡燉湯、家庭大規格或自行搭配等使用方式，再比較產品規格。',
            '下面整理的是產品如何放進日常飲食與生活，讓你先找到容易執行的起點。':'以下依產品型態與使用方式整理，方便快速比較日常安排。',

            # 使用方式
            '龜鹿食補買回去怎麼用？從實際步驟開始':'龜鹿食補使用方式：從實際步驟開始',
            '把產品放進每天做得到的方式':'日常可安排的使用方式',
            '先理解實際做法與保存方式，再選擇最容易執行的使用情境。':'先理解實際做法與保存方式，再依日常習慣安排使用情境。',
            '龜鹿膏可依個人習慣安排於早上或下午；第一次使用時，可先從容易持續的時段開始。':'龜鹿膏可依個人習慣安排於早上或下午，並選擇固定、方便持續的時段。',
            '龜鹿膠為600g一斤裝，適合熟悉龜鹿產品、家庭固定備用或希望一次準備較大規格的人。':'龜鹿膠為600g一斤裝，適合熟悉龜鹿產品、家庭固定備用或偏好大規格安排的人。',
            '鹿茸粉可依個人習慣加入溫開水、牛奶、豆漿或其他飲品，並建議由少量開始。':'鹿茸粉可依個人習慣加入溫開水、牛奶、豆漿或其他飲品，並依飲食習慣調整使用份量。',
            '<p class="eyebrow">使用提醒</p>':'<p class="eyebrow">使用資訊</p>',
            '<h2>使用前先看這幾點</h2>':'<h2>飲用與保存重點</h2>',
            '<h3>第一次可先從少量開始</h3>':'<h3>依飲食習慣調整</h3>',
            '<h3>特殊狀況先詢問</h3>':'<h3>特殊狀況專業確認</h3>',
            '看完還是不確定怎麼使用？':'需要確認使用方式？',
            '告訴我們產品名稱、規格與你偏好的飲用或料理方式，我們協助整理一般使用資訊。':'提供產品名稱、規格與偏好的飲用或料理方式，我們協助整理一般使用資訊。',

            # 聯絡頁
            '<h2>可以直接詢問</h2>':'<h2>可詢問的服務項目</h2>',
            '<h2>補充說明</h2>':'<h2>服務說明</h2>',
            '加入後留言想了解的產品名稱、規格、使用方式或配送需求，我們會依問題協助整理。':'加入後提供產品名稱、規格、使用方式或配送需求，客服會依需求提供產品與訂購資訊。'
          }

          files = list(root.glob('*.html')) + [root/'data.json', root/'site-v287-core.js', root/'site.js']
          for path in files:
            if not path.exists():
              continue
            text = path.read_text(encoding='utf-8')
            for old, new in replacements.items():
              text = text.replace(old, new)
            text = re.sub(r'site\.css\?v=[^\"\']+', f'site.css?v={version}', text)
            text = re.sub(r'site\.js\?v=[^\"\']+', f'site.js?v={version}', text)
            text = re.sub(r"data\.json\?v=[^'\"]+", f'data.json?v={version}', text)
            text = re.sub(r"site-v287-core\.js\?v=[^'\"]+", f'site-v287-core.js?v={version}', text)
            path.write_text(text, encoding='utf-8')

          data_path = root/'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = version
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 顯示仍含負面或內部語氣的公開檔案，供 Actions log 檢查。
          terms = ['無法繼續','不因求快','不是一句口號','不是把產品堆在一起','不是直接替你做判斷','不搶走','不用先猜','就不會被','避免頁面過長','腸胃敏感者','完整體驗','輕巧體驗','內容版本 v287']
          for path in files:
            if not path.exists(): continue
            text = path.read_text(encoding='utf-8')
            for term in terms:
              if term in text:
                print(f'REVIEW: {path} -> {term}')

      - name: Remove workflow after completion
        run: rm -f .github/workflows/v297-2-final-trust-polish.yml

      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v297.2: finalize trustworthy professional public copy"
          git push origin main
