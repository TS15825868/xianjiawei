name: render-free-short2-archive

on:
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT
# This workflow is retained only as an archived technical experiment.
# The user explicitly rejected the articulated / cutout-style result as not matching
# the official small-boss character, companions, scene quality, and animation standard.
# It must never run automatically on push and must never feed the formal publishing pipeline.

jobs:
  render-archived-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install archived preview runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=10,<12'

      - name: Reconstruct archived mascot reference
        run: |
          test -s brand-character-spec.json
          for f in assets/reference/mascot-sprite-v20260816.part0 assets/reference/mascot-sprite-v20260816.part1 assets/reference/mascot-sprite-v20260816.part2 assets/reference/mascot-sprite-v20260816.part3 assets/reference/mascot-sprite-v20260816.part4; do test -s "$f"; done
          python tools/video_free/prepare_sprite.py

      - name: Render archived technical preview only
        run: |
          mkdir -p artifacts
          python tools/video_free/render_short2_v2.py --out artifacts/short2-opening-shop-preview-ARCHIVE-NOT-FOR-PUBLISH.mp4

      - name: Validate technical file only
        run: |
          python - <<'PY'
          import json, subprocess
          p='artifacts/short2-opening-shop-preview-ARCHIVE-NOT-FOR-PUBLISH.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=width,height,r_frame_rate','-show_entries','format=duration','-of','json',p],text=True)
          d=json.loads(raw)
          v=next(s for s in d['streams'] if 'width' in s)
          dur=float(d['format']['duration'])
          assert v['width']==720 and v['height']==1280, v
          assert 29.5 <= dur <= 30.5, dur
          print('ARCHIVE ONLY: technical container valid; NOT approved for publishing')
          PY

      - name: Upload archived artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-short2-ARCHIVE-NOT-FOR-PUBLISH
          path: artifacts/short2-opening-shop-preview-ARCHIVE-NOT-FOR-PUBLISH.mp4
          retention-days: 3
          if-no-files-found: error
