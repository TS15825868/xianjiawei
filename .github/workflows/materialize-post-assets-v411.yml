name: 正式貼文圖與長期試喝上線

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/post-assets-v411/READY'

permissions:
  contents: write

concurrency:
  group: materialize-post-assets-v411
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and install approved assets
        shell: bash
        run: |
          set -euo pipefail
          cat staging/post-assets-v411/part*.b64 | base64 --decode > /tmp/xjw-post-assets-v411.zip
          rm -rf images/posts/approved-v411
          mkdir -p images/posts/approved-v411
          unzip -q /tmp/xjw-post-assets-v411.zip -d images/posts/approved-v411
          test "$(find images/posts/approved-v411 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 22
          test -f images/posts/approved-v411/manifest.json
      - name: Apply website final policy
        run: node tools/finalize-trial-and-post-assets-v411.mjs
      - name: Verify website files
        shell: bash
        run: |
          node --check site.js
          grep -q '買10送1，共11罐500元' trial.html
          grep -q '00-trial-evergreen.jpg' trial.html
          ! grep -R -n -E '買10送2|共12罐500元|共12包2,000元' --include='*.html' --include='*.json' --include='*.txt' .
      - name: Commit verified website result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/approved-v411 trial.html index.html data.json site.js sitemap.xml llms.txt geo-data.json 2>/dev/null || true
          git add -u
          git rm -r --ignore-unmatch staging/post-assets-v411
          if git diff --cached --quiet; then
            echo 'No website changes.'
          else
            git commit -m 'feat(site): publish final evergreen trial and approved post assets v411'
            git push origin HEAD:main
          fi
