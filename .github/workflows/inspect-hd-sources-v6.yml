name: Inspect HD image sources v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hd-sources-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build source contact sheets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          sets={
            'dmapproved_png':[
              'images/dm-approved-v20260810/guilu-gao-100g.png',
              'images/dm-approved-v20260810/guilu-drink-30cc.png',
              'images/dm-approved-v20260810/guilu-drink-180cc.png',
              'images/dm-approved-v20260810/guilu-tangkuai-75g.png',
              'images/dm-approved-v20260810/guilu-jiao-600g.png',
              'images/dm-approved-v20260810/lurong-fen-75g.png'],
            'formal_display':[
              'images/formal-display/dm-guilu-gao.jpg','images/formal-display/dm-guilu-drink-30.jpg',
              'images/formal-display/dm-guilu-drink-180.jpg','images/formal-display/dm-guilu-tangkuai.jpg',
              'images/formal-display/dm-guilu-jiao.jpg','images/formal-display/dm-lurong-fen.jpg'],
            'dmv3':[
              'images/dm-v3/guilu-gao.jpg','images/dm-v3/guilu-drink-30.jpg','images/dm-v3/guilu-drink-180.jpg',
              'images/dm-v3/guilu-tangkuai.jpg','images/dm-v3/guilu-jiao.jpg','images/dm-v3/luerong-fen.jpg']
          }
          out=Path('source-review-v6'); out.mkdir(exist_ok=True)
          for label,paths in sets.items():
            thumbs=[]
            for p in paths:
              path=Path(p)
              if not path.exists():
                print('MISSING',p); continue
              im=Image.open(path).convert('RGB')
              print(label,p,im.size,path.stat().st_size)
              canvas=Image.new('RGB',(560,760),'white')
              fitted=ImageOps.contain(im,(540,680))
              canvas.paste(fitted,((560-fitted.width)//2,8))
              d=ImageDraw.Draw(canvas)
              d.text((12,694),path.name,fill='black')
              d.text((12,720),f'{im.width}x{im.height}  {path.stat().st_size} bytes',fill='black')
              thumbs.append(canvas)
            sheet=Image.new('RGB',(1120,2280),'#ddd')
            for i,im in enumerate(thumbs): sheet.paste(im,((i%2)*560,(i//2)*760))
            sheet.save(out/f'{label}.jpg',quality=94)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-review-v6
          path: source-review-v6
          retention-days: 1
