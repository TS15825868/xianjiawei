name: Inspect HD image sources v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hd-sources-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build source contact sheets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          sets={
            'dmv3':[
              'images/dm-v3/guilu-gao.jpg','images/dm-v3/guilu-drink-30.jpg','images/dm-v3/guilu-drink-180.jpg',
              'images/dm-v3/guilu-tangkuai.jpg','images/dm-v3/guilu-jiao.jpg','images/dm-v3/luerong-fen.jpg'],
            'dmfinal':[
              'images/dm-final/01_guilu-gao-100g-dm.jpg','images/dm-final/02_guilu-drink-30cc-dm.jpg',
              'images/dm-final/03_guilu-drink-180cc-dm.jpg','images/dm-final/04_guilu-tangkuai-75g-dm.jpg',
              'images/dm-final/05_guilu-jiao-600g-dm.jpg','images/dm-final/06_luerong-fen-75g-dm.jpg']
          }
          out=Path('source-review-v6'); out.mkdir(exist_ok=True)
          for label,paths in sets.items():
            thumbs=[]
            for p in paths:
              path=Path(p)
              if not path.exists():
                print('MISSING',p); continue
              im=Image.open(path).convert('RGB')
              print(label,p,im.size,path.stat().st_size)
              canvas=Image.new('RGB',(520,700),'white')
              fitted=ImageOps.contain(im,(500,620))
              canvas.paste(fitted,((520-fitted.width)//2,10))
              d=ImageDraw.Draw(canvas)
              d.text((12,642),path.name,fill='black')
              d.text((12,668),f'{im.width}x{im.height}  {path.stat().st_size} bytes',fill='black')
              thumbs.append(canvas)
            sheet=Image.new('RGB',(1040,2100),'#ddd')
            for i,im in enumerate(thumbs): sheet.paste(im,((i%2)*520,(i//2)*700))
            sheet.save(out/f'{label}.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-review-v6
          path: source-review-v6
          retention-days: 1
