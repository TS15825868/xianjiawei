name: 仙加味正式 DM 六張圖驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-approved-dm-v4086.yml"

permissions:
  contents: write

concurrency:
  group: xjw-approved-dm-v4086
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository DM files
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from PIL import Image
          manifest=json.loads(Path('images/dm-final/approved-dm-v4086-manifest.json').read_text())
          assert manifest['version']=='408.6'
          assert manifest['dimensions']==[1122,1402]
          assert len(manifest['files'])==6 and len(set(manifest['files']))==6
          page=Path('dm.html').read_text()
          results=[]
          for name in manifest['files']:
            file=Path('images/dm-final')/name
            assert file.exists() and file.stat().st_size>100000, name
            with Image.open(file) as image:
              assert list(image.size)==manifest['dimensions'], (name,image.size)
            assert page.count(f'images/dm-final/{name}?v=408.7')>=2, name
            results.append({'name':name,'bytes':file.stat().st_size,'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          assert page.count('class="dm-image-v2"')==6
          Path('/tmp/dm-files.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Verify GitHub Pages production
        shell: bash
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/dm-live.html -w '%{http_code}' "https://ts15825868.github.io/xianjiawei/dm.html?t=$(date +%s)" || true)
            if [ "$code" = "200" ] && grep -q '01_guilu-gao-100g-dm.jpg?v=408.7' /tmp/dm-live.html && grep -q '06_guilu-jiao-600g-dm.jpg?v=408.7' /tmp/dm-live.html; then ok="1"; break; fi
            sleep 10
          done
          test "$ok" = "1"
          for name in 01_guilu-gao-100g-dm.jpg 02_guilu-drink-30cc-dm.jpg 03_guilu-drink-180cc-dm.jpg 04_luerong-fen-75g-dm.jpg 05_guilu-tangkuai-75g-dm.jpg 06_guilu-jiao-600g-dm.jpg; do
            code=$(curl -L -sS -o "/tmp/${name}" -w '%{http_code}' "https://ts15825868.github.io/xianjiawei/images/dm-final/${name}?v=408.7")
            test "$code" = "200"
            test -s "/tmp/${name}"
          done
      - name: Record verification
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          files=json.load(open('/tmp/dm-files.json'))
          result={
            'ok':True,
            'verifiedAt':datetime.now(timezone.utc).isoformat(),
            'commit':os.environ['GITHUB_SHA'],
            'manifestVersion':'408.6',
            'pageAssetVersion':'408.7',
            'dimensions':[1122,1402],
            'fileCount':6,
            'livePage':'https://ts15825868.github.io/xianjiawei/dm.html',
            'files':files
          }
          open('dm-v4086-live-verification.json','w').write(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name actions
          git config user.email actions@github.com
          git add dm-v4086-live-verification.json
          git commit -m "chore: record approved DM v4086 production verification" || exit 0
          git push