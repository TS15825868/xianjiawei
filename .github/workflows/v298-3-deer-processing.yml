name: v298.3 deer processing history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clarify deer-product processing history
        shell: python
        run: |
          from pathlib import Path

          path = Path('brand.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '品牌故事｜仙加味四代鹿角工序與萬華傳承': '品牌故事｜仙加味四代鹿類原料加工與萬華傳承',
            '從曾祖父開創、祖父鹿角伯、父親第三代，到第四代仙加味，延續萬華四代鹿角工序與龜鹿食補文化。': '從曾祖父開創、祖父鹿角伯、父親第三代，到第四代仙加味，延續萬華四代鹿類原料加工、代工與龜鹿食補文化。',
            '四代家人一路與鹿角、龜鹿熬製及傳統食補文化打交道，從早年的行口買賣、坪林養鹿，到後來專注於原料挑選、切料分級、代工加工與熬膠工序': '四代家人一路與鹿角、鹿茸、鹿鞭等鹿類原料與產品，以及龜鹿熬製和傳統食補文化打交道，從早年的行口買賣、坪林養鹿，到後來專注於生鮮原料與乾品的挑選、處理、分級、代工加工與熬膠工序',
            '家族也曾在坪林山林親手建立鹿場，從飼養、觀察到鹿角處理，對鹿的生長與鹿角原料有更直接的認識。隨著土地與環境條件轉變，家族將重心轉向更熟悉、也更能長久累積的專業：鹿角挑選、切料分級、原料處理、代工加工與龜鹿熬製。': '家族也曾在坪林山林親手建立鹿場，從飼養、觀察到鹿類原料處理，對鹿的生長與相關原料有更直接的認識。隨著土地與環境條件轉變，家族將重心轉向更熟悉、也更能長久累積的專業：鹿角、鹿茸、鹿鞭等鹿類原料與產品，包含生鮮原料與乾品的挑選、處理、分級、代工與加工，以及龜鹿熬製。',
            '從山產原料、鹿角處理到龜鹿相關代工與加工，一步一步累積實務經驗。長年熟悉鹿角挑選、處理、切料與分級': '從山產原料，到鹿角、鹿茸、鹿鞭等鹿類原料與產品的處理，以及龜鹿相關代工與加工，一步一步累積實務經驗。長年熟悉生鮮原料與乾品的挑選、處理、切料、分級與加工',
            '協助原料處理、鹿角工序、代工加工與日常營運': '協助鹿角、鹿茸、鹿鞭等鹿類原料與產品的生鮮及乾品處理、代工加工與日常營運',
            '山產原料、鹿角處理、龜鹿相關代工與加工': '山產原料，以及鹿角、鹿茸、鹿鞭等鹿類原料與產品的生鮮、乾品處理及龜鹿相關代工加工',
            '協助祖父處理原料、鹿角工序、代工加工與日常營運': '協助祖父處理鹿角、鹿茸、鹿鞭等鹿類原料與產品的生鮮、乾品加工，以及日常營運',
            '持續深耕鹿角、山產原料、龜鹿相關代工與加工': '持續深耕鹿角、鹿茸、鹿鞭等鹿類原料與產品的生鮮、乾品處理，以及山產原料與龜鹿相關代工加工',
            '持續以原料處理、代工加工與龜鹿相關製作為核心': '持續以鹿類原料與產品的生鮮、乾品處理、代工加工及龜鹿相關製作為核心',
            '延續家族對鹿角、龜板、切料、分級與熬製過程的重視': '延續家族對鹿類原料、龜板、切料、分級、加工與熬製過程的重視',
            'site.css?v=298.2': 'site.css?v=298.3',
            'site.js?v=298.2': 'site.js?v=298.3'
          }

          for old, new in replacements.items():
            text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/v298-3-deer-processing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.3: clarify fresh and dried deer-product processing history"
          git push origin main
