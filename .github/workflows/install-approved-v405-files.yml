name: Install approved website mascot files v405.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-approved-v405-files
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install the 15 approved images and page configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/install-approved-v405.yml').read_text(encoding='utf-8').splitlines()
          blocks=[]
          i=0
          while i < len(source):
              if source[i].strip() == "python3 - <<'PY'":
                  start=i+1
                  i=start
                  while i < len(source) and source[i].strip() != 'PY':
                      i+=1
                  raw='\n'.join(source[start:i])
                  blocks.append(textwrap.dedent(raw))
              i+=1
          if len(blocks) < 2:
              raise SystemExit(f'installer Python blocks missing: {len(blocks)}')
          for number in (0,1):
              exec(compile(blocks[number], f'approved-installer-block-{number+1}', 'exec'), {'__name__':'__main__'})
          PY

          rm -f temp-test.txt __DO_NOT_COMMIT_TEST__ approved-v405-assets.json
          rm -f mascot-v404.js site-v404.css images/brand/website-mascot-manifest.json
          rm -f images/brand/website-mascot-*.jpg
          rm -rf images/brand/mascot-v404 tmp-v405-bundle tmp-v405-chunks tmp-v405-chunks16 tmp-v405q15chunks

          node --check approved-mascot-v405.js
          test "$(find images/brand/approved-v405 -maxdepth 1 -type f | wc -l)" -eq 15
          grep -q '405.1' site.js
          grep -q 'product-guilu-drink-180cc.html' choose.html
          ! test -e mascot-v404.js
          ! test -e images/brand/mascot-v404

      - name: Commit website files directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No website file changes to commit.'
            exit 0
          fi
          git commit -m "正式安裝15張核准官網小老闆圖並清理舊素材 v405.1"
          git pull --rebase origin main
          git push origin HEAD:main
