name: Run v408 now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'RUN_V408_NOW'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install and consolidate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          rm -rf /tmp/xjw-p /tmp/xjw-d
          mkdir -p /tmp/xjw-p /tmp/xjw-d images/products-v3 images/dm-final
          base64 -d _upload/products-v408.zip.b64 > /tmp/p.zip
          base64 -d _upload/dm-v408.zip.b64 > /tmp/d.zip
          unzip -q /tmp/p.zip -d /tmp/xjw-p
          unzip -q /tmp/d.zip -d /tmp/xjw-d
          cp -f /tmp/xjw-p/products-v3/*.webp images/products-v3/
          cp -f /tmp/xjw-d/dm-final/*.webp images/dm-final/

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          V='408.0'
          M={
          'images/products-v3/guilu-gao.jpg':'images/products-v3/guilu-gao.webp',
          'images/products-v3/guilu-drink-30.jpg':'images/products-v3/guilu-drink-30.webp',
          'images/products-v3/guilu-drink-180.jpg':'images/products-v3/guilu-drink-180.webp',
          'images/products-v3/guilu-tangkuai.jpg':'images/products-v3/guilu-tangkuai.webp',
          'images/products-v3/guilu-jiao.jpg':'images/products-v3/guilu-jiao.webp',
          'images/products-v3/luerong-fen.jpg':'images/products-v3/luerong-fen.webp',
          'images/dm-final/01_guilu-gao-100g-dm.jpg':'images/dm-final/01_guilu-gao-100g-dm.webp',
          'images/dm-final/02_guilu-drink-30cc-dm.jpg':'images/dm-final/02_guilu-drink-30cc-dm.webp',
          'images/dm-final/03_guilu-drink-180cc-dm.jpg':'images/dm-final/03_guilu-drink-180cc-dm.webp',
          'images/dm-final/04_luerong-fen-75g-dm.jpg':'images/dm-final/04_luerong-fen-75g-dm.webp',
          'images/dm-final/05_guilu-tangkuai-75g-dm.jpg':'images/dm-final/05_guilu-tangkuai-75g-dm.webp',
          'images/dm-final/06_guilu-jiao-600g-dm.jpg':'images/dm-final/06_guilu-jiao-600g-dm.webp'}
          ver=re.compile(r'(\.(?:css|js|json|jpg|jpeg|png|webp))\?v=[0-9.]+')
          for p in list(Path('.').glob('*.html'))+list(Path('.').glob('*.js'))+list(Path('.').glob('*.json')):
              s=p.read_text(encoding='utf-8')
              for a,b in M.items(): s=s.replace(a,b)
              s=ver.sub(lambda m:m.group(1)+f'?v={V}',s)
              p.write_text(s,encoding='utf-8')

          core=Path('site-core.js').read_text(encoding='utf-8')
          masc=Path('approved-mascot-v405.js').read_text(encoding='utf-8')
          core=re.sub(r'data\.json\?v=[0-9.]+',f'data.json?v={V}',core)
          masc=re.sub(r'const VERSION = "[0-9.]+";',f'const VERSION = "{V}";',masc)
          masc=re.sub(r'^"use strict";\s*','',masc)
          Path('site.js').write_text('"use strict";\n\n/* 網站核心整合版 v408.0 */\n'+core.strip()+'\n\n/* 15張核准小老闆配置 */\n'+masc.strip()+'\n',encoding='utf-8')

          css=Path('site.css').read_text(encoding='utf-8').rstrip()
          css+='\n\n/* 手機與清晰度修正（已整合） */\n'+Path('site-v321.css').read_text(encoding='utf-8').strip()
          css+='\n\n/* 15張核准小老闆樣式（已整合） */\n'+Path('site-v405.css').read_text(encoding='utf-8').strip()+'\n'
          Path('site.css').write_text(css,encoding='utf-8')

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*<link[^>]+href="site-v(?:321|405)\.css[^>]*>\s*','\n',s)
              s=re.sub(r'\s*<script[^>]+src="(?:site-core|approved-mascot-v405)\.js[^>]*></script>\s*','\n',s)
              s=re.sub(r'site\.css\?v=[0-9.]+',f'site.css?v={V}',s)
              s=re.sub(r'site\.js\?v=[0-9.]+',f'site.js?v={V}',s)
              p.write_text(s,encoding='utf-8')

          Path('deploy-version.json').write_text(json.dumps({
            'version':V,'updated':'2026-07-13','catalog':'five-types-six-specifications',
            'productAssets':'six-latest-product-images-1122x1402-webp',
            'dmAssets':'six-latest-dm-images-1122x1402-webp',
            'frontend':'single-site-js-and-single-site-css',
            'mascot':'15-approved-distinct-website-scenes'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -f site-core.js approved-mascot-v405.js site-v321.css site-v405.css
          rm -f images/products-v3/guilu-gao.jpg images/products-v3/guilu-drink-30.jpg images/products-v3/guilu-drink-180.jpg
          rm -f images/products-v3/guilu-tangkuai.jpg images/products-v3/guilu-jiao.jpg images/products-v3/luerong-fen.jpg
          rm -f images/dm-final/*.jpg images/test-binary.webp
          rm -rf _upload
          rm -f .github/workflows/apply-product-assets-v408.yml .github/workflows/run-v408-now.yml .github/workflows/trigger-v408-once.yml

          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          test "$(find images/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          for f in images/products-v3/guilu-{gao,drink-30,drink-180,tangkuai,jiao}.webp images/products-v3/luerong-fen.webp images/dm-final/*.webp; do
            identify -format '%w %h' "$f" | grep -qx '1122 1402'
          done
          grep -q 'images/products-v3/guilu-gao.webp?v=408.0' data.json
          grep -q 'images/dm-final/03_guilu-drink-180cc-dm.webp?v=408.0' dm.html
          for p in product-guilu-gao.html product-guilu-drink-30cc.html product-guilu-drink-180cc.html product-guilu-tangkuai.html product-guilu-jiao.html product-luerong-fen.html; do
            grep -Eq 'images/products-v3/[^" ]+\.webp\?v=408\.0' "$p"
            grep -Eq 'images/dm-final/[^" ]+\.webp\?v=408\.0' "$p"
          done

          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy 仙加味網站
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: main
                - name: Verify v408.0
                  run: |
                    set -euo pipefail
                    node --check site.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool deploy-version.json >/dev/null
                    grep -q '"version": "408.0"' deploy-version.json
                    test ! -e site-core.js
                    test ! -e site-v321.css
                    test ! -d _upload
                    test "$(find images/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
                    grep -q 'images/products-v3/guilu-gao.webp?v=408.0' data.json
                    grep -q 'images/dm-final/03_guilu-drink-180cc-dm.webp?v=408.0' dm.html
                - name: Prepare static site
                  run: |
                    rm -rf _site && mkdir _site
                    rsync -a ./ _site/ --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='tools/' --exclude='node_modules/' --exclude='*.zip' --exclude='*.b64' --exclude='*.md'
                    touch _site/.nojekyll
                    test -s _site/index.html
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          sed -i 's/^          //' .github/workflows/deploy-pages.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '更新六項產品圖與DM並整合前端檔案 v408.0'
          git push origin HEAD:main
