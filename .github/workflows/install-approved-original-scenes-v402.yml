name: Install approved original website scenes v402.0

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  install:
    if: github.event_name != 'issues' || github.event.issue.title == 'install approved original website scenes v402.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download package
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 "https://drive.google.com/uc?export=download&id=1Z3K1c6uMMIFTYcmR2uu21BQbaujVKC_i&confirm=t" -o /tmp/scenes.zip
          unzip -t /tmp/scenes.zip
      - name: Install and verify
        run: |
          set -euo pipefail
          unzip -o /tmp/scenes.zip -d .
          for f in home products choose combo guide recipes faq contact brand dm video knowledge hanfang-baike sources; do
            test -s "images/brand/website-mascot-${f}.png"
            file "images/brand/website-mascot-${f}.png" | grep -q 'PNG image data'
          done
          test -s images/hero/home-brand-guilu-series.jpg
          grep -q 'const VERSION = "402.0"' site-fix-v317.js
          grep -q 'approved-original-scene' images/brand/website-mascot-manifest.json
          rm -f .approved-scene-install-trigger .approved-scene-install-trigger-2 .approved-scene-install-trigger-3
          rm -f .github/workflows/install-approved-original-scenes-v402.yml
      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網全站改用核准原圖場景 v402.0"
          git push origin main
      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "核准原圖場景已安裝完成。"
