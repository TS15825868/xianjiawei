name: 仙加味官網目前正式版驗收後自清理

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-current-site-validation.yml'

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require every current website layer to pass
        run: |
          python tools/validate-site-release.py
          python tools/validate-public-customer-pages-v20260809.py
          python tools/validate-visual-cohesion-v20260809.py
          python tools/validate_public_aio_seo.py
          python tools/validate-public-boundary-v20260808.py
          python tools/validate-publishing-content-match-v20260809.py
          for file in site.js site-core-v410.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-public-content-cleanup-v20260809.js site-public-image-retirement-v20260812.js site-mascot-placement-v20260812.js site-stability-v20260814.js publishing-center-guardian.js; do
            node --check "$file"
          done
      - name: Remove temporary audit files only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            .github/workflows/one-shot-current-site-diagnostics.yml \
            data/site-validation-diagnostic.json \
            .github/workflows/one-shot-current-site-validation.yml \
            .github/workflows/one-shot-fix-current-validator-context.yml \
            .github/workflows/one-shot-clean-current-site-validation.yml; do
            if [ -e "$file" ]; then git rm "$file"; fi
          done
          git commit -m 'chore(site): remove completed temporary validation workflows'
          git pull --rebase origin main
          git push origin HEAD:main
