name: Apply approved DM final v408.5

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-dm-final-v4085
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_APPROVED_DM_FINAL_V408_5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Rebuild the verified approved archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPO}/issues/97/comments" > /tmp/comments.json
          python3 - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path
          pages=json.loads(Path('/tmp/comments.json').read_text())
          comments=[]
          for page in pages:
              comments.extend(page)
          parts={}
          total=None
          for item in comments:
              body=item.get('body') or ''
              m=re.match(r'^V408_CHUNK\s+(\d+)/(\d+)\n([A-Za-z0-9+/=\n\r]+)$',body)
              if not m:
                  continue
              idx,count=int(m.group(1)),int(m.group(2))
              total=count if total is None else total
              if count != total:
                  raise SystemExit('chunk total mismatch')
              parts[idx]=''.join(m.group(3).split())
          if total != 36 or set(parts) != set(range(1,37)):
              raise SystemExit(f'incomplete chunks: total={total}, found={sorted(parts)}')
          raw=base64.b64decode(''.join(parts[i] for i in range(1,37)),validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='ebea7dfca7c8e6672c72a26dab51fba60013b45f886abe424f32f9035822bff7'
          if digest != expected:
              raise SystemExit(f'archive hash mismatch: {digest}')
          Path('/tmp/v408-assets.zip').write_bytes(raw)
          print('archive verified',len(raw),digest)
          PY
          rm -rf /tmp/v408-assets
          mkdir -p /tmp/v408-assets
          unzip -q /tmp/v408-assets.zip -d /tmp/v408-assets

      - name: Install and verify the six approved DM images
        run: |
          set -euo pipefail
          mkdir -p images/dm-final
          test "$(find /tmp/v408-assets/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          for f in /tmp/v408-assets/dm-final/*.webp; do
            identify -format '%w %h' "$f" | grep -qx '1122 1402'
            test "$(stat -c%s "$f")" -gt 50000
          done
          cp -f /tmp/v408-assets/dm-final/*.webp images/dm-final/
          python3 tools/apply_dm_v4085_final.py

      - name: Remove old and temporary files
        run: |
          rm -f images/dm-final/01_guilu-gao-100g-dm.jpg
          rm -f images/dm-final/02_guilu-drink-30cc-dm.jpg
          rm -f images/dm-final/03_guilu-drink-180cc-dm.jpg
          rm -f images/dm-final/04_luerong-fen-75g-dm.jpg
          rm -f images/dm-final/05_guilu-tangkuai-75g-dm.jpg
          rm -f images/dm-final/06_guilu-jiao-600g-dm.jpg
          rm -rf _upload
          rm -f .github/workflows/test-drive-download.yml
          rm -f .github/workflows/report-approved-dm-v4085.yml
          rm -f .github/workflows/apply-approved-dm-binary-v4085.yml
          rm -f .github/workflows/apply-approved-dm-v4085-final.yml
          rm -f tools/apply_dm_v4085_final.py

      - name: Final validation
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.5"' deploy-version.json
          grep -q '仙加味網站核心｜整合正式版 v408.5' site.js
          grep -q "const detailImage = p.image" site.js
          test "$(find images/dm-final -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
          test "$(find images/dm-final -maxdepth 1 -name '*-dm.jpg' | wc -l)" -eq 0
          for f in images/dm-final/*.webp; do
            identify -format '%w %h' "$f" | grep -qx '1122 1402'
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(data['products'])==6
          for p in data['products']:
              assert p['image'].startswith('images/products-v3/')
              assert p['dmImage'].startswith('images/dm-final/') and p['dmImage'].endswith('.webp?v=408.5')
              assert p['detailImages']==[p['dmImage']]
          dm=Path('dm.html').read_text(encoding='utf-8')
          assert dm.count('class="dm-image-v2"')==6
          assert dm.count('.webp?v=408.5')>=12
          PY

      - name: Commit the actual approved DM files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '實際替換六張核准正式DM圖檔 v408.5'
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.5_APPROVED_DM_FINAL_SUCCESS｜已由36段驗證素材重建完整壓縮檔（SHA-256核對通過），六張1122×1402核准DM已實際替換並提交到main。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
