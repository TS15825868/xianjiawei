name: Clear LINE buttons site-wide v406.1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_LINE_BUTTONS_V406_1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update every LINE CTA and audit all buttons
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          core = Path('site-core.js')
          s = core.read_text(encoding='utf-8')
          replacements = {
            "'看產品': 'LINE 詢問產品'": "'看產品': '前往 LINE 詢問產品'",
            "'直接下單': 'LINE 下單'": "'直接下單': '前往 LINE 下單'",
            "'幫我推薦': 'LINE 幫我推薦'": "'幫我推薦': '前往 LINE 請我推薦'",
            "'搭配組合': 'LINE 詢問搭配'": "'搭配組合': '前往 LINE 詢問搭配'",
            "'怎麼使用': 'LINE 詢問用法'": "'怎麼使用': '前往 LINE 詢問用法'",
            "'價格方案': 'LINE 詢問價格'": "'價格方案': '前往 LINE 詢問價格'",
            "'品牌故事': 'LINE 詢問品牌'": "'品牌故事': '前往 LINE 詢問品牌'",
            "'人工客服': 'LINE 聯絡客服'": "'人工客服': '前往 LINE 聯絡客服'",
            "'料理搭配': 'LINE 詢問搭配'": "'料理搭配': '前往 LINE 詢問料理搭配'",
            "return `LINE 詢問${productName}`;": "return `前往 LINE 詢問${productName}`;",
            "return `LINE 詢問${productName}用法`;": "return `前往 LINE 詢問${productName}用法`;",
            "return 'LINE 選擇數量';": "return '前往 LINE 選擇數量';",
            "return 'LINE 加入購物車';": "return '前往 LINE 加入購物車';",
            "return 'LINE 詢問搭配';": "return '前往 LINE 詢問搭配';",
            "return 'LINE 選擇組數';": "return '前往 LINE 選擇組數';",
            "return 'LINE 加入組合';": "return '前往 LINE 加入組合';",
            "`LINE ${cleaned}`": "`前往 LINE ${cleaned}`",
            ": 'LINE 詢問產品';": ": '前往 LINE 詢問產品';",
            "aria-label=\"官方 LINE｜${visibleLabel}\"": "aria-label=\"將開啟官方 LINE｜${visibleLabel}\" title=\"將開啟官方 LINE\"",
            "link.setAttribute('aria-label', `官方 LINE｜${visibleLabel}`);": "link.setAttribute('aria-label', `將開啟官方 LINE｜${visibleLabel}`);\n  link.setAttribute('title', '將開啟官方 LINE');",
            "el.setAttribute('aria-label', `官方 LINE｜${visibleLabel}`);": "el.setAttribute('aria-label', `將開啟官方 LINE｜${visibleLabel}`);\n    el.setAttribute('title', '將開啟官方 LINE');",
            "visibleLabel.replace(/^LINE\\s*/, '')": "visibleLabel.replace(/^前往\\s+LINE\\s*/, '')"
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          core.write_text(s, encoding='utf-8')

          css = Path('site.css')
          s = css.read_text(encoding='utf-8')
          s = re.sub(r'--linegreen:\s*#[0-9A-Fa-f]{6};', '--linegreen:#06C755;', s)
          if 'rgba(6,199,85' not in s:
            s = s.replace('box-shadow:none;\n}', 'box-shadow:0 8px 20px rgba(6,199,85,.22);\n}', 1)
          css.write_text(s, encoding='utf-8')

          # Make the pre-JavaScript fallback wording explicit on every static LINE link.
          for p in Path('.').glob('*.html'):
            text = p.read_text(encoding='utf-8')
            def repl(m):
              attrs, label = m.group(1), m.group(2).strip()
              if 'data-line-url' not in attrs and 'line.me/' not in attrs and 'lin.ee/' not in attrs:
                return m.group(0)
              if label.startswith('前往 LINE'):
                new = label
              elif 'LINE' in label:
                new = '前往 ' + label
              elif label in {'直接詢問','我要詢問','詢問客服','詢問產品','聯絡客服'}:
                new = '前往 LINE 詢問'
              elif label:
                new = '前往 LINE｜' + label
              else:
                new = '前往 LINE 詢問'
              if 'title=' not in attrs:
                attrs += ' title="將開啟官方 LINE"'
              return '<a' + attrs + '>' + new + '</a>'
            text = re.sub(r'<a([^>]*(?:data-line-url|line\.me/|lin\.ee/)[^>]*)>([^<]*)</a>', repl, text)
            p.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re, sys
          core = Path('site-core.js').read_text(encoding='utf-8')
          css = Path('site.css').read_text(encoding='utf-8')
          assert '--linegreen:#06C755;' in css
          assert '前往 LINE 詢問產品' in core
          assert '前往 LINE 下單' in core
          assert '前往 LINE 請我推薦' in core
          bad=[]
          total=0
          for p in Path('.').glob('*.html'):
            text=p.read_text(encoding='utf-8')
            for m in re.finditer(r'<a([^>]*(?:data-line-url|line\.me/|lin\.ee/)[^>]*)>([^<]*)</a>', text):
              total += 1
              label=m.group(2).strip()
              if 'LINE' not in label:
                bad.append(f'{p}:{label}')
          print(f'LINE_LINKS_AUDITED={total}')
          if bad:
            print('\n'.join(bad))
            sys.exit('LINE link label audit failed')
          print('LINE_BUTTON_AUDIT_OK')
          PY

      - name: Commit directly to main
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-dm-and-line-buttons-v406.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '全站LINE按鈕改為明確文字與LINE綠色 v406.1'
          git push origin HEAD:main

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run deploy-pages.yml --ref main

      - name: Report and close
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'LINE_BUTTONS_SUCCESS｜全站導向 LINE 的按鈕已改為 LINE 綠色，文字明確顯示「前往 LINE 詢問／下單／請我推薦」，並完成全站連結文字驗收與部署觸發。'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'LINE_BUTTONS_FAILURE｜未完成，請查看本次 Actions 紀錄。'});
