name: Finalize website mascot v404.3

on:
  push:
    branches: [main]
    paths:
      - "RUN_FINALIZE_V4043.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v4043
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final page mapping
        run: |
          set -euo pipefail
          cat > mascot-v404.js <<'JS'
          "use strict";
          (() => {
            const VERSION = "404.3";
            const PAGES = {
              home: { image:"images/brand/mascot-v404/home.jpg", position:"left-top", eyebrow:"歡迎認識仙加味", title:"從日常使用方式開始認識龜鹿系列", text:"小老闆負責品牌導覽；產品外觀、包裝與規格一律以下方真實產品原圖為準。", primary:["認識產品","products.html"], secondary:["怎麼選","choose.html"] },
              products: { image:"images/brand/mascot-v404/products.jpg", position:"right-top", eyebrow:"產品總覽", title:"小老闆負責導覽，產品以真實原圖呈現", text:"龜鹿膏、龜鹿飲30cc、龜鹿飲180cc鋁袋、龜鹿湯塊、龜鹿膠與鹿茸粉，請直接查看下方產品卡。", primary:["怎麼選","choose.html"], secondary:["使用方式","guide.html"] },
              choose: { image:"images/brand/mascot-v404/choose.jpg", position:"center-top", eyebrow:"怎麼選", title:"先看使用方式，再選產品型態", text:"固定取用、方便即飲、沖泡燉湯、家庭規格或自行調飲，可依自己的生活習慣比較。", primary:["看全部產品","products.html"], secondary:["搭配組合","combo.html"] },
              combo: { image:"images/brand/mascot-v404/combo.jpg", position:"left-top", eyebrow:"搭配組合", title:"依生活節奏整理搭配方向", text:"小老闆圖只呈現情境；組合內每項產品均以正式產品卡及真實產品原圖為準。", primary:["看產品","products.html"], secondary:["怎麼使用","guide.html"] },
              guide: { image:"images/brand/mascot-v404/guide.jpg", position:"center-top", eyebrow:"使用方式", title:"沖泡、即飲與燉湯方式一次整理", text:"小老闆呈現使用情境，不代替產品原圖；實際瓶型、盒型、袋型與規格以產品頁為準。", primary:["料理搭配","recipes.html"], secondary:["常見問題","faq.html"] },
              recipes: { image:"images/brand/mascot-v404/recipes.jpg", position:"left-top", eyebrow:"料理搭配", title:"把龜鹿產品放回熟悉的餐桌情境", text:"料理圖負責呈現燉湯、沖泡與熱飲方向；產品包裝仍以正式產品原圖為準。", primary:["使用方式","guide.html"], secondary:["看產品","products.html"] },
              brand: { image:"images/brand/mascot-v404/brand.jpg", position:"right-top", eyebrow:"品牌故事", title:"從萬華出發，延續四代工序與信用", text:"品牌頁專注仙加味的來處、工序與日常定位，不重複產品展示。", primary:["認識產品","products.html"], secondary:["聯絡我們","contact.html"] },
              faq: { image:"images/brand/mascot-v404/faq.jpg", position:"center-top", eyebrow:"常見問題", title:"產品、使用、購買與配送問題一次整理", text:"FAQ專注回答問題，不重複產品主視覺。", primary:["看產品","products.html"], secondary:["聯絡我們","contact.html"] },
              contact: { image:"images/brand/mascot-v404/contact.jpg", position:"right-top", eyebrow:"官方 LINE 與門市", title:"需要協助時，直接留下訊息", text:"聯絡頁專注LINE、門市、配送與取貨；不使用錯誤產品示意圖。", primary:["查看產品","products.html"], secondary:["門市資訊","#store-info"] }
            };
            function render() {
              const page = document.body?.dataset?.page || "home";
              const config = PAGES[page];
              document.querySelectorAll("#mascot-guide").forEach(node => node.remove());
              if (!config) return;
              if (page === "home") {
                const image = document.querySelector(".home-story-main .story-photo");
                if (!image) return;
                image.src = `${config.image}?v=${VERSION}`;
                image.alt = "仙加味小老闆品牌入口情境";
                image.classList.add("mascot-v404-home-story");
                image.width = 1448;
                image.height = 1086;
                return;
              }
              const hero = document.querySelector("main .hero");
              if (!hero) return;
              const section = document.createElement("section");
              section.id = "mascot-guide";
              section.className = "section mascot-guide-section mascot-guide-v404";
              section.innerHTML = `<article class="mascot-guide-card mascot-guide-card--${page} reveal"><div class="mascot-guide-card__media mascot-v404-crop mascot-v404-crop--${config.position}"><img class="mascot-guide-card__image" src="${config.image}?v=${VERSION}" alt="仙加味小老闆${config.eyebrow}情境" width="1448" height="1086" loading="lazy" decoding="async"></div><div class="mascot-guide-card__copy"><p class="eyebrow">${config.eyebrow}</p><h2>${config.title}</h2><p>${config.text}</p><div class="hero-actions"><a class="btn btn-outline" href="${config.primary[1]}">${config.primary[0]}</a><a class="btn btn-outline" href="${config.secondary[1]}">${config.secondary[0]}</a></div></div></article>`;
              hero.insertAdjacentElement("afterend", section);
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render, {once:true}); else render();
          })();
          JS

          cat > site-v404.css <<'CSS'
          /* v404.3：每頁一張小老闆情境，聚焦角色；產品只使用 products-v3 真實原圖。 */
          .mascot-guide-v404 .mascot-guide-card__media { position:relative; overflow:hidden; aspect-ratio:16/9; min-height:0; background:#2c2118; border-radius:22px; }
          .mascot-guide-v404 .mascot-guide-card__image { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.72); filter:none; }
          .mascot-v404-crop--left-top .mascot-guide-card__image { transform-origin:18% 18%; object-position:18% 18%; }
          .mascot-v404-crop--right-top .mascot-guide-card__image { transform-origin:82% 18%; object-position:82% 18%; }
          .mascot-v404-crop--center-top .mascot-guide-card__image { transform-origin:50% 18%; object-position:50% 18%; }
          .home-story-main { overflow:hidden; }
          .home-story-main .mascot-v404-home-story { width:100%; height:420px; object-fit:cover; object-position:18% 18%; transform:scale(1.58); transform-origin:18% 18%; display:block; }
          .home-story-main__body { position:relative; z-index:2; background:var(--surface, #fff); }
          @media (max-width:760px) {
            .mascot-guide-v404 .mascot-guide-card__image { transform:scale(1.5); }
            .home-story-main .mascot-v404-home-story { height:300px; transform:scale(1.45); }
          }
          CSS

          cat > site.js <<'JS'
          "use strict";
          // v404.3：單一網站核心＋單一小老闆配置。
          document.write('<link rel="stylesheet" href="site-v321.css?v=404.3" data-site-version="404.3">');
          document.write('<link rel="stylesheet" href="site-v404.css?v=404.3" data-mascot-version="404.3">');
          document.write('<script src="site-core.js?v=404.3"><\/script>');
          document.write('<script src="mascot-v404.js?v=404.3"><\/script>');
          JS

          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          V='404.3'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'site\.css\?v=[^"\']+',f'site.css?v={V}',s)
              s=re.sub(r'site-v321\.css\?v=[^"\']+',f'site-v321.css?v={V}',s)
              s=re.sub(r'site\.js\?v=[^"\']+',f'site.js?v={V}',s)
              if p.name=='index.html':
                  s=s.replace('images/brand/scene-brand-all.svg?v=403.1','images/brand/mascot-v404/home.jpg?v=404.3')
                  s=s.replace('https://ts15825868.github.io/xianjiawei/images/brand/scene-brand-all.svg?v=403.1','https://ts15825868.github.io/xianjiawei/images/logo.png')
              p.write_text(s,encoding='utf-8')
          page_map={k:f'images/brand/mascot-v404/{k}.jpg' for k in ['home','products','choose','combo','guide','recipes','brand','faq','contact']}
          hashes={}
          for k,v in page_map.items():
              q=Path(v)
              if not q.exists() or q.stat().st_size<100000: raise SystemExit(f'missing {v}')
              hashes[k]=hashlib.sha256(q.read_bytes()).hexdigest()
          if len(set(hashes.values()))!=9: raise SystemExit('duplicate mascot image')
          products={'龜鹿膏100g':'images/products-v3/guilu-gao.jpg','龜鹿飲30cc':'images/products-v3/guilu-drink-30.jpg','龜鹿飲180cc':'images/products-v3/guilu-drink-180.jpg','龜鹿湯塊75g':'images/products-v3/guilu-tangkuai.jpg','龜鹿膠600g':'images/products-v3/guilu-jiao.jpg','鹿茸粉75g':'images/products-v3/luerong-fen.jpg'}
          for k,v in products.items():
              if not Path(v).exists(): raise SystemExit(f'missing real product {v}')
          manifest={'version':V,'source':'user-approved website mascot scenes','rules':['核心九頁各一張不同小老闆圖','小老闆圖聚焦角色，不露出錯誤AI產品包裝','產品卡與產品頁只使用真實產品原圖','首頁只保留一張小老闆主視覺','五個內容頁不插入大型小老闆圖'],'pageMap':page_map,'productMap':products,'sha256':hashes}
          for f in ['images/brand/mascot-v404/manifest.json','images/brand/website-mascot-manifest.json']:
              Path(f).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('deploy-version.json').write_text(json.dumps({'version':V,'updated':'2026-07-12','mascot':'unique-user-approved-page-scenes','websiteMascotScenes':list(page_map),'largeMascotExcludedPages':['dm','video','knowledge','hanfang-baike','sources'],'productSource':'images/products-v3','productTransform':'none','homeMascotCount':1,'audit':'no-duplicate-mascot-no-generated-product-packaging-visible'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('mascot-source-audit.json').write_text(json.dumps({'version':V,'scope':'xianjiawei/main','mascotImages':'user-approved website mascot scenes','productSource':'images/products-v3','productTransform':'none','generatedProductPackagingVisible':False,'duplicateMascotPages':False,'homepageDuplicateMascot':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for old in Path('images/brand').glob('scene-*.svg'): old.unlink()
          for old in Path('images/brand').glob('website-mascot-*.jpg'): old.unlink()
          for wf in [Path('.github/workflows/deploy-pages.yml'),Path('.github/workflows/verify-site-and-catalog.yml')]:
              if wf.exists():
                  t=wf.read_text(encoding='utf-8').replace('404.2',V).replace('404.1',V).replace('403.1',V).replace('402.0',V)
                  wf.write_text(t,encoding='utf-8')
          PY

      - name: Verify
        run: |
          set -euo pipefail
          node --check site.js
          node --check site-core.js
          node --check mascot-v404.js
          node --check site-fix-v317.js
          python3 tools/site_maintenance.py
          grep -q 'site.js?v=404.3' index.html
          grep -q 'images/brand/mascot-v404/home.jpg?v=404.3' index.html
          grep -q '"version": "404.3"' deploy-version.json
          ! grep -R 'images/brand/scene-' --include='*.html' --include='*.js' .
          test "$(find images/brand/mascot-v404 -maxdepth 1 -name '*.jpg' | wc -l | tr -d ' ')" -eq 9

      - name: Commit and self-clean
        run: |
          set -euo pipefail
          rm -f RUN_FINALIZE_V4043.txt .github/workflows/finalize-v4043.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網小老闆與真實產品圖完整上線 v404.3"
          git push origin main
