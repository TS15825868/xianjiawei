name: 仙加味目前權威一次性整理

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-authority-repair.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-one-shot-current-authority-repair
  cancel-in-progress: true

jobs:
  repair-current-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair active current-authority files and guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          CURRENT_USAGE='每日早上及下午各一小匙'
          OLD_USAGE='一天一次一小匙'
          simple_files=[
            'llms-full.txt','llms.txt','data.json','geo-data.json','catalog-public.json',
            'assets/data/official-products.json','content/visual-production-spec-current.json',
            'tools/validate-site-release.py','tools/validate-public-customer-pages-v20260809.py',
            'tools/validate-canonical-facts-v20260808.py','tools/validate-site-production-release-v20260809.py'
          ]
          for rel in simple_files:
            p=Path(rel)
            if not p.exists():
              continue
            text=p.read_text(encoding='utf-8')
            text=text.replace(OLD_USAGE,CURRENT_USAGE)
            p.write_text(text,encoding='utf-8')

          sync=Path('tools/sync-current-derived-authority.py')
          text=sync.read_text(encoding='utf-8')
          text=text.replace(" ('每日早上及下午各一小匙','一天一次一小匙'),", " ('一天一次一小匙','每日早上及下午各一小匙'),")
          text=text.replace(" ('早晚各一小匙','一天一次一小匙'),", " ('早晚各一小匙','每日早上及下午各一小匙'),")
          for old_line in [
            " ('龜鹿湯塊 75g／盒｜深藍盒｜8塊裝｜每塊約9.375g','龜鹿湯塊 75g／盒｜深藍盒｜8塊裝'),\n",
            " ('75g／盒｜深藍盒｜8塊裝｜每塊約9.375g','75g／盒｜深藍盒｜8塊裝'),\n",
            " ('75g／盒｜8塊裝｜每塊約9.375g','75g／盒｜8塊裝'),\n",
            " ('75g／盒，8塊裝、每塊約9.375g','75g／盒｜8塊裝'),\n",
            " ('75g／盒、8塊裝、每塊約9.375g','75g／盒｜8塊裝'),\n",
            " ('600g（1斤）／盒｜32塊裝｜每塊約18.75g','600g（1斤）／盒｜32塊裝'),\n",
            " ('600g（1斤）／盒、32塊裝、每塊約18.75g','600g（1斤）／盒｜32塊裝'),\n",
            " ('600g／盒｜32塊裝｜每塊約18.75g','600g（1斤）／盒｜32塊裝'),\n"
          ]:
            text=text.replace(old_line,'')
          text=text.replace(
            "for rel in ['content/public-post-library.json','content/public-content-policy.json','config/public-content-policy.json','content/post-bank-v6-manifest.json']:",
            "for rel in ['content/public-post-library.json','content/public-content-policy.json','config/public-content-policy.json','content/post-bank-v6-manifest.json','data.json','geo-data.json','assets/data/official-products.json','content/visual-production-spec-current.json']:"
          )
          text=text.replace("for rel in ['llms-full.txt']:", "for rel in ['llms-full.txt','llms.txt']:")
          old=" retired=['每日早上及下午各一小匙','早晚各一小匙','75g／盒｜8塊裝｜每塊約9.375g','600g（1斤）／盒｜32塊裝｜每塊約18.75g','600g／盒｜32塊裝｜每塊約18.75g','龜鹿飲30cc玻璃瓶','30cc／瓶']"
          text=text.replace(old," retired=['一天一次一小匙','龜鹿飲30cc玻璃瓶','30cc／瓶']")
          sync.write_text(text,encoding='utf-8')
          PY

      - name: Synchronize current derived customer outputs
        run: python tools/sync-current-derived-authority.py

      - name: Validate current facts do not regress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required='每日早上及下午各一小匙'
          retired=['一天一次一小匙','龜鹿飲30cc玻璃瓶','30cc／瓶']
          targets=['config/official-products.json','assets/data/official-products.json','data.json','catalog-public.json','llms-full.txt','llms.txt']
          for rel in targets:
            text=Path(rel).read_text(encoding='utf-8')
            for phrase in retired:
              if phrase in text:
                raise SystemExit(f'{rel} 仍含退役目前資料：{phrase}')
          for rel in ['config/official-products.json','assets/data/official-products.json','data.json','catalog-public.json']:
            text=Path(rel).read_text(encoding='utf-8')
            if '龜鹿膏' in text and required not in text:
              raise SystemExit(f'{rel} 缺少目前龜鹿膏使用方式')
          print('PASS: 目前正式使用方式、30cc罐規格與詳細重量分層規則已一致。')
          PY

      - name: Commit repaired current authority
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync-current-derived-authority.py \
            catalog-public.json content/public-post-library.json content/public-content-policy.json config/public-content-policy.json \
            content/post-bank-v6-manifest.json data.json geo-data.json assets/data/official-products.json \
            content/visual-production-spec-current.json llms-full.txt llms.txt \
            tools/validate-site-release.py tools/validate-public-customer-pages-v20260809.py \
            tools/validate-canonical-facts-v20260808.py tools/validate-site-production-release-v20260809.py
          if git diff --cached --quiet; then
            echo 'Current authority already aligned.'
            exit 0
          fi
          git commit -m 'sync: align all active outputs with current product authority'
          git push origin HEAD:main
