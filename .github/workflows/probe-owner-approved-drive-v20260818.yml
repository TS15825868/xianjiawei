name: 驗證使用者確認原圖可安裝
on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/probe-owner-approved-drive-v20260818.trigger'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify original image download
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://drive.google.com/uc?export=download&id=1xQvxy5Drdiayqo3Jh3OzLTqFxzWZpHNq' -o /tmp/owner-approved.png
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/owner-approved.png')
          assert im.format == 'PNG'
          assert im.width >= 1000 and im.height >= 1200
          im.verify()
          print('PASS original PNG')
          PY
          mkdir -p assets/staging
          printf '%s\n' 'PASS original Drive image download 2026-08-18' > assets/staging/probe-owner-approved-drive-v20260818.ok
      - name: Commit PASS marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/staging/probe-owner-approved-drive-v20260818.ok
          git commit -m '驗證使用者確認原圖可由部署流程讀取'
          git push origin HEAD:main
