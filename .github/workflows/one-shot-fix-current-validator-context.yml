name: 仙加味官網守門語境一次性修正

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-current-validator-context.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fix only stale validator assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          boundary=Path('tools/validate-public-boundary-v20260808.py')
          src=boundary.read_text(encoding='utf-8')
          before=src
          # 30cc目前硬規格是小玻璃裸罐、無貼紙；「無外盒」並非正式必填產品事實。
          src=re.sub(r'(["\'])無外盒\1\s*,?\s*','',src)
          if src==before:
            raise SystemExit('boundary validator: 找不到退役的「無外盒」硬條件')
          boundary.write_text(src,encoding='utf-8')

          publishing=Path('tools/validate-publishing-content-match-v20260809.py')
          src=publishing.read_text(encoding='utf-8')
          before=src
          old=r'龜鹿湯塊.{0,80}(?:300\s*g|600\s*g)'
          new=r'龜鹿湯塊(?:(?!龜鹿膠|龜鹿膏|鹿茸粉|龜鹿飲).){0,80}(?:300\s*g|600\s*g)'
          if old not in src:
            raise SystemExit('publishing validator: 找不到舊的跨產品80字誤判規則')
          src=src.replace(old,new)
          publishing.write_text(src,encoding='utf-8')
          print('PASS: only validator assumptions were changed; current public content was not modified.')
          PY
      - name: Validate every current website layer before commit
        run: |
          python tools/validate-site-release.py
          python tools/validate-public-customer-pages-v20260809.py
          python tools/validate-visual-cohesion-v20260809.py
          python tools/validate_public_aio_seo.py
          python tools/validate-public-boundary-v20260808.py
          python tools/validate-publishing-content-match-v20260809.py
          for file in site.js site-core-v410.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-public-content-cleanup-v20260809.js site-public-image-retirement-v20260812.js site-mascot-placement-v20260812.js site-stability-v20260814.js publishing-center-guardian.js; do
            node --check "$file"
          done
      - name: Commit only after all validation passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate-public-boundary-v20260808.py tools/validate-publishing-content-match-v20260809.py
          git commit -m 'test(site): make public and publishing guards current-context aware'
          git pull --rebase origin main
          git push origin HEAD:main
