name: 安裝使用者確認最新10張貼文圖

on:
  push:
    branches: [main]
    paths:
      - 'data/install-owner-approved-final10-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: xjw-install-owner-approved-final10-v20260818
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BRIDGE_TITLE: XJW-TEMP-ASSET-BRIDGE-20260818-1123
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate temporary attachment bridge
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "${BRIDGE_TITLE} in:title" --limit 10 --json number,title,body > /tmp/issues.json
          node - <<'NODE'
          const fs=require('fs');
          const title=process.env.BRIDGE_TITLE;
          const rows=JSON.parse(fs.readFileSync('/tmp/issues.json','utf8'));
          const issue=rows.find(x=>x.title===title);
          if(!issue) throw new Error('找不到最新10圖暫存橋接 issue');
          fs.writeFileSync('/tmp/issue-number', String(issue.number));
          fs.writeFileSync('/tmp/issue-body', issue.body||'');
          console.log('bridge issue #'+issue.number);
          NODE

      - name: Extract and download exactly 10 approved images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final10
          node - <<'NODE'
          const fs=require('fs');
          const body=fs.readFileSync('/tmp/issue-body','utf8');
          const urls=[...body.matchAll(/https:\/\/github\.com\/user-attachments\/(?:assets|files)\/[^\s)\]]+/g)].map(m=>m[0]);
          const uniq=[...new Set(urls)];
          if(uniq.length!==10){
            console.error(body);
            throw new Error(`預期 10 個附件網址，實際 ${uniq.length}`);
          }
          fs.writeFileSync('/tmp/urls.txt',uniq.join('\n')+'\n');
          NODE
          names=(
            01-work-30cc.webp
            02-home-180cc.webp
            03-gao-storage.webp
            04-tangkuai-soup.webp
            05-jiao-600g.webp
            06-lurong-75g.webp
            07-line-consult.webp
            08-home-out.webp
            09-organize-cabinet.webp
            10-office-warm-drink.webp
          )
          i=0
          while IFS= read -r url; do
            name="${names[$i]}"
            curl -fL --retry 5 --retry-delay 2 "$url" -o "/tmp/final10/$name"
            test -s "/tmp/final10/$name"
            size=$(stat -c%s "/tmp/final10/$name")
            test "$size" -gt 30000 || { echo "$name too small: $size" >&2; exit 1; }
            magic=$(xxd -p -l 12 "/tmp/final10/$name")
            echo "$name $size bytes $magic"
            python3 - "$name" "/tmp/final10/$name" <<'PY'
import sys
name,path=sys.argv[1:]
b=open(path,'rb').read(16)
if not (b[:4]==b'RIFF' and b[8:12]==b'WEBP'):
    raise SystemExit(f'{name}: not WebP')
PY
            i=$((i+1))
          done < /tmp/urls.txt
          test "$i" -eq 10

      - name: Remove obsolete generated post-image libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/posts/owner-approved-v20260818
          # 使用者已確認：現有貼文圖全部不是最新版本；舊貼文圖庫不得再被 fallback 使用。
          find images/posts -mindepth 1 -maxdepth 1 ! -name 'owner-approved-v20260818' -print -exec rm -rf {} + 2>/dev/null || true
          rm -rf images/publishing/generated-v20260815 || true
          rm -rf asset-staging/priority10-svg-v20260817 || true
          cp /tmp/final10/*.webp images/posts/owner-approved-v20260818/

      - name: Write final10 authoritative manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const base='https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/';
          const rows=[
            ['XJW-GUILU-drink30-work-break','上班帶一罐，30cc 不用把行程打亂','01-work-30cc.webp','仙加味上班日常；小老闆手持30cc小玻璃罐'],
            ['XJW-GUILU-drink180-home','今天在家，180cc 可以慢慢安排','02-home-180cc.webp','仙加味居家溫飲；180cc鋁袋生活情境'],
            ['XJW-GUILU-gao-storage','龜鹿膏開罐後，記得冷藏','03-gao-storage.webp','仙加味保存提醒；龜鹿膏開罐後冷藏'],
            ['XJW-GUILU-tangkuai-soup','今晚燉湯，把龜鹿湯塊安排進家常餐桌','04-tangkuai-soup.webp','仙加味料理搭配；龜鹿湯塊家常燉湯'],
            ['XJW-GUILU-jiao-600g','週末有時間，再慢慢認識龜鹿膠這種型態','05-jiao-600g.webp','仙加味型態認識；600g／32塊龜鹿膠'],
            ['XJW-GUILU-luerong-75g','午後認識鹿茸粉，把節奏留給自己','06-lurong-75g.webp','仙加味粉末安排；75g鹿茸粉'],
            ['XJW-SOCIAL-20260815-02-line-consult-and-trial','不知道怎麼選，先把你的日常告訴我們','07-line-consult.webp','仙加味LINE諮詢；依日常協助挑選產品'],
            ['XJW-GUILU-choose-by-place','今天在家，明天外出，產品型態不一定要選同一種','08-home-out.webp','仙加味生活節奏；在家與外出依情境選擇'],
            ['XJW-SOCIAL-20260815-03-storage-basics','星期天整理櫃子，也順便看看龜鹿還剩多少','09-organize-cabinet.webp','仙加味整理一下；產品櫃與保存整理'],
            ['XJW-SOCIAL-20260815-01-warm-drink-moment','辦公桌上的一杯溫熱飲，也可以有不同選擇','10-office-warm-drink.webp','仙加味辦公桌安排；30cc與180cc溫熱飲情境']
          ];
          const posts=rows.map(([id,title,file,image_alt],index)=>({
            order:index+1,id,title,file,
            image_path:`images/posts/owner-approved-v20260818/${file}`,
            image_url:`${base}${file}?v=20260818-owner-approved-final10-v1`,
            image_alt,
            image_source:'使用者2026-08-18親自確認之最新10張正式圖｜圖文一對一｜不得fallback舊圖'
          }));
          const manifest={
            version:'2026-08-18-owner-approved-final10-v1',
            authority:'使用者於2026-08-18明確確認這10張很棒，最新版本取代所有舊貼文圖',
            count:10,
            fallback_allowed:false,
            posts
          };
          fs.writeFileSync('images/posts/owner-approved-v20260818/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: Verify repository contains only current post-image release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find images/posts/owner-approved-v20260818 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10
          test -f images/posts/owner-approved-v20260818/manifest.json
          node - <<'NODE'
          const m=require('./images/posts/owner-approved-v20260818/manifest.json');
          if(m.count!==10||m.posts.length!==10||m.fallback_allowed!==false) throw new Error('final10 manifest invalid');
          if(new Set(m.posts.map(x=>x.image_url.split('?')[0])).size!==10) throw new Error('duplicate final10 image urls');
          NODE
          echo 'Remaining post image tree:'
          find images/posts -maxdepth 2 -type f -print | sort
          # No old generated post library may remain.
          test ! -e images/posts/priority10-v20260817
          test ! -e images/posts/rebuild-v20260816
          test ! -e images/posts/current-v20260815
          test ! -e images/publishing/generated-v20260815
          test ! -e asset-staging/priority10-svg-v20260817

      - name: Commit official final10 and old-image cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/posts images/publishing asset-staging 2>/dev/null || true
          git add images/posts/owner-approved-v20260818
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'fix(posts): replace stale post images with owner-approved final10'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close temporary bridge issue
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          n=$(cat /tmp/issue-number)
          gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment '最新10張正式圖已寫入正式素材路徑，暫存橋接完成並關閉。'
