name: Real purple carton correction v6
on:
  push:
    branches: [main]
    paths:
      - 'ops/fix-erzhenbao-original-photo-v6.py'
      - '.github/workflows/fix-erzhenbao-original-photo-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Replace misleading package illustration with unaltered original purple carton
        run: python ops/fix-erzhenbao-original-photo-v6.py
      - name: Check new package photo and reference replacement
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          p=Path('images/catalog-corrections-v20261016-v6')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['updated'])>=3
          with Image.open(p/'royalherb-erzhenbao-64-main.webp') as img:
              assert img.size == (1122,1402)
          assert 'catalog-corrections-v20261016-v6' in Path('product-er-zhen-bao.html').read_text()
          PY
      - name: Commit new path and changed website references, retain old assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/catalog-corrections-v20261016-v6/
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'fix: replace imaginary square graphic with real two-treasure purple box original pixels'
          git pull --rebase origin main
          git push origin HEAD:main
