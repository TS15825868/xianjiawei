name: v298 brand history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update verified family timeline
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('brand.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
            '<p>祖父長年與鹿角為伍，熟悉鹿角挑選、處理、切料與分級，在同業與地方間被稱為「鹿角伯」。這個稱呼，也成為家族鹿角技藝最有記憶點的象徵。從曾經的坪林鹿場，到後來專注鹿角工序，第二代把經驗做得更深、更穩。</p>',
            '<p>祖父「鹿角伯」為民國28年次。國小畢業後，十幾歲便跟著曾祖父在老店學習，從山產原料、鹿角處理到龜鹿相關代工與加工，一步一步累積實務經驗。長年熟悉鹿角挑選、處理、切料與分級，也因此在同業與地方間被稱為「鹿角伯」。</p>'
          )

          old = '''  <div class="grid grid-2">
    <article class="card reveal">
      <p class="eyebrow">家族事業</p>
      <h3>從行口經驗走向專業經營</h3>
      <p>在前兩代累積的行口經驗、鹿角知識與工序基礎上，家族逐步形成以鹿角、山產原料與龜鹿相關製作為核心的事業。</p>
    </article>
    <article class="card reveal">
      <p class="eyebrow">仙加味品牌</p>
      <h3>把家族經驗整理成清楚的品牌資訊</h3>
      <p>「仙加味」成為面向消費者的品牌名稱，保留傳統食補的核心，同時把產品資訊、使用方式與生活情境整理得更清楚。</p>
    </article>
  </div>'''

          new = '''  <div class="grid grid-2">
    <article class="card reveal">
      <p class="eyebrow">民國28年次</p>
      <h3>鹿角伯出生，第二代的故事由此開始</h3>
      <p>祖父自十幾歲、國小畢業後，便跟著曾祖父在老店學習山產原料、鹿角處理、龜鹿相關代工與加工，從現場工作累積對原料與工序的理解。</p>
    </article>
    <article class="card reveal">
      <p class="eyebrow">1974年</p>
      <h3>因家庭安排分家，持續專注代工與加工</h3>
      <p>分家後，祖父延續熟悉的代工、加工與原料處理工作，逐步建立獨立經營的基礎，也持續累積客戶與同業間的信用。</p>
    </article>
    <article class="card reveal">
      <p class="eyebrow">1976年</p>
      <h3>正式成立獨立事業</h3>
      <p>在多年老店經驗與代工加工基礎上，祖父正式成立自己的事業，持續深耕鹿角、山產原料、龜鹿相關代工與加工。</p>
    </article>
    <article class="card reveal">
      <p class="eyebrow">1978年</p>
      <h3>由行號轉為有限公司組織</h3>
      <p>事業完成公司化經營，持續以原料處理、代工加工與龜鹿相關製作為核心，為後續第三代與第四代的承接打下更完整的基礎。</p>
    </article>
    <article class="card reveal">
      <p class="eyebrow">仙加味品牌</p>
      <h3>把家族經驗整理成清楚的品牌資訊</h3>
      <p>「仙加味」成為面向消費者的品牌名稱，保留傳統食補的核心，同時把產品資訊、使用方式與生活情境整理得更清楚。</p>
    </article>
  </div>'''

          if old not in text:
            raise SystemExit('找不到重要歷程原區塊，停止更新以避免誤改。')
          text = text.replace(old, new)

          text = text.replace('site.css?v=297.2', 'site.css?v=298.0')
          text = text.replace('site.js?v=297.2', 'site.js?v=298.0')
          path.write_text(text, encoding='utf-8')

          # 首頁品牌故事入口同步更新快取版本
          index = Path('index.html')
          if index.exists():
            src = index.read_text(encoding='utf-8')
            src = re.sub(r'site\.css\?v=[^\"\']+', 'site.css?v=298.0', src)
            src = re.sub(r'site\.js\?v=[^\"\']+', 'site.js?v=298.0', src)
            index.write_text(src, encoding='utf-8')

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/v298-brand-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298: add verified 鹿角伯 timeline without company name"
          git push origin main
