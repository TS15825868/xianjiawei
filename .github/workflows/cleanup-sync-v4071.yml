name: Cleanup and sync v407.1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  cleanup:
    if: github.event.issue.title == 'CLEANUP_SYNC_V407_1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize versions and remove temporary files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version='407.1'
          pattern=re.compile(r'(\.(?:css|js|jpg|jpeg|png|webp))\?v=[0-9.]+')
          targets=list(Path('.').glob('*.html'))+[Path('data.json'),Path('approved-mascot-v405.js')]
          for path in targets:
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8')
              text=pattern.sub(lambda m:m.group(1)+f'?v={version}',text)
              path.write_text(text,encoding='utf-8')
          PY

          rm -f tmp-test*.txt
          rm -f .github/workflows/apply-site-sync-v4071.yml
          rm -f .github/workflows/cleanup-sync-v4071.yml

          node --check site.js
          node --check site-core.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          test "$(grep -o 'class="dm-image-v2"' dm.html | wc -l)" -eq 6
          grep -q '03_guilu-drink-180cc-dm.jpg?v=407.1' dm.html
          grep -q 'site.js?v=407.1' index.html
          grep -q '"version": "407.1"' deploy-version.json
          grep -q "version='407.1'" .github/workflows/deploy-pages.yml

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m '清理暫存檔並統一全站快取版本 v407.1'
            git push origin HEAD:main
          fi

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run deploy-pages.yml --ref main

      - name: Report success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'CLEANUP_SYNC_SUCCESS｜已清除暫存測試檔與失敗流程、全站資源版本統一為407.1、DM頁補齊六項並觸發Pages部署。'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'CLEANUP_SYNC_FAILURE｜未完成，請查看本次Actions紀錄。'});
