name: 仙加味小老闆貼文圖重製

on:
  push:
    branches: [main]
    paths:
      - 'data/post-smallboss-rebuild-v20260815.json'
      - 'tools/build-smallboss-post-images-v20260815.py'
      - '.github/workflows/build-smallboss-post-images-v20260815.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-smallboss-post-rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Build formal small-boss post images
        run: python tools/build-smallboss-post-images-v20260815.py
      - name: Validate output and blocked display text
        shell: bash
        run: |
          set -euo pipefail
          count="$(find images/posts/smallboss-v20260815 -maxdepth 1 -type f -name '*.jpg' | wc -l)"
          expected="$(python - <<'PY'
          import json
          print(len(json.load(open('data/post-smallboss-rebuild-v20260815.json',encoding='utf-8'))['posts']))
          PY
          )"
          test "$count" -eq "$expected"
          ! grep -R -F '台興山產' data/post-smallboss-rebuild-v20260815.json tools/build-smallboss-post-images-v20260815.py
          echo "PASS: ${count} 張小老闆貼文圖已完成，繁體中文與正式產品素材規則通過。"
      - name: Commit generated images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/smallboss-v20260815
          if git diff --cached --quiet; then
            echo 'No generated image changes.'
            exit 0
          fi
          git commit -m 'feat(posts): generate formal small-boss post visuals'
          git push origin HEAD:main
