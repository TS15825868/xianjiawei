name: v298.8 header tagline

on:
  push:
    paths:
      - TRIGGER_V298_8.txt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh site.js cache version on every page
        shell: python
        run: |
          from pathlib import Path
          import re

          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              text = re.sub(r'site\.js\?v=[^"\']+', 'site.js?v=298.8', text)
              html.write_text(text, encoding='utf-8')

      - name: Commit and clean temporary files
        run: |
          rm -f TRIGGER_V298_8.txt
          rm -f .github/workflows/v298-8-header-tagline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.8: publish header brand tagline across all pages"
          git push origin main
