name: 【暫停自動】仙加味官網品質檢查

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-site-quality-manual
  cancel-in-progress: true

jobs:
  audit:
    name: 手動執行全站結構、SEO、圖片與互動檢查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run full website audit
        run: node tools/audit-site.mjs

      - name: Verify GitHub Pages entry files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s 404.html
          test -s site.js
          test -s site.css
          test -s data.json
          test -s products.html
          test -s contact.html
          test -s brand.html
          test -s brand-facts.html
          grep -q '六項正式產品規格' products.html
          grep -q '龜鹿飲30cc玻璃罐' data.json
          grep -q '30cc／罐（小玻璃罐）' data.json
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' data.json
          if grep -Eq '(\$|NT\$)[[:space:]]*[0-9]|(售價|優惠價)[[:space:]]*[：:]?[[:space:]]*[0-9]' products.html product-guilu-jiao.html; then
            echo '公開產品頁不得出現實際售價或優惠金額。' >&2
            exit 1
          fi
          echo 'PASS GitHub Pages 核心入口、六項正式規格與公開價格規則。'

      - name: Check deployed public pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://ts15825868.github.io/xianjiawei'
          fetch_page() {
            local path="$1"
            local output="$2"
            curl --fail --silent --show-error --location --max-time 30 --retry 3 --retry-delay 5 "$base/$path" > "$output"
            test -s "$output"
          }
          fetch_page '' /tmp/home.html
          fetch_page 'products.html' /tmp/products.html
          fetch_page 'contact.html' /tmp/contact.html
          fetch_page 'brand.html' /tmp/brand.html
          fetch_page 'brand-facts.html' /tmp/brand-facts.html
          fetch_page 'product-guilu-jiao.html' /tmp/guilu-jiao.html
          fetch_page 'data.json' /tmp/data.json
          grep -q '仙加味' /tmp/home.html
          grep -q '六項正式產品規格' /tmp/products.html
          grep -q '仙加味官方 LINE' /tmp/contact.html
          grep -q '四代' /tmp/brand.html
          grep -q '官方事實資料中心' /tmp/brand-facts.html
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' /tmp/guilu-jiao.html
          grep -q '600g／盒（1斤）｜32塊裝｜每塊約18.75g' /tmp/data.json
          echo 'PASS 已部署公開頁面與正式規格。'
