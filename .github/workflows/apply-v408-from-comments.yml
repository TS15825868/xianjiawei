name: Apply v408 full update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  update:
    if: github.event.issue.number == 97 && github.event.comment.body == 'RUN_V408_FULL_UPDATE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild verified asset archive from issue comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPO}/issues/97/comments" > /tmp/comments.json
          python3 - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path

          pages=json.loads(Path('/tmp/comments.json').read_text())
          comments=[]
          for page in pages:
              comments.extend(page)
          parts={}
          total=None
          for item in comments:
              body=item.get('body') or ''
              m=re.match(r'^V408_CHUNK\s+(\d+)/(\d+)\n([A-Za-z0-9+/=\n\r]+)$', body)
              if not m:
                  continue
              idx,count=int(m.group(1)),int(m.group(2))
              total=count if total is None else total
              if count != total:
                  raise SystemExit('chunk total mismatch')
              parts[idx]=''.join(m.group(3).split())
          if total != 36 or set(parts) != set(range(1,37)):
              raise SystemExit(f'incomplete chunks: total={total}, found={sorted(parts)}')
          raw=base64.b64decode(''.join(parts[i] for i in range(1,37)), validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='ebea7dfca7c8e6672c72a26dab51fba60013b45f886abe424f32f9035822bff7'
          if digest != expected:
              raise SystemExit(f'archive hash mismatch: {digest}')
          Path('/tmp/v408-assets.zip').write_bytes(raw)
          print('archive verified',len(raw),digest)
          PY
          rm -rf /tmp/v408-assets
          mkdir -p /tmp/v408-assets
          unzip -q /tmp/v408-assets.zip -d /tmp/v408-assets

      - name: Install product images, DM images and consolidate frontend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          version='408.1'
          src=Path('/tmp/v408-assets')
          products={
            'guilu-gao':'images/products-v3/guilu-gao.webp',
            'guilu-drink-30':'images/products-v3/guilu-drink-30.webp',
            'guilu-drink-180':'images/products-v3/guilu-drink-180.webp',
            'guilu-tangkuai':'images/products-v3/guilu-tangkuai.webp',
            'guilu-jiao':'images/products-v3/guilu-jiao.webp',
            'luerong-fen':'images/products-v3/luerong-fen.webp',
          }
          dm={
            'guilu-gao':'images/dm-final/01_guilu-gao-100g-dm.webp',
            'guilu-drink-30':'images/dm-final/02_guilu-drink-30cc-dm.webp',
            'guilu-drink-180':'images/dm-final/03_guilu-drink-180cc-dm.webp',
            'luerong-fen':'images/dm-final/04_luerong-fen-75g-dm.webp',
            'guilu-tangkuai':'images/dm-final/05_guilu-tangkuai-75g-dm.webp',
            'guilu-jiao':'images/dm-final/06_guilu-jiao-600g-dm.webp',
          }
          expected=list(products.values())+list(dm.values())
          for rel in expected:
              p=src/rel.replace('images/','')
              if not p.is_file():
                  raise SystemExit(f'missing archive file: {p}')
              raw=p.read_bytes()
              if len(raw)<50000 or raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP':
                  raise SystemExit(f'invalid webp: {p} {len(raw)}')
              dst=Path(rel)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dst)

          # Update the single data source. Product cards use image; modal and DM views use dmImage.
          data_path=Path('data.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          catalog=data.get('products') or []
          if len(catalog)!=6:
              raise SystemExit(f'expected 6 products, got {len(catalog)}')
          found=set()
          for item in catalog:
              pid=item.get('id')
              if pid not in products or pid not in dm:
                  raise SystemExit(f'unexpected product id: {pid}')
              item['image']=f"{products[pid]}?v={version}"
              item['dmImage']=f"{dm[pid]}?v={version}"
              item['detailImages']=[f"{dm[pid]}?v={version}"]
              item['gallery']=[]
              found.add(pid)
          if found != set(products):
              raise SystemExit(f'catalog ids mismatch: {found}')
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          old_to_new={
            'images/products-v3/guilu-gao.jpg':products['guilu-gao'],
            'images/products-v3/guilu-drink-30.jpg':products['guilu-drink-30'],
            'images/products-v3/guilu-drink-180.jpg':products['guilu-drink-180'],
            'images/products-v3/guilu-tangkuai.jpg':products['guilu-tangkuai'],
            'images/products-v3/guilu-jiao.jpg':products['guilu-jiao'],
            'images/products-v3/luerong-fen.jpg':products['luerong-fen'],
            'images/dm-final/01_guilu-gao-100g-dm.jpg':dm['guilu-gao'],
            'images/dm-final/02_guilu-drink-30cc-dm.jpg':dm['guilu-drink-30'],
            'images/dm-final/03_guilu-drink-180cc-dm.jpg':dm['guilu-drink-180'],
            'images/dm-final/04_luerong-fen-75g-dm.jpg':dm['luerong-fen'],
            'images/dm-final/05_guilu-tangkuai-75g-dm.jpg':dm['guilu-tangkuai'],
            'images/dm-final/06_guilu-jiao-600g-dm.jpg':dm['guilu-jiao'],
          }

          for page in Path('.').glob('*.html'):
              text=page.read_text(encoding='utf-8')
              for old,new in old_to_new.items():
                  text=re.sub(re.escape(old)+r'(?:\?v=[0-9.]+)?',f'{new}?v={version}',text)
              text=re.sub(r'site\.css\?v=[0-9.]+',f'site.css?v={version}',text)
              text=re.sub(r'site\.js\?v=[0-9.]+',f'site.js?v={version}',text)
              text=re.sub(r'\s*<link[^>]+href="site-v(?:321|405)\.css[^>]*>\s*','\n',text)
              text=re.sub(r'\s*<script[^>]+src="(?:site-core|approved-mascot-v405)\.js[^>]*></script>\s*','\n',text)
              page.write_text(text,encoding='utf-8')

          # Consolidate JavaScript into site.js.
          core=Path('site-core.js').read_text(encoding='utf-8')
          mascot=Path('approved-mascot-v405.js').read_text(encoding='utf-8')
          core=re.sub(r"data\.json\?v=[0-9.]+",f'data.json?v={version}',core)
          mascot=re.sub(r'const VERSION = "[0-9.]+";',f'const VERSION = "{version}";',mascot)
          mascot=re.sub(r'^"use strict";\s*','',mascot)
          combined='"use strict";\n\n/* 仙加味網站核心｜單一正式檔 v408.1 */\n'+core.strip()+\
                   '\n\n/* 15張核准小老闆頁面配置 */\n'+mascot.strip()+'\n'
          Path('site.js').write_text(combined,encoding='utf-8')

          # Consolidate CSS into site.css.
          base=Path('site.css').read_text(encoding='utf-8')
          mobile=Path('site-v321.css').read_text(encoding='utf-8')
          mascot_css=Path('site-v405.css').read_text(encoding='utf-8')
          base=re.sub(r'/\* BEGIN CONSOLIDATED V408 \*/.*?/\* END CONSOLIDATED V408 \*/\s*','',base,flags=re.S)
          merged=base.rstrip()+\
            '\n\n/* BEGIN CONSOLIDATED V408 */\n/* 手機版與清晰度修正 */\n'+mobile.strip()+\
            '\n\n/* 核准小老闆圖片樣式 */\n'+mascot_css.strip()+\
            '\n/* END CONSOLIDATED V408 */\n'
          Path('site.css').write_text(merged,encoding='utf-8')

          # Asset manifest for later exact verification.
          manifest={'version':version,'format':'webp','source':'user-approved-product-and-dm-images','assets':{}}
          for rel in expected:
              p=Path(rel); raw=p.read_bytes()
              manifest['assets'][rel]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'width':1122,'height':1402}
          Path('images/v408-assets-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          deploy={
            'version':version,
            'updated':'2026-07-13',
            'frontend':'single-site-js-and-single-site-css',
            'catalog':'five-types-six-specifications',
            'productImages':'six-user-approved-webp',
            'dm':'six-user-approved-webp',
            'modalRule':'product-card=image, quick-view=dmImage, detail-hero=image, dm-page=dmImage',
            'mascot':'15-approved-distinct-website-scenes'
          }
          Path('deploy-version.json').write_text(json.dumps(deploy,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -f site-core.js approved-mascot-v405.js site-v321.css site-v405.css
          rm -f images/products-v3/guilu-gao.jpg images/products-v3/guilu-drink-30.jpg images/products-v3/guilu-drink-180.jpg
          rm -f images/products-v3/guilu-tangkuai.jpg images/products-v3/guilu-jiao.jpg images/products-v3/luerong-fen.jpg
          rm -f images/products-v3/guilu-gao.avif images/products-v3/guilu-drink-30.avif images/products-v3/guilu-drink-180.avif
          rm -f images/products-v3/guilu-tangkuai.avif images/products-v3/guilu-jiao.avif images/products-v3/luerong-fen.avif
          rm -f images/dm-final/01_guilu-gao-100g-dm.jpg images/dm-final/02_guilu-drink-30cc-dm.jpg
          rm -f images/dm-final/03_guilu-drink-180cc-dm.jpg images/dm-final/04_luerong-fen-75g-dm.jpg
          rm -f images/dm-final/05_guilu-tangkuai-75g-dm.jpg images/dm-final/06_guilu-jiao-600g-dm.jpg
          rm -f images/dm-final/*.avif
          rm -rf _upload _payload
          rm -f tmp-test*.txt images/test-binary.webp

      - name: Install durable Pages deployment workflow
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy 仙加味網站

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: main
                - name: Verify production website
                  run: |
                    set -euo pipefail
                    node --check site.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool deploy-version.json >/dev/null
                    python3 -m json.tool images/v408-assets-manifest.json >/dev/null
                    grep -q '"version": "408.1"' deploy-version.json
                    test ! -e site-core.js
                    test ! -e approved-mascot-v405.js
                    test ! -e site-v321.css
                    test ! -e site-v405.css
                    test "$(grep -o 'class="dm-image-v2"' dm.html | wc -l)" -eq 6
                    grep -q 'product-guilu-drink-180cc.html' choose.html
                    grep -q '15張核准小老闆頁面配置' site.js
                    grep -q 'BEGIN CONSOLIDATED V408' site.css
                    python3 - <<'PY'
                    import json
                    from pathlib import Path
                    data=json.loads(Path('data.json').read_text())
                    assert len(data['products'])==6
                    for p in data['products']:
                        assert p['image'].split('?')[0].endswith('.webp')
                        assert p['dmImage'].split('?')[0].endswith('.webp')
                        assert Path(p['image'].split('?')[0]).is_file()
                        assert Path(p['dmImage'].split('?')[0]).is_file()
                    core=Path('site.js').read_text()
                    assert 'const thumb = p.image' in core
                    assert 'p.dmImage ||' in core
                    PY
                - name: Prepare static website
                  run: |
                    rm -rf _site
                    mkdir -p _site
                    rsync -a ./ _site/ \
                      --exclude='.git/' --exclude='.github/' --exclude='_site/' \
                      --exclude='tools/' --exclude='node_modules/' \
                      --exclude='*.zip' --exclude='*.b64' --exclude='*.md'
                    touch _site/.nojekyll
                    test -s _site/index.html
                    test -s _site/products.html
                    test -s _site/dm.html
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          sed -i 's/^          //' .github/workflows/deploy-pages.yml

      - name: Remove obsolete temporary workflows and validate
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-product-assets-v408.yml
          rm -f .github/workflows/run-v408-now.yml
          rm -f .github/workflows/trigger-v408-once.yml
          rm -f .github/workflows/apply-v408-simple.yml
          rm -f .github/workflows/debug-v408.yml
          rm -f .github/workflows/test-drive-download-v408.yml
          rm -f .github/workflows/apply-v408-safe.yml
          rm -f .github/workflows/consolidate-frontend-v408.yml
          rm -f .github/workflows/apply-site-sync-v4071.yml
          rm -f .github/workflows/cleanup-sync-v4071.yml
          rm -f .github/workflows/apply-v408-from-comments.yml

          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          python3 -m json.tool images/v408-assets-manifest.json >/dev/null
          test "$(grep -o 'class="dm-image-v2"' dm.html | wc -l)" -eq 6
          ! grep -R -E 'site-core\.js|approved-mascot-v405\.js|site-v321\.css|site-v405\.css' -- *.html
          ! grep -R -E 'images/(products-v3|dm-final)/[^" ]+\.jpg' -- *.html data.json site.js
          grep -q 'const thumb = p.image' site.js
          grep -q 'p.dmImage ||' site.js
          grep -q '"version": "408.1"' deploy-version.json
          grep -q 'guilu-gao.webp?v=408.1' data.json
          grep -q '01_guilu-gao-100g-dm.webp?v=408.1' data.json

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成六項產品圖與DM更新並整合前端 v408.1'
          git push origin HEAD:main

      - name: Report completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment 97 --repo "$REPO" --body 'V408_FULL_UPDATE_SUCCESS｜六張產品圖、六張DM、產品卡、快速查看跳窗、六個詳細頁、DM頁、單一site.js、單一site.css、版本與部署驗收均已完成並推送main。'
          gh issue close 97 --repo "$REPO" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment 97 --repo "$REPO" --body 'V408_FULL_UPDATE_FAILURE｜未推送半成品，請查看本次Actions失敗步驟。'
