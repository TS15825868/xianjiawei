name: Apply site v408.7 full

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: apply-site-v4087-full
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_SITE_V4087_FULL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified update script
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown beautifulsoup4 pillow
          gdown '1JFafCAXXmcpCpf15nKTqi-dmC9-dtZk4' -O /tmp/apply_v4087.py
          echo '3d1736577a3ff8a75141e0d2316af7a266ea97391b871c01520963bb739a1fef  /tmp/apply_v4087.py' | sha256sum -c -

      - name: Apply v408.7 full update
        run: |
          set -euo pipefail
          python3 /tmp/apply_v4087.py

      - name: Replace production deploy workflow
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy 仙加味網站

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout main
                  uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 1

                - name: Validate v408.7 website
                  run: |
                    set -euo pipefail
                    node --check site.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool catalog-public.json >/dev/null
                    python3 -m json.tool deploy-version.json >/dev/null
                    grep -q '"version": "408.7"' deploy-version.json
                    grep -q '整合正式版 v408.7' site.js
                    grep -q '五大產品型態、六項規格' products.html
                    grep -q '龜鹿飲180cc鋁袋' products.html
                    test "$(grep -o '<url>' sitemap.xml | wc -l)" -eq 20
                    grep -q 'catalog-public.json' llms.txt
                    grep -q 'Sitemap: https://ts15825868.github.io/xianjiawei/sitemap.xml' robots.txt
                    echo 'ab92c43f68c2d11f33b036e99e9bc31dde3c199c187ead2032fd72bccfdac58b  images/dm-final/01_guilu-gao-100g-dm.jpg' | sha256sum -c -
                    echo 'e46b71ca2265adf544087ba3badbf430821896961c0deb4d1dbde13478d39f49  images/dm-final/02_guilu-drink-30cc-dm.jpg' | sha256sum -c -
                    echo '81f10bb54c66bb273ddbb040f3e634db3239ac4a85931916ce234f099228e5f1  images/dm-final/03_guilu-drink-180cc-dm.jpg' | sha256sum -c -
                    echo 'cdac8d1a3484e941224d3c7725b0d55b073b94286e6f4a000a7ae80e18def121  images/dm-final/04_luerong-fen-75g-dm.jpg' | sha256sum -c -
                    echo 'e5d2d0ce9413f21a0507fcee8e90a1990d408c26b39667008d68046043448d99  images/dm-final/05_guilu-tangkuai-75g-dm.jpg' | sha256sum -c -
                    echo 'f3e6a24fc83f385feb5dda38a24a310de13c46150929d6ea45cb5050caa562a9  images/dm-final/06_guilu-jiao-600g-dm.jpg' | sha256sum -c -
                    python3 - <<'PY'
                    from pathlib import Path
                    import json
                    d=json.loads(Path('data.json').read_text(encoding='utf-8'))
                    assert len(d['products']) == 6
                    for p in d['products']:
                        assert p['image'].endswith('?v=408.7')
                        assert p['dmImage'].endswith('?v=408.7')
                    pages=['product-guilu-gao.html','product-guilu-drink-30cc.html','product-guilu-drink-180cc.html','product-guilu-tangkuai.html','product-guilu-jiao.html','product-luerong-fen.html']
                    for page in pages:
                        s=Path(page).read_text(encoding='utf-8')
                        assert s.count('<h1') == 1
                        assert '完整產品資料' in s
                        assert 'product-dm-compact' in s
                        assert 'product-mascot-anchor' in s
                    for p in Path('images/brand/approved-v405').glob('*.webp'):
                        assert p.stat().st_size > 20000
                    assert len(list(Path('images/brand/approved-v405').glob('*.webp'))) == 15
                    print('v408.7 validation passed')
                    PY

                - name: Build lean static website
                  run: python3 tools/build_static_v4087.py

                - name: Configure Pages
                  uses: actions/configure-pages@v5

                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site

                - name: Deploy Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Remove temporary workflows and stale automation files
        run: |
          rm -f .github/workflows/apply-site-v4087-full.yml
          rm -f .github/workflows/report-deploy-v4086.yml
          rm -f .github/workflows/report-deploy-v4086-log.yml
          rm -f .github/workflows/report-deploy-v4086-error.yml
          rm -f .github/workflows/confirm-deploy-v4086-success.yml
          rm -f .github/workflows/confirm-latest-deploy-v4086.yml
          rm -f .github/workflows/report-dm-v4086-failure.yml

      - name: Commit directly to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成整站SEO AIO產品頁與效能優化 v408.7'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          echo '[]' > /tmp/runs.json
          for i in $(seq 1 36); do
            gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --commit "$TARGET_SHA" --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json || true
            status=$(python3 - <<'PY'
          import json
          try:
              runs=json.load(open('/tmp/runs.json'))
              print(runs[0].get('status','') if runs else '')
          except Exception:
              print('')
          PY
            )
            [ "$status" = 'completed' ] && break
            sleep 10
          done
          conclusion=$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json'))
          print(runs[0].get('conclusion','') if runs else '')
          PY
          )
          cat /tmp/runs.json
          test "$conclusion" = 'success'

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_SUCCESS｜整站資訊層級、六項產品完整介紹、SEO/AIO、sitemap、robots、llms、機器可讀產品資料、圖片WebP、精簡部署與GitHub Pages正式上線全部驗收成功。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_FAILURE｜本次流程未完成，不宣稱上線；請查看失敗步驟後修正。'
