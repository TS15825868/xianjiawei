name: v294 product images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow

      - name: Generate product cards and DMs
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import json, textwrap

          ROOT = Path('.')
          OUT_PRODUCT = ROOT / 'images' / 'products-v3'
          OUT_DM = ROOT / 'images' / 'dm-v3'
          OUT_PRODUCT.mkdir(parents=True, exist_ok=True)
          OUT_DM.mkdir(parents=True, exist_ok=True)

          regular_paths = [
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc',
          ]
          bold_paths = [
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc',
              '/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc',
          ]
          def find_font(paths):
              for p in paths:
                  if Path(p).exists(): return p
              raise FileNotFoundError(paths)
          REG = find_font(regular_paths)
          BOLD = find_font(bold_paths)
          def font(size, bold=False): return ImageFont.truetype(BOLD if bold else REG, size)

          products = [
              {
                  'id':'guilu-gao','title':'龜鹿膏','subtitle':'日常食補安排','spec':'100g／罐',
                  'source':['images/products-v2/guilu-gao.jpeg','images/dm-final/01_guilu-gao-100g-dm.jpg'],
                  'features':['可直接食用','可熱水化開','方便日常安排'],
                  'ingredients':['鹿角萃取物','龜板萃取物','枸杞','紅棗','黃耆','粉光蔘'],
                  'usage':['早上或下午取1～2小匙','可直接食用','或加入約100～300mL熱水化開後飲用'],
                  'storage':['未開封置於陰涼乾燥處','也可保存於5°C以下冷藏','開封後請密封冷藏並儘早食用完畢'],
                  'accent':'#7B1E1E'
              },
              {
                  'id':'guilu-drink-30','title':'龜鹿飲','subtitle':'30cc／玻璃瓶','spec':'30cc／瓶',
                  'source':['images/products-v2/guilu-drink-30.jpeg','images/dm-final/02_guilu-drink-30cc-dm.jpg'],
                  'features':['即開即飲','輕巧方便','也可溫熱後飲用'],
                  'ingredients':['水','鹿角萃取物','龜板萃取物','枸杞','紅棗','黃耆','粉光蔘'],
                  'usage':['開瓶即可飲用','可依個人習慣隔水溫熱後飲用','開瓶後請儘速飲用完畢'],
                  'storage':['未開封置於陰涼乾燥處','也可保存於5°C以下冷藏','開瓶後請儘速飲用完畢'],
                  'accent':'#8A2520'
              },
              {
                  'id':'guilu-drink-180','title':'龜鹿飲','subtitle':'180cc／鋁袋','spec':'180cc／包',
                  'source':['images/products-v2/guilu-drink-180.jpeg','images/dm-final/03_guilu-drink-180cc-dm.jpg'],
                  'features':['即開即飲','鋁袋包裝','也可溫熱後飲用'],
                  'ingredients':['水','鹿角萃取物','龜板萃取物','枸杞','紅棗','黃耆','粉光蔘'],
                  'usage':['打開即可飲用','可隔水加熱後飲用','亦可倒入杯中後加熱飲用'],
                  'storage':['未開封置於陰涼乾燥處','也可保存於5°C以下冷藏','開封後請儘速飲用完畢'],
                  'accent':'#8A2520'
              },
              {
                  'id':'guilu-tangkuai','title':'龜鹿湯塊','subtitle':'日常燉湯與熱飲的簡單安排','spec':'75g／盒｜8塊裝｜每塊9.375g',
                  'source':['images/products-v2/guilu-tangkuai.jpeg','images/dm-final/05_guilu-tangkuai-75g-dm.jpg'],
                  'features':['可熱水沖泡','可保溫壺悶泡','適合雞湯、排骨湯搭配'],
                  'ingredients':['鹿角萃取物','龜板萃取物'],
                  'usage':['取1塊加入約300～500mL熱水','可放入保溫壺悶泡','也可加入雞湯、排骨湯等燉煮'],
                  'storage':['常溫置於陰涼處','或保存於5°C以下冷藏','開封後請密封保存並儘早食用完畢'],
                  'accent':'#0B2D5B'
              },
              {
                  'id':'guilu-jiao','title':'龜鹿膠','subtitle':'大包裝安排','spec':'600g／盒（1斤）｜32塊裝｜每塊18.75g',
                  'source':['images/products-v2/guilu-jiao.jpeg','images/dm-final/06_guilu-jiao-600g-dm.jpg'],
                  'features':['可熱水化開','可直接食用','也可燉煮使用'],
                  'ingredients':['鹿角萃取物','龜板萃取物'],
                  'usage':['取適量加入約300～500mL熱水化開','可依個人需求直接食用','也可加入雞湯、排骨湯等燉煮'],
                  'storage':['常溫置於陰涼處','或保存於5°C以下冷藏','開封後請密封保存並儘早食用完畢'],
                  'accent':'#72519B'
              },
              {
                  'id':'luerong-fen','title':'鹿茸粉','subtitle':'日常調飲的簡單安排','spec':'75g／罐',
                  'source':['images/products-v2/luerong-fen.jpeg','images/dm-final/04_luerong-fen-75g-dm.jpg'],
                  'features':['可加入溫開水','可搭配牛奶、豆漿','方便日常調飲'],
                  'ingredients':['鹿茸'],
                  'usage':['依個人需求取適量鹿茸粉','加入溫開水或熱飲中攪拌均勻','也可搭配牛奶、豆漿或其他飲品'],
                  'storage':['置於陰涼乾燥處','避免陽光直射及高溫環境','開封後請密封保存並儘早食用完畢'],
                  'accent':'#8B6425'
              },
          ]

          BG = '#F7F2E8'; INK = '#241E19'; MUTED = '#665E55'; GOLD = '#B28A48'

          def pick_source(paths):
              for p in paths:
                  path = ROOT / p
                  if path.exists(): return path
              raise FileNotFoundError('No product source found: ' + ', '.join(paths))

          def rounded(draw, box, radius=24, fill='#FFFFFF', outline='#D8C7AA', width=2):
              draw.rounded_rectangle(box, radius=radius, fill=fill, outline=outline, width=width)

          def paste_contain(canvas, src_path, box):
              x1,y1,x2,y2 = box
              src = Image.open(src_path).convert('RGB')
              fitted = ImageOps.contain(src, (x2-x1, y2-y1), Image.Resampling.LANCZOS)
              layer = Image.new('RGB',(x2-x1,y2-y1),'#FFFFFF')
              layer.paste(fitted, ((layer.width-fitted.width)//2,(layer.height-fitted.height)//2))
              canvas.paste(layer,(x1,y1))

          def center(draw, y, text, f, fill=INK, width=None):
              width = width or draw._image.width
              bb = draw.textbbox((0,0), text, font=f)
              draw.text(((width-(bb[2]-bb[0]))/2,y), text, font=f, fill=fill)

          def wrapped(draw, xy, text, f, max_width, fill=INK, line_gap=8):
              x,y = xy; line=''; lines=[]
              for ch in text:
                  test=line+ch
                  if draw.textbbox((0,0),test,font=f)[2] <= max_width: line=test
                  else:
                      if line: lines.append(line)
                      line=ch
              if line: lines.append(line)
              for ln in lines:
                  draw.text((x,y),ln,font=f,fill=fill)
                  y += f.size + line_gap
              return y

          def product_card(p):
              im=Image.new('RGB',(800,1000),BG); d=ImageDraw.Draw(im)
              d.rounded_rectangle((18,18,782,982),radius=34,outline=GOLD,width=3)
              center(d,45,'仙加味',font(34,True),p['accent'])
              center(d,105,p['title'],font(70,True),p['accent'])
              center(d,190,p['subtitle'],font(28),MUTED)
              rounded(d,(70,245,730,745),28,'#FFFFFF','#DDCEB5',2)
              paste_contain(im,pick_source(p['source']),(85,260,715,730))
              center(d,775,p['spec'],font(32,True),INK)
              y=842
              for feat in p['features']:
                  d.ellipse((90,y+5,108,y+23),fill=GOLD)
                  d.text((125,y),feat,font=font(25),fill=INK)
                  y+=43
              return im

          def dm_card(p):
              im=Image.new('RGB',(900,1200),BG); d=ImageDraw.Draw(im)
              d.rounded_rectangle((18,18,882,1182),radius=34,outline=GOLD,width=3)
              center(d,38,'仙加味',font(30,True),p['accent'])
              center(d,88,p['title'],font(58,True),p['accent'])
              center(d,155,'補養，是一種節奏。',font(25),MUTED)
              rounded(d,(55,205,845,650),24,'#FFFFFF','#DDCEB5',2)
              paste_contain(im,pick_source(p['source']),(70,220,830,635))
              center(d,675,p['spec'],font(27,True),INK)

              boxes=[
                  ('產品特色',p['features']),('成分',p['ingredients']),
                  ('使用方式',p['usage']),('保存方式',p['storage'])
              ]
              coords=[(45,730,435,925),(465,730,855,925),(45,945,435,1135),(465,945,855,1135)]
              for (title,items),box in zip(boxes,coords):
                  x1,y1,x2,y2=box; rounded(d,box,20,'#FFFDFC','#DDCEB5',2)
                  d.rounded_rectangle((x1+18,y1+14,x1+175,y1+55),radius=18,fill=p['accent'])
                  d.text((x1+35,y1+20),title,font=font(23,True),fill='#FFFFFF')
                  yy=y1+70
                  for item in items:
                      d.ellipse((x1+22,yy+8,x1+34,yy+20),fill=GOLD)
                      yy=wrapped(d,(x1+45,yy),item,font(19),x2-x1-65,INK,5)+5
              center(d,1150,'實際產品外觀以原包裝為準',font(17),MUTED)
              return im

          for p in products:
              product_card(p).save(OUT_PRODUCT / f"{p['id']}.jpg",quality=86,optimize=True,progressive=True)
              dm_card(p).save(OUT_DM / f"{p['id']}.jpg",quality=86,optimize=True,progressive=True)

          data_path=ROOT/'data.json'
          data=json.loads(data_path.read_text(encoding='utf-8'))
          for p in data.get('products',[]):
              pid=p['id']
              if pid=='guilu-drink-30':
                  p['image']='images/products-v3/guilu-drink-30.jpg'
                  p['dmImage']='images/dm-v3/guilu-drink-30.jpg'
                  p['detailImages']=['images/dm-v3/guilu-drink-30.jpg','images/dm-v3/guilu-drink-180.jpg']
              else:
                  p['image']=f'images/products-v3/{pid}.jpg'
                  p['dmImage']=f'images/dm-v3/{pid}.jpg'
                  p['detailImages']=[f'images/dm-v3/{pid}.jpg']
              if pid in ('guilu-tangkuai','guilu-jiao'):
                  p['ingredients']=['鹿角萃取物','龜板萃取物']
          data['version']='294.0'
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for html in ROOT.glob('*.html'):
              text=html.read_text(encoding='utf-8')
              text=text.replace('site.js?v=293.0','site.js?v=294.0')
              text=text.replace('site.js?v=292.0','site.js?v=294.0')
              for old,new in {
                  'images/products-v2/guilu-gao.jpeg':'images/products-v3/guilu-gao.jpg',
                  'images/products-v2/guilu-drink-30.jpeg':'images/products-v3/guilu-drink-30.jpg',
                  'images/products-v2/guilu-drink-180.jpeg':'images/products-v3/guilu-drink-180.jpg',
                  'images/products-v2/guilu-tangkuai.jpeg':'images/products-v3/guilu-tangkuai.jpg',
                  'images/products-v2/guilu-jiao.jpeg':'images/products-v3/guilu-jiao.jpg',
                  'images/products-v2/luerong-fen.jpeg':'images/products-v3/luerong-fen.jpg',
              }.items(): text=text.replace(old,new)
              html.write_text(text,encoding='utf-8')

          core=ROOT/'site-v287-core.js'
          text=core.read_text(encoding='utf-8').replace('data.json?v=293.0','data.json?v=294.0').replace('data.json?v=292.0','data.json?v=294.0')
          core.write_text(text,encoding='utf-8')
          site=ROOT/'site.js'
          text=site.read_text(encoding='utf-8').replace('site-v287-core.js?v=293.0','site-v287-core.js?v=294.0')
          site.write_text(text,encoding='utf-8')

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/products-v3 images/dm-v3 data.json '*.html' site.js site-v287-core.js
          git commit -m "v294: publish real-product cards and DMs"
          git push origin main
