name: 仙加味官網跨裝置視覺／功能完整驗收
# visual audit version: 20261005-v28-final

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'images/**'
      - '.github/workflows/responsive-visual-audit-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-responsive-visual-audit-current
  cancel-in-progress: true

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      XJW_BROWSER_ENGINE: ${{ matrix.engine }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - name: Confirm latest main is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url='https://ts15825868.github.io/xianjiawei/index.html'
          expected="$(grep -o 'site.css?v=[^"[:space:]]*' index.html | head -1)"
          test -n "$expected"
          echo "Waiting for live release marker: $expected"
          ok=0
          for i in $(seq 1 36); do
            code="$(curl -LsS --retry 1 --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o live-index.html -w '%{http_code}' "$url?audit=${GITHUB_SHA}" || true)"
            if [ "$code" = "200" ] && [ -s live-index.html ] && grep -Fq "$expected" live-index.html; then
              echo "Latest main is live on attempt $i"
              grep -o 'site.css?v=[^"[:space:]]*' live-index.html | head -1 || true
              ok=1
              break
            fi
            live="$(grep -o 'site.css?v=[^"[:space:]]*' live-index.html 2>/dev/null | head -1 || true)"
            echo "Waiting for latest Pages deployment... $i/36 (HTTP $code, live=$live)"
            sleep 5
          done
          test "$ok" = '1'

      - name: Install Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps "$XJW_BROWSER_ENGINE"

      - name: Audit desktop tablet iPhone Android
        shell: bash
        run: |
          set -euo pipefail
          cat > xjw-responsive-audit.cjs <<'NODE'
          const fs=require('fs');
          const browserType=require('playwright')[process.env.XJW_BROWSER_ENGINE];

          const BASE='https://ts15825868.github.io/xianjiawei/';
          const productMaster=JSON.parse(fs.readFileSync('public-product-master.json','utf8'));
          const publicCount=productMaster.products.length;
          if(productMaster.productCount!==publicCount)throw new Error('公開產品數與母資料不一致');
          const mediaAuthority=JSON.parse(fs.readFileSync('data/product-media-authority.json','utf8'));
          const approvedMainPaths=[...new Set(Object.values(mediaAuthority.products||{}).map(item=>new URL(String(item.mainImage||''),BASE).pathname).filter(Boolean))];
          const pages=[
            'index.html','products.html','choose.html','guide.html','recipes.html','trial.html','faq.html','brand.html','contact.html','dm.html',
            'product-guilu-gao.html','product-guilu-drink-30cc.html','product-guilu-drink-180cc.html','product-guilu-tangkuai.html','product-guilu-jiao.html','product-luerong-fen.html',
            'knowledge.html','why-guilu.html','video.html','sources.html','brand-facts.html','brand-origin.html','craft.html','ingredients.html','quality.html','combo.html','hanfang-baike.html','trial-line.html','404.html'
          ];
          const viewports={
            desktop:{width:1440,height:1000,isMobile:false,hasTouch:false},
            tablet:{width:820,height:1180,isMobile:false,hasTouch:true},
            iphone:{width:390,height:844,isMobile:true,hasTouch:true},
            android:{width:412,height:915,isMobile:true,hasTouch:true}
          };
          const keyScreens=new Set(['index.html','products.html','choose.html','guide.html','recipes.html','trial.html','faq.html','brand.html','contact.html','why-guilu.html','product-guilu-gao.html','product-guilu-drink-30cc.html','product-guilu-drink-180cc.html','product-guilu-tangkuai.html','product-guilu-jiao.html','product-luerong-fen.html']);

          function rgb(s){
            const m=String(s||'').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/);
            return m?{r:+m[1],g:+m[2],b:+m[3],a:m[4]===undefined?1:+m[4]}:null;
          }
          function lum(c){
            const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
            return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b);
          }
          function contrast(a,b){
            const l1=lum(a),l2=lum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
          }

          (async()=>{
            fs.mkdirSync('responsive-audit-screens',{recursive:true});
            const browser=await browserType.launch();
            const report={generatedAt:new Date().toISOString(),base:BASE,viewports:{},errors:[],warnings:[]};
            const linkStatusCache=new Map();

            for(const [vpName,vp] of Object.entries(viewports)){
              const context=await browser.newContext({
                viewport:{width:vp.width,height:vp.height},
                isMobile:vp.isMobile,
                hasTouch:vp.hasTouch,
                deviceScaleFactor:1,
                locale:'zh-TW'
              });
              report.viewports[vpName]={};

              for(const pth of pages){
                const page=await context.newPage();
                if(pth==='trial-line.html'){
                  // Validate the live handoff URL, then suspend only automatic external navigation while inspecting its layout.
                  await page.route(BASE+pth,async route=>{
                    const response=await route.fetch();
                    const html=await response.text();
                    if(!html.includes("const target='https://line.me/R/oaMessage/%40762jybnm/"))throw new Error('Trial handoff is not official LINE OA');
                    await route.fulfill({response,body:html.replace('setTimeout(()=>location.href=target,650);','/* automatic handoff suspended for layout evidence only */')});
                  });
                }
                const consoleErrors=[],pageErrors=[],requestFailed=[];
                page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()) });
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('requestfailed',r=>requestFailed.push({url:r.url(),failure:r.failure()}));

                let response;
                try{
                  response=await page.goto(BASE+pth,{waitUntil:'domcontentloaded',timeout:30000});
                  if(pth!=='trial-line.html'){
                    await page.waitForFunction(()=>Boolean(document.documentElement.dataset.xjwRuntime)&&document.body.classList.contains('ux-v410'),{timeout:12000}).catch(()=>{});
                    if(pth==='products.html'){
                      await page.waitForFunction(count=>document.querySelectorAll('#product-list .product-card').length===count,publicCount,{timeout:12000}).catch(()=>{});
                    }
                  }
                  // 驗收證據必須把 lazy 圖也實際載入，避免 fullPage 截圖出現假性空白卡。
                  await page.evaluate(()=>{
                    document.querySelectorAll('img[loading="lazy"]').forEach(img=>{img.loading='eager';});
                  });
                  await page.waitForFunction(() => {
                    return [...document.images].filter(i=>i.getAttribute('src')).every(i=>i.complete&&i.naturalWidth>0);
                  },{timeout:8000}).catch(()=>{});
                  await page.waitForTimeout(260);
                }catch(e){
                  report.errors.push({vp:vpName,page:pth,type:'navigation',detail:String(e)});
                  await page.close(); continue;
                }

                const audit=await page.evaluate((approvedMainPaths) => {
                  const approvedMainSet=new Set(approvedMainPaths);
                  const visible=el=>!!(el&&(el.offsetWidth||el.offsetHeight||el.getClientRects().length));
                  const css=el=>getComputedStyle(el);
                  const imgs=[...document.images];
                  const header=document.querySelector('.site-header');
                  const menuBtn=document.querySelector('.menu-btn');
                  const h1=document.querySelector('h1');
                  const paras=[...document.querySelectorAll('main p')]
                    .filter(visible)
                    .filter(p=>!p.matches('.eyebrow,.product-purpose,.muted'));
                  const duplicates=[...document.querySelectorAll('[id]')].map(e=>e.id).filter((id,i,a)=>id&&a.indexOf(id)!==i);
                  const rawLinks=[...document.querySelectorAll('a[href]')].filter(visible).map(a=>({
                    text:(a.textContent||'').trim().slice(0,80),
                    href:(a.getAttribute('href')||'').trim()
                  }));
                  const badInteractiveLinks=rawLinks.filter(x=>!x.href||x.href==='#'||/^javascript:/i.test(x.href));
                  const badLineLinks=rawLinks.filter(x=>/^https:\/\/lin\.ee\//i.test(x.href)&&x.href!=='https://lin.ee/sHZW7NkR');
                  const formalProductImages=imgs.filter(i=>visible(i)&&Boolean(i.closest('.product-card__img,.home-product-showcase__grid a,.product-detail-hero__media,.modal-gallery__item,.trial-product-card__media'))).map(i=>{
                    const media=i.closest('.product-card__img,.home-product-showcase__grid a,.product-detail-hero__media,.modal-gallery__item,.trial-product-card__media');
                    const src=i.getAttribute('src')||'';
                    let approvedSource=false;
                    try{
                      approvedSource=approvedMainSet.has(new URL(src,location.href).pathname);
                    }catch{}
                    return {
                      src,approvedSource,
                      objectFit:css(i).objectFit,
                      objectPosition:css(i).objectPosition,
                      transform:css(i).transform,
                      mediaOverflowX:media?css(media).overflowX:'',
                      mediaOverflowY:media?css(media).overflowY:'',
                      width:Math.round(i.getBoundingClientRect().width),
                      height:Math.round(i.getBoundingClientRect().height)
                    };
                  });
                  const productImageStyleIssues=formalProductImages.filter(i=>
                    !i.approvedSource||i.objectFit!=='contain'||i.transform!=='none'
                  );
                  const oldBrandPresent=(document.documentElement.innerHTML||'').includes('台興山產');
                  const runtime=document.documentElement.dataset.xjwRuntime||'';

                  const tiny=[...document.querySelectorAll('main p, main li, main a, .btn, .menu-group a, .footer-card a, .footer-card p')]
                    .filter(visible)
                    .map(el=>({text:(el.textContent||'').trim().slice(0,70),size:parseFloat(css(el).fontSize),tag:el.tagName,cls:el.className||''}))
                    .filter(x=>x.text&&x.size<11.5)
                    .slice(0,20);

                  const overflow=[...document.querySelectorAll('body *')].filter(visible).map(el=>{
                    const r=el.getBoundingClientRect(); return {el,r};
                  }).filter(x=>x.r.left<-3||x.r.right>innerWidth+3).slice(0,20).map(x=>({
                    tag:x.el.tagName,id:x.el.id||'',cls:String(x.el.className||'').slice(0,100),left:x.r.left,right:x.r.right
                  }));

                  const tapSmall=[...document.querySelectorAll('.btn,.menu-btn,.menu-close,.header-line-cta,.floating-line-cta')]
                    .filter(visible).map(el=>{const r=el.getBoundingClientRect();return {text:(el.textContent||'').trim().slice(0,50),w:r.width,h:r.height,cls:el.className||''}})
                    .filter(x=>x.w<40||x.h<40).slice(0,20);

                  const contrastWarnings=[];
                  for(const el of [...document.querySelectorAll('main h1,main h2,main h3,main p,main li,.btn,.site-header a,.site-header button,.footer-card p,.footer-card a,.footer-card h3')]){
                    if(!visible(el)) continue;
                    const s=css(el), fg=s.color;
                    let node=el,bg=null,gradient=false;
                    for(let i=0;i<5&&node;i++,node=node.parentElement){
                      const ns=css(node);
                      if(ns.backgroundImage && ns.backgroundImage!=='none') gradient=true;
                      const c=ns.backgroundColor;
                      if(c && !c.endsWith(', 0)') && c!=='rgba(0, 0, 0, 0)' && c!=='transparent'){bg=c;break}
                    }
                    if(gradient||!bg) continue;
                    const fm=fg.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/), bm=bg.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/);
                    if(!fm||!bm) continue;
                    const fc={r:+fm[1],g:+fm[2],b:+fm[3]}, bc={r:+bm[1],g:+bm[2],b:+bm[3]};
                    const cv=(c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)})(fc);
                    const bv=(c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)})(bc);
                    const ratio=(Math.max(cv,bv)+.05)/(Math.min(cv,bv)+.05);
                    const large=parseFloat(s.fontSize)>=24 || (parseFloat(s.fontSize)>=18.66 && parseInt(s.fontWeight)>=700);
                    if(ratio<(large?3:4.5)) contrastWarnings.push({text:(el.textContent||'').trim().slice(0,70),tag:el.tagName,cls:el.className||'',fg,bg,ratio:+ratio.toFixed(2),size:s.fontSize});
                    if(contrastWarnings.length>=20) break;
                  }

                  return {
                    title:document.title,
                    w:innerWidth,h:innerHeight,
                    scrollWidth:document.documentElement.scrollWidth,
                    scrollHeight:document.documentElement.scrollHeight,
                    overflowX:document.documentElement.scrollWidth>innerWidth+3,
                    header:header?{position:css(header).position,top:header.getBoundingClientRect().top,height:header.getBoundingClientRect().height,z:css(header).zIndex}:null,
                    menuBtn:menuBtn?{visible:visible(menuBtn),w:menuBtn.getBoundingClientRect().width,h:menuBtn.getBoundingClientRect().height}:null,
                    h1:h1?{size:parseFloat(css(h1).fontSize),color:css(h1).color,text:h1.textContent.trim().slice(0,90)}:null,
                    bodyFont:parseFloat(css(document.body).fontSize),
                    paragraphFont:paras.length?Math.min(...paras.slice(0,30).map(x=>parseFloat(css(x).fontSize))):null,
                    brokenImages:imgs.filter(i=>(!i.complete||!i.naturalWidth)&&String(i.loading||'').toLowerCase()!=='lazy').map(i=>i.src),
                    loadedImagePaths:imgs.filter(i=>i.complete&&i.naturalWidth>0).map(i=>{try{return new URL(i.currentSrc||i.src,location.href).pathname}catch{return''}}).filter(Boolean),
                    missingAlt:imgs.filter(i=>visible(i)&&!i.alt).map(i=>i.src),
                    duplicateIds:[...new Set(duplicates)],
                    rawLinks,badInteractiveLinks,badLineLinks,
                    formalProductImages,productImageStyleIssues,oldBrandPresent,runtime,
                    tiny,overflow,tapSmall,contrastWarnings
                  };
                },approvedMainPaths);

                // Header/選單實際互動測試
                let menuTest=null;
                if(pth==='trial-line.html'){
                  menuTest={handoff:true};
                }else if(vpName!=='desktop'){
                  try{
                    await page.evaluate(()=>window.scrollTo(0,Math.min(document.body.scrollHeight*.58,2200)));
                    await page.waitForTimeout(120);
                    const fixed=await page.locator('.site-header').evaluate(el=>({top:el.getBoundingClientRect().top,position:getComputedStyle(el).position}));
                    const menu=page.locator('.menu-btn');
                    if(await menu.isVisible()){
                      await menu.click();
                      await page.waitForTimeout(100);
                      const opened=await page.evaluate(()=>({
                        aria:document.querySelector('.menu-btn')?.getAttribute('aria-expanded'),
                        bodyClass:document.body.className,
                        menuClass:document.querySelector('.site-menu')?.className,
                        panelVisible:!!document.querySelector('.site-menu__panel')?.getClientRects().length
                      }));
                      if(await page.locator('.menu-close').isVisible()) await page.locator('.menu-close').click();
                      menuTest={fixed,opened};
                    }else menuTest={fixed,error:'menu button not visible'};
                  }catch(e){menuTest={error:String(e)}}
                }else{
                  menuTest=await page.evaluate(()=>({
                    headerNavVisible:!!document.querySelector('.header-nav')?.getClientRects().length,
                    menuVisible:!!document.querySelector('.menu-btn')?.getClientRects().length
                  }));
                }

                const status=response?response.status():null;
                report.viewports[vpName][pth]={status,...audit,menuTest,consoleErrors,pageErrors,requestFailed};

                if(pth!=='trial-line.html'){
                  const footerAudit=await page.evaluate(()=>{
                    const footer=document.querySelector('.site-footer');
                    const card=footer?.querySelector('.footer-card');
                    const sample=card?.querySelector('.footer-brand-block p,.footer-contact p,.footer-nav-links a,.footer-legal');
                    const css=el=>el?getComputedStyle(el):null;
                    return {
                      exists:Boolean(footer&&card&&sample),
                      backgroundColor:css(footer)?.backgroundColor||'',
                      backgroundImage:css(footer)?.backgroundImage||'',
                      textColor:css(sample)?.color||''
                    };
                  });
                  report.viewports[vpName][pth].footerAudit=footerAudit;
                  const bg=rgb(footerAudit.backgroundColor),fg=rgb(footerAudit.textColor);
                  const ratio=bg&&fg?contrast(bg,fg):0;
                  if(!footerAudit.exists) report.errors.push({vp:vpName,page:pth,type:'footer-missing',detail:footerAudit});
                  else if(!fg||ratio<4.5) report.errors.push({vp:vpName,page:pth,type:'footer-low-contrast',detail:{...footerAudit,contrast:ratio}});
                }

                // 首頁產品可用完整網格或橫滑；只有橫滑需要下一張提示。
                if(pth==='index.html'&&(vpName==='iphone'||vpName==='android')){
                  const homeProductRail=await page.evaluate(()=>{
                    const grid=document.querySelector('.home-product-showcase__grid');
                    const cards=[...document.querySelectorAll('.home-product-showcase__grid>a')];
                    const hint=document.querySelector('.home-product-swipe-hint');
                    const allLink=document.querySelector('.home-product-showcase__all');
                    const shown=el=>!!(el&&(el.offsetWidth||el.offsetHeight||el.getClientRects().length));
                    if(!grid||cards.length<2)return {count:cards.length,ready:false,hintVisible:shown(hint),allLinkVisible:shown(allLink)};
                    const gr=grid.getBoundingClientRect();
                    const first=cards[0].getBoundingClientRect();
                    const second=cards[1].getBoundingClientRect();
                    const peek=Math.max(0,Math.min(gr.right,second.right)-Math.max(gr.left,second.left));
                    return {
                      count:cards.length,
                      ready:true,
                      hintVisible:shown(hint),
                      allLinkVisible:shown(allLink),
                      overflowable:grid.scrollWidth>grid.clientWidth+5,
                      firstWidth:Math.round(first.width),
                      gridWidth:Math.round(gr.width),
                      nextPeek:Math.round(peek)
                    };
                  });
                  report.viewports[vpName][pth].homeProductRail=homeProductRail;
                  if(!homeProductRail.ready||!homeProductRail.allLinkVisible||(homeProductRail.overflowable&&(!homeProductRail.hintVisible||homeProductRail.nextPeek<24))){
                    report.errors.push({vp:vpName,page:pth,type:'mobile-product-rail-undiscoverable',detail:homeProductRail});
                  }
                }

                if(status!==200) report.errors.push({vp:vpName,page:pth,type:'http',detail:status});
                if(audit.overflowX) report.errors.push({vp:vpName,page:pth,type:'horizontal-overflow',detail:audit.overflow});
                if(audit.brokenImages.length) report.errors.push({vp:vpName,page:pth,type:'broken-images',detail:audit.brokenImages});
                if(audit.badInteractiveLinks.length) report.errors.push({vp:vpName,page:pth,type:'invalid-interactive-link',detail:audit.badInteractiveLinks});
                if(audit.badLineLinks.length) report.errors.push({vp:vpName,page:pth,type:'wrong-line-link',detail:audit.badLineLinks});
                if(audit.productImageStyleIssues.length) report.errors.push({vp:vpName,page:pth,type:'formal-product-image-style',detail:audit.productImageStyleIssues});
                if(audit.oldBrandPresent) report.errors.push({vp:vpName,page:pth,type:'old-public-brand-name',detail:'台興山產'});
                if(pth!=='trial-line.html'&&!audit.runtime) report.errors.push({vp:vpName,page:pth,type:'runtime-not-ready',detail:audit.runtime});
                if(audit.missingAlt.length) report.warnings.push({vp:vpName,page:pth,type:'missing-alt',detail:audit.missingAlt});
                if(pageErrors.length) report.errors.push({vp:vpName,page:pth,type:'page-errors',detail:pageErrors});

                if(vpName==='desktop'){
                  const baseUrl=new URL(BASE);
                  for(const link of audit.rawLinks){
                    const raw=String(link.href||'');
                    if(!raw||raw.startsWith('#')||/^(mailto:|tel:|javascript:)/i.test(raw)) continue;
                    let target;
                    try{target=new URL(raw,BASE+pth)}catch{continue}
                    if(target.origin!==baseUrl.origin||!target.pathname.startsWith(baseUrl.pathname)) continue;
                    target.hash='';
                    const key=target.toString();
                    if(!linkStatusCache.has(key)){
                      let finalStatus=null;
                      let finalError=null;
                      for(let attempt=1;attempt<=3;attempt++){
                        try{
                          const r=await context.request.get(key,{timeout:15000,failOnStatusCode:false});
                          finalStatus=r.status();
                          finalError=null;
                          if(finalStatus<500&&finalStatus!==429) break;
                        }catch(e){
                          finalError=String(e);
                        }
                        if(attempt<3) await page.waitForTimeout(350*attempt);
                      }
                      if(finalError&&finalStatus===null) linkStatusCache.set(key,{error:finalError});
                      else linkStatusCache.set(key,finalStatus);
                    }
                    const linkStatus=linkStatusCache.get(key);
                    if(typeof linkStatus==='number'&&linkStatus>=400){
                      report.errors.push({vp:vpName,page:pth,type:'broken-internal-link',detail:{...link,status:linkStatus,target:key}});
                    }else if(linkStatus&&typeof linkStatus==='object'&&linkStatus.error){
                      report.errors.push({vp:vpName,page:pth,type:'internal-link-request-failed',detail:{...link,target:key,error:linkStatus.error}});
                    }
                  }
                }
                const successfullyLoadedImagePaths=new Set(audit.loadedImagePaths||[]);
                const meaningfulRequestFailures=requestFailed.filter(x=>{
                  const url=String(x.url||'');
                  if(url.includes('google-analytics.com')||url.includes('googletagmanager.com'))return false;
                  const errorText=String(x.failure?.errorText||'');
                  if(errorText==='net::ERR_ABORTED'){
                    try{
                      const pathname=new URL(url,BASE+pth).pathname;
                      if(successfullyLoadedImagePaths.has(pathname))return false;
                      if(/\/images\/dm-final\//i.test(pathname))return false;
                    }catch{}
                  }
                  return true;
                });
                if(meaningfulRequestFailures.length) report.errors.push({vp:vpName,page:pth,type:'request-failed',detail:meaningfulRequestFailures});
                if(audit.duplicateIds.length) report.errors.push({vp:vpName,page:pth,type:'duplicate-ids',detail:audit.duplicateIds});
                if(audit.tapSmall.length && vpName!=='desktop') report.errors.push({vp:vpName,page:pth,type:'tap-target-small',detail:audit.tapSmall});
                if(audit.h1 && audit.h1.size<(vpName==='desktop'?32:30)) report.errors.push({vp:vpName,page:pth,type:'h1-too-small',detail:audit.h1});
                if(audit.paragraphFont && audit.paragraphFont<14) report.warnings.push({vp:vpName,page:pth,type:'body-text-small',detail:audit.paragraphFont});
                if(audit.tiny.length) report.warnings.push({vp:vpName,page:pth,type:'tiny-text',detail:audit.tiny});
                if(audit.contrastWarnings.length) report.warnings.push({vp:vpName,page:pth,type:'contrast-review',detail:audit.contrastWarnings});
                if(pth==='trial-line.html'){
                  // trial-line 是獨立 LINE 交接頁，不要求共用 Header／選單。
                }else if(vpName!=='desktop'){
                  if(menuTest?.error || Math.abs(menuTest?.fixed?.top||0)>2 || !['fixed','sticky'].includes(menuTest?.fixed?.position) || menuTest?.opened?.aria!=='true'){
                    report.errors.push({vp:vpName,page:pth,type:'fixed-menu',detail:menuTest});
                  }
                }else if(!menuTest?.headerNavVisible){
                  report.errors.push({vp:vpName,page:pth,type:'desktop-nav-hidden',detail:menuTest});
                }

                if(pth==='index.html'){
                  const affordance=await page.evaluate(()=>{
                    const els=[...document.querySelectorAll(
                      '.home-intro-section .section-actions .btn-outline,.home-choice-section .section-actions .btn-outline,.home-feature-card .btn-outline,.home-service-card:not(.home-service-card--line) .btn-outline'
                    )];
                    return els.map(el=>{
                      const s=getComputedStyle(el);
                      return {text:el.textContent.trim(),borderWidth:s.borderTopWidth,borderStyle:s.borderTopStyle,background:s.backgroundColor,height:el.getBoundingClientRect().height};
                    });
                  });
                  const bad=affordance.filter(x=>parseFloat(x.borderWidth)<1||x.borderStyle==='none'||x.background==='rgba(0, 0, 0, 0)'||x.height<44);
                  if(bad.length) report.errors.push({vp:vpName,page:pth,type:'home-secondary-button-affordance',detail:bad});
                }

                if(pth==='choose.html'){
                  const duplicateChoose=await page.locator('#choose-results').count();
                  if(duplicateChoose) report.errors.push({vp:vpName,page:pth,type:'choose-duplicate-results',detail:{count:duplicateChoose}});
                }

                if(pth==='brand-facts.html'){
                  const facts=await page.evaluate(()=>{
                    const table=document.querySelector('.facts-table');
                    const wrap=document.querySelector('.table-scroll');
                    const cards=[...document.querySelectorAll('.brand-facts-mobile .brand-fact-card')];
                    const visible=e=>!!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length));
                    return {tableVisible:visible(table)&&visible(wrap),cardCount:cards.length,visibleCards:cards.filter(visible).length};
                  });
                  report.viewports[vpName][pth].brandFacts=facts;
                  const mobile=vpName==='iphone'||vpName==='android';
                  if(mobile && (facts.cardCount!==publicCount||facts.visibleCards!==publicCount||facts.tableVisible)){
                    report.errors.push({vp:vpName,page:pth,type:'brand-facts-mobile-cards',detail:facts});
                  }
                  if(!mobile && vpName!=='tablet' && !facts.tableVisible){
                    report.errors.push({vp:vpName,page:pth,type:'brand-facts-desktop-table',detail:facts});
                  }
                }

                if(pth==='why-guilu.html'){
                  const gold=await page.evaluate(()=>{
                    const section=document.querySelector('#guilu-choose.section--brand-gold');
                    const h2=section?.querySelector('.section-heading h2');
                    const p=section?.querySelector('.section-heading > p:last-child');
                    const css=el=>el?getComputedStyle(el):null;
                    return {
                      exists:Boolean(section&&h2&&p),
                      headingColor:css(h2)?.color||'',
                      paragraphColor:css(p)?.color||'',
                      backgroundColor:css(section)?.backgroundColor||''
                    };
                  });
                  report.viewports[vpName][pth].brandGoldSection=gold;
                  if(!gold.exists||![gold.headingColor,gold.paragraphColor].every(color=>{const bg=rgb(gold.backgroundColor==='rgba(0, 0, 0, 0)'?'rgb(247, 244, 237)':gold.backgroundColor),fg=rgb(color);return bg&&fg&&contrast(bg,fg)>=4.5;})){
                    report.errors.push({vp:vpName,page:pth,type:'brand-gold-low-contrast-copy',detail:gold});
                  }
                }

                if(pth==='products.html'){
                  const productIntroButtons=page.locator('#product-list .product-card [data-product-intro="1"]');
                  const modalExpected={
                    'guilu-gao':['/images/product-main/guilu-gao.jpg','/images/dm-final/01_guilu-gao-100g-dm.jpg'],
                    'guilu-drink-30':['/images/product-main/guilu-drink-30.jpg','/images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg'],
                    'guilu-drink-180':['/images/product-main/guilu-drink-180.jpg','/images/dm-final/03_guilu-drink-180cc-dm.jpg'],
                    'guilu-tangkuai':['/images/product-main/guilu-tangkuai.jpg','/images/dm-final/05_guilu-tangkuai-75g-dm.jpg'],
                    'guilu-jiao':['/images/product-main/guilu-jiao.jpg','/images/dm-final/06_guilu-jiao-600g-dm.jpg'],
                    'luerong-fen':['/images/product-main/luerong-fen.jpg','/images/dm-final/04_luerong-fen-75g-dm.jpg']
                  };
                  const modalCount=await productIntroButtons.count();
                  if(modalCount!==publicCount) report.errors.push({vp:vpName,page:pth,type:'product-intro-count',detail:{expected:publicCount,actual:modalCount}});
                  for(let i=0;i<modalCount;i++){
                    const button=productIntroButtons.nth(i);
                    const id=await button.locator('xpath=ancestor::article[@data-product-id]').getAttribute('data-product-id');
                    await button.scrollIntoViewIfNeeded();
                    await page.waitForTimeout(150);
                    await button.click();
                    try{
                      await page.waitForSelector('#product-modal.show[aria-hidden="false"]',{timeout:5000});
                    }catch(error){
                      report.errors.push({vp:vpName,page:pth,type:'modal-open-failed',detail:{id,url:page.url(),message:error.message}});
                      fs.writeFileSync('responsive-audit-report.json',JSON.stringify(report,null,2));
                      await page.screenshot({path:`responsive-audit-screens/${vpName}-modal-failed-${id}.png`,fullPage:true});
                      throw error;
                    }
                    await page.waitForFunction(()=>{
                      const main=document.querySelector('#product-modal .modal-gallery__item img');
                      const dm=document.querySelector('#product-modal .modal-detail-media__frame img');
                      return Boolean(main?.complete&&main.naturalWidth>0&&main.naturalHeight>0&&dm?.complete&&dm.naturalWidth>0&&dm.naturalHeight>0);
                    },{timeout:8000}).catch(()=>{});
                    await page.evaluate(async()=>{
                      const imgs=[document.querySelector('#product-modal .modal-gallery__item img'),document.querySelector('#product-modal .modal-detail-media__frame img')].filter(Boolean);
                      await Promise.all(imgs.map(img=>typeof img.decode==='function'?img.decode().catch(()=>{}):Promise.resolve()));
                    });
                    await page.waitForTimeout(80);
                    const modalAudit=await page.evaluate(()=>{
                      const modal=document.getElementById('product-modal');
                      const main=modal?.querySelector('.modal-gallery__item img');
                      const dm=modal?.querySelector('.modal-detail-media__frame img');
                      const mainFrame=modal?.querySelector('.modal-gallery__item');
                      const dmFrame=modal?.querySelector('.modal-detail-media__frame');
                      const intro=modal?.querySelector('.modal-intro');
                      const gallery=modal?.querySelector('.modal-gallery');
                      const facts=modal?.querySelector('.modal-facts');
                      const pathOf=el=>{try{return new URL(el?.getAttribute('src')||'',location.href).pathname}catch{return ''}};
                      const box=el=>el?.getBoundingClientRect?.().toJSON?.()||null;
                      const styleOf=el=>el?{transform:getComputedStyle(el).transform,objectFit:getComputedStyle(el).objectFit,objectPosition:getComputedStyle(el).objectPosition}:null;
                      const ratio=el=>el&&el.naturalWidth&&el.naturalHeight?el.naturalWidth/el.naturalHeight:null;
                      return {
                        visible:Boolean(modal?.classList.contains('show')&&modal?.getAttribute('aria-hidden')==='false'),
                        main:pathOf(main),
                        dm:pathOf(dm),
                        headings:Array.from(modal?.querySelectorAll('.modal-section h3')||[]).map(x=>x.textContent.trim()),
                        line:Boolean(modal?.querySelector('.modal-actions .btn-line')),
                        mainBox:box(main),
                        mainFrameBox:box(mainFrame),
                        dmBox:box(dm),
                        dmFrameBox:box(dmFrame),
                        introBox:box(intro),
                        galleryBox:box(gallery),
                        factsBox:box(facts),
                        mainStyle:styleOf(main),
                        dmStyle:styleOf(dm),
                        mainNaturalRatio:ratio(main),
                        dmNaturalRatio:ratio(dm)
                      };
                    });
                    const expected=modalExpected[id]||[];
                    if(!modalAudit.visible) report.errors.push({vp:vpName,page:pth,type:'modal-not-visible',detail:{id,modalAudit}});
                    if(expected[0]&&!modalAudit.main.endsWith(expected[0])) report.errors.push({vp:vpName,page:pth,type:'modal-main-wrong',detail:{id,expected:expected[0],actual:modalAudit.main}});
                    if(expected[1]&&!modalAudit.dm.endsWith(expected[1])) report.errors.push({vp:vpName,page:pth,type:'modal-dm-wrong',detail:{id,expected:expected[1],actual:modalAudit.dm}});
                    const requiredHeadings=['規格','成分','一般使用方式','保存／出貨資訊'];
                    if(requiredHeadings.some((h,idx)=>modalAudit.headings[idx]!==h)) report.errors.push({vp:vpName,page:pth,type:'modal-facts-order',detail:{id,expected:requiredHeadings,actual:modalAudit.headings}});
                    if(id==='guilu-drink-30'){
                      const usageText=await page.locator('[role=dialog]').innerText();
                      for(const phrase of ['每日 1–2 罐','可依個人需求調整','飲用時間可依個人使用習慣與作息時間安排'])if(!usageText.includes(phrase))report.errors.push({vp:vpName,page:pth,type:'modal-current-usage-missing',detail:{id,phrase}});
                    }
                    if(!modalAudit.line) report.errors.push({vp:vpName,page:pth,type:'modal-line-missing',detail:{id}});
                    if(!modalAudit.mainBox?.width||!modalAudit.mainBox?.height) report.errors.push({vp:vpName,page:pth,type:'modal-main-hidden',detail:{id,box:modalAudit.mainBox}});
                    if(!modalAudit.dmBox?.width||!modalAudit.dmBox?.height) report.errors.push({vp:vpName,page:pth,type:'modal-dm-hidden',detail:{id,box:modalAudit.dmBox}});
                    if(modalAudit.mainStyle?.transform!=='none'||modalAudit.mainStyle?.objectFit!=='contain') report.errors.push({vp:vpName,page:pth,type:'modal-main-transform-or-fit',detail:{id,style:modalAudit.mainStyle}});
                    if(modalAudit.dmStyle?.transform!=='none'||modalAudit.dmStyle?.objectFit!=='contain') report.errors.push({vp:vpName,page:pth,type:'modal-dm-transform-or-fit',detail:{id,style:modalAudit.dmStyle}});
                    const ratioDiff=(box,natural)=>box?.width&&box?.height&&natural?Math.abs((box.width/box.height)-natural):0;
                    if(ratioDiff(modalAudit.mainBox,modalAudit.mainNaturalRatio)>.025) report.errors.push({vp:vpName,page:pth,type:'modal-main-ratio-cropped',detail:{id,box:modalAudit.mainBox,naturalRatio:modalAudit.mainNaturalRatio}});
                    if(ratioDiff(modalAudit.dmBox,modalAudit.dmNaturalRatio)>.025) report.errors.push({vp:vpName,page:pth,type:'modal-dm-ratio-cropped',detail:{id,box:modalAudit.dmBox,naturalRatio:modalAudit.dmNaturalRatio}});
                    if(modalAudit.mainFrameBox&&modalAudit.mainBox&&(modalAudit.mainBox.top<modalAudit.mainFrameBox.top-2||modalAudit.mainBox.bottom>modalAudit.mainFrameBox.bottom+2)) report.errors.push({vp:vpName,page:pth,type:'modal-main-overflow',detail:{id,image:modalAudit.mainBox,frame:modalAudit.mainFrameBox}});
                    if(modalAudit.dmFrameBox&&modalAudit.dmBox&&(modalAudit.dmBox.top<modalAudit.dmFrameBox.top-2||modalAudit.dmBox.bottom>modalAudit.dmFrameBox.bottom+2)) report.errors.push({vp:vpName,page:pth,type:'modal-dm-overflow',detail:{id,image:modalAudit.dmBox,frame:modalAudit.dmFrameBox}});
                    if(modalAudit.introBox&&modalAudit.galleryBox&&modalAudit.introBox.bottom>modalAudit.galleryBox.top+2) report.errors.push({vp:vpName,page:pth,type:'modal-intro-overlap',detail:{id,intro:modalAudit.introBox,gallery:modalAudit.galleryBox}});
                    if(modalAudit.galleryBox&&modalAudit.factsBox&&modalAudit.galleryBox.bottom>modalAudit.factsBox.top+2) report.errors.push({vp:vpName,page:pth,type:'modal-gallery-facts-overlap',detail:{id,gallery:modalAudit.galleryBox,facts:modalAudit.factsBox}});
                    if(vpName==='desktop'||vpName==='iphone'||vpName==='android'||i===0){
                      await page.screenshot({path:`responsive-audit-screens/${vpName}-modal-${id}.png`,fullPage:true});
                    }
                    await page.locator('#product-modal-close').click();
                    await page.waitForSelector('#product-modal[aria-hidden="true"]',{state:'attached',timeout:3000});
                    await page.waitForTimeout(150);
                  }
                }

                if(keyScreens.has(pth)||vpName==='desktop'||vpName==='iphone'){
                  await page.screenshot({path:`responsive-audit-screens/${vpName}-${pth.replace('.html','')}.png`,fullPage:true});
                }
                await page.close();
              }
              await context.close();
            }

            await browser.close();
            fs.writeFileSync('responsive-audit-report.json',JSON.stringify(report,null,2));
            const lines=[
              '# 仙加味跨裝置官網驗收',
              '',
              `- 產生時間：${report.generatedAt}`,
              `- 全站頁面：${pages.length}`,
              `- 裝置：${Object.keys(viewports).join('、')}`,
              `- 錯誤：${report.errors.length}`,
              `- 警告：${report.warnings.length}`,
              '',
              '## Errors',
              ...(report.errors.length?report.errors.map(x=>`- [${x.vp}] ${x.page} / ${x.type}: ${JSON.stringify(x.detail).slice(0,500)}`):['- 無']),
              '',
              '## Warnings',
              ...(report.warnings.length?report.warnings.slice(0,100).map(x=>`- [${x.vp}] ${x.page} / ${x.type}: ${JSON.stringify(x.detail).slice(0,500)}`):['- 無'])
            ];
            fs.writeFileSync('responsive-audit-summary.md',lines.join('\n'));
            console.log(lines.join('\n'));
            if(report.errors.length) process.exit(1);
          })();
          NODE
          node xjw-responsive-audit.cjs

      - name: Upload compact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-visual-report-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            responsive-audit-report.json
            responsive-audit-summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-responsive-visual-audit-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            responsive-audit-report.json
            responsive-audit-summary.md
            responsive-audit-screens/
          if-no-files-found: warn
          retention-days: 7

