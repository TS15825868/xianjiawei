name: 官網使用者確認三端母本一次寫回 v428
run-name: 官網 v428｜30cc玻璃罐・買10送1・約5至7個工作天出貨

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/three-system-policy-v428/READY'
      - 'tools/materialize-three-system-policy-v428.mjs'
      - '.github/workflows/materialize-three-system-policy-v428.yml'

permissions:
  contents: write

concurrency:
  group: website-three-system-policy-v428
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write user-confirmed website data
        run: node tools/materialize-three-system-policy-v428.mjs

      - name: Verify user-confirmed data
        shell: bash
        run: |
          set -euo pipefail
          node --check site.js
          node --check tools/apply-trial-site-entry.mjs
          node --check tools/materialize-three-system-policy-v428.mjs
          node tools/materialize-three-system-policy-v428.mjs
          test -f diagnostics/three-system-policy-v428.json
          node -e "const r=require('./diagnostics/three-system-policy-v428.json');if(r.status!=='success'||!String(r.fulfillment_rule||'').includes('約5～7個工作天出貨'))process.exit(1)"
          ! grep -R -n -E '買10送2|共12罐500元|共12包2,000元|30cc／瓶（小玻璃瓶）|製作加工約需5～7個工作天|完成後才安排出貨' index.html trial.html data.json catalog-public.json tools/apply-trial-site-entry.mjs
          grep -q '約5～7個工作天出貨' trial.html
          grep -q '買10送1，共11罐500元' trial.html
          grep -q '買10送1，共11包2,000元' trial.html
          grep -q '30cc小玻璃罐' trial.html
          grep -q '180cc鋁袋' trial.html
          git diff --check

      - name: Commit final state and consume trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trial.html data.json catalog-public.json geo-data.json llms.txt tools/apply-trial-site-entry.mjs tools/finalize-trial-and-post-assets-v411.mjs tools/lock-user-confirmed-trial-v426.mjs tools/lock-production-before-shipping-v427.mjs tools/materialize-three-system-policy-v428.mjs diagnostics/three-system-policy-v428.json 2>/dev/null || true
          git rm -r --ignore-unmatch staging/three-system-policy-v428
          if git diff --cached --quiet; then
            echo 'Website is already aligned with the user-confirmed rules.'
            exit 0
          fi
          git commit -m 'chore(site): materialize user-confirmed website policy v428'
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
