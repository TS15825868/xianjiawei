name: 驗證全站 UX v410

on:
  push:
    branches: [main]
    paths:
      - 'site.js'
      - 'site-ux-v410.css'
      - 'site-ux-v4101.css'
      - 'site-ux-v409.js'
      - '*.html'
      - '.github/workflows/apply-site-ux-v409.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site-ux-v410
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站程式碼
        uses: actions/checkout@v4

      - name: 檢查全站共用核心
        shell: bash
        run: |
          set -euo pipefail
          test -f site.js
          test -f site-ux-v410.css
          test -f site-ux-v4101.css
          grep -q '__XJW_V410__' site.js
          grep -q 'site-ux-v410.css' site.js

          python3 - <<'PY'
          from pathlib import Path

          pages = sorted(Path('.').glob('*.html'))
          shell_pages = []
          missing_core = []
          duplicate_headers = []
          duplicate_footers = []

          for path in pages:
              text = path.read_text(encoding='utf-8', errors='ignore')
              uses_shell = any(token in text for token in (
                  'id="site-header"', "id='site-header'",
                  'id="site-footer"', "id='site-footer'",
                  'id="site-menu-root"', "id='site-menu-root'"
              ))

              # Google 驗證頁與貼文圖輸出頁不是官網導覽頁，不強制載入共用核心。
              if not uses_shell:
                  continue

              shell_pages.append(str(path))
              if 'site.js' not in text:
                  missing_core.append(str(path))
              if text.count('id="site-header"') + text.count("id='site-header'") > 1:
                  duplicate_headers.append(str(path))
              if text.count('id="site-footer"') + text.count("id='site-footer'") > 1:
                  duplicate_footers.append(str(path))

          if missing_core:
              raise SystemExit('以下共用版型頁面未載入 site.js：' + ', '.join(missing_core))
          if duplicate_headers:
              raise SystemExit('以下頁面存在重複頁首容器：' + ', '.join(duplicate_headers))
          if duplicate_footers:
              raise SystemExit('以下頁面存在重複頁尾容器：' + ', '.join(duplicate_footers))
          if len(shell_pages) < 20:
              raise SystemExit(f'共用版型頁面數量異常，目前僅 {len(shell_pages)} 頁')

          print(f'已確認 {len(shell_pages)} 個官網頁面共用 site.js v410；特殊驗證／輸出頁已正確排除。')
          PY

      - name: 檢查 JavaScript 語法
        run: node --check site.js && node --check site-ux-v409.js