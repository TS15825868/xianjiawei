name: 驗證全站 UX v410

on:
  push:
    branches: [main]
    paths:
      - 'site.js'
      - 'site-ux-v410.css'
      - 'site-ux-v409.js'
      - '*.html'
      - '.github/workflows/apply-site-ux-v409.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site-ux-v410
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站程式碼
        uses: actions/checkout@v4

      - name: 檢查全站共用核心
        shell: bash
        run: |
          set -euo pipefail
          test -f site.js
          test -f site-ux-v410.css
          grep -q '__XJW_V410__' site.js
          grep -q 'site-ux-v410.css' site.js

          python3 - <<'PY'
          from pathlib import Path

          pages = sorted(Path('.').glob('*.html'))
          missing_core = []
          duplicate_headers = []

          for path in pages:
              text = path.read_text(encoding='utf-8')
              if 'site.js' not in text:
                  missing_core.append(str(path))
              if text.count('id="site-header"') > 1 or text.count("id='site-header'") > 1:
                  duplicate_headers.append(str(path))

          if missing_core:
              raise SystemExit('以下頁面未載入全站共用 site.js：' + ', '.join(missing_core))
          if duplicate_headers:
              raise SystemExit('以下頁面存在重複頁首容器：' + ', '.join(duplicate_headers))

          print(f'已確認 {len(pages)} 個根目錄 HTML 頁面共用 site.js v410。')
          PY

      - name: 檢查 JavaScript 語法
        run: node --check site.js && node --check site-ux-v409.js
