name: 仙加味試喝頁按鈕間距一次性修正
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trial-button-spacing-once-v20260815.yml'
permissions:
  contents: write
jobs:
  fix-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Increase trial product button spacing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('trial.html')
          s=p.read_text(encoding='utf-8')
          old='.trial-product-card__actions{display:grid;gap:12px;padding:10px 20px 20px;margin-top:auto}'
          new='.trial-product-card__actions{display:grid;gap:18px;padding:12px 20px 22px;margin-top:auto}'
          old_m='.trial-product-card__actions{gap:14px;padding:10px 18px 20px}'
          new_m='.trial-product-card__actions{gap:20px;padding:12px 18px 22px}'
          assert old in s, '找不到桌機試喝按鈕舊間距規則'
          assert old_m in s, '找不到手機試喝按鈕舊間距規則'
          s=s.replace(old,new,1).replace(old_m,new_m,1)
          p.write_text(s,encoding='utf-8')
          check=p.read_text(encoding='utf-8')
          assert 'gap:18px;padding:12px 20px 22px' in check
          assert 'gap:20px;padding:12px 18px 22px' in check
          PY
      - name: Validate current site release
        run: |
          python tools/validate-site-release.py
          python tools/validate-public-customer-pages-v20260809.py
      - name: Commit verified trial layout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trial.html
          if git diff --cached --quiet; then echo 'No verified changes'; exit 0; fi
          git commit -m 'fix(site): increase trial product action spacing'
          git push origin HEAD:main
