name: 仙加味首篇社群正式圖落檔

on:
  push:
    branches: [main]
    paths:
      - '_automation/materialize-first-social-image-20260904.trigger'

permissions:
  contents: write

concurrency:
  group: xjw-materialize-first-social-image-20260904
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download verified original Q mascot image
        shell: bash
        run: |
          set -euo pipefail
          src='https://d2ol7oe51mr4n9.cloudfront.net/user_3I7cZELbKfOMYPcVd2g8GfqVrb4/1b91a6a8-cff0-4f50-a187-bfd50f36f840.webp'
          dst='images/posts/formal-v20260904/first-post-work-rest-qmascot.webp'
          mkdir -p "$(dirname "$dst")"
          curl -fL --retry 3 --retry-delay 2 "$src" -o "$dst"
          test "$(wc -c < "$dst")" -gt 150000
          file "$dst" | grep -qi 'Web/P image'
          echo "bytes=$(wc -c < "$dst")"
      - name: Commit formal binary image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '仙加味自動化'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/formal-v20260904/first-post-work-rest-qmascot.webp
          git rm _automation/materialize-first-social-image-20260904.trigger
          git commit -m '落檔 2026-09-04 首篇 Q版社群正式圖'
          git push origin HEAD:main
