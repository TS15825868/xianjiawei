name: Apply site content v408.7 only

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: apply-site-v4087-siteonly
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_SITE_V4087_CONTENT_ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified update script
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown beautifulsoup4 pillow
          gdown '1JFafCAXXmcpCpf15nKTqi-dmC9-dtZk4' -O /tmp/apply_v4087.py
          echo '3d1736577a3ff8a75141e0d2316af7a266ea97391b871c01520963bb739a1fef  /tmp/apply_v4087.py' | sha256sum -c -

      - name: Apply full website content update
        run: |
          set -euo pipefail
          python3 /tmp/apply_v4087.py

      - name: Remove stale public files
        run: |
          rm -rf .website-sprite8 .website-upload .website-upload20
          rm -f tmp-v4087-trigger-note.txt
          rm -f AUDIT_ALL_BUTTONS_TRIGGER.txt AUDIT_ALL_BUTTONS_TRIGGER_B.txt AUDIT_STATUS.txt BUTTON_AUDIT_REPORT.json README_上傳說明.txt _upload-test.txt
          rm -f WEBSITE_LINE_INTENT_FINAL2_TRIGGER.txt WEBSITE_LINE_INTENT_FINAL3_TRIGGER.txt WEBSITE_LINE_INTENT_FINAL_TRIGGER.txt WEBSITE_LINE_INTENT_TRIGGER.txt WEBSITE_LINE_LABELS_TRIGGER.txt WEBSITE_LINE_LABELS_TRIGGER_2.txt
          rm -f rich-menu-actions-v307.json site-fix-v317.js

      - name: Validate v408.7 content
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.7"' deploy-version.json
          grep -q '整合正式版 v408.7' site.js
          grep -q '五大產品型態、六項規格' products.html
          grep -q '龜鹿飲180cc鋁袋' products.html
          test "$(grep -o '<url>' sitemap.xml | wc -l)" -eq 20
          grep -q 'catalog-public.json' llms.txt
          grep -q 'Sitemap: https://ts15825868.github.io/xianjiawei/sitemap.xml' robots.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('data.json').read_text(encoding='utf-8'))
          assert len(d['products']) == 6
          for p in d['products']:
              assert p['image'].endswith('?v=408.7')
              assert p['dmImage'].endswith('?v=408.7')
          pages=['product-guilu-gao.html','product-guilu-drink-30cc.html','product-guilu-drink-180cc.html','product-guilu-tangkuai.html','product-guilu-jiao.html','product-luerong-fen.html']
          for page in pages:
              s=Path(page).read_text(encoding='utf-8')
              assert s.count('<h1') == 1
              assert '完整產品資料' in s
              assert 'product-dm-compact' in s
              assert 'product-mascot-anchor' in s
          assert len(list(Path('images/brand/approved-v405').glob('*.webp'))) == 15
          assert Path('llms.txt').stat().st_size > 100
          print('v408.7 content validation passed')
          PY

      - name: Commit site files without workflow changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github
          git commit -m '完成整站搜尋與AI可見性、產品頁與效能優化 v408.7'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 3
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          echo '[]' > /tmp/runs.json
          for i in $(seq 1 36); do
            gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --commit "$TARGET_SHA" --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json || true
            status=$(python3 - <<'PY'
          import json
          try:
              runs=json.load(open('/tmp/runs.json'))
              print(runs[0].get('status','') if runs else '')
          except Exception:
              print('')
          PY
            )
            [ "$status" = 'completed' ] && break
            sleep 10
          done
          conclusion=$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json'))
          print(runs[0].get('conclusion','') if runs else '')
          PY
          )
          cat /tmp/runs.json
          test "$conclusion" = 'success'

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_CONTENT_SUCCESS｜六項產品頁、首頁與產品總覽、搜尋引擎與AI可讀資料、圖片WebP與精簡公開檔案已推送main，GitHub Pages正式部署驗收成功。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'SITE_V4087_CONTENT_FAILURE｜本次未宣稱上線，請查看失敗步驟。'
