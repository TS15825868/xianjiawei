name: Confirm deploy v408.6 success

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'CONFIRM_DEPLOY_V4086_SUCCESS'
    runs-on: ubuntu-latest
    steps:
      - name: Wait and report target deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='c79e41a2062ea939c324b2c2559972331a61f56e'
          echo '[]' > /tmp/runs.json
          for i in $(seq 1 24); do
            gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --commit "$target" --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json || true
            status=$(python3 - <<'PY'
          import json
          try:
              runs=json.load(open('/tmp/runs.json'))
              print(runs[0].get('status','') if runs else '')
          except Exception:
              print('')
          PY
            )
            if [ "$status" = 'completed' ]; then break; fi
            sleep 10
          done
          {
            echo 'DEPLOY_V4086_FINAL_REPORT'
            echo '```json'
            cat /tmp/runs.json
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
