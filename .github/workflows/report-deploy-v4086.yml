name: Report deploy v408.6 log

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_DEPLOY_V4086_LOG'
    runs-on: ubuntu-latest
    steps:
      - name: Report exact failed log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          run_id=29241558021
          gh run view "$run_id" --repo "${{ github.repository }}" --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/run.json 2>&1
          gh run view "$run_id" --repo "${{ github.repository }}" --log-failed > /tmp/failed.log 2>&1
          {
            echo 'DEPLOY_V4086_FAILED_LOG'
            echo '```json'
            cat /tmp/run.json
            echo '```'
            echo '```text'
            tail -220 /tmp/failed.log
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
