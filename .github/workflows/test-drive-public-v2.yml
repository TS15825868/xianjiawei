name: Test Drive public DM v2

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  test:
    if: github.event.issue.title == 'TEST_DRIVE_PUBLIC_DM_V2'
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          set +e
          curl -L --fail --max-time 60 -o /tmp/dm.zip 'https://drive.usercontent.google.com/download?id=11rBLrjxeDX8W_jcKRAfIj4B9Z8q9aQql&export=download&confirm=t'
          echo CURL_EXIT=$? > /tmp/report.txt
          stat -c 'SIZE=%s' /tmp/dm.zip >> /tmp/report.txt 2>/dev/null
          file /tmp/dm.zip >> /tmp/report.txt 2>/dev/null
          unzip -t /tmp/dm.zip >> /tmp/report.txt 2>&1
          echo UNZIP_EXIT=$? >> /tmp/report.txt
          head -30 /tmp/report.txt
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'DRIVE_PUBLIC_DM_V2'
            echo '```text'
            cat /tmp/report.txt 2>/dev/null || true
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
