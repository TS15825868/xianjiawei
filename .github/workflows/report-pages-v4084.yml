name: Report Pages v408.4

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_PAGES_V408_4'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: sleep 25
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --limit 6 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json
          {
            echo 'V408.4_PAGES_STATUS'
            echo '```json'
            cat /tmp/runs.json
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
