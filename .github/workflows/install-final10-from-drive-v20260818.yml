name: 安裝第一批10張原始貼文圖（Drive傳遞）
on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/install-final10-drive-v20260818.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download and validate first owner-approved original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/posts/owner-approved-v20260818
          curl -L --fail --retry 2 'https://drive.google.com/uc?export=download&id=1xQvxy5Drdiayqo3Jh3OzLTqFxzWZpHNq' -o images/posts/owner-approved-v20260818/01-work-30cc.png
          file images/posts/owner-approved-v20260818/01-work-30cc.png
          python3 - <<'PY'
          from PIL import Image
          p='images/posts/owner-approved-v20260818/01-work-30cc.png'
          im=Image.open(p)
          assert im.format == 'PNG', im.format
          assert im.width >= 1000 and im.height >= 1200, im.size
          im.verify()
          print('PASS:', p)
          PY
      - name: Commit verified original
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/owner-approved-v20260818/01-work-30cc.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '新增使用者確認貼文圖01：上班30cc'
          git push origin HEAD:main
