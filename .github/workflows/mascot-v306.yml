name: Apply mascot v306

on:
  pull_request:
    branches: [main]
    paths:
      - MASCOT_V306_TRIGGER.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply website mascot configuration
        run: python tools/apply_mascot_v306.py
      - name: Validate
        run: |
          node --check site.js
          python - <<'PY'
          from pathlib import Path
          text=Path('site.js').read_text(encoding='utf-8')
          assert 'v=306.0' in text
          assert "combo: {" in text
          css=Path('site.css').read_text(encoding='utf-8')
          assert 'object-fit:contain' in css
          print('website mascot v306 validated')
          PY
      - name: Commit generated update
        run: |
          rm -f MASCOT_V306_TRIGGER.txt
          rm -f tools/apply_mascot_v306.py
          rm -f .github/workflows/mascot-v306.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "網站 v306：統一仙加味小老闆完整情境配置" || exit 0
          git push origin HEAD:${{ github.head_ref }}
