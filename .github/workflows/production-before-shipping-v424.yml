name: 官網製作完成後出貨規則守門 v424
run-name: 官網 v424｜5至7工作天只計製作加工・完成後出貨

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'trial.html'
      - 'data.json'
      - 'catalog-public.json'
      - 'tools/apply-trial-site-entry.mjs'
      - 'tools/lock-production-before-shipping-v424.mjs'
      - '.github/workflows/production-before-shipping-v424.yml'

permissions:
  contents: write

concurrency:
  group: website-production-before-shipping-v424
  cancel-in-progress: true

jobs:
  normalize-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply official production and shipping rules
        run: node tools/lock-production-before-shipping-v424.mjs

      - name: Run complete website validation
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-site.mjs
          python3 tools/validate_public_aio_seo.py
          node tools/lock-production-before-shipping-v424.mjs
          git diff --check

      - name: Persist official website state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Website is already aligned with the production-before-shipping rule.'
            exit 0
          fi
          git commit -m 'chore(site): persist production-before-shipping rule v424'
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
