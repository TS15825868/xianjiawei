name: 仙加味第一批10篇完整生活場景圖產出

on:
  push:
    branches: [main]
    paths:
      - 'asset-staging/priority10-svg-v20260817/TRIGGER.txt'
      - 'tools/render-priority10-v20260817.mjs'
      - 'tools/render-scene-poster-core-v20260817.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install renderer
        run: npm install --no-audit --no-fund --no-package-lock sharp
      - name: Render 10 full lifestyle scenes
        run: node tools/render-priority10-v20260817.mjs
      - name: Validate 10 scene images and authority metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(find images/posts/priority10-v20260817 -maxdepth 1 -name '*.webp' | wc -l)" -eq 10
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('images/posts/priority10-v20260817/manifest.json','utf8'));
          if(m.count!==10 || m.posts.length!==10) throw new Error('manifest count mismatch');
          if(!String(m.version).includes('scene-v4')) throw new Error('old priority10 manifest version');
          const urls=new Set();
          for(const p of m.posts){
            if(!p.scene) throw new Error(`${p.id} missing scene`);
            if(!String(p.image_url).includes('v=20260817-scene3')) throw new Error(`${p.id} missing fresh cache bust`);
            if(!String(p.image_source).includes('完整生活場景重製v3')) throw new Error(`${p.id} stale image source`);
            if(!String(p.image_source).includes('無內嵌文字')) throw new Error(`${p.id} rendered image may still contain generated Chinese text`);
            const n=fs.statSync(p.image_path).size;
            if(n<50000) throw new Error(`${p.id} too small ${n}`);
            if(urls.has(p.image_url)) throw new Error(`${p.id} duplicate image url`);
            urls.add(p.image_url);
            console.log('PASS',p.id,p.scene,n);
          }
          NODE
      - name: Commit formal full-scene WebP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/priority10-v20260817
          if git diff --cached --quiet; then
            echo 'No formal visual changes.'
            exit 0
          fi
          git commit -m 'feat(posts): rebuild priority10 with full lifestyle scenes'
          git pull --rebase origin main
          git push
