name: 仙加味第一批10篇正式場景圖產出

on:
  push:
    branches: [main]
    paths:
      - 'asset-staging/priority10-svg-v20260817/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Traditional Chinese SVG/WebP renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin webp fonts-noto-cjk
      - name: Build 10 deterministic scene SVGs
        run: node tools/render-priority10-v20260817.mjs
      - name: Render social-ready WebP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf images/posts/priority10-v20260817
          mkdir -p images/posts/priority10-v20260817 /tmp/priority10-png
          for f in asset-staging/priority10-svg-v20260817/svg/*.svg; do
            id="$(basename "$f" .svg)"
            rsvg-convert -w 1080 -h 1350 "$f" -o "/tmp/priority10-png/${id}.png"
            cwebp -quiet -q 88 "/tmp/priority10-png/${id}.png" -o "images/posts/priority10-v20260817/${id}.webp"
          done
          cp asset-staging/priority10-svg-v20260817/manifest.json images/posts/priority10-v20260817/manifest.json
      - name: Validate 10 images one-to-one
        shell: bash
        run: |
          set -euo pipefail
          test "$(find images/posts/priority10-v20260817 -maxdepth 1 -name '*.webp' | wc -l)" -eq 10
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('images/posts/priority10-v20260817/manifest.json','utf8'));
          if(m.count!==10 || m.posts.length!==10) throw new Error('manifest count mismatch');
          for(const p of m.posts){
            const f=`images/posts/priority10-v20260817/${p.id}.webp`;
            const n=fs.statSync(f).size;
            if(n<50000) throw new Error(`${p.id} too small ${n}`);
            console.log('PASS',p.id,n);
          }
          NODE
      - name: Commit formal WebP scenes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/posts/priority10-v20260817
          if git diff --cached --quiet; then
            echo 'No formal visual changes.'
            exit 0
          fi
          git commit -m 'feat(posts): publish priority10 matched lifestyle scenes'
          git push
