name: 單次公開圖文六項匹配驗收

on:
  push:
    branches: [main]
    paths:
      - '.github/visual-match-audit-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate scripts and policy
        run: |
          set -euo pipefail
          node --check publishing-center.js
          node --check publishing-visual-match.js
          node --check publishing-known-mismatch-guard.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          html = Path('publishing-center.html').read_text(encoding='utf-8')
          for name in ['publishing-center.js','publishing-visual-match.js','publishing-known-mismatch-guard.js']:
              assert name in html, f'missing script reference: {name}'
          policy = json.loads(Path('content/public-visual-match-policy.json').read_text(encoding='utf-8'))
          ids = [item['id'] for item in policy['required_dimensions']]
          assert ids == ['product','season','context','temperature','expression','action'], ids
          assert len(policy['known_mismatches']) >= 7
          source = Path('publishing-visual-match.js').read_text(encoding='utf-8')
          for term in ['產品／規格／價格','季節','情境','冷熱','表情','動作']:
              assert term in source, term
          guard = Path('publishing-known-mismatch-guard.js').read_text(encoding='utf-8')
          assert 'event.stopImmediatePropagation()' in guard
          print('PASS public visual match gate')
          PY
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh issue create --title 'PASS｜公開貼文六項圖文匹配驗收 20260806' --body '已通過：產品／規格／價格、季節、情境、冷熱、表情、動作六項核准門檻；7篇明顯不符圖片已禁止核准與發布。本流程未發布任何社群貼文。'
          else
            gh issue create --title 'FAIL｜公開貼文六項圖文匹配驗收 20260806' --body '公開發布中心六項圖文匹配驗收失敗，請查看本次Actions紀錄。本流程未發布任何社群貼文。'
          fi
