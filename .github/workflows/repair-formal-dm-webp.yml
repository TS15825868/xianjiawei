name: 修復正式 DM WebP 圖檔

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-formal-dm-webp.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-repair-formal-dm-webp
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Rebuild formal WebPs from approved JPGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          mapping = {
              'images/dm-final/01_guilu-gao-100g-dm.jpg': 'images/dm-approved-v20260810/guilu-gao-100g.webp',
              'images/dm-final/03_guilu-drink-180cc-dm.jpg': 'images/dm-approved-v20260810/guilu-drink-180cc.webp',
              'images/dm-final/05_guilu-tangkuai-75g-dm.jpg': 'images/dm-approved-v20260810/guilu-tangkuai-75g.webp',
              'images/dm-final/06_guilu-jiao-600g-dm.jpg': 'images/dm-approved-v20260810/guilu-jiao-600g.webp',
              'images/dm-final/04_luerong-fen-75g-dm.jpg': 'images/dm-approved-v20260810/lurong-fen-75g.webp',
          }
          for src, dst in mapping.items():
              out = Path(dst)
              out.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as im:
                  im.convert('RGB').save(out, 'WEBP', quality=88, method=6)
              print(f'rebuilt {dst} from {src}')
          PY
      - name: Restore current formal authority paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = {
              'guilu-gao': '/images/dm-approved-v20260810/guilu-gao-100g.webp',
              'guilu-drink-180cc': '/images/dm-approved-v20260810/guilu-drink-180cc.webp',
              'guilu-tangkuai': '/images/dm-approved-v20260810/guilu-tangkuai-75g.webp',
              'guilu-jiao': '/images/dm-approved-v20260810/guilu-jiao-600g.webp',
              'luerong-fen': '/images/dm-approved-v20260810/lurong-fen-75g.webp',
          }

          p = Path('data/formal-media-authority-v20260810.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for item in data['products']:
              if item['id'] in paths:
                  item['dm'] = paths[item['id']]
                  item['source'] = 'approved-dm-rebuilt-valid-webp'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          m = Path('images/formal-display/manifest.json')
          manifest = json.loads(m.read_text(encoding='utf-8'))
          manifest_paths = {
              'guilu-gao': paths['guilu-gao'],
              'guilu-drink-180': paths['guilu-drink-180cc'],
              'guilu-tangkuai': paths['guilu-tangkuai'],
              'guilu-jiao': paths['guilu-jiao'],
              'luerong-fen': paths['luerong-fen'],
          }
          for key, value in manifest_paths.items():
              manifest['products'][key]['path'] = value
          m.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify all formal WebP signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'guilu-gao-100g.webp',
              'guilu-drink-30cc.webp',
              'guilu-drink-180cc.webp',
              'guilu-tangkuai-75g.webp',
              'guilu-jiao-600g.webp',
              'lurong-fen-75g.webp',
              'guilu-drink-trial.webp',
          ]
          root = Path('images/dm-approved-v20260810')
          for name in required:
              p = root / name
              b = p.read_bytes()
              assert len(b) > 12 and b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'invalid WebP: {p}'
              print('valid', p, len(b))
          PY
      - name: Commit repaired WebPs and authority
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/dm-approved-v20260810/*.webp data/formal-media-authority-v20260810.json images/formal-display/manifest.json
          if git diff --cached --quiet; then
            echo 'Formal DM WebPs are already valid and current.'
            exit 0
          fi
          git commit -m 'media: rebuild formal DM WebP binaries from approved originals'
          git push origin HEAD:main
