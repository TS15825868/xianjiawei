name: Install sharp formal AVIF v6 completion

on:
  push:
    branches: [main]
    paths:
      - '_upload/avif-v6.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble approved 180cc high-resolution AVIF master
        shell: bash
        run: |
          set -euo pipefail
          marker='_upload/avif-v6.ready'
          test -f "$marker"
          cat _upload/avif-v6-180.part-* | base64 -d > /tmp/guilu-drink-180cc.avif

      - name: Verify exact approved binaries and dimensions
        shell: bash
        run: |
          set -euo pipefail
          declare -A SHA=(
            [guilu-drink-180cc]='b1223ff545bd95dcaa22543270689a46a2c83a760346dfca8044725a0219d45e'
            [guilu-drink-30cc]='a57ce8e03a867e8162065ae380dae97248c85f6923eb74578d72349610e435d8'
            [guilu-gao]='6958c71f7d1d8cac4df348511fca2e2f4983eace279126444174589798d46ff2'
            [guilu-jiao]='091145c925a3579e53b75468555c07ecbeeb45d4176028ec5e0879ccb0fdafee'
            [guilu-tangkuai]='0d54fbb42d2d6d875713295ff6c53cecc7dd5f753f8d5e5b0fc54f6cf40677bf'
            [luerong-fen]='d9312b796007cbead43d9525867c759b265a089c5424e3de24a1afd8b1f16fc3'
          )
          test "$(sha256sum /tmp/guilu-drink-180cc.avif | awk '{print $1}')" = "${SHA[guilu-drink-180cc]}"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/guilu-drink-180cc.avif)" = '1122x1402'
          for name in guilu-drink-30cc guilu-gao guilu-jiao guilu-tangkuai luerong-fen; do
            file="images/customer-display-v20260812/${name}.avif"
            test -f "$file"
            test "$(sha256sum "$file" | awk '{print $1}')" = "${SHA[$name]}"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")" = '1122x1402'
            echo "PASS $name 1122x1402"
          done
          echo 'PASS guilu-drink-180cc 1122x1402'

      - name: Install 180cc AVIF and clean upload chunks
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/guilu-drink-180cc.avif images/customer-display-v20260812/guilu-drink-180cc.avif
          rm -f _upload/avif-v6-180.part-* _upload/avif-v6.ready
          cat > images/customer-display-v20260812/hd-avif-v6-status.json <<'JSON'
          {
            "version": "20260812-sharp-formal-media-v6",
            "status": "six-approved-product-avif-masters-installed",
            "dimensions": "1122x1402",
            "role": "formal-product-main-only",
            "rules": [
              "產品主圖與詳細DM分開",
              "30cc維持小玻璃罐正式外觀與30cc／罐",
              "180cc維持鋁袋正式外觀",
              "龜鹿湯塊主規格只放75g／盒｜8塊裝",
              "龜鹿膠主規格只放600g（1斤）／盒｜32塊裝",
              "不得以AI重畫產品本體"
            ]
          }
          JSON

      - name: Commit verified high-resolution product masters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A images/customer-display-v20260812 _upload
          if git diff --cached --quiet; then
            echo 'No AVIF install changes.'
            exit 0
          fi
          git commit -m 'fix(images): complete six sharp formal product AVIF masters v6'
          git push origin HEAD:main
