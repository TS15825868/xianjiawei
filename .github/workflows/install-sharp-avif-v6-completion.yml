name: Install sharp formal AVIF v6 completion

on:
  push:
    branches: [main]
    paths:
      - '_upload/avif54-v6/ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble corrected high-resolution tangkuai master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xjw-avif-v6
          cat _upload/avif54-v6/guilu-tangkuai/*.part > /tmp/guilu-tangkuai.b64
          base64 -d /tmp/guilu-tangkuai.b64 > /tmp/xjw-avif-v6/guilu-tangkuai.avif

      - name: Verify exact approved binaries and dimensions
        shell: bash
        run: |
          set -euo pipefail
          declare -A SHA=(
            [guilu-drink-30cc]='a57ce8e03a867e8162065ae380dae97248c85f6923eb74578d72349610e435d8'
            [guilu-gao]='6958c71f7d1d8cac4df348511fca2e2f4983eace279126444174589798d46ff2'
            [guilu-jiao]='091145c925a3579e53b75468555c07ecbeeb45d4176028ec5e0879ccb0fdafee'
            [guilu-tangkuai]='0d54fbb42d2d6d875713295ff6c53cecc7dd5f753f8d5e5b0fc54f6cf40677bf'
          )
          tang='/tmp/xjw-avif-v6/guilu-tangkuai.avif'
          test "$(sha256sum "$tang" | awk '{print $1}')" = "${SHA[guilu-tangkuai]}"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$tang")" = '1122x1402'

          # Existing safe AVIF part-1 files must also remain exact.
          for name in guilu-drink-30cc guilu-gao guilu-jiao; do
            file="images/customer-display-v20260812/${name}.avif"
            test -f "$file"
            test "$(sha256sum "$file" | awk '{print $1}')" = "${SHA[$name]}"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")" = '1122x1402'
          done

          # 180cc and luerong have already-vetted 1122x1402 repo masters; do not upload duplicate binaries.
          for file in images/dm-v3/guilu-drink-180.jpg images/dm-v3/luerong-fen.jpg; do
            test -f "$file"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")" = '1122x1402'
          done

      - name: Install corrected tangkuai AVIF and remove upload chunks
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/xjw-avif-v6/guilu-tangkuai.avif images/customer-display-v20260812/guilu-tangkuai.avif
          rm -rf _upload/avif54-v6
          cat > images/customer-display-v20260812/hd-avif-v6-status.json <<'JSON'
          {
            "version": "20260813-sharp-formal-media-v6",
            "status": "sharp-product-masters-ready",
            "role": "formal-product-main-only",
            "product_main_sources": {
              "guilu-gao": "images/customer-display-v20260812/guilu-gao.avif",
              "guilu-drink-30cc": "images/customer-display-v20260812/guilu-drink-30cc.avif",
              "guilu-drink-180cc": "images/dm-v3/guilu-drink-180.jpg",
              "guilu-tangkuai": "images/customer-display-v20260812/guilu-tangkuai.avif",
              "guilu-jiao": "images/customer-display-v20260812/guilu-jiao.avif",
              "luerong-fen": "images/dm-v3/luerong-fen.jpg"
            },
            "dimensions": "1122x1402",
            "rules": [
              "產品主圖與詳細DM分開",
              "30cc維持小玻璃罐正式外觀與30cc／罐規格",
              "180cc維持鋁袋正式外觀",
              "龜鹿湯塊主規格不放每塊重量",
              "龜鹿膠主規格不放每塊重量",
              "不得以AI重畫產品本體",
              "詳細DM仍須逐字核對後才能升級"
            ]
          }
          JSON

      - name: Commit verified high-resolution product masters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/customer-display-v20260812/guilu-tangkuai.avif images/customer-display-v20260812/hd-avif-v6-status.json _upload/avif54-v6 || true
          if git diff --cached --quiet; then
            echo 'No HD product changes required.'
            exit 0
          fi
          git commit -m 'fix(images): install corrected sharp tangkuai master v6'
          git push origin HEAD:main
