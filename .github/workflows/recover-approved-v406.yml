name: Recover approved website images v406

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: recover-approved-v406
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'INSTALL_APPROVED_V406'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore approved assets
        id: restore
        continue-on-error: true
        run: |
          set +e
          {
            python3 -m pip install --quiet pillow
            git fetch --no-tags origin 5538b096585130dc1b9fdf7604252a17fd4717df --depth=1
            git show FETCH_HEAD:assets/approved-v405-assets.zip > /tmp/approved-v405-partial.zip
            wc -c /tmp/approved-v405-partial.zip
            python3 - <<'PY'
            from pathlib import Path
            import struct, zlib
            data = Path('/tmp/approved-v405-partial.zip').read_bytes()
            print('FIRST16', data[:16].hex())
            pos = 0
            entries = []
            while True:
                idx = data.find(b'PK\x03\x04', pos)
                if idx < 0 or idx + 30 > len(data): break
                (_, _, _, method, _, _, _, csize, _, nlen, xlen) = struct.unpack_from('<IHHHHHIIIHH', data, idx)
                ns = idx + 30; ne = ns + nlen; ds = ne + xlen
                name = data[ns:ne].decode('utf-8', 'replace')
                if method == 0:
                    pos = max(ds + csize, idx + 4)
                    continue
                if method != 8:
                    pos = idx + 4
                    continue
                d = zlib.decompressobj(-15)
                raw = d.decompress(data[ds:]) + d.flush()
                entries.append((Path(name).name, len(raw), d.eof, raw[:12].hex()))
                if not d.eof: break
                consumed = (len(data)-ds)-len(d.unused_data)
                pos = ds + consumed
            print('ENTRIES', entries)
            PY
            python3 tools/recover-approved-v406.py
          } > /tmp/recover-v406.log 2>&1
          code=$?
          cat /tmp/recover-v406.log
          exit $code

      - name: Commit final website to main
        id: publish
        if: steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "完成15張核准小老闆素材配置與清理"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --delete tmp-do-not-use || true

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/recover-v406.log') ? fs.readFileSync('/tmp/recover-v406.log', 'utf8') : 'No recovery log was created.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `V406_RESTORE_${process.env.RESTORE_OUTCOME.toUpperCase()} / PUBLISH_${process.env.PUBLISH_OUTCOME.toUpperCase()}\n\n\`\`\`\n${log.slice(-10000)}\n\`\`\``
            });
