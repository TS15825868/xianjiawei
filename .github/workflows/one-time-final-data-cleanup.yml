name: 官網單次正式資料清理

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == 'ONE_TIME_SITE_CLEANUP_20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 清理正式資料與舊來源
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          data_path = root / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))

          old_jiao = '600g／盒（1斤）｜32塊裝｜每塊約18.75g'
          new_jiao = '600g（1斤）／盒｜32塊裝｜每塊約18.75g'
          drink_notice = '龜鹿飲為接單後安排製作加工；訂單資料與付款方式確認後，製作加工約需5～7個工作天，完成後才安排出貨，物流配送時間另計。'
          stock_notice = '本產品為預先製作備貨商品；訂單資料與付款方式確認後，依現貨狀況安排出貨，物流配送時間另計。'

          replacements = [
            (old_jiao, new_jiao),
            ('600g／盒（1斤）', '600g（1斤）／盒'),
            ('龜鹿飲30cc玻璃瓶', '龜鹿飲30cc玻璃罐'),
            ('30cc／瓶（玻璃瓶）', '30cc／罐（小玻璃罐）'),
            ('30cc／瓶（小玻璃瓶）', '30cc／罐（小玻璃罐）'),
            ('30cc玻璃瓶', '30cc玻璃罐'),
            ('小玻璃瓶', '小玻璃罐'),
            ('images/products-v3/guilu-drink-30-clean.svg?v=411.0', 'images/products-v3/guilu-drink-30.jpg?v=20260805'),
            ('images/products-v3/guilu-drink-30-clean.svg', 'images/products-v3/guilu-drink-30.jpg'),
            ('從萬華西昌街出發', '從萬華出發'),
            ('從西昌街開始', '從萬華開始'),
            ('門市自取、宅配、7-11賣貨便與雙北親送', '宅配、7-11賣貨便與雙北親送'),
            ('門市自取、宅配、7-11賣貨便', '宅配、7-11賣貨便'),
            ('門市自取或配送', '配送'),
          ]

          def clean_text(value):
            text = str(value)
            for before, after in replacements:
              text = text.replace(before, after)
            text = text.replace('30cc玻璃罐與30cc玻璃罐', '30cc玻璃罐與180cc鋁袋')
            text = text.replace('30cc玻璃罐 vs 30cc玻璃罐', '30cc玻璃罐 vs 180cc鋁袋')
            text = text.replace('30cc玻璃罐開罐即可飲用；30cc玻璃罐開封即可飲用', '30cc玻璃罐開罐即可飲用；180cc鋁袋撕開即可飲用')
            text = text.replace('若想完整一份龜鹿飲，可詢問30cc玻璃罐', '若想較完整一份龜鹿飲，可詢問180cc鋁袋')
            text = text.replace('若想較完整一份龜鹿飲，可詢問30cc玻璃罐', '若想較完整一份龜鹿飲，可詢問180cc鋁袋')
            text = text.replace('30cc玻璃罐體積小、外出方便；30cc玻璃罐容量較完整', '30cc玻璃罐體積小、外出方便；180cc鋁袋容量較完整')
            text = text.replace('30cc玻璃罐適合輕巧即飲與外出攜帶，30cc玻璃罐適合想一次安排一份龜鹿飲的人', '30cc玻璃罐適合輕巧即飲與外出攜帶，180cc鋁袋適合想一次安排較完整份量的人')
            text = text.replace('開瓶即飲', '開罐即飲')
            text = text.replace('開瓶即可飲用', '開罐即可飲用')
            text = re.sub(r'台北市萬華區西昌街\s*52\s*號', '台北萬華', text)
            text = text.replace('https://www.google.com/maps?q=台北萬華', '')
            return text

          def walk(value):
            if isinstance(value, str): return clean_text(value)
            if isinstance(value, list): return [walk(item) for item in value]
            if isinstance(value, dict): return {key: walk(item) for key, item in value.items()}
            return value

          data = walk(data)
          for key in ['store','crmTracking','lineButtonPolicy','buttonTextPolicy','fallbackFlow','brandPolicy','productLineFinal','tangkuaiJiaoNote','advisorFlows','lineOaFixNote']:
            data.pop(key, None)
          data['shipping'] = ['宅配', '7-11賣貨便', '雙北親送']
          data['series'] = ['龜鹿系列', '鹿茸系列']
          data['version'] = '2026-08-05-clean-v2'
          data['catalogVersion'] = '2026-08-05-clean-v2'
          data['updatedAt'] = '2026-08-05'
          data['fulfillmentPolicy'] = {
            'version': '2026-08-05-v3',
            'drinkProductIds': ['guilu-drink-30','guilu-drink-180'],
            'readyStockProductIds': ['guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen'],
            'drinkNotice': drink_notice,
            'readyStockNotice': stock_notice,
          }

          expected = {
            'guilu-drink-30': ('龜鹿飲30cc玻璃罐','30cc／罐（小玻璃罐）','images/products-v3/guilu-drink-30.jpg?v=20260805','made-to-order-drink',False),
            'guilu-drink-180': ('龜鹿飲180cc鋁袋','180cc／包（鋁袋）','images/products-v3/guilu-drink-180.jpg?v=20260805','made-to-order-drink',False),
            'guilu-gao': ('龜鹿膏','100g／罐','images/products-v3/guilu-gao.jpg?v=20260805','ready-stock',True),
            'guilu-tangkuai': ('龜鹿湯塊','75g／盒｜8塊裝｜每塊約9.375g','images/products-v3/guilu-tangkuai.jpg?v=20260805','ready-stock',True),
            'guilu-jiao': ('龜鹿膠',new_jiao,'images/products-v3/guilu-jiao.jpg?v=20260805','ready-stock',True),
            'luerong-fen': ('鹿茸粉','75g／罐','images/products-v3/luerong-fen.jpg?v=20260805','ready-stock',True),
          }
          by_id = {str(item.get('id')): item for item in data.get('products', []) if isinstance(item, dict)}
          order = ['guilu-drink-30','guilu-drink-180','guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen']
          products = []
          for product_id in order:
            product = dict(by_id.get(product_id, {}))
            name, size, image, fulfillment, ready = expected[product_id]
            product.update({
              'id': product_id,
              'name': name,
              'displayName': name,
              'size': size,
              'image': image,
              'fulfillmentType': fulfillment,
              'readyStock': ready,
              'fulfillmentNotice': drink_notice if not ready else stock_notice,
              'priceNote': '價格與優惠請透過官方 LINE 詢問。',
            })
            if product_id == 'guilu-drink-30':
              product['dmImage'] = 'images/dm-final/02_guilu-drink-30cc-dm.jpg?v=20260805'
              product['detailImages'] = [image, product['dmImage']]
              product['description'] = '30cc小玻璃罐，裸罐、無貼紙，適合輕巧即飲、外出攜帶與工作空檔安排。'
            elif product_id == 'guilu-drink-180':
              product['dmImage'] = 'images/dm-final/03_guilu-drink-180cc-dm.jpg?v=20260805'
              product['detailImages'] = [image, product['dmImage']]
              product['description'] = '180cc鋁袋即飲型態，適合居家、工作空檔或偏好一次安排較完整份量的人。'
            products.append(product)
          data['products'] = products
          data['officialProductIds'] = order
          data['officialProductCount'] = 6
          data.pop('faqs', None)
          page_content = data.setdefault('pageContent', {})
          page_content['contactNotes'] = [
            '購買方式、活動、付款與配送安排，請透過官方 LINE 確認。',
            '特殊健康狀況、正在看診、用藥、孕期或其他疑慮，建議先詢問醫師、中醫師或藥師。',
          ]
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Clean public text sources without touching internal forbidden lists.
          public_suffixes = {'.html','.txt','.xml','.webmanifest','.js'}
          for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in public_suffixes:
              continue
            if '.git' in path.parts or '.github' in path.parts or 'tools' in path.parts:
              continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = clean_text(text)
            if updated != text:
              path.write_text(updated, encoding='utf-8')

          for obsolete in [
            'tools/apply-official-product-specs.mjs',
            'tools/enforce_canonical_public_product_wording.py',
            'tools/audit-site.mjs',
            'tools/validate-official-products.mjs',
          ]:
            path = root / obsolete
            if path.exists(): path.unlink()

          # Exact validations.
          reloaded = json.loads(data_path.read_text(encoding='utf-8'))
          assert len(reloaded['products']) == 6
          assert [item['id'] for item in reloaded['products']] == order
          assert reloaded['products'][0]['size'] == '30cc／罐（小玻璃罐）'
          assert reloaded['products'][1]['size'] == '180cc／包（鋁袋）'
          assert reloaded['products'][3]['size'] == '75g／盒｜8塊裝｜每塊約9.375g'
          assert reloaded['products'][4]['size'] == new_jiao
          public_files = [data_path, root/'catalog-public.json', root/'geo-data.json', root/'llms.txt', root/'llms-full.txt']
          public_text = '\n'.join(path.read_text(encoding='utf-8', errors='ignore') for path in public_files if path.exists())
          for forbidden in ['龜鹿飲30cc玻璃瓶','30cc／瓶','小玻璃瓶','600g／盒（1斤）','guilu-drink-30-clean.svg','台北市萬華區西昌街52號','龜鹿湯塊150g','龜鹿湯塊300g','龜鹿湯塊600g']:
            if forbidden in public_text:
              raise SystemExit(f'公開資料仍含舊值：{forbidden}')

          Path('.github/workflows/one-time-final-data-cleanup.yml').unlink()
          PY

      - name: 提交清理結果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(site): finalize clean six-product data and remove obsolete sources'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 關閉一次性觸發Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --reason completed --comment '官網單次正式資料清理已執行完成，流程檔已自動移除。' || true
