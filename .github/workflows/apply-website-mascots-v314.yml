name: Apply website mascots v314

on:
  push:
    branches: [main]
    paths:
      - APPLY_WEBSITE_MASCOTS_V314.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download website mascot package
        run: |
          python3 -m pip install --quiet gdown
          gdown --id 1Fo0MhGFyUhnQd14COzo3ZjkzPsl2JDOL -O /tmp/website-mascots.zip
          test $(wc -c < /tmp/website-mascots.zip) -gt 1000000
          unzip -t /tmp/website-mascots.zip

      - name: Install images and update website mapping
        run: |
          mkdir -p images/brand
          unzip -o /tmp/website-mascots.zip -d images/brand
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('const MASCOT_IMAGES = {')
          end = s.index('};', start) + 2
          block = """const MASCOT_IMAGES = {
            welcome: 'images/brand/xianjiawei-scene-welcome.jpg?v=314.0',
            products: 'images/brand/xianjiawei-scene-products.jpg?v=314.0',
            guide: 'images/brand/xianjiawei-scene-guide.jpg?v=314.0',
            combo: 'images/brand/xianjiawei-scene-combo.jpg?v=314.0',
            usage: 'images/brand/xianjiawei-scene-usage.jpg?v=314.0',
            service: 'images/brand/xianjiawei-scene-service.jpg?v=314.0',
            brand: 'images/brand/xianjiawei-scene-brand.jpg?v=314.0'
          };"""
          s = s[:start] + block + s[end:]
          s = s.replace("image: 'products', scene: 'products', eyebrow: '搭配組合'", "image: 'combo', scene: 'combo', eyebrow: '搭配組合'")
          s = s.replace("image: 'welcome', scene: 'welcome', eyebrow: '品牌故事'", "image: 'brand', scene: 'brand', eyebrow: '品牌故事'")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify image set and code
        run: |
          for f in welcome products guide combo usage service brand; do
            test -s "images/brand/xianjiawei-scene-${f}.jpg"
          done
          node --check site.js
          grep -q "xianjiawei-scene-combo.jpg?v=314.0" site.js
          grep -q "xianjiawei-scene-brand.jpg?v=314.0" site.js

      - name: Commit website images
        run: |
          rm -f APPLY_WEBSITE_MASCOTS_V314.txt
          rm -f .github/workflows/apply-website-mascots-v314.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '更新網站專用仙加味小老闆情境圖 v314'
          git pull --rebase origin main
          git push origin main
