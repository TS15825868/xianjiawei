name: Install mascot complete v403.0

on:
  push:
    branches: [main]
    paths:
      - "INSTALL_MASCOT_403.txt"

permissions:
  contents: write

concurrency:
  group: install-mascot-v403
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-delay 4 \
            "https://drive.google.com/uc?export=download&id=1mbwWlxhF9YZLK38reYDRNRFODyHNXXyN&confirm=t" \
            -o /tmp/mascot-v403.zip
          unzip -t /tmp/mascot-v403.zip

      - name: Install corrected scenes
        run: |
          set -euo pipefail
          unzip -o /tmp/mascot-v403.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '403.0'
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'site\.css\?v=[^"\']+', f'site.css?v={version}', text)
              text = re.sub(r'site-v321\.css\?v=[^"\']+', f'site-v321.css?v={version}', text)
              text = re.sub(r'site\.js\?v=[^"\']+', f'site.js?v={version}', text)
              if page.name == 'index.html':
                  text = re.sub(r'images/hero/home-brand-guilu-series\.jpg(?:\?v=[^"\']+)?', f'images/brand/scene-brand-all.svg?v={version}', text)
              page.write_text(text, encoding='utf-8')

          core = Path('site-core.js')
          if core.exists():
              text = core.read_text(encoding='utf-8')
              text = re.sub(r'\?v=400\.2', '?v=403.0', text)
              text = re.sub(r'\?v=401\.2', '?v=403.0', text)
              text = re.sub(r'\?v=402\.0', '?v=403.0', text)
              core.write_text(text, encoding='utf-8')
          PY

      - name: Verify package and product fidelity rules
        run: |
          set -euo pipefail
          for f in \
            scene-guilu-jiao-600g.svg \
            scene-guilu-drink-180cc.svg \
            scene-guilu-gao-100g.svg \
            scene-luerong-fen-75g.svg \
            scene-products-all.svg \
            scene-choose-forms.svg \
            scene-guilu-tangkuai-75g.svg \
            scene-brand-all.svg \
            scene-guilu-drink-30cc.svg; do
            test -s "images/brand/$f"
            grep -q 'data:image/jpeg;base64' "images/brand/$f"
            grep -q 'width="1440" height="1080"' "images/brand/$f"
          done
          grep -q 'const VERSION = "403.0"' site-fix-v317.js
          grep -q 'scene-brand-all.svg' site-fix-v317.js
          grep -q 'scene-guilu-jiao-600g.svg' mascot-source-audit.json
          grep -q '"productTransform": "none"' deploy-version.json
          grep -q 'site.js?v=403.0' index.html

      - name: Commit directly to main
        run: |
          set -euo pipefail
          rm -f INSTALL_MASCOT_403.txt
          rm -f .github/workflows/install-mascot-v403.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "官網全站小老闆與產品原圖對位完成 v403.0"
          git push origin main
