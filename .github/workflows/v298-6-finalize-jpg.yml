name: v298.6 finalize JPG repair

on:
  push:
    paths:
      - TRIGGER_V298_6.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace broken WebP references and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = '298.6'
          for product in data.get('products', []):
              if product.get('id') == 'guilu-drink-180':
                  product['image'] = 'images/products-v3/guilu-drink-180.jpg?v=298.6'
                  product['dmImage'] = 'images/dm-final/03_guilu-drink-180cc-dm.jpg?v=298.6'
                  product['detailImages'] = ['images/dm-final/03_guilu-drink-180cc-dm.jpg?v=298.6']
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              text = re.sub(r'site\.js\?v=[^"\']+', 'site.js?v=298.6', text)
              text = text.replace('images/dm-v3/guilu-drink-180.webp?v=298.5', 'images/dm-final/03_guilu-drink-180cc-dm.jpg?v=298.6')
              text = text.replace('images/products-v3/guilu-drink-180.webp?v=298.5', 'images/products-v3/guilu-drink-180.jpg?v=298.6')
              html.write_text(text, encoding='utf-8')

          core = Path('site-v287-core.js')
          if core.exists():
              text = core.read_text(encoding='utf-8')
              text = re.sub(r'data\.json\?v=[^\'"`]+', 'data.json?v=298.6', text)
              core.write_text(text, encoding='utf-8')
          PY

      - name: Remove trigger and commit
        run: |
          rm -f TRIGGER_V298_6.txt
          rm -f .github/workflows/v298-6-finalize-jpg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.6: repair 180cc images with stable JPG paths"
          git push origin main
