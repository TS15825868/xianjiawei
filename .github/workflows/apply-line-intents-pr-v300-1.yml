name: Apply website LINE intents PR v300.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'website-line-intents-v300-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical LINE intents
        run: node tools/apply_line_intent_integration_v300_1.js
      - name: Verify
        run: |
          node --check site.js
          node tools/check_line_intents.js
          python3 tools/site_maintenance.py
      - name: Commit result
        run: |
          rm -f WEBSITE_LINE_INTENT_TRIGGER.txt
          rm -f tools/apply_line_intent_integration_v300_1.js
          rm -f .github/workflows/apply-line-intent-integration-v300-1.yml
          rm -f .github/workflows/apply-line-intents-pr-v300-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v300.1: align website LINE buttons with bot intents"
          git push origin HEAD:${{ github.head_ref }}
