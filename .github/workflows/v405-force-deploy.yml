name: Force deploy v405

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: force-pages-v405
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.issue.title == 'TRIGGER_PAGES_V405'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Report force deploy started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'V405_FORCE_STARTED'
            })

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build v405 site
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s assets/approved-v405-assets.zip
          echo 'f37e456acd939119677fbfcaea89d82e66c67306b206e90981233c29153fdfb8  assets/approved-v405-assets.zip' | sha256sum -c -
          node --check site.js
          node --check approved-mascot-v405.js
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='assets/' \
            --exclude='*.zip' \
            --exclude='*.md'
          mkdir -p _site/images/brand/approved-v405
          unzip -o assets/approved-v405-assets.zip -d _site/images/brand/approved-v405 >/dev/null
          test "$(find _site/images/brand/approved-v405 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 15
          python3 - <<'PY'
          from pathlib import Path
          import re
          version='405.0'
          for page in Path('_site').glob('*.html'):
              text=page.read_text(encoding='utf-8')
              text=re.sub(r'site\.css\?v=[^"\']+',f'site.css?v={version}',text)
              text=re.sub(r'site-v321\.css\?v=[^"\']+',f'site-v321.css?v={version}',text)
              text=re.sub(r'site\.js\?v=[^"\']+',f'site.js?v={version}',text)
              page.write_text(text,encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/images/brand/approved-v405/home-brand.webp
          grep -q 'site.js?v=405.0' _site/index.html

      - name: Report build outcome
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `V405_BUILD_${process.env.OUTCOME.toUpperCase()}`
            })

      - name: Stop after build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Set Pages build type to workflow
        id: pagesmode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          current="$(curl -sS -o /tmp/pages-current.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
          if [ "$current" = "404" ]; then
            code="$(curl -sS -o /tmp/pages-result.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api" \
              -d '{"build_type":"workflow"}')"
          else
            code="$(curl -sS -o /tmp/pages-result.json -w '%{http_code}' -X PUT \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api" \
              -d '{"build_type":"workflow"}')"
          fi
          echo "Pages API: $code"
          cat /tmp/pages-result.json || true
          case "$code" in 200|201|204) ;; *) exit 1 ;; esac

      - name: Report Pages mode outcome
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.pagesmode.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `V405_PAGES_MODE_${process.env.OUTCOME.toUpperCase()}`
            })

      - name: Stop after Pages mode failure
        if: steps.pagesmode.outcome != 'success'
        run: exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report deployment outcome
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `V405_DEPLOY_${process.env.OUTCOME.toUpperCase()} ${process.env.PAGE_URL || ''}`
            })

      - name: Stop after deployment failure
        if: steps.deployment.outcome != 'success'
        run: exit 1
