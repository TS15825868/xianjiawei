name: Verify Formal Media Live Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-formal-media-live-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all current product originals, DMs and trial image on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://ts15825868.github.io/xianjiawei'
          python - <<'PY' > /tmp/media-paths.txt
          import json
          def clean(v):
            return str(v or '').split('?')[0].lstrip('/')
          d=json.load(open('data.json',encoding='utf-8'))
          for p in d.get('products',[]):
            v=clean(p.get('officialOriginalImage') or p.get('image'))
            if v: print(v)
          f=json.load(open('data/formal-media-authority-v20260810.json',encoding='utf-8'))
          def walk(x):
            if isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,str) and ('/images/' in v or v.startswith('images/')) and v.lower().split('?')[0].endswith(('.jpg','.jpeg','.png','.webp')):
                  print(clean(v))
                else: walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(f)
          PY
          sort -u /tmp/media-paths.txt -o /tmp/media-paths.txt
          test "$(wc -l < /tmp/media-paths.txt)" -ge 13
          for attempt in 1 2 3 4 5 6 7 8; do
            failed=0
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              curl -fsSL --max-time 20 "$base/$rel" -o /tmp/media-check || failed=1
              test -s /tmp/media-check || failed=1
            done < /tmp/media-paths.txt
            if [ "$failed" = 0 ]; then
              echo 'PASS: current uploaded product originals, approved DMs and trial media are live.'
              exit 0
            fi
            sleep 15
          done
          echo 'Some current formal media did not become live within retry window.' >&2
          cat /tmp/media-paths.txt >&2
          exit 1
      - name: Record formal media live status and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > formal-media-live-status.json <<JSON
          {
            "status": "verified_live",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "product_identity": "products-v3 user-uploaded originals",
            "customer_product_dm": "current approved uploaded DMs",
            "trial_media": "current approved uploaded trial image",
            "blocking_guards": false,
            "guard_mode": "paused_for_full_system_update"
          }
          JSON
          rm -f .github/workflows/verify-formal-media-live-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: confirm uploaded product photos DMs and trial media live'
          git pull --rebase origin main
          git push origin HEAD:main
