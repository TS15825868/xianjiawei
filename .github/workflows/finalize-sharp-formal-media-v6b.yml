name: Finalize sharp formal media v6b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-sharp-formal-media-v6b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact approved high-resolution product masters
        shell: bash
        run: |
          set -euo pipefail
          declare -A SHA=(
            [guilu-drink-30cc]='a57ce8e03a867e8162065ae380dae97248c85f6923eb74578d72349610e435d8'
            [guilu-gao]='6958c71f7d1d8cac4df348511fca2e2f4983eace279126444174589798d46ff2'
            [guilu-jiao]='091145c925a3579e53b75468555c07ecbeeb45d4176028ec5e0879ccb0fdafee'
            [guilu-tangkuai]='0d54fbb42d2d6d875713295ff6c53cecc7dd5f753f8d5e5b0fc54f6cf40677bf'
            [luerong-fen]='d9312b796007cbead43d9525867c759b265a089c5424e3de24a1afd8b1f16fc3'
          )
          for name in guilu-drink-30cc guilu-gao guilu-jiao guilu-tangkuai luerong-fen; do
            file="images/customer-display-v20260812/${name}.avif"
            test -f "$file"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${SHA[$name]}"
            echo "PASS $name"
          done
          test -f images/dm-v3/guilu-drink-180.jpg
          test "$(wc -c < images/dm-v3/guilu-drink-180.jpg)" -gt 50000
          test "$(xxd -p -l 3 images/dm-v3/guilu-drink-180.jpg)" = 'ffd8ff'
          echo 'PASS vetted 180cc high-resolution JPEG source'

      - name: Apply and validate formal media v6
        run: python tools/finalize_sharp_formal_media_v6.py

      - name: Syntax-check updated website runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check site-customer-display-v20260812.js
          node --check site-product-image-safety.js
          node --check site-public-image-retirement-v20260812.js
          node --check site-formal-media-v20260810.js
          node --check site.js

      - name: Commit final public-site media release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # GitHub Actions GITHUB_TOKEN may update site content but may not edit another workflow.
          # Keep the cache workflow change for the connected GitHub app to apply separately.
          git restore -- .github/workflows/bump-site-entry-cache-v20260812.yml || true
          git add -A
          if git diff --cached --quiet; then
            echo 'No final media changes required.'
            exit 0
          fi
          git commit -m 'fix(images): switch public site to sharp formal media v6'
          git pull --rebase origin main
          git push origin HEAD:main
