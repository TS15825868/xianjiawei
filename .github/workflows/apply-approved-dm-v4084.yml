name: Apply approved DM v408.4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-approved-dm-v4084
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == 'APPLY_APPROVED_DM_V408_4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply approved DM placement
        run: python3 tools/apply_approved_dm_v4084.py

      - name: Validate files
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          grep -q '"version": "408.4"' deploy-version.json
          grep -q 'images/dm-final/01_guilu-gao-100g-dm.jpg?v=408.4' dm.html
          grep -q 'images/dm-final/03_guilu-drink-180cc-dm.jpg?v=408.4' dm.html
          test "$(grep -R -l 'product-dm-section' product-*.html | wc -l)" -eq 6

      - name: Commit website content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json site.js deploy-version.json dm.html product-*.html
          git commit -m '放入六張正式產品DM v408.4'
          git push origin HEAD:main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.4_APPROVED_DM_SUCCESS｜六張正式DM已放入DM頁及六個產品詳細頁；產品卡與快速查看維持真實產品原圖。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
