name: Patch v408 chunk count

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 97 && github.event.comment.body == 'PATCH_V408_CHUNKS_27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-v408-from-comments.yml')
          s=p.read_text()
          s=s.replace('if total != 36 or set(parts) != set(range(1,37)):', 'if total != 27 or set(parts) != set(range(1,28)):')
          s=s.replace("for i in range(1,37)", "for i in range(1,28)")
          p.write_text(s)
          PY
          rm -f .github/workflows/patch-v408-chunk-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '調整v408素材分段為27段'
          git push origin HEAD:main
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 97 --repo '${{ github.repository }}' --body 'V408_CHUNK_COUNT_PATCHED_27'
