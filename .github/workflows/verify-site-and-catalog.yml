name: Verify website and shared catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-site-and-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run complete website validation and capture diagnostics
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          (
            set -euo pipefail
            echo '=== 用料原則正式圖片 ==='
            python3 tools/materialize_ingredient_principle.py

            echo '=== JavaScript 與 JSON ==='
            node --check site.js
            python3 -m json.tool data.json >/dev/null
            python3 -m json.tool catalog-public.json >/dev/null
            python3 -m json.tool deploy-version.json >/dev/null
            python3 -m json.tool brand-character-spec.json >/dev/null

            echo '=== 官網內容與連結 ==='
            python3 tools/verify_public_site.py

            echo '=== 靜態網站建置 ==='
            python3 tools/build_static_v4087.py
            test -d _site
            test -f _site/index.html
            test -f _site/images/posts/generated/post-ingredient-principle.webp

            echo '=== HTTP smoke tests ==='
            cd _site
            python3 -m http.server 8080 >/tmp/site-http.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            sleep 2
            for path in index.html products.html choose.html dm.html guide.html brand.html faq.html contact.html sitemap.xml robots.txt llms.txt data.json catalog-public.json brand-character-spec.json site.js site.css product-guilu-gao.html product-guilu-drink-30cc.html product-guilu-drink-180cc.html product-guilu-tangkuai.html product-guilu-jiao.html product-luerong-fen.html images/posts/generated/post-ingredient-principle.webp; do
              curl --fail --silent --show-error "http://127.0.0.1:8080/$path" >/dev/null
            done
            echo 'PASS 官網完整驗證、建置與 HTTP smoke tests'
          ) > artifacts/site-validation.log 2>&1
          status=$?
          tail -n 260 artifacts/site-validation.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist verified ingredient image and remove temporary files
        id: persist
        if: steps.validation.outputs.exit_code == '0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          (
            set -euo pipefail
            if [ "$EVENT_NAME" != 'push' ] || [ "$ACTOR" = 'github-actions[bot]' ]; then
              echo '非人工 main push，不執行資料寫回'
              exit 0
            fi

            rm -f .github/workflows/install-ingredient-principle-from-blob.yml
            rm -f artifacts/uploads/chunk-transport-test.txt
            rm -f artifacts/uploads/ingredient-q3.part-*.b64
            rm -f .trigger-verified-ingredient-image-20260801

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add images/posts/generated/post-ingredient-principle.webp
            git add -u -- .github/workflows artifacts/uploads .trigger-verified-ingredient-image-20260801 || true
            if git diff --cached --quiet; then
              echo '正式圖片與清理狀態已一致'
              exit 0
            fi
            git commit -m 'assets(site): install verified ingredient principle post image'

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "PASS 已提交正式圖片（第 ${attempt} 次）"
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 3))
            done
            echo '三次重試後仍無法提交正式圖片' >&2
            exit 1
          ) > artifacts/site-persist.log 2>&1
          status=$?
          cat artifacts/site-persist.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact failure diagnostics
        if: steps.validation.outputs.exit_code != '0' || steps.persist.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VALIDATION_EXIT: ${{ steps.validation.outputs.exit_code }}
          PERSIST_EXIT: ${{ steps.persist.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          title='[CI 診斷] 仙加味官網完整驗證失敗'
          {
            echo '## 仙加味官網完整驗證失敗'
            echo
            echo "- 提交：\`${SOURCE_SHA}\`"
            echo "- 驗證 Exit code：\`${VALIDATION_EXIT:-未執行}\`"
            echo "- 寫回 Exit code：\`${PERSIST_EXIT:-未執行}\`"
            echo "- 時間：$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '### 驗證日誌'
            echo '```text'
            test -f artifacts/site-validation.log && tail -c 18000 artifacts/site-validation.log || true
            echo
            echo '```'
            echo
            echo '### 寫回日誌'
            echo '```text'
            test -f artifacts/site-persist.log && tail -c 8000 artifacts/site-persist.log || true
            echo
            echo '```'
          } > artifacts/site-ci-diagnostic.md

          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file artifacts/site-ci-diagnostic.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file artifacts/site-ci-diagnostic.md
          fi

      - name: Close resolved diagnostic issue
        if: steps.validation.outputs.exit_code == '0' && steps.persist.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title='[CI 診斷] 仙加味官網完整驗證失敗'
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            {
              echo '## 仙加味官網完整驗證已通過'
              echo
              echo "- 提交：\`${SOURCE_SHA}\`"
              echo '- 用料原則正式 WebP：位元驗證通過'
              echo '- 官網資料與連結：通過'
              echo '- 靜態建置：通過'
              echo '- HTTP smoke tests：通過'
              echo '- 正式圖片主分支寫回：通過或已一致'
              echo "- 時間：$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            } > artifacts/site-ci-success.md
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file artifacts/site-ci-success.md
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment '最新官網完整驗證已通過。' >/dev/null 2>&1 || true
          fi

      - name: Enforce result
        shell: bash
        run: |
          test "${{ steps.validation.outputs.exit_code }}" = '0'
          test "${{ steps.persist.outputs.exit_code }}" = '0'
