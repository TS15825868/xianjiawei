name: 仙加味貼文媒體角色Metadata一次性對齊

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-align-post-media-role-metadata.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Align machine-readable media roles only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path=Path('data/post-library-userzip3-v20260811.json')
          catalog=json.loads(catalog_path.read_text(encoding='utf-8'))
          catalog['runtime']='20260814-userzip3-current-media-roles-v3'
          catalog['principle']='目前最新使用者ZIP素材優先；生活情境圖依季節、情境、環境、冷熱、表情、動作、道具與文案語意比對。一般產品主題使用目前正式產品圖；明確DM主題使用目前有效dm-final詳細DM；試喝主題固定使用2026-08-14正式試喝海報；products-v3只作真實產品身份、包裝與比例校正參考。ZIP產品卡只作人工比對候選，不得取代正式產品圖、DM或試喝權威；已有合格來源優先使用，真的沒有合格來源才重新生成；任何換圖／生成後舊核准失效、回pending_review並重跑16項。'
          catalog['product_media_rule']='ZIP中的產品卡型圖片不自動取得產品權威。一般產品主題使用目前正式產品圖；明確DM主題使用images/dm-final/；試喝主題固定使用2026-08-14正式試喝海報；images/products-v3/只作產品身份與比例校正參考。'
          catalog['media_roles']={
              'customer_product_image':'images/customer-display-v20260812/',
              'detailed_dm':'images/dm-final/',
              'trial':'images/trial/trial-poster-small-boss-official-v20260814.jpg',
              'product_identity_reference':'images/products-v3/'
          }
          for item in catalog.get('product_card_review_only') or []:
              item['reason']='ZIP產品卡僅作人工比對參考，不取代目前正式產品圖、詳細DM或試喝權威；products-v3只作真實產品身份、包裝與比例校正。'
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          assets_path=Path('content/public-asset-library.json')
          assets=json.loads(assets_path.read_text(encoding='utf-8'))
          assets['version']='2026-08-14-public-assets-v7-current-media-roles'
          policy=assets.setdefault('policy',{})
          # Compatibility key remains the raw identity/original source used by older layers.
          policy['officialProductImageSource']='images/products-v3/'
          policy['productIdentityReferenceSource']='images/products-v3/'
          policy['customerProductDisplaySource']='images/customer-display-v20260812/'
          policy['detailedDmSource']='images/dm-final/'
          policy['trialPosterSource']='images/trial/trial-poster-small-boss-official-v20260814.jpg'
          policy['mediaRolePolicy']='一般產品顧客主圖、詳細DM、試喝海報與products-v3產品身份／比例參考分離；不得互相取代。'
          for asset in assets.get('assets') or []:
              if asset.get('id')=='product-drink30-official':
                  rules=str(asset.get('rules') or '')
                  asset['rules']=rules.replace('不可改瓶型','不可改罐型')
          assets_path.write_text(json.dumps(assets,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate current release and publishing authority
        run: |
          python tools/validate-site-release.py
          python tools/validate-publishing-content-match-v20260809.py
          node --check publishing-center-data-current-authority-guard.js
      - name: Commit metadata alignment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/post-library-userzip3-v20260811.json content/public-asset-library.json
          git rm .github/workflows/one-shot-align-post-media-role-metadata.yml
          git commit -m 'fix(publishing): align machine-readable media role authority'
          git pull --rebase origin main
          git push origin HEAD:main
