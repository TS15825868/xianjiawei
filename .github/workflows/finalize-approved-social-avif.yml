name: Finalize approved social AVIF authority

on:
  push:
    branches:
      - main
    paths:
      - '.github/finalize-approved-social-avif-trigger.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Align approved media authority and remove stale duplicates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          candidates_path = Path('content/social-plan-20261015-1031-candidates.json')
          media_path = Path('content/social-next-cycle-media-v20260911.json')

          candidates = json.loads(candidates_path.read_text(encoding='utf-8'))
          candidates['version'] = '2026-09-12-v6-avif-finalized-not-scheduled'
          media_by_date = {
              '2026-10-18': 'images/social/approved-202610/2026-10-18-cooking-prep.avif',
              '2026-10-24': 'images/social/approved-202610/2026-10-24-tangkuai-cooking.avif',
              '2026-10-31': 'images/social/approved-202610/2026-10-31-drink-comparison.avif',
          }
          for item in candidates.get('candidates', []):
              day = str(item.get('date', ''))[:10]
              if day in media_by_date:
                  item['media'] = media_by_date[day]
                  item['mediaProvider'] = 'github'
                  item['status'] = 'approved-not-scheduled'
          candidates_path.write_text(json.dumps(candidates, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          media = json.loads(media_path.read_text(encoding='utf-8'))
          media['version'] = '2026-09-12-v7-avif-finalized-github-assets'
          media['status'] = 'eligible-next-cycle-media-pool-with-user-approved-avif'
          formal = {
              '2026-10-18': {
                  'source': 'images/social/approved-202610/2026-10-18-cooking-prep.avif',
                  'sha256': 'af8b052f12f5a31b76c1d77cc0c425400616de07f4745a0dd1ac04c7d22acd73',
                  'dimensions': '1080x1080',
              },
              '2026-10-24': {
                  'source': 'images/social/approved-202610/2026-10-24-tangkuai-cooking.avif',
                  'sha256': 'c8fc2dfb72a6e32050667d352c09aae2c9a3ce3e759cca144b3f1ace4d97e5b0',
                  'dimensions': '1080x1080',
              },
              '2026-10-31': {
                  'source': 'images/social/approved-202610/2026-10-31-drink-comparison.avif',
                  'sha256': '33a1126852606688bed1207b2fbb5d56b08f189acd583e1e842993555cd878c5',
                  'dimensions': '1080x1350',
              },
          }
          for item in media.get('approvedMedia', []):
              day = item.get('date')
              if day in formal:
                  item.update(formal[day])
                  item['status'] = 'approved-not-scheduled'
          media['approvalGate'] = '10/18、10/24、10/31三張新圖已由使用者人工通過，並經GitHub Actions以整檔大小與SHA256驗證後落入main正式AVIF路徑；GitHub Pages已成功。狀態仍為approved-not-scheduled，10/15後須先依activationGate讀取10/1至10/14實際表現再決定排程。'
          media_path.write_text(json.dumps(media, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = {
              'version': '2026-09-12-v1',
              'brand': '仙加味',
              'status': 'approved-not-scheduled',
              'scheduleGate': '2026-10-15後先檢查2026-10-01至2026-10-14實際表現再決定是否排程',
              'files': [
                  {'date':'2026-10-18','path':formal['2026-10-18']['source'],'sha256':formal['2026-10-18']['sha256'],'dimensions':'1080x1080','canvaAssetId':'MAHU6pn5Tns','isAiGenerated':True},
                  {'date':'2026-10-24','path':formal['2026-10-24']['source'],'sha256':formal['2026-10-24']['sha256'],'dimensions':'1080x1080','canvaAssetId':'MAHU6kflnDg','isAiGenerated':True},
                  {'date':'2026-10-31','path':formal['2026-10-31']['source'],'sha256':formal['2026-10-31']['sha256'],'dimensions':'1080x1350','canvaAssetId':'MAHU6jYKL74','isAiGenerated':False},
              ],
          }
          manifest_path = Path('images/social/approved-202610/manifest.json')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for stale in [
              'images/social/approved-202610/2026-10-18-cooking-prep.webp',
              'images/social/approved-202610/2026-10-24-tangkuai-cooking.webp',
              'images/social/approved-202610/2026-10-31-drink-comparison.webp',
          ]:
              Path(stale).unlink(missing_ok=True)

          for old in [
              '.asset-import/20260912-approved-social',
              '.asset-import/20260912-approved-social-v2',
          ]:
              shutil.rmtree(old, ignore_errors=True)
          PY

      - name: Commit authority cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[social-avif-finalize] content: align approved AVIF authority"
          git push origin HEAD:main
