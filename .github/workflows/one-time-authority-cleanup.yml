name: 單次官網正式資料清理（完成後自刪）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-authority-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 清理舊規格、舊工具與未使用資料
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          old_long = '600g／盒（1斤）｜32塊裝｜每塊約18.75g'
          new_long = '600g（1斤）／盒｜32塊裝｜每塊約18.75g'
          old_short = '600g／盒（1斤）'
          new_short = '600g（1斤）／盒'
          text_suffixes = {'.html','.json','.js','.mjs','.cjs','.css','.txt','.md','.xml','.webmanifest','.py','.yml','.yaml'}
          skip_parts = {'.git','node_modules'}

          changed = []
          for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in text_suffixes:
              continue
            if any(part in skip_parts for part in path.parts):
              continue
            if path.as_posix() == '.github/workflows/one-time-authority-cleanup.yml':
              continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = text.replace(old_long, new_long).replace(old_short, new_short)
            if updated != text:
              path.write_text(updated, encoding='utf-8')
              changed.append(path.as_posix())

          for rel in ['config/official-products.json','assets/data/official-products.json']:
            path = Path(rel)
            if not path.exists():
              continue
            data = json.loads(path.read_text(encoding='utf-8'))
            for item in data.get('products', []):
              if item.get('id') == 'guilu-jiao':
                if 'spec' in item: item['spec'] = new_long
                if 'specification' in item: item['specification'] = new_long
            forbidden = [value for value in data.get('forbidden', []) if value not in {new_long,new_short}]
            if old_long not in forbidden: forbidden.append(old_long)
            data['forbidden'] = forbidden
            data['version'] = '2026-08-05-user-authority-v4'
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          obsolete = [
            'tools/apply-official-product-specs.mjs',
            'tools/enforce_canonical_public_product_wording.py',
            'tools/validate-official-products.mjs',
            'tools/audit-site.mjs',
            'tools/enforce_aio_page_summaries.py',
            'tools/validate_public_aio_seo.py',
          ]
          for rel in obsolete:
            path = Path(rel)
            if path.exists():
              path.unlink()

          deploy = Path('.github/workflows/deploy-pages.yml')
          text = deploy.read_text(encoding='utf-8')
          text = text.replace(old_long, new_long).replace(old_short, new_short)
          if old_long not in text:
            marker = "'龜鹿湯塊600g',"
            text = text.replace(marker, marker + "\n              '600g／盒（1斤）｜32塊裝｜每塊約18.75g',")
          deploy.write_text(text, encoding='utf-8')

          data = json.loads(Path('data.json').read_text(encoding='utf-8'))
          products = {item.get('id'): item for item in data.get('products', []) if isinstance(item, dict)}
          expected_ids = {'guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'}
          if set(products) != expected_ids:
            raise SystemExit(f'官網產品不是唯一六項：{sorted(products)}')
          if products['guilu-jiao'].get('size') != new_long:
            raise SystemExit('龜鹿膠正式規格未改為使用者確認格式')
          public_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.json','.txt','.xml'} and '.git' not in p.parts]
          public = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in public_files)
          if old_long in public or old_short in public:
            raise SystemExit('公開資料仍含龜鹿膠舊字序')
          for legacy in ['龜鹿飲30cc玻璃瓶','30cc／瓶（小玻璃瓶）','龜鹿湯塊300g','龜鹿湯塊600g']:
            if legacy in public:
              raise SystemExit(f'公開資料仍含舊資料：{legacy}')

          Path('.github/workflows/one-time-authority-cleanup.yml').unlink()
          print(f'PASS：官網正式資料清理完成，文字更新 {len(changed)} 個檔案。')
          PY

      - name: 提交清理結果並移除本工作流
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(site): finalize exact six-product authority and remove obsolete data'
          git pull --rebase origin main
          git push origin HEAD:main
