name: 仙加味｜九張使用者指定主圖與丹參六款正面統一正式上線
on:
  push:
    paths:
      - ".github/workflows/owner-approved-nine-photo-release-v20261017.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owner-approved-nine-photo-release-v20261017
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact main version
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python image prerequisites
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic photo segmentation packages
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Download nine exact originals by SHA and produce final photo files
        run: python tools/import-owner-final-packages-v20261017.py
      - name: Verify all 9 hero and 5 tea front image outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("images/catalog-owner-final-v20261017")
          ims=list(p.glob("*-main.webp"))
          assert len(ims)==14, ("Missing completed images",len(ims))
          for f in ims:
              img=Image.open(f)
              assert img.width>=1100 and img.height>=1100 and img.mode=="RGBA",f
              assert img.getbbox(),f
          print("PASS: 14 true product images")
          PY
      - name: Publish official front-end references and exact images
        run: |
          git config user.name "xianjiawei-product-maintenance[bot]"
          git config user.email "xianjiawei-product-maintenance[bot]@users.noreply.github.com"
          git add -A images/catalog-owner-final-v20261017 data/owner-final-product-photo-release-v20261017.json
          git add -A -- '*.html' '*.js' '*.json' 'data/*.json'
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "feat: release nine approved whole-package heroes and six aligned tea boxes with closeable viewer"
            git push origin HEAD:main
          fi
