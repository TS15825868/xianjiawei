name: Fix product images v408.3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == 'FIX_PRODUCT_IMAGES_V408_3_RUN'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified real product images
        run: |
          set -euo pipefail
          python3 tools/fix_product_images_v4083.py
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null

      - name: Commit and push main
        run: |
          set -euo pipefail
          rm -rf _trigger
          rm -f tools/fix_product_images_v4083.py
          rm -f .github/workflows/fix-product-images-v4083.yml
          rm -f .github/workflows/test-v4083.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修正全站產品圖片為真實原圖 v408.3'
          git push origin HEAD:main

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.3_PRODUCT_IMAGE_FIX_SUCCESS｜產品卡、快速查看、詳細頁、詳細圖與產品圖文整理頁已統一使用六張真實產品原圖；錯誤重畫DM已移除，不再顯示被改造的瓶罐、盒型、袋型或標籤。main 已更新並由 GitHub Pages 自動重新部署。'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
