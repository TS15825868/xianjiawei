name: 安裝使用者確認最新10張正式貼文圖

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/install-latest-approved10-direct-v20260818.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-install-latest-approved10-direct
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download exact user-approved source images
        shell: bash
        run: |
          set -euo pipefail
          out='images/posts/owner-approved-v20260818'
          rm -rf "$out"
          mkdir -p "$out"
          download(){
            local id="$1" file="$2" sha="$3"
            local url="https://drive.google.com/uc?export=download&id=${id}"
            echo "downloading $file"
            curl -L --fail --retry 6 --retry-delay 2 --max-time 90 -sS -o "$out/$file" "$url"
            test -s "$out/$file"
            printf '%s  %s\n' "$sha" "$out/$file" | sha256sum -c -
            python3 - "$out/$file" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          b=p.read_bytes()
          if not b.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit(f'not png: {p}')
          PY
          }
          download '1LyVWdVSx_Wdz3K4jeJg1Hw6iIPAQAwsS' '01-work-30cc.png' 'ace18058da09c4f684f09dbd37257844356e6d6263514734788ff4668b3b1eef'
          download '1sWw8wE15PRUNphCGNCy81LVzFmCa9nMq' '02-home-180cc.png' '9a5ed2878fcb9ed8b2afe1995253211162993723114788758693068e72654d2b'
          download '1x2Dm7UTwrhq5cN3bdIBineGwTxYOCAzT' '03-gao-storage.png' '18422a84bfad334f339e876b0dfe13fe676b2ae48d97d619866931e0279119e9'
          download '1x2apdDckJt8kxNqEYu2P1G8QhIJzWEXU' '04-tangkuai-soup.png' '4741959fb746a3e2b6e5addfa3c52fe9376043ea882310a6193f553660b7264a'
          download '1nhPvhws3fSYAEJA7v5k5d9N1FxKiNauK' '05-jiao-600g.png' '8f2de4800fd4810bb0fb5eb7dccb9aa14d045eff028e89bb024b8c72cc753495'
          download '10uR6pMKuyPeQFYCZiZ4cVCLNrBYY-06V' '06-lurong-75g.png' 'e78d58865e0d58bf087a2d89ba0a38ab7ede2a449ed0df41a98260d4b229ff13'
          download '1oG9AU8OPh5iEBb10VAA7LHK9bO-CBK68' '07-line-consult.png' 'eaa72a5af48fc000c7a63dd99f35498965ef690ee2e7e0bc143fc3a452944186'
          download '1jHR6QARPJK04mmgmsb4WScG4v4qQETTH' '08-home-out.png' '9fe6cb06eb5c80fb9a99addb431b25d2cbf9bf5a3d8eb7126b58eadba06e37c7'
          download '1Gkd3fHLu5ND-UQuN_U3DNVtZr3XR_L8u' '09-organize-cabinet.png' 'c9938a15079497a79f77685638364073d1f8b2188814358e3c379052bb471b4e'
          download '18VPU7NGnQB5sWdP-ZD4GkzViNLY8VNMn' '10-office-warm-drink.png' '77ecf17fec65867760240229c9666cf44f1c6dfc5afee2d36ac836b6c13aee9e'

      - name: Write authoritative manifest
        shell: bash
        run: |
          cat > images/posts/owner-approved-v20260818/manifest.json <<'JSON'
          {
            "version": "2026-08-18-owner-approved10-direct-v1",
            "count": 10,
            "source": "使用者已確認很棒的10張正式圖｜Google Drive 原始檔逐檔 SHA256 驗證",
            "posts": [
              {"id":"XJW-GUILU-drink30-work-break","title":"上班帶一罐，30cc不用把行程打亂","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/01-work-30cc.png?v=20260818-direct-v1","image_alt":"仙加味小老闆上班工作空檔與30cc小玻璃裸罐情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜正式產品實物外觀"},
              {"id":"XJW-GUILU-drink180-home","title":"回到家，把180cc安排進自己的節奏","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/02-home-180cc.png?v=20260818-direct-v1","image_alt":"仙加味小老闆居家180cc鋁袋飲用情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜180cc鋁袋正式外觀"},
              {"id":"XJW-GUILU-gao-storage","title":"龜鹿膏開罐後，順手放進冰箱","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/03-gao-storage.png?v=20260818-direct-v1","image_alt":"仙加味小老闆整理龜鹿膏並放入冰箱的保存情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜龜鹿膏正式外觀"},
              {"id":"XJW-GUILU-tangkuai-soup","title":"今晚燉湯，把龜鹿湯塊安排進家常餐桌","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/04-tangkuai-soup.png?v=20260818-direct-v1","image_alt":"仙加味小老闆家常燉湯與龜鹿湯塊正式盒裝情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜龜鹿湯塊正式外觀"},
              {"id":"XJW-GUILU-jiao-600g","title":"週末有時間，再慢慢認識龜鹿膠這種型態","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/05-jiao-600g.png?v=20260818-direct-v1","image_alt":"仙加味小老闆週末認識600g龜鹿膠正式盒裝情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜龜鹿膠正式外觀"},
              {"id":"XJW-GUILU-luerong-75g","title":"下午想簡單一點，可以先認識鹿茸粉","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/06-lurong-75g.png?v=20260818-direct-v1","image_alt":"仙加味小老闆下午認識75g鹿茸粉正式產品情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜鹿茸粉正式外觀"},
              {"id":"XJW-SOCIAL-20260815-02-line-consult-and-trial","title":"不知道怎麼選，先把你的日常告訴我們","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/07-line-consult.png?v=20260818-direct-v1","image_alt":"仙加味小老闆以LINE諮詢協助依日常挑選產品","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜LINE諮詢情境"},
              {"id":"XJW-GUILU-choose-by-place","title":"今天在家，明天外出，產品型態不一定要選同一種","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/08-home-out.png?v=20260818-direct-v1","image_alt":"仙加味小老闆呈現在家與外出不同生活情境的產品選擇","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜生活情境對應產品"},
              {"id":"XJW-SOCIAL-20260815-03-storage-basics","title":"星期天整理櫃子，也順便看看龜鹿還剩多少","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/09-organize-cabinet.png?v=20260818-direct-v1","image_alt":"仙加味小老闆星期天整理櫃子與龜鹿產品庫存情境","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜保存整理情境"},
              {"id":"XJW-SOCIAL-20260815-01-warm-drink-moment","title":"辦公桌上的一杯日常安排，也可以有不同選擇","image_url":"https://ts15825868.github.io/xianjiawei/images/posts/owner-approved-v20260818/10-office-warm-drink.png?v=20260818-direct-v1","image_alt":"仙加味小老闆辦公桌情境與30cc、180cc不同日常安排","image_source":"使用者確認之正式10圖｜完整單張非拼湊圖｜固定Q版小老闆｜辦公室日常情境"}
            ]
          }
          JSON
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('images/posts/owner-approved-v20260818/manifest.json')
          d=json.loads(p.read_text())
          assert d['count']==10 and len(d['posts'])==10
          assert len({x['id'] for x in d['posts']})==10
          assert len({x['image_url'] for x in d['posts']})==10
          print('PASS manifest 10/10')
          PY

      - name: Commit latest approved images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/posts/owner-approved-v20260818
          git commit -m 'feat(posts): 安裝使用者確認最新10張正式貼文圖'
          git pull --rebase origin main
          git push origin HEAD:main
