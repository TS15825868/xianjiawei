name: 仙加味官網正式上線手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit all customer-facing pages and formal product/trial contracts
        run: python tools/validate-site-production-release-v20260809.py
      - name: Audit single cohesive visual and no-collage policy
        run: python tools/validate-visual-cohesion-v20260809.py
      - name: Ensure audit makes no repository changes
        run: git diff --exit-code
