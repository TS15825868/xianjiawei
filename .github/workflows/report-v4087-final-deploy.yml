name: Report v408.7 final deploy

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'REPORT_V4087_FINAL_DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Wait and report latest Pages run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '[]' > /tmp/runs.json
          for i in $(seq 1 30); do
            gh run list --repo "${{ github.repository }}" --workflow deploy-pages.yml --limit 8 --json databaseId,status,conclusion,headSha,displayTitle,createdAt > /tmp/runs.json || true
            status=$(python3 - <<'PY'
          import json
          try:
              runs=json.load(open('/tmp/runs.json'))
              print(runs[0].get('status','') if runs else '')
          except Exception:
              print('')
          PY
            )
            [ "$status" = 'completed' ] && break
            sleep 10
          done
          {
            echo 'V4087_FINAL_DEPLOY_REPORT'
            echo '```json'
            cat /tmp/runs.json
            echo '```'
          } > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
