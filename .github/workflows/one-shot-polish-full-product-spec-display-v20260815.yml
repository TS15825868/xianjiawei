name: 仙加味產品完整規格顯示收尾
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-polish-full-product-spec-display-v20260815.yml'
permissions:
  contents: write
jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Polish customer-facing full specifications
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8'); old=s
              for a,b in pairs: s=s.replace(a,b)
              if s!=old: p.write_text(s,encoding='utf-8')

          patch('data.json',[
            ('"size": "75g （2兩）／盒｜8塊裝"','"size": "75g （2兩）／盒｜8塊裝，每塊約9.375g"'),
            ('"size": "600g （1斤）／盒｜32塊裝"','"size": "600g （1斤）／盒｜32塊裝，每塊約18.75 g"'),
          ])
          patch('site-product-data-authority.js',[
            ("normalized.size='75g （2兩）／盒｜8塊裝';","normalized.size='75g （2兩）／盒｜8塊裝，每塊約9.375g';"),
            ("normalized.size='600g （1斤）／盒｜32塊裝';","normalized.size='600g （1斤）／盒｜32塊裝，每塊約18.75 g';"),
            ('主規格維持簡潔；產品詳頁可顯示每塊約重，不再全站硬刪。','顧客產品頁可直接顯示完整規格與每塊約重；正式產品圖仍維持原圖與包裝比例。'),
          ])
          patch('site.js',[
            ('size:"75g （2兩）／盒｜8塊裝",image:', 'size:"75g （2兩）／盒｜8塊裝，每塊約9.375g",image:'),
            ('size:"600g （1斤）／盒｜32塊裝",image:', 'size:"600g （1斤）／盒｜32塊裝，每塊約18.75 g",image:'),
          ])
          patch('products.html',[
            ('content="比較仙加味龜鹿飲30cc玻璃罐、龜鹿飲180cc鋁袋、龜鹿膏100g、龜鹿湯塊75g、龜鹿膠600g與鹿茸粉75g。"','content="比較仙加味龜鹿飲30cc玻璃罐、龜鹿飲180cc鋁袋、龜鹿膏100g、龜鹿湯塊75g （2兩）／盒｜8塊裝，每塊約9.375g、龜鹿膠600g （1斤）／盒｜32塊裝，每塊約18.75 g與鹿茸粉75g。"'),
            ('content="仙加味目前六項正式產品：龜鹿膏100g、龜鹿飲30cc小玻璃罐、龜鹿飲180cc鋁袋、龜鹿湯塊75g、龜鹿膠600g（1斤）與鹿茸粉75g。"','content="仙加味目前六項正式產品：龜鹿膏100g、龜鹿飲30cc小玻璃罐、龜鹿飲180cc鋁袋、龜鹿湯塊75g （2兩）／盒｜8塊裝，每塊約9.375g、龜鹿膠600g （1斤）／盒｜32塊裝，每塊約18.75 g與鹿茸粉75g。"'),
            ('"description":"比較仙加味龜鹿飲30cc玻璃罐、龜鹿飲180cc鋁袋、龜鹿膏100g、龜鹿湯塊75g、龜鹿膠600g與鹿茸粉75g。"','"description":"比較仙加味龜鹿飲30cc玻璃罐、龜鹿飲180cc鋁袋、龜鹿膏100g、龜鹿湯塊75g （2兩）／盒｜8塊裝，每塊約9.375g、龜鹿膠600g （1斤）／盒｜32塊裝，每塊約18.75 g與鹿茸粉75g。"'),
          ])
          patch('product-guilu-tangkuai.html',[
            ('<title>龜鹿湯塊75g｜8塊裝｜使用與保存｜仙加味</title>','<title>龜鹿湯塊75g （2兩）｜8塊裝｜使用與保存｜仙加味</title>'),
            ('content="龜鹿湯塊75g｜8塊裝｜仙加味"','content="龜鹿湯塊75g （2兩）｜8塊裝｜仙加味"'),
            ('content="75g （2兩）／盒｜8塊裝；可搭配熱水與家常燉湯。"','content="75g （2兩）／盒｜8塊裝，每塊約9.375g；可搭配熱水與家常燉湯。"'),
            ('content="仙加味龜鹿湯塊正式主規格75g （2兩）／盒｜8塊裝；每塊約9.375g只屬產品詳細資料，可搭配熱水或家常湯品。"','content="仙加味龜鹿湯塊規格為75g （2兩）／盒｜8塊裝，每塊約9.375g；可搭配熱水或家常湯品。"'),
            ('<span>75g／盒</span>','<span>75g （2兩）／盒</span>'),
            ('龜鹿湯塊為75g （2兩）／盒｜8塊裝；龜鹿膠為600g （1斤）／盒｜32塊裝。','龜鹿湯塊為75g （2兩）／盒｜8塊裝，每塊約9.375g；龜鹿膠為600g （1斤）／盒｜32塊裝，每塊約18.75 g。'),
          ])
          patch('product-guilu-jiao.html',[
            ('<title>龜鹿膠600g（1斤）｜32塊裝｜仙加味</title>','<title>龜鹿膠600g （1斤）｜32塊裝｜仙加味</title>'),
            ('content="龜鹿膠600g（1斤）｜32塊裝｜仙加味"','content="龜鹿膠600g （1斤）｜32塊裝｜仙加味"'),
            ('content="600g （1斤）／盒｜32塊裝。"','content="600g （1斤）／盒｜32塊裝，每塊約18.75 g。"'),
            ('content="仙加味龜鹿膠正式主規格600g （1斤）／盒｜32塊裝；每塊約18.75 g只屬產品詳細資料，可搭配熱水或家常料理。"','content="仙加味龜鹿膠規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g；可搭配熱水或家常料理。"'),
            ('<span>600g（1斤）／盒</span>','<span>600g （1斤）／盒</span>'),
            ('"name":"每塊約","value":"18.75g"','"name":"每塊約","value":"18.75 g"'),
            ('龜鹿膠為600g （1斤）／盒｜32塊裝；龜鹿湯塊為75g （2兩）／盒｜8塊裝。','龜鹿膠為600g （1斤）／盒｜32塊裝，每塊約18.75 g；龜鹿湯塊為75g （2兩）／盒｜8塊裝，每塊約9.375g。'),
          ])
          PY
      - name: Assert exact customer display
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '75g （2兩）／盒｜8塊裝，每塊約9.375g' products.html
          grep -Fq '600g （1斤）／盒｜32塊裝，每塊約18.75 g' products.html
          grep -Fq '75g （2兩）／盒｜8塊裝，每塊約9.375g' faq.html
          grep -Fq '600g （1斤）／盒｜32塊裝，每塊約18.75 g' faq.html
          grep -Fq '<span>75g （2兩）／盒</span>' product-guilu-tangkuai.html
          grep -Fq '<span>600g （1斤）／盒</span>' product-guilu-jiao.html
          grep -Fq 'normalized.size='"'"'75g （2兩）／盒｜8塊裝，每塊約9.375g'"'"'' site-product-data-authority.js
          grep -Fq 'normalized.size='"'"'600g （1斤）／盒｜32塊裝，每塊約18.75 g'"'"'' site-product-data-authority.js
      - name: Validate current customer release
        shell: bash
        run: |
          python tools/validate-site-release.py
          python tools/validate-public-customer-pages-v20260809.py
      - name: Commit verified display polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json site-product-data-authority.js site.js products.html product-guilu-tangkuai.html product-guilu-jiao.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix(site): show full soup block and guilu jiao specs everywhere on product pages'
          git push origin HEAD:main
