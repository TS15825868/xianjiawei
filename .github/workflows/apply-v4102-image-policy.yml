name: 套用全站圖片完整顯示 v410.2

on:
  push:
    branches: [main]
    paths:
      - 'site-ux-v4102.css'
      - 'tools/apply_v4102_image_policy.py'
      - '.github/workflows/apply-v4102-image-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-image-policy-v4102
  cancel-in-progress: true

jobs:
  apply-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 取得 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 套用全站圖片、時間軸與正式名稱
        run: python3 tools/apply_v4102_image_policy.py

      - name: 驗證網站核心與資料
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 -m json.tool catalog-public.json >/dev/null
          python3 -m json.tool deploy-version.json >/dev/null
          git diff --check

      - name: 提交並自動更新 main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '全站已符合 v410.2 正式規則。'
          else
            git commit -m 'feat: 全站圖片完整顯示與30cc玻璃罐正式更新 v410.2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
