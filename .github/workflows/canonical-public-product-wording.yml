name: 官網公開產品名稱、AIO 與 SEO 守門員

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "data.json"
      - "catalog-public.json"
      - "geo-data.json"
      - "llms.txt"
      - "llms-full.txt"
      - "tools/enforce_canonical_public_product_wording.py"
      - ".github/workflows/canonical-public-product-wording.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-public-product-wording-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize canonical public wording
        run: python3 tools/enforce_canonical_public_product_wording.py --write

      - name: Verify canonical wording, AIO sources and official specifications
        run: |
          set -euo pipefail
          python3 tools/enforce_canonical_public_product_wording.py
          git diff --check

      - name: Commit normalized public wording
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Public product wording and AIO/SEO sources are already canonical.'
          else
            git commit -m 'fix(site): normalize public 30cc glass bottle wording'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
