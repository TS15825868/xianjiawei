name: 仙加味｜全部核准商品實拍與無字山水背景
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_brand_neutral_product_scenes.py'
      - '.github/workflows/build-brand-neutral-product-scenes.yml'
permissions:
  contents: write
concurrency:
  group: xjw-brand-neutral-scenic-product-media
  cancel-in-progress: false
jobs:
  build-review-artworks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pillow>=10,<13'
      - name: Generate art using ONLY current approved physical product images
        run: python tools/build_brand_neutral_product_scenes.py
      - name: Save images and real-product provenance for visual review
        uses: actions/upload-artifact@v4
        with:
          name: brand-neutral-scenic-real-product-review
          path: images/catalog-neutral-scenes-v20261016/
          retention-days: 30
      - name: Stage review assets without auto-changing public image references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/catalog-neutral-scenes-v20261016/
          if git diff --cached --quiet; then
            echo 'No candidate media changes'
            exit 0
          fi
          git commit -m 'assets(media): store no-word scenic real-photo candidates [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
