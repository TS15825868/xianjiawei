name: 官網 22 張正式貼文圖上線 v415

on:
  workflow_dispatch:
  page_build:
  push:
    branches: [main]
    paths:
      - staging/post-assets-v413/READY
      - .github/workflows/materialize-post-assets-v413.yml

permissions:
  contents: write

concurrency:
  group: materialize-post-assets-v415
  cancel-in-progress: false

jobs:
  materialize-assets:
    if: github.event_name != 'page_build' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip after successful materialization
        id: gate
        shell: bash
        run: |
          if [ ! -f staging/post-assets-v413/READY ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '22 張圖片已上線，沒有待執行觸發檔。'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install and verify approved post images
        id: install
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            ZIP='staging/post-assets-v412/assets.zip'
            OUT='images/posts/approved-v413'
            TRIAL='images/posts/approved-v412/guilu-drink-trial-evergreen.jpg'
            test -f "$ZIP"
            test -f "$TRIAL"
            rm -rf "$OUT"
            mkdir -p "$OUT"
            unzip -q "$ZIP" -d "$OUT"
            cp "$TRIAL" "$OUT/00-trial-evergreen.jpg"
            COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')"
            test "$COUNT" = '22'
            test -f "$OUT/manifest.json"
            test -f "$OUT/00-trial-evergreen.jpg"
            test -f "$OUT/01-work-rest.jpg"
            test -f "$OUT/21-rain-home-c.jpg"
            cmp -s "$TRIAL" "$OUT/00-trial-evergreen.jpg"
            node - <<'NODE'
            const fs=require('fs');
            const crypto=require('crypto');
            const dir='images/posts/approved-v413';
            const images=fs.readdirSync(dir).filter(name=>name.endsWith('.jpg')).sort();
            const trial=fs.readFileSync(`${dir}/00-trial-evergreen.jpg`);
            const report={status:'success',checked_at:new Date().toISOString(),commit:process.env.GITHUB_SHA||'',directory:dir,image_count:images.length,images,manifest:'manifest.json',trial_poster_source:'images/posts/approved-v412/guilu-drink-trial-evergreen.jpg',trial_poster_sha256:crypto.createHash('sha256').update(trial).digest('hex'),trial_poster_wording:'製作加工約需5～7個工作天，完成後出貨',owner_review_required:true};
            fs.mkdirSync('diagnostics',{recursive:true});
            fs.writeFileSync('diagnostics/post-assets-v413.json',JSON.stringify(report,null,2)+'\n');
            NODE
          } 2>&1 | tee /tmp/post-assets.log

      - name: Persist images or latest failure
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ "$INSTALL_RESULT" != success ]; then
            node - <<'NODE'
            const fs=require('fs');
            const log=fs.existsSync('/tmp/post-assets.log')?fs.readFileSync('/tmp/post-assets.log','utf8').split(/\r?\n/).slice(-160).join('\n'):'';
            fs.writeFileSync('diagnostics/post-assets-v413.json',JSON.stringify({status:'failure',checked_at:new Date().toISOString(),commit:process.env.GITHUB_SHA||'',last_error:log},null,2)+'\n');
            NODE
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/post-assets-v413.json
          if [ "$INSTALL_RESULT" = success ]; then
            git add images/posts/approved-v413
            git rm -r --ignore-unmatch staging/post-assets-v413
          fi
          if ! git diff --cached --quiet; then
            if [ "$INSTALL_RESULT" = success ]; then
              git commit -m 'assets(site): publish 22 approved social post images v415'
            else
              git commit -m 'chore(site): record 22-image materialization failure v415'
            fi
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Fail after diagnostic is persisted
        if: always() && steps.gate.outputs.run == 'true'
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
        run: test "$INSTALL_RESULT" = success
