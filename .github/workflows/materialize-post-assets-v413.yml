name: 官網 22 張正式貼文圖上線 v417

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["仙加味官網品質守門員"]
    types: [completed]
    branches: [main]
  page_build:
  push:
    branches: [main]
    paths:
      - staging/post-assets-v413/READY
      - .github/workflows/materialize-post-assets-v413.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: materialize-post-assets-v417
  cancel-in-progress: false

jobs:
  materialize-assets:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'page_build' || github.event.build.status == 'built')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install with exact diagnostics
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/post-assets-v417.log) 2>&1
          if [ ! -f staging/post-assets-v413/READY ]; then
            echo 'SKIP: trigger file already removed; approved images already completed.'
            exit 0
          fi
          ZIP='staging/post-assets-v412/assets.zip'
          OUT='images/posts/approved-v413'
          TRIAL='images/posts/approved-v412/guilu-drink-trial-evergreen.jpg'
          echo "CHECK zip exists: $ZIP"
          test -s "$ZIP" || { echo 'ERROR: staged ZIP missing or empty'; exit 11; }
          echo 'CHECK ZIP central directory'
          unzip -t "$ZIP" || { echo 'ERROR: staged ZIP is corrupt'; exit 12; }
          echo "CHECK trial poster exists: $TRIAL"
          test -s "$TRIAL" || { echo 'ERROR: approved trial poster missing or empty'; exit 13; }
          rm -rf "$OUT"
          mkdir -p "$OUT"
          echo 'UNZIP 22 approved images'
          unzip -oq "$ZIP" -d "$OUT" || { echo 'ERROR: unzip failed'; exit 14; }
          echo 'COPY recovered 1200x1200 trial poster'
          cp "$TRIAL" "$OUT/00-trial-evergreen.jpg" || { echo 'ERROR: trial poster copy failed'; exit 15; }
          COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')"
          echo "JPG_COUNT=$COUNT"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$COUNT" = '22' || { echo "ERROR: expected 22 JPG files, got $COUNT"; exit 16; }
          for file in manifest.json 00-trial-evergreen.jpg 01-work-rest.jpg 21-rain-home-c.jpg; do
            test -s "$OUT/$file" || { echo "ERROR: missing required file $file"; exit 17; }
          done
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const dir='images/posts/approved-v413';
          const images=fs.readdirSync(dir).filter(name=>name.endsWith('.jpg')).sort();
          if(images.length!==22) throw new Error(`Node verification expected 22, got ${images.length}`);
          const trial=fs.readFileSync(`${dir}/00-trial-evergreen.jpg`);
          if(trial.length<50000) throw new Error(`Trial poster unexpectedly small: ${trial.length}`);
          const report={
            status:'success',
            version:'v417',
            checked_at:new Date().toISOString(),
            commit:process.env.GITHUB_SHA||'',
            directory:dir,
            image_count:images.length,
            images,
            manifest:'manifest.json',
            trial_poster_source:'images/posts/approved-v412/guilu-drink-trial-evergreen.jpg',
            trial_poster_sha256:crypto.createHash('sha256').update(trial).digest('hex'),
            owner_review_required:true,
            publish_posts:false,
            policy:'images are candidates only; ERP owner approval required before Facebook or Instagram scheduling; LINE VOOM manual'
          };
          fs.mkdirSync('diagnostics',{recursive:true});
          fs.writeFileSync('diagnostics/post-assets-v413.json',JSON.stringify(report,null,2)+'\n');
          console.log(report);
          NODE
          echo 'PASS: 22 approved post images materialized and verified.'

      - name: Persist images or exact failure
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f staging/post-assets-v413/READY ]; then
            exit 0
          fi
          mkdir -p diagnostics
          if [ "$INSTALL_RESULT" != success ]; then
            node - <<'NODE'
            const fs=require('fs');
            const log=fs.existsSync('/tmp/post-assets-v417.log')?fs.readFileSync('/tmp/post-assets-v417.log','utf8').split(/\r?\n/).slice(-220).join('\n'):'installer produced no log';
            fs.writeFileSync('diagnostics/post-assets-v413.json',JSON.stringify({status:'failure',version:'v417',checked_at:new Date().toISOString(),commit:process.env.GITHUB_SHA||'',last_error:log},null,2)+'\n');
            NODE
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/post-assets-v413.json
          if [ "$INSTALL_RESULT" = success ]; then
            git add images/posts/approved-v413
            git rm -r --ignore-unmatch staging/post-assets-v413
          fi
          if ! git diff --cached --quiet; then
            if [ "$INSTALL_RESULT" = success ]; then
              git commit -m 'assets(site): publish 22 approved social post images v417'
            else
              git commit -m 'chore(site): persist exact 22-image failure v417'
            fi
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

          LOG=$(tail -n 220 /tmp/post-assets-v417.log 2>/dev/null || true)
          gh issue comment 156 --repo TS15825868/xianjiawei --body "官網 22 張正式貼文圖 v417：${INSTALL_RESULT}\n\n提交：${GITHUB_SHA}\n\n\`\`\`\n${LOG}\n\`\`\`"

      - name: Fail after diagnostic is persisted
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
        run: test "$INSTALL_RESULT" = success
