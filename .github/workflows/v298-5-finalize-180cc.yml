name: v298.5 finalize 180cc product

on:
  push:
    paths:
      - TRIGGER_V298_5.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split 30cc and 180cc into independent products
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = '298.5';
          const file = 'data.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.version = version;

          const index = data.products.findIndex(p => p.id === 'guilu-drink-30');
          if (index < 0) throw new Error('guilu-drink-30 not found');
          const original = data.products[index];
          const ingredients = original.ingredients || ['水','鹿角萃取物','龜板萃取物','枸杞','紅棗','黃耆','粉光蔘'];

          const drink30 = {
            ...original,
            id: 'guilu-drink-30',
            name: '龜鹿飲30cc',
            displayName: '龜鹿飲30cc',
            size: '30cc／瓶（玻璃瓶）',
            image: 'images/products-v3/guilu-drink-30.jpg?v=298.5',
            dmImage: 'images/dm-v3/guilu-drink-30.jpg?v=298.5',
            description: '30cc玻璃小瓶，把龜鹿膏的成分方向整理成方便即飲的液態型態。適合輕巧即飲、外出攜帶與工作空檔安排。',
            ingredients,
            usage: ['開瓶即可飲用','可依個人習慣溫熱後飲用','開瓶後請儘速飲用完畢'],
            storage: ['未開封置於陰涼乾燥處','避免高溫與日光直射','開瓶後請儘速飲用完畢'],
            fit: '想方便即飲、外出攜帶或在工作空檔飲用的人',
            detailImages: ['images/dm-v3/guilu-drink-30.jpg?v=298.5'],
            detailPage: 'product-guilu-drink-30cc.html',
            purpose: '輕巧即飲食補',
            purposeDirection: '適合外出攜帶、工作空檔或偏好小瓶即飲的人。'
          };
          delete drink30.specOptions;
          delete drink30.extraDetailPages;

          const drink180 = {
            id: 'guilu-drink-180',
            series: '仙加味・龜鹿',
            name: '龜鹿飲180cc',
            displayName: '龜鹿飲180cc',
            size: '180cc／包（鋁袋）',
            image: 'images/products-v3/guilu-drink-180.webp?v=298.5',
            gallery: [],
            dmImage: 'images/dm-v3/guilu-drink-180.webp?v=298.5',
            description: '180cc鋁袋包裝，把龜鹿膏的成分方向整理成較大容量的即飲型態。開封即可飲用，也可依個人習慣溫熱後飲用。',
            ingredients,
            usage: ['打開即可飲用','可隔水加熱後飲用','亦可倒入杯中後加熱飲用','開封後請儘速飲用完畢'],
            storage: ['常溫置於陰涼處','或保存於5°C以下冷藏','開封後請儘速飲用完畢'],
            fit: '偏好較大容量即飲、居家安排或溫熱後飲用的人',
            detailImages: ['images/dm-v3/guilu-drink-180.webp?v=298.5'],
            priceNote: '價格與優惠請透過官方 LINE 詢問。',
            detailPage: 'product-guilu-drink-180cc.html',
            purpose: '較大容量即飲食補',
            purposeDirection: '適合偏好較大容量即飲、居家安排或溫熱後飲用的人。'
          };

          data.products.splice(index, 1, drink30, drink180);
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');

          for (const name of fs.readdirSync('.').filter(n => n.endsWith('.html'))) {
            let html = fs.readFileSync(name, 'utf8');
            html = html.replace(/site\.js\?v=[^"']+/g, 'site.js?v=298.5');
            if (name === 'product-guilu-drink-180cc.html') {
              html = html.replace(/images\/(?:products|dm)-v3\/guilu-drink-180\.(?:jpg|webp)(?:\?v=[^"']+)?/g, 'images/dm-v3/guilu-drink-180.webp?v=298.5');
            }
            if (name === 'product-guilu-drink-30cc.html') {
              html = html.replace(/images\/(?:products|dm)-v3\/guilu-drink-30\.jpg(?:\?v=[^"']+)?/g, 'images/dm-v3/guilu-drink-30.jpg?v=298.5');
            }
            fs.writeFileSync(name, html);
          }

          if (fs.existsSync('site-v287-core.js')) {
            let core = fs.readFileSync('site-v287-core.js', 'utf8');
            core = core.replace(/data\.json\?v=[^'"`]+/g, 'data.json?v=298.5');
            fs.writeFileSync('site-v287-core.js', core);
          }
          NODE

      - name: Clean temporary files and commit
        run: |
          rm -rf images/upload-source
          rm -f UPLOAD_180_PRODUCT_PLACEHOLDER.txt
          rm -f TRIGGER_V298_5.txt
          rm -f .github/workflows/v298-5-apply-180-images.yml
          rm -f .github/workflows/v298-5-finalize-180cc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.5: publish independent 30cc and 180cc product cards"
          git push origin main
