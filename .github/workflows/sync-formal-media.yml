name: 仙加味正式DM與試喝素材同步

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync-formal-media.py'
      - 'docs/FORMAL_MEDIA_POLICY_20260810.md'
      - '.github/workflows/sync-formal-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-formal-media-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync formal customer media
        run: python tools/sync-formal-media.py
      - name: Validate formal specs and display authority
        shell: bash
        run: |
          test -f images/formal-display/manifest.json
          test -f site-formal-media-v20260810.js
          grep -Fq '30cc／罐（小玻璃罐' images/formal-display/manifest.json
          grep -Fq '180cc／包（鋁袋）' images/formal-display/manifest.json
          grep -Fq '75g／盒｜8塊裝' images/formal-display/manifest.json
          grep -Fq '600g／盒｜32塊裝' images/formal-display/manifest.json
          ! grep -R -F '30cc／瓶' --include='*.html' .
          ! grep -R -F '五種產品使用方式' --include='*.html' .
          ! grep -R -F 'products-v2' images/formal-display site-formal-media-v20260810.js
      - name: Commit synchronized formal media
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Formal media already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/formal-display site-formal-media-v20260810.js index.html dm.html products.html trial.html 2>/dev/null || true
          git commit -m 'deploy: sync latest approved DM and trial display media'
          git push origin HEAD:main
