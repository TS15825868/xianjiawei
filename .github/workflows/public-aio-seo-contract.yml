name: 【暫停自動】官網 AIO SEO GEO 正式合約

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-aio-seo-contract-manual
  cancel-in-progress: true

jobs:
  validate-manually:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public AIO SEO GEO output manually
        run: python tools/validate_public_aio_seo.py
