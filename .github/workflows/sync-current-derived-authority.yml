name: 仙加味目前權威衍生資料同步

# MAINTENANCE MODE: manual only until the owner finishes visual/function review.
# 最新正式資料優先；同步器不得把新版規格、用法或顧客文字降級回舊守門內容。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-current-authority-derived-sync
  cancel-in-progress: true

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maintenance mode notice
        run: echo "PAUSED automatic sync; this run is manual maintenance verification only."
      - name: Sync current derived authority files
        run: python tools/sync-current-derived-authority.py
      - name: Validate synchronized customer outputs against latest authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          targets=['content/public-post-library.json','llms-full.txt','llms.txt','catalog-public.json','data.json','geo-data.json','assets/data/official-products.json','public-product-master.json','ai-answers.json']
          retired=['一天一次一小匙','早晚各一小匙','每日早上及下午各一小匙','建議白天飲用','每日1～2罐','每日 1～2罐','每日1-2罐','每日 1-2罐','龜鹿飲30cc玻璃瓶','30cc／瓶']
          current_30='每日 1–2 罐'
          official=json.loads(Path('assets/data/official-products.json').read_text(encoding='utf-8'))
          by={p.get('id'):p for p in official.get('products',[])}
          assert len(by)==7
          assert len(official.get('approved_media_product_ids') or [])==6
          gao=by['guilu-gao']; p30o=by['guilu-drink-30']; tang=by['guilu-tangkuai']; jiao=by['guilu-jiao']; qixuan=by['qixuan-guilu-drink-powder']
          assert gao['usage_primary']=='食用時間可依個人使用習慣與作息時間安排'
          assert p30o['usage_primary']==current_30
          assert p30o['usage_timing']=='飲用時間可依個人使用習慣與作息時間安排'
          assert tang['specification']=='75g （2兩）／盒｜8塊裝' and tang['detail_unit_approx']=='每塊約9.375g'
          assert jiao['specification']=='600g （1斤）／盒｜32塊裝' and str(jiao['detail_unit_approx']).replace(' ','')=='每塊約18.75g'
          assert qixuan['specification']=='2g／小包；20g／包（10小包）'
          assert qixuan.get('media_status')=='formal-product-image-pending'
          public=json.loads(Path('public-product-master.json').read_text(encoding='utf-8'))
          public_by={p.get('id'):p for p in public.get('products',[])}
          assert public_by['guilu-drink-30']['usage'][0]==current_30
          json.loads(Path('content/public-post-library.json').read_text(encoding='utf-8'))
          catalog=json.loads(Path('catalog-public.json').read_text(encoding='utf-8'))
          products={p.get('id'):p for p in catalog.get('products',[])}
          p30=products.get('guilu-drink-30') or {}
          assert str(p30.get('dmImage') or '').split('?',1)[0].endswith('/images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg')
          assert 'quarantinedDmImage' not in p30
          assert catalog.get('knowledgeProductCount')==7
          assert catalog.get('approvedMediaProductCount')==6
          rules=catalog.get('specificationRules') or {}
          assert current_30 in str(rules.get('drink30') or '')
          assert tang['specification'] in str(rules.get('tangkuai') or '') and tang['detail_unit_approx'] in str(rules.get('tangkuai') or '')
          assert jiao['specification'] in str(rules.get('jiao') or '') and '18.75' in str(rules.get('jiao') or '')
          assert '顧客文字可顯示完整規格' in str(rules.get('tangkuai') or '')
          assert '顧客文字可顯示完整規格' in str(rules.get('jiao') or '')
          assert '柒玄茶・龜鹿調飲粉' in Path('public-product-master.json').read_text(encoding='utf-8')
          for rel in targets:
            text=Path(rel).read_text(encoding='utf-8')
            for phrase in retired:
              if phrase in text: raise SystemExit(f'{rel} 顧客／公開目前輸出仍含退役資料：{phrase}')
          print('PASS: derived outputs follow seven-product text authority, six-approved-media model, current 30cc daily 1–2 cans, and no legacy copy regression.')
          PY
      - name: Commit synchronized derived outputs
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Derived authority outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-public.json content/public-post-library.json content/public-content-policy.json config/public-content-policy.json content/post-bank-v6-manifest.json data.json geo-data.json assets/data/official-products.json content/visual-production-spec-current.json llms-full.txt llms.txt
          if git diff --cached --quiet; then
            echo 'No derived output changes to commit.'
            exit 0
          fi
          git commit -m 'sync: refresh derived public content from current authority'
          git push origin HEAD:main
