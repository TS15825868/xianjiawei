name: Finalize website mascot assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-website-assets.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify website mascot images
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image, ImageStat, ImageFilter
          import json

          names = ['home','products','choose','combo','guide','recipes','faq','contact','brand']
          manifest = {'version': '400.2', 'scope': 'xianjiawei/main website assets only', 'images': {}}
          hashes = set()
          for name in names:
              path = Path('images/brand') / f'website-mascot-{name}.jpg'
              if not path.exists() or path.stat().st_size < 100000:
                  raise SystemExit(f'圖片缺少或檔案異常：{path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  edge_mean = ImageStat.Stat(image.convert('L').filter(ImageFilter.FIND_EDGES)).mean[0]
              if width < 1200 or height < 900:
                  raise SystemExit(f'解析度不足：{path} {width}x{height}')
              if edge_mean < 2.0:
                  raise SystemExit(f'圖片疑似空白或嚴重模糊：{path} edge={edge_mean:.2f}')
              digest = sha256(path.read_bytes()).hexdigest()
              hashes.add(digest)
              manifest['images'][name] = {
                  'file': f'images/brand/website-mascot-{name}.jpg',
                  'width': width,
                  'height': height,
                  'bytes': path.stat().st_size,
                  'edgeMean': round(edge_mean, 3),
                  'sha256': digest,
              }
          if len(hashes) != len(names):
              raise SystemExit('網站小老闆圖片有重複內容')
          Path('images/brand/website-mascot-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('網站九張專用小老闆圖片品質確認完成')
          PY

      - name: Unify website code and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = '400.2'

          path = Path('site.js')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'v=\d+(?:\.\d+)*', f'v={version}', text)
          text = text.replace('data-site-v400="1"', 'data-site-version="400.2"')
          path.write_text(text, encoding='utf-8')

          path = Path('site-fix-v317.js')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'const VERSION = "[^"]+";', f'const VERSION = "{version}";', text, count=1)
          path.write_text(text, encoding='utf-8')

          path = Path('site-core.js')
          text = path.read_text(encoding='utf-8')
          mascot_block = '''const MASCOT_IMAGES = {
            welcome: 'images/brand/website-mascot-home.jpg?v=400.2',
            products: 'images/brand/website-mascot-products.jpg?v=400.2',
            guide: 'images/brand/website-mascot-choose.jpg?v=400.2',
            combo: 'images/brand/website-mascot-combo.jpg?v=400.2',
            usage: 'images/brand/website-mascot-guide.jpg?v=400.2',
            recipes: 'images/brand/website-mascot-recipes.jpg?v=400.2',
            faq: 'images/brand/website-mascot-faq.jpg?v=400.2',
            service: 'images/brand/website-mascot-contact.jpg?v=400.2',
            brand: 'images/brand/website-mascot-brand.jpg?v=400.2'
          };'''
          text, count = re.subn(r'const MASCOT_IMAGES = \{.*?\n\};', mascot_block, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('找不到 site-core MASCOT_IMAGES')
          text = text.replace("image: 'products', scene: 'products', eyebrow: '搭配組合'", "image: 'combo', scene: 'combo', eyebrow: '搭配組合'")
          text = text.replace("image: 'usage', scene: 'usage', eyebrow: '料理搭配'", "image: 'recipes', scene: 'recipes', eyebrow: '料理搭配'")
          text = text.replace("image: 'service', scene: 'service', eyebrow: '常見問題'", "image: 'faq', scene: 'faq', eyebrow: '常見問題'")
          text = text.replace("image: 'welcome', scene: 'welcome', eyebrow: '品牌故事'", "image: 'brand', scene: 'brand', eyebrow: '品牌故事'")
          path.write_text(text, encoding='utf-8')

          deploy = {
              'version': version,
              'updated': '2026-07-12',
              'mascot': 'website-dedicated-high-resolution-assets',
              'websiteMascotScenes': ['home','products','choose','combo','guide','recipes','faq','contact','brand'],
              'resolutionMinimum': '1200x900',
              'lineOaAssetsRepository': 'TS15825868/TS-LINE main public/mascot',
              'audit': 'separate-local-assets-no-runtime-cross-project-no-repeat-jpeg-generation-cache-busting-and-sharpness-check'
          }
          Path('deploy-version.json').write_text(json.dumps(deploy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove obsolete mascot generators and mixed LINE assets
        run: |
          rm -rf images/line-mascot
          rm -f images/brand/website-mascot-*.svg
          rm -f tools/generate-mascot-v400.py tools/apply-mascot-v400.py
          rm -f APPLY_MASCOT_V400.txt RUN_FIX_WEBSITE_MASCOT_IMAGES.txt
          rm -f APPLY_WEBSITE_MASCOTS_V314.txt APPLY_WEBSITE_MASCOTS_V319.txt
          rm -f APPLY_WEBSITE_SPRITE_V315.txt APPLY_WEBSITE_SPRITE_V316.txt

      - name: Validate code and commit main
        run: |
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js
          python3 -m json.tool deploy-version.json >/dev/null
          python3 -m json.tool images/brand/website-mascot-manifest.json >/dev/null
          grep -q '400.2' site.js
          grep -q '400.2' site-fix-v317.js
          grep -q 'website-mascot-brand.jpg?v=400.2' site-core.js
          test ! -d images/line-mascot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成網站專用高解析小老闆正式檔案整理"
          git push origin main
