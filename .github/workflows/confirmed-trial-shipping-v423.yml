name: 官網正式試喝規則守門 v423
run-name: 官網 v423｜30cc玻璃罐・買10送1・約5至7個工作天出貨

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'trial.html'
      - 'data.json'
      - 'catalog-public.json'
      - 'tools/**'
      - '.github/workflows/confirmed-trial-shipping-v423.yml'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: website-confirmed-trial-shipping-v423
  cancel-in-progress: true

jobs:
  normalize-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply confirmed trial rules
        run: node tools/lock-confirmed-trial-shipping-v423.mjs

      - name: Run complete website validation
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-site.mjs
          python3 tools/validate_public_aio_seo.py
          node tools/lock-confirmed-trial-shipping-v423.mjs
          git diff --check

      - name: Persist official website state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Website is already aligned with the confirmed rules.'
            exit 0
          fi
          git commit -m 'chore(site): persist confirmed trial shipping rule v423'
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
