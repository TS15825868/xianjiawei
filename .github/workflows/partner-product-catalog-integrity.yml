name: Partner product catalog integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partner-product-catalog-integrity.yml'
      - 'tools/validate-partner-catalog-integrity.py'
      - 'index.html'
      - 'products.html'
      - 'partner-catalog.json'
      - 'data.json'
      - 'site-core-v410.js'
      - 'site-media-modal-final-v20260814.js'
      - 'site.js'
      - 'product-*.html'
      - 'images/partner-products/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public product facts, approved images and detail pages
        run: python3 tools/validate-partner-catalog-integrity.py
