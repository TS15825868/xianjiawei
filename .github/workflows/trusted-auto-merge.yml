name: Trusted PR Test and Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'TS15825868'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full static audit
        run: python3 tools/site_maintenance.py

      - name: JavaScript syntax
        run: |
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js

      - name: HTTP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/xianjiawei-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 2

          for path in \
            index.html products.html choose.html combo.html guide.html recipes.html \
            video.html knowledge.html hanfang-baike.html sources.html dm.html brand.html \
            faq.html contact.html data.json catalog-public.json \
            site.js site-core.js site-fix-v317.js site.css site-v321.css \
            images/brand/xianjiawei-scene-guide.jpg \
            product-guilu-gao.html product-guilu-drink-30cc.html \
            product-guilu-drink-180cc.html product-guilu-tangkuai.html \
            product-guilu-jiao.html product-luerong-fen.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$path" >/dev/null
          done

          grep -q '"id": "guilu-drink-30"' data.json
          grep -q '"id": "guilu-drink-180"' data.json
          grep -q '"id": "guilu-drink-180"' catalog-public.json
          grep -q '@762jybnm' data.json

      - name: Squash merge trusted PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
