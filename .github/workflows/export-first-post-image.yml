name: Export official social images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-first-post-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify official image set exists
        run: |
          test -d images/posts/official-v20260818
          test "$(find images/posts/official-v20260818 -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 13
      - name: Upload official image set
        uses: actions/upload-artifact@v4
        with:
          name: official-social-images-20260818
          path: images/posts/official-v20260818/*.webp
          if-no-files-found: error
          retention-days: 1
