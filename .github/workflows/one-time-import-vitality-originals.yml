name: 仙加味龜鹿活力飲實物原圖匯入
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-import-vitality-originals.yml'
permissions:
  contents: write
concurrency:
  group: one-time-vitality-originals
  cancel-in-progress: false
jobs:
  import-user-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact original uploaded product photographs
        shell: bash
        env:
          MAIN_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3I7cZELbKfOMYPcVd2g8GfqVrb4/8c028de0-f3d1-4bbd-b85d-86b84f250a42.jpg
          LABEL_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3I7cZELbKfOMYPcVd2g8GfqVrb4/1a17e396-e474-4860-8004-72d229f4fcb7.jpg
          JAR_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3I7cZELbKfOMYPcVd2g8GfqVrb4/4f17328e-c37d-4bce-9f9e-a0c1f553788c.jpg
        run: |
          set -euo pipefail
          mkdir -p images/partner-products
          curl -fLsS --connect-timeout 15 --max-time 90 --retry 2 "$MAIN_URL" -o images/partner-products/jinan-vitality-front-original.jpg
          curl -fLsS --connect-timeout 15 --max-time 90 --retry 2 "$LABEL_URL" -o images/partner-products/jinan-vitality-label-original.jpg
          curl -fLsS --connect-timeout 15 --max-time 90 --retry 2 "$JAR_URL" -o images/partner-products/jinan-vitality-jar-original.jpg
          printf '%s  %s\n' \
            'c7ae1de7262dd2e710ef663a1265b57347b3b9e21a0bb2ad91760eb995fdc934' 'images/partner-products/jinan-vitality-front-original.jpg' \
            '99395b0d22f3b8518eac03849147cec625dfda213eb59a6759a41bd7caf2971e' 'images/partner-products/jinan-vitality-label-original.jpg' \
            '11d337bf46167337583e113d7acd4cb0040cbbcac09d197b2f48a74fea35d37b' 'images/partner-products/jinan-vitality-jar-original.jpg' | sha256sum -c -
          for photo in images/partner-products/jinan-vitality-*-original.jpg; do
            test "$(file --mime-type -b "$photo")" = "image/jpeg"
          done
      - name: Commit only exact product-photo bytes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/partner-products/jinan-vitality-*-original.jpg
          if git diff --cached --quiet; then
            echo 'Validated originals already committed'
          else
            git commit -m "assets(food): import three exact user-submitted Jin An vitality photos"
            git push origin HEAD:main
          fi
