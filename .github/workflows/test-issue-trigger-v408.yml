name: Test issue trigger v408
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  test:
    if: github.event.issue.title == 'TEST_V408_ISSUE_TRIGGER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'ISSUE_TRIGGER_OK'});
