name: Inspect 180cc AVIF v2 reassembly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-180-v2-reassembly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reassemble and fully decode
        shell: bash
        run: |
          set -euo pipefail
          test "$(find _upload/avif-v6-180-v2 -maxdepth 1 -type f | wc -l)" -eq 6
          cat _upload/avif-v6-180-v2/001 _upload/avif-v6-180-v2/002 _upload/avif-v6-180-v2/003 _upload/avif-v6-180-v2/004 _upload/avif-v6-180-v2/005 _upload/avif-v6-180-v2/006 | base64 -d > /tmp/180.avif
          mkdir -p inspect-180-v2
          sha256sum /tmp/180.avif | tee inspect-180-v2/sha256.txt
          wc -c /tmp/180.avif | tee inspect-180-v2/size.txt
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt -of default=nw=1 /tmp/180.avif | tee inspect-180-v2/ffprobe.txt
          ffmpeg -v error -i /tmp/180.avif -frames:v 1 -q:v 2 inspect-180-v2/reassembled-180.jpg
          test -s inspect-180-v2/reassembled-180.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-180-v2
          path: inspect-180-v2
          retention-days: 1
