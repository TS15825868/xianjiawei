name: 仙加味官網現行連結／產品／素材完整驗收

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'images/**'
      - 'data/**'
      - 'public-product-master.json'
      - '.github/workflows/site-link-media-audit-current.yml'
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-site-link-media-audit-current
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Verify current public product and media authority
        shell: node {0}
        run: |
          const fs=require('fs');
          const path=require('path');
          const master=JSON.parse(fs.readFileSync('public-product-master.json','utf8'));
          const media=JSON.parse(fs.readFileSync('data/product-media-authority.json','utf8'));
          const errors=[];
          const mainAsset=/^images\/product-main\/.+\.jpg$/i;
          const expectedMain={
            'guilu-gao':'images/product-main/guilu-gao.jpg',
            'guilu-drink-30':'images/product-main/guilu-drink-30.jpg',
            'guilu-drink-180':'images/product-main/guilu-drink-180.jpg',
            'guilu-tangkuai':'images/product-main/guilu-tangkuai.jpg',
            'guilu-jiao':'images/product-main/guilu-jiao.jpg',
            'luerong-fen':'images/product-main/luerong-fen.jpg'
          };
          const validJpeg=p=>{
            if(!fs.existsSync(p))return false;
            const b=fs.readFileSync(p);
            return b.length>=400000&&b[0]===0xff&&b[1]===0xd8&&b[b.length-2]===0xff&&b[b.length-1]===0xd9;
          };
          const products=Array.isArray(master.products)?master.products:[];
          if(master.brand?.name!=='仙加味')errors.push('public master brand不是仙加味');
          if(Number(master.productCount)!==products.length)errors.push(`productCount ${master.productCount} != products ${products.length}`);
          if(!products.length)errors.push('public product master沒有產品');
          const ids=new Set();
          for(const p of products){
            if(!p.id||!p.name||!p.specification)errors.push('產品缺id/name/specification');
            if(ids.has(p.id))errors.push(`產品id重複 ${p.id}`); else ids.add(p.id);
            if(String(p.name).includes('台興山產'))errors.push(`${p.id}: 公開名稱含舊品牌`);
            if(p.id==='guilu-drink-30'&&p.name!=='龜鹿飲30cc玻璃罐')errors.push('30cc正式名稱錯誤');
            if(p.id==='guilu-drink-30'&&p.specification!=='30cc／罐（小玻璃罐）')errors.push('30cc正式規格錯誤');
            if(p.id==='guilu-drink-180'&&p.name!=='龜鹿飲180cc鋁袋')errors.push('180cc正式名稱錯誤');
            if(p.id==='guilu-drink-180'&&p.specification!=='180cc／包（鋁袋）')errors.push('180cc正式規格錯誤');
          }
          const mediaById=new Map(Object.entries(media.products||{}));
          for(const p of products){
            const m=mediaById.get(p.id);
            if(!m){errors.push(`${p.id}: 官網產品圖片權威缺產品`);continue}
            const main=String(m.mainImage||'').replace(/^\//,'');
            const details=Array.isArray(m.detailImages)?m.detailImages.map(x=>String(x||'').replace(/^\//,'')):[];
            const identity=String(m.identityReference||'').replace(/^\//,'');
            if(!mainAsset.test(main))errors.push(`${p.id}: 一般展示主圖必須是唯一使用者核准 product-main JPG：${main}`);
            else if(!fs.existsSync(path.resolve(main)))errors.push(`${p.id}: mainImage實體不存在 ${main}`);
            else if(!validJpeg(path.resolve(main)))errors.push(`${p.id}: product-main JPG疑似低畫質、截斷或格式錯誤 ${main}`);
            if(main!==expectedMain[p.id])errors.push(`${p.id}: 未使用唯一正式 product-main ${expectedMain[p.id]}`);
            if(!identity)errors.push(`${p.id}: 缺 identityReference`);
            else if(!fs.existsSync(path.resolve(identity)))errors.push(`${p.id}: identityReference實體不存在 ${identity}`);
            if(identity===main)errors.push(`${p.id}: identityReference 不得直接當一般展示主圖`);
            if(!details.length)errors.push(`${p.id}: 缺 detailImages`);
            for(const d of details){
              if(!/^images\/dm-final\//i.test(d))errors.push(`${p.id}: 詳細圖不在 dm-final：${d}`);
              else if(!fs.existsSync(path.resolve(d)))errors.push(`${p.id}: detailImage實體不存在 ${d}`);
              if(d===main)errors.push(`${p.id}: mainImage/detailImage角色混用`);
            }
          }
          if(String(mediaById.get('guilu-drink-30')?.mainImage||'')!==expectedMain['guilu-drink-30'])errors.push('30cc一般展示未使用正式小玻璃裸罐 product-main JPG');
          if(String(mediaById.get('guilu-drink-180')?.mainImage||'')!==expectedMain['guilu-drink-180'])errors.push('180cc一般展示未使用正式鋁袋 product-main JPG');
          if(!String(mediaById.get('guilu-drink-30')?.detailImages?.[0]||'').includes('02_guilu-drink-30cc-dm-official-v20260814.jpg'))errors.push('30cc詳細頁DM錯誤');
          if(!String(mediaById.get('guilu-drink-180')?.detailImages?.[0]||'').includes('03_guilu-drink-180cc-dm.jpg'))errors.push('180cc詳細頁DM錯誤');
          // Detail-page Hero / DM role validation: same product-main above, dm-final only in detail section.
          const detailPages={
            'guilu-gao':'product-guilu-gao.html',
            'guilu-drink-30':'product-guilu-drink-30cc.html',
            'guilu-drink-180':'product-guilu-drink-180cc.html',
            'guilu-tangkuai':'product-guilu-tangkuai.html',
            'guilu-jiao':'product-guilu-jiao.html',
            'luerong-fen':'product-luerong-fen.html'
          };
          for(const [id,pageFile] of Object.entries(detailPages)){
            const m=mediaById.get(id);
            const pageText=fs.readFileSync(pageFile,'utf8');
            const main=String(m?.mainImage||'');
            if(!main||!pageText.includes(main))errors.push(`${pageFile}: Hero 未使用該產品唯一 mainImage ${main}`);
            if(/images\/dm-final\//i.test(pageText))errors.push(`${pageFile}: 外層產品頁不得直接嵌入 dm-final；DM 只能由查看介紹 Modal 顯示`);
          }
          const publicSurfaces=['index.html','products.html','choose.html','trial.html',...Object.values(detailPages)];
          const retiredPublicImage=/(?:images\/(?:products-v\d+|customer-display-v20260812|product-focus-v20260925)\/[^"'\s]+|images\/product-main\/[^"'\s]+\.svg)/i;
          for(const file of publicSurfaces){
            const text=fs.readFileSync(file,'utf8');
            if(retiredPublicImage.test(text))errors.push(`${file}: 公開產品主圖仍混用退役圖片或 product-main SVG`);
          }
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          console.log(`PASS website product/media authority: ${products.length} products, ${master.version}`);

      - name: Validate public runtime syntax and responsive contract
        shell: bash
        run: |
          set -euo pipefail
          for file in site.js site-core-v410.js site-product-media-authority.js site-product-data-authority.js site-customer-display-v20260812.js site-dm-authority-v20260811.js site-media-modal-final-v20260814.js site-product-image-safety.js site-official-product-variants.js site-stability-v20260814.js; do
            node --check "$file"
          done
          grep -q 'mobile-compare-ready' site-core-v410.js
          grep -q 'site.css?v=20261008-links-scene-v47' index.html
          grep -q 'site.js' index.html
          grep -q '.site-menu{display:none;position:fixed;inset:0' site.css
          grep -q '.site-menu__panel' site.css
          grep -q 'safe-area-inset-bottom' site.css
          if grep -R -n 'images/line-qr.jpg' -- *.html site-core-v410.js; then
            echo 'ERROR: 公開頁仍引用舊 LINE QR JPG'
            exit 1
          fi
          echo 'PASS runtime syntax / fixed navigation / cross-device / LINE QR contract'

      - name: Audit internal links anchors local assets and public wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json, re

          root=Path('.')
          htmls=sorted([p for p in root.glob('*.html') if p.is_file()])
          errors=[]; warnings=[]; checks=0

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.assets=[]; self.ids=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d and d['id']: self.ids.add(d['id'])
                  if 'name' in d and d['name']: self.ids.add(d['name'])
                  if tag=='a' and d.get('href'): self.links.append(d['href'])
                  if tag in {'img','script','source','video'} and d.get('src'): self.assets.append(d['src'])
                  if tag=='link' and d.get('href') and d.get('rel') and any(x in str(d.get('rel')) for x in ['stylesheet','icon']): self.assets.append(d['href'])

          parsed={}
          for f in htmls:
              text=f.read_text('utf-8',errors='replace')
              if '台興山產' in text: errors.append(f'{f}: 公開HTML含舊品牌名台興山產')
              if re.search(r'30\s*cc.{0,16}(玻璃瓶|／\s*瓶|瓶裝)',text,re.I|re.S): errors.append(f'{f}: 公開HTML含30cc舊瓶稱')
              p=P(); p.feed(text); parsed[f.name]=p

          def clean_path(v):
              return unquote(v.split('?',1)[0].split('#',1)[0]).lstrip('./')

          for f in htmls:
              p=parsed[f.name]
              for href in p.links:
                  checks+=1
                  h=href.strip()
                  if not h or h.lower().startswith(('mailto:','tel:','javascript:','data:')): continue
                  if h.startswith('#'):
                      frag=h[1:]
                      if frag and frag not in p.ids: errors.append(f'{f}: missing anchor #{frag}')
                      continue
                  u=urlparse(h)
                  if u.scheme in {'http','https'}:
                      if u.netloc=='ts15825868.github.io' and u.path.startswith('/xianjiawei/'):
                          rel=u.path[len('/xianjiawei/'):]
                          target=rel or 'index.html'
                          if target.endswith('/') or not Path(target).suffix: target=target.rstrip('/')+'/index.html'
                          tp=root/target
                          if not tp.exists(): errors.append(f'{f}: missing internal target {h}')
                          if u.fragment and tp.suffix=='.html' and tp.name in parsed and u.fragment not in parsed[tp.name].ids:
                              errors.append(f'{f}: missing target anchor {h}')
                      continue
                  target=clean_path(h)
                  if not target: continue
                  tp=(f.parent/target).resolve()
                  try: tp.relative_to(root.resolve())
                  except Exception: continue
                  if target.endswith('/') or not Path(target).suffix: tp=tp/'index.html'
                  if not tp.exists(): errors.append(f'{f}: missing link target {h}')
                  elif u.fragment and tp.suffix=='.html' and tp.name in parsed and u.fragment not in parsed[tp.name].ids:
                      errors.append(f'{f}: missing target anchor {h}')

              for src in p.assets:
                  checks+=1
                  s=src.strip()
                  if not s or s.startswith(('data:','http://','https://','//')): continue
                  target=clean_path(s)
                  if not target: continue
                  tp=(f.parent/target).resolve()
                  try: tp.relative_to(root.resolve())
                  except Exception: continue
                  if not tp.exists(): errors.append(f'{f}: missing asset {src}')

          report={'htmlPages':len(htmls),'checks':checks,'errors':errors,'warnings':warnings}
          Path('site-link-media-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors: raise SystemExit(1)
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-site-link-media-audit-${{ github.run_id }}
          path: site-link-media-audit.json
          if-no-files-found: error
          retention-days: 7
