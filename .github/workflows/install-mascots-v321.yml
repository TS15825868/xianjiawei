name: Install website mascots v321

on:
  pull_request:
    branches: [main]
    paths:
      - INSTALL_MASCOTS_V321.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download and verify approved images
        run: |
          python3 -m pip install --quiet gdown pillow
          gdown --id 1Fo0MhGFyUhnQd14COzo3ZjkzPsl2JDOL -O /tmp/website-mascots.zip
          unzip -t /tmp/website-mascots.zip
          rm -rf /tmp/website-mascots
          mkdir -p /tmp/website-mascots images/brand
          unzip -o /tmp/website-mascots.zip -d /tmp/website-mascots
          find /tmp/website-mascots -type f -name 'xianjiawei-scene-*.jpg' -exec cp {} images/brand/ \;
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=['welcome','products','guide','combo','usage','service','brand']
          for name in names:
              p=Path(f'images/brand/xianjiawei-scene-{name}.jpg')
              if not p.exists() or p.stat().st_size < 200000:
                  raise SystemExit(f'圖片缺少或檔案過小：{p}')
              with Image.open(p) as im:
                  if im.size != (1600,1200):
                      raise SystemExit(f'圖片尺寸錯誤：{p} {im.size}')
                  im.verify()
          print('高畫質小老闆圖片驗證完成')
          PY

      - name: Commit high-resolution images to PR branch
        run: |
          rm -f INSTALL_MASCOTS_V321.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/brand INSTALL_MASCOTS_V321.txt
          git commit -m '正式上傳七張網站專用高畫質小老闆圖 v321'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
