name: 仙加味 AI／GEO 現行正式資料與線上索引驗收

# 公開權威變更時執行本地唯讀驗證；正式網站抓取維持手動，避免部署時序與重複請求。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-geo-current-audit.yml'
      - 'tools/free_live_search_audit.py'
      - 'tools/validate_public_aio_seo.py'
      - 'tools/test-ai-geo-catalog-authority.cjs'
      - 'site-analytics.js'
      - 'site.js'
      - 'tools/test-site-analytics.cjs'
      - 'tools/test-partner-product-line-entry.cjs'
      - 'product-*.html'
      - 'public-product-master.json'
      - 'partner-catalog.json'
      - 'catalog-public.json'
      - 'ai-answers.json'
      - 'geo-data.json'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'sitemap.xml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-ai-geo-current-audit
  cancel-in-progress: true

jobs:
  validate-ai-geo-current:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify complete public AI catalog against current source authorities
        run: node --test tools/test-ai-geo-catalog-authority.cjs tools/test-site-analytics.cjs tools/test-partner-product-line-entry.cjs
      - name: Validate current own-brand AI and GEO authority
        run: |
          set -euo pipefail
          python -m json.tool public-product-master.json >/dev/null
          python -m json.tool ai-answers.json >/dev/null
          python -m json.tool geo-data.json >/dev/null
          python tools/validate-ai-geo-current-v20260820.py
      - name: Verify full live website catalog and hidden-page indexability
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/free_live_search_audit.py
      - name: Ensure audit is read-only
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short
