name: Finalize website mascot on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.issue.title == 'RUN WEBSITE MASCOT FINALIZE 400.2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify website dedicated images without recompressing them
        run: |
          python3 -m pip install --quiet pillow
          rm -f images/brand/website-mascot-*.svg

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image, ImageStat, ImageFilter
          import json

          names = ['home','products','choose','combo','guide','recipes','faq','contact','brand']
          manifest = {'version': '400.2', 'scope': 'xianjiawei/main website assets only', 'images': {}}
          hashes = set()
          for name in names:
              path = Path('images/brand') / f'website-mascot-{name}.jpg'
              if not path.exists() or path.stat().st_size < 100000:
                  raise SystemExit(f'圖片缺少或檔案異常：{path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  gray = image.convert('L')
                  edges = gray.filter(ImageFilter.FIND_EDGES)
                  edge_mean = ImageStat.Stat(edges).mean[0]
              if width < 1200 or height < 900:
                  raise SystemExit(f'解析度不足：{path} {width}x{height}')
              if edge_mean < 2.0:
                  raise SystemExit(f'圖片疑似空白或嚴重模糊：{path} edge={edge_mean:.2f}')
              digest = sha256(path.read_bytes()).hexdigest()
              hashes.add(digest)
              manifest['images'][name] = {
                  'file': f'images/brand/website-mascot-{name}.jpg',
                  'width': width,
                  'height': height,
                  'bytes': path.stat().st_size,
                  'edgeMean': round(edge_mean, 3),
                  'sha256': digest,
              }
          if len(hashes) != len(names):
              raise SystemExit('網站小老闆圖片有重複內容')
          Path('images/brand/website-mascot-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Fix cache versions and remove every repeat-compression path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = '400.2'
          site_js = Path('site.js')
          text = site_js.read_text(encoding='utf-8')
          text = re.sub(r'v=\d+(?:\.\d+)*', f'v={version}', text)
          site_js.write_text(text, encoding='utf-8')

          site_fix = Path('site-fix-v317.js')
          text = site_fix.read_text(encoding='utf-8')
          text = re.sub(r'const VERSION = "[^"]+";', f'const VERSION = "{version}";', text, count=1)
          site_fix.write_text(text, encoding='utf-8')

          site_core = Path('site-core.js')
          text = site_core.read_text(encoding='utf-8')
          text = re.sub(r'(website-mascot-[a-z-]+\.jpg)\?v=\d+(?:\.\d+)*', rf'\1?v={version}', text)
          site_core.write_text(text, encoding='utf-8')

          deploy = {
              'version': version,
              'updated': '2026-07-12',
              'mascot': 'website-dedicated-high-resolution-assets',
              'websiteMascotScenes': ['home','products','choose','combo','guide','recipes','faq','contact','brand'],
              'resolutionMinimum': '1200x900',
              'lineOaAssetsRepository': 'TS15825868/TS-LINE main public/mascot',
              'audit': 'no-cross-project-runtime-no-repeat-jpeg-generation-cache-busting-and-image-sharpness-check'
          }
          Path('deploy-version.json').write_text(json.dumps(deploy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f tools/generate-mascot-v400.py tools/apply-mascot-v400.py
          rm -f .github/workflows/apply-mascot-v400.yml .github/workflows/apply-mascot-v400-pr.yml
          rm -f .github/workflows/bootstrap-website-mascot.yml
          rm -f .github/workflows/fix-and-run-website-mascot.yml
          rm -f APPLY_MASCOT_V400.txt RUN_FIX_WEBSITE_MASCOT_IMAGES.txt
          rm -f APPLY_WEBSITE_MASCOTS_V314.txt APPLY_WEBSITE_MASCOTS_V319.txt
          rm -f APPLY_WEBSITE_SPRITE_V315.txt APPLY_WEBSITE_SPRITE_V316.txt
          rm -rf images/line-mascot

      - name: Write clean website-only deployment workflow
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy仙加味網站

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build-and-deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Verify production website
                  run: |
                    python3 tools/site_maintenance.py
                    node --check site.js
                    node --check site-core.js
                    node --check site-fix-v317.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool images/brand/website-mascot-manifest.json >/dev/null
                    python3 - <<'PY'
                    import json
                    from pathlib import Path
                    manifest = json.loads(Path('images/brand/website-mascot-manifest.json').read_text(encoding='utf-8'))
                    if len(manifest.get('images', {})) != 9:
                        raise SystemExit('網站小老闆圖片數量不正確')
                    for item in manifest['images'].values():
                        path = Path(item['file'])
                        if not path.exists() or path.stat().st_size < 100000:
                            raise SystemExit('網站小老闆圖片缺少或檔案異常：' + str(path))
                        if item['width'] < 1200 or item['height'] < 900 or item['edgeMean'] < 2:
                            raise SystemExit('網站小老闆圖片品質不合格：' + str(path))
                    if Path('images/line-mascot').exists():
                        raise SystemExit('網站專案不應包含 LINE OA 專用圖片')
                    print('網站九張專用小老闆圖片品質確認完成')
                    PY

                - name: Prepare public website
                  run: |
                    rm -rf _site
                    mkdir -p _site
                    rsync -a ./ _site/ \
                      --exclude='.git/' \
                      --exclude='.github/' \
                      --exclude='_site/' \
                      --exclude='tools/' \
                      --exclude='node_modules/' \
                      --exclude='.website-*' \
                      --exclude='assets/' \
                      --exclude='*.zip' \
                      --exclude='*.tar' \
                      --exclude='*.tar.gz' \
                      --exclude='*.b64' \
                      --exclude='*.md' \
                      --exclude='APPLY_*' \
                      --exclude='RUN_*' \
                      --exclude='INSTALL_*' \
                      --exclude='FIX_*'
                    touch _site/.nojekyll
                    python3 - <<'PY'
                    from pathlib import Path
                    import re
                    version = '400.2'
                    root = Path('_site')
                    pages = list(root.glob('*.html'))
                    for page in pages:
                        text = page.read_text(encoding='utf-8')
                        text = re.sub(r'site\.css\?v=[^"\']+', f'site.css?v={version}', text)
                        text = re.sub(r'site\.js\?v=[^"\']+', f'site.js?v={version}', text)
                        text = re.sub(r'site-v321\.css\?v=[^"\']+', f'site-v321.css?v={version}', text)
                        if 'site-v321.css' not in text:
                            text = text.replace('</head>', f'<link rel="stylesheet" href="site-v321.css?v={version}"/>\n</head>')
                        page.write_text(text, encoding='utf-8')
                    required = ['site.js','site-core.js','site-fix-v317.js','site.css','site-v321.css','data.json','catalog-public.json','images/brand/website-mascot-manifest.json']
                    required += [f'images/brand/website-mascot-{name}.jpg' for name in ('home','products','choose','combo','guide','recipes','faq','contact','brand')]
                    for filename in required:
                        target = root / filename
                        if not target.exists() or target.stat().st_size == 0:
                            raise SystemExit('缺少發布檔案：' + filename)
                    print(f'準備完成：{len(pages)} 個頁面，v{version} 網站專用九種高解析小老闆。')
                    PY

                - name: Configure Pages
                  uses: actions/configure-pages@v5
                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - name: Deploy Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Validate and publish main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js
          python3 -m json.tool deploy-version.json >/dev/null
          python3 -m json.tool images/brand/website-mascot-manifest.json >/dev/null
          grep -q '400.2' site.js
          grep -q '400.2' site-fix-v317.js
          test ! -d images/line-mascot
          rm -f .github/workflows/trigger-website-mascot-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成網站專用高解析小老闆正式版"
          git push origin main
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment '網站小老闆正式版已完成並提交 main。'
