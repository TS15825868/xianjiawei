name: Bootstrap website mascot assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-website-mascot.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved high-resolution mascot package
        run: |
          python3 -m pip install --quiet gdown pillow
          gdown --id 1Fo0MhGFyUhnQd14COzo3ZjkzPsl2JDOL -O /tmp/xianjiawei-mascot-v400.zip
          test $(wc -c < /tmp/xianjiawei-mascot-v400.zip) -gt 10000000
          unzip -t /tmp/xianjiawei-mascot-v400.zip
          rm -rf /tmp/xianjiawei-mascot-v400
          mkdir -p /tmp/xianjiawei-mascot-v400
          unzip -q /tmp/xianjiawei-mascot-v400.zip -d /tmp/xianjiawei-mascot-v400

      - name: Install website dedicated images only
        run: |
          mkdir -p images/brand
          for name in home products choose combo guide recipes faq contact brand; do
            src="/tmp/xianjiawei-mascot-v400/images/brand/website-mascot-${name}.jpg"
            test -s "$src"
            cp "$src" "images/brand/website-mascot-${name}.jpg"
          done
          rm -rf images/line-mascot
          rm -f images/brand/website-mascot-*.svg

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import json

          names = ['home','products','choose','combo','guide','recipes','faq','contact','brand']
          manifest = {'version': '400.1', 'scope': 'xianjiawei/main website only', 'images': {}}
          hashes = set()
          for name in names:
              path = Path('images/brand') / f'website-mascot-{name}.jpg'
              if path.stat().st_size < 500000:
                  raise SystemExit(f'圖片檔案過小：{path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
              if width < 1200 or height < 900:
                  raise SystemExit(f'解析度不足：{path} {width}x{height}')
              digest = sha256(path.read_bytes()).hexdigest()
              hashes.add(digest)
              manifest['images'][name] = {
                  'file': f'images/brand/website-mascot-{name}.jpg',
                  'width': width,
                  'height': height,
                  'bytes': path.stat().st_size,
                  'sha256': digest,
              }
          if len(hashes) != len(names):
              raise SystemExit('網站小老闆圖片有重複內容')
          Path('images/brand/website-mascot-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Unify website cache version and remove unsafe generators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = '400.1'

          site_js = Path('site.js')
          text = site_js.read_text(encoding='utf-8')
          text = re.sub(r'v=\d+(?:\.\d+)*', f'v={version}', text)
          site_js.write_text(text, encoding='utf-8')

          site_fix = Path('site-fix-v317.js')
          text = site_fix.read_text(encoding='utf-8')
          text = re.sub(r'const VERSION = "[^"]+";', f'const VERSION = "{version}";', text, count=1)
          text = re.sub(r'\?v=\d+(?:\.\d+)*', f'?v={version}', text)
          site_fix.write_text(text, encoding='utf-8')

          site_core = Path('site-core.js')
          text = site_core.read_text(encoding='utf-8')
          text = re.sub(r'(website-mascot-[a-z-]+\.jpg)\?v=\d+(?:\.\d+)*', rf'\1?v={version}', text)
          site_core.write_text(text, encoding='utf-8')

          deploy = {
              'version': version,
              'updated': '2026-07-12',
              'mascot': 'website-dedicated-approved-high-resolution-assets',
              'websiteMascotScenes': ['home','products','choose','combo','guide','recipes','faq','contact','brand'],
              'resolutionMinimum': '1200x900',
              'lineOaAssetsRepository': 'TS15825868/TS-LINE main public/mascot',
              'audit': 'direct-local-assets-no-cross-project-proxy-no-repeat-jpeg-generation-cache-busting'
          }
          Path('deploy-version.json').write_text(json.dumps(deploy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f tools/generate-mascot-v400.py tools/apply-mascot-v400.py
          rm -f APPLY_MASCOT_V400.txt RUN_FIX_WEBSITE_MASCOT_IMAGES.txt APPLY_WEBSITE_MASCOTS_V314.txt APPLY_WEBSITE_MASCOTS_V319.txt APPLY_WEBSITE_SPRITE_V315.txt APPLY_WEBSITE_SPRITE_V316.txt
          rm -f .github/workflows/apply-mascot-v400.yml .github/workflows/apply-mascot-v400-pr.yml

      - name: Write clean production deploy workflow
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy仙加味網站

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build-and-deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Verify production website
                  run: |
                    python3 tools/site_maintenance.py
                    node --check site.js
                    node --check site-core.js
                    node --check site-fix-v317.js
                    python3 -m json.tool data.json >/dev/null
                    python3 -m json.tool images/brand/website-mascot-manifest.json >/dev/null
                    python3 - <<'PY'
                    import json
                    from pathlib import Path
                    manifest = json.loads(Path('images/brand/website-mascot-manifest.json').read_text(encoding='utf-8'))
                    if len(manifest.get('images', {})) != 9:
                        raise SystemExit('網站小老闆圖片數量不正確')
                    for item in manifest['images'].values():
                        path = Path(item['file'])
                        if not path.exists() or path.stat().st_size < 500000:
                            raise SystemExit('網站小老闆圖片缺少或檔案過小：' + str(path))
                        if item['width'] < 1200 or item['height'] < 900:
                            raise SystemExit('網站小老闆圖片解析度不足：' + str(path))
                    if Path('images/line-mascot').exists():
                        raise SystemExit('網站專案不應再包含 LINE OA 小老闆圖片')
                    print('網站九張專用小老闆圖片確認完成')
                    PY

                - name: Prepare public website
                  run: |
                    rm -rf _site
                    mkdir -p _site
                    rsync -a ./ _site/ \
                      --exclude='.git/' \
                      --exclude='.github/' \
                      --exclude='_site/' \
                      --exclude='tools/' \
                      --exclude='node_modules/' \
                      --exclude='.website-*' \
                      --exclude='assets/' \
                      --exclude='*.zip' \
                      --exclude='*.tar' \
                      --exclude='*.tar.gz' \
                      --exclude='*.b64' \
                      --exclude='*.md' \
                      --exclude='APPLY_*' \
                      --exclude='RUN_*' \
                      --exclude='INSTALL_*' \
                      --exclude='FIX_*'
                    touch _site/.nojekyll

                    python3 - <<'PY'
                    from pathlib import Path
                    import re

                    version = '400.1'
                    root = Path('_site')
                    pages = list(root.glob('*.html'))
                    for page in pages:
                        text = page.read_text(encoding='utf-8')
                        text = re.sub(r'site\.css\?v=[^"\']+', f'site.css?v={version}', text)
                        text = re.sub(r'site\.js\?v=[^"\']+', f'site.js?v={version}', text)
                        text = re.sub(r'site-v321\.css\?v=[^"\']+', f'site-v321.css?v={version}', text)
                        text = re.sub(
                            r'資料更新：\d{4}-\d{2}-\d{2}｜內容版本 v[\d.]+',
                            f'資料更新：2026-07-12｜內容版本 v{version}',
                            text,
                        )
                        if 'site-v321.css' not in text:
                            text = text.replace('</head>', f'<link rel="stylesheet" href="site-v321.css?v={version}"/>\n</head>')
                        page.write_text(text, encoding='utf-8')

                    required_pages = {
                        'index.html','products.html','choose.html','combo.html','guide.html',
                        'recipes.html','video.html','knowledge.html','hanfang-baike.html',
                        'sources.html','dm.html','brand.html','faq.html','contact.html',
                        'product-guilu-gao.html','product-guilu-drink-30cc.html',
                        'product-guilu-drink-180cc.html','product-guilu-tangkuai.html',
                        'product-guilu-jiao.html','product-luerong-fen.html',
                    }
                    missing = sorted(required_pages - {page.name for page in pages})
                    if missing:
                        raise SystemExit('缺少網站頁面：' + ', '.join(missing))

                    required_files = [
                        'site.js','site-core.js','site-fix-v317.js','site.css','site-v321.css',
                        'data.json','catalog-public.json','images/brand/website-mascot-manifest.json',
                    ] + [f'images/brand/website-mascot-{name}.jpg' for name in (
                        'home','products','choose','combo','guide','recipes','faq','contact','brand'
                    )]
                    for required_file in required_files:
                        target = root / required_file
                        if not target.exists() or target.stat().st_size == 0:
                            raise SystemExit('缺少發布檔案：' + required_file)
                    print(f'準備完成：{len(pages)} 個頁面，v{version} 網站專用九種高解析小老闆。')
                    PY

                - name: Configure Pages
                  uses: actions/configure-pages@v5

                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site

                - name: Deploy Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Validate website release
        run: |
          node --check site.js
          node --check site-core.js
          node --check site-fix-v317.js
          python3 -m json.tool deploy-version.json >/dev/null
          python3 -m json.tool images/brand/website-mascot-manifest.json >/dev/null
          grep -q '400.1' site.js
          grep -q '400.1' site-fix-v317.js
          test ! -d images/line-mascot

      - name: Commit directly to main
        run: |
          rm -f .github/workflows/bootstrap-website-mascot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成網站專用高解析小老闆正式版"
          git push origin main
