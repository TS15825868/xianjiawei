name: v298.5 apply 180cc images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert uploaded WebP sources to website JPG files
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re

          pairs = [
              (Path('images/upload-source/guilu-drink-180-product.webp'), Path('images/products-v3/guilu-drink-180.jpg')),
              (Path('images/upload-source/guilu-drink-180-dm.webp'), Path('images/dm-v3/guilu-drink-180.jpg')),
          ]
          for src, dst in pairs:
              if not src.exists():
                  raise SystemExit(f'Missing source image: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              image = Image.open(src).convert('RGB')
              image.save(dst, 'JPEG', quality=90, optimize=True, progressive=True)

          version = '298.5'
          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = version
          for product in data.get('products', []):
              if product.get('id') == 'guilu-drink-180':
                  product['image'] = f'images/products-v3/guilu-drink-180.jpg?v={version}'
                  product['dmImage'] = f'images/dm-v3/guilu-drink-180.jpg?v={version}'
                  product['detailImages'] = [f'images/dm-v3/guilu-drink-180.jpg?v={version}']
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              if html.name == 'product-guilu-drink-180.html':
                  text = re.sub(r'images/(?:products|dm)-v3/guilu-drink-180\.jpg(?:\?v=[^\"\']+)?', f'images/dm-v3/guilu-drink-180.jpg?v={version}', text)
              text = re.sub(r'site\.js\?v=[^\"\']+', f'site.js?v={version}', text)
              html.write_text(text, encoding='utf-8')

          core = Path('site-v287-core.js')
          if core.exists():
              text = core.read_text(encoding='utf-8')
              text = re.sub(r"data\.json\?v=[^'\"]+", f'data.json?v={version}', text)
              core.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary files and commit
        run: |
          rm -rf images/upload-source
          rm -f UPLOAD_180_PRODUCT_PLACEHOLDER.txt
          rm -f .github/workflows/v298-5-apply-180-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.5: publish 180cc product image and DM"
          git push origin main
