name: Repair and audit website v320

on:
  push:
    branches: [main]
    paths:
      - RUN_REPAIR_SITE_V320.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Build sharp independent mascot images
        run: |
          set -euo pipefail
          test -s assets/website-sprite-part01.txt
          test -s assets/website-sprite-part02.txt
          cat assets/website-sprite-part01.txt assets/website-sprite-part02.txt | tr -d '\n\r ' | base64 -d > /tmp/xianjiawei-scenes-sprite.jpg
          file /tmp/xianjiawei-scenes-sprite.jpg | grep -q 'JPEG image data'
          mkdir -p images/brand
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageOps

          src = Image.open('/tmp/xianjiawei-scenes-sprite.jpg').convert('RGB')
          w, h = src.size
          if w % 4 or h % 2:
              raise SystemExit(f'Unexpected sprite size: {w}x{h}')
          tw, th = w // 4, h // 2
          names = [
              ['welcome', 'products', 'guide', 'combo'],
              ['usage', 'recipes', 'faq', 'service'],
          ]
          out = Path('images/brand')
          for row in range(2):
              for col in range(4):
                  name = names[row][col]
                  tile = src.crop((col * tw, row * th, (col + 1) * tw, (row + 1) * th))
                  # 網站卡片固定 4:3；至少輸出 1600x1200，避免 Retina 手機放大模糊。
                  if tile.width < 1600 or tile.height < 1200:
                      scale = max(1600 / tile.width, 1200 / tile.height)
                      tile = tile.resize((round(tile.width * scale), round(tile.height * scale)), Image.Resampling.LANCZOS)
                  tile = ImageOps.fit(tile, (1600, 1200), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  tile = tile.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
                  tile.save(out / f'xianjiawei-scene-{name}.jpg', 'JPEG', quality=92, subsampling=0, optimize=True, progressive=True)
          # 品牌故事目前沿用歡迎情境，但保留獨立檔名，方便之後直接替換。
          Image.open(out / 'xianjiawei-scene-welcome.jpg').save(
              out / 'xianjiawei-scene-brand.jpg', 'JPEG', quality=92, subsampling=0, optimize=True, progressive=True
          )
          print(f'Sprite: {w}x{h}; tiles: {tw}x{th}; output: 1600x1200')
          PY

      - name: Consolidate JavaScript and restore page-specific scenes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          core = Path('site-core.js')
          if not core.exists():
              core = Path('site.js')
          s = core.read_text(encoding='utf-8')

          mapping = """const MASCOT_IMAGES = {
            welcome: 'images/brand/xianjiawei-scene-welcome.jpg?v=320.0',
            products: 'images/brand/xianjiawei-scene-products.jpg?v=320.0',
            guide: 'images/brand/xianjiawei-scene-guide.jpg?v=320.0',
            combo: 'images/brand/xianjiawei-scene-combo.jpg?v=320.0',
            usage: 'images/brand/xianjiawei-scene-usage.jpg?v=320.0',
            recipes: 'images/brand/xianjiawei-scene-recipes.jpg?v=320.0',
            faq: 'images/brand/xianjiawei-scene-faq.jpg?v=320.0',
            service: 'images/brand/xianjiawei-scene-service.jpg?v=320.0',
            brand: 'images/brand/xianjiawei-scene-brand.jpg?v=320.0'
          };"""
          s, n = re.subn(r"const MASCOT_IMAGES = \{.*?\n\};", mapping, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('MASCOT_IMAGES block not found')

          replacements = {
              "image: 'products', scene: 'products', eyebrow: '搭配組合'": "image: 'combo', scene: 'combo', eyebrow: '搭配組合'",
              "image: 'usage', scene: 'usage', eyebrow: '料理搭配'": "image: 'recipes', scene: 'recipes', eyebrow: '料理搭配'",
              "image: 'welcome', scene: 'welcome', eyebrow: '品牌故事'": "image: 'brand', scene: 'brand', eyebrow: '品牌故事'",
              "image: 'service', scene: 'service', eyebrow: '常見問題'": "image: 'faq', scene: 'faq', eyebrow: '常見問題'",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace("fetch('data.json?v=307.1')", "fetch('data.json?v=320.0')")
          s = re.sub(
              r'<img src="\$\{MASCOT_IMAGES\[config\.image\]\}" alt="仙加味小老闆情境導覽" width="\d+" height="\d+" loading="\$\{page === \'home\' \? \'eager\' : \'lazy\'\}" decoding="async">',
              '<img class="mascot-guide-card__image" src="${MASCOT_IMAGES[config.image]}" alt="仙加味小老闆情境導覽" width="1600" height="1200" loading="${page === \'home\' ? \'eager\' : \'lazy\'}" fetchpriority="${page === \'home\' ? \'high\' : \'auto\'}" decoding="async">',
              s,
              count=1,
          )

          Path('site.js').write_text(s, encoding='utf-8')
          for obsolete in ['site-core.js', 'site-fix-v317.js', 'website-mascot-sprite.js']:
              p = Path(obsolete)
              if p.exists() and p.name != 'site.js':
                  p.unlink()
          PY

      - name: Clean mascot CSS and improve mobile display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* v303｜仙加味小老闆情境卡 */'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n\n'

          s += r'''/* v320｜網站專用小老闆高畫質情境卡 */
          .mascot-guide-section{padding-top:0}
          .mascot-guide-card{
            position:relative;
            display:grid;
            grid-template-columns:minmax(320px,46%) minmax(0,1fr);
            overflow:hidden;
            padding:0;
            background:linear-gradient(135deg,#fffaf2 0%,#f4ead8 100%);
            border:1px solid rgba(123,30,30,.14);
            border-radius:28px;
            box-shadow:0 18px 44px rgba(55,38,22,.12);
          }
          .mascot-guide-card__media{
            position:relative;
            aspect-ratio:4/3;
            min-width:0;
            overflow:hidden;
            background:#efe4d2;
          }
          .mascot-guide-card__media::after{display:none!important;content:none!important}
          .mascot-guide-card__image,
          .mascot-guide-card__media img{
            display:block!important;
            width:100%!important;
            height:100%!important;
            min-height:0!important;
            max-height:none!important;
            object-fit:cover!important;
            object-position:center!important;
            image-rendering:auto!important;
            filter:none!important;
            opacity:1!important;
            transform:translateZ(0)!important;
            backface-visibility:hidden!important;
          }
          .mascot-guide-card__copy{position:relative;z-index:1;align-self:center;padding:clamp(28px,4vw,58px)}
          .mascot-guide-card__copy h2{max-width:15em;color:var(--brand)}
          .mascot-guide-card__copy p:not(.eyebrow){max-width:680px;color:#4b5563}

          @media(max-width:760px){
            .page{padding-bottom:88px}
            .mascot-guide-card{grid-template-columns:1fr;border-radius:22px}
            .mascot-guide-card__media{width:100%;aspect-ratio:4/3}
            .mascot-guide-card__copy{padding:22px 20px 28px;margin:0}
            .mascot-guide-card__copy h2{font-size:clamp(24px,7vw,32px)}
            .floating-line-cta{
              right:12px;
              bottom:calc(12px + env(safe-area-inset-bottom));
              max-width:calc(100vw - 24px);
            }
          }
          @media(prefers-reduced-motion:reduce){
            .reveal{opacity:1!important;transform:none!important;transition:none!important}
          }
          '''
          p.write_text(s, encoding='utf-8')
          PY

      - name: Fix homepage product-type completeness and update cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          anchor = '<article class="card reveal product-purpose-card"><p class="product-purpose">固定日常食補</p><h3>龜鹿膏</h3><p>小匙取用或加入約100～300mL熱水化開，適合早上或下午固定安排。</p><a class="btn btn-outline" href="product-guilu-gao.html">看龜鹿膏</a></article>'
          drink = '<article class="card reveal product-purpose-card"><p class="product-purpose">方便即飲食補</p><h3>龜鹿飲</h3><p>保留30cc玻璃瓶與180cc鋁袋兩種規格，可依攜帶方式與日常份量選擇。</p><div class="product-card__actions"><a class="btn btn-outline" href="product-guilu-drink-30cc.html">看30cc</a><a class="btn btn-outline" href="product-guilu-drink-180cc.html">看180cc</a></div></article>'
          if drink not in s:
              if anchor not in s:
                  raise SystemExit('Homepage purpose anchor not found')
              s = s.replace(anchor, anchor + '\n' + drink, 1)
          index.write_text(s, encoding='utf-8')

          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'site\.css\?v=[^"\']+', 'site.css?v=320.0', text)
              text = re.sub(r'site\.js\?v=[^"\']+', 'site.js?v=320.0', text)
              text = text.replace('href="site.css"', 'href="site.css?v=320.0"')
              text = text.replace('src="site.js"', 'src="site.js?v=320.0"')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove obsolete website repair files
        run: |
          rm -f assets/website-sprite-part01.txt assets/website-sprite-part02.txt
          rm -f .github/workflows/apply-website-sprite-v316.yml
          rm -f .github/workflows/apply-website-sprite-v315.yml
          rm -f .github/workflows/apply-website-mascots-v314.yml
          rm -f .github/workflows/fix-website-mascot-images.yml
          rm -f APPLY_WEBSITE_SPRITE_V316.txt APPLY_WEBSITE_SPRITE_V315.txt APPLY_WEBSITE_MASCOTS_V314.txt

      - name: Audit entire website
        run: |
          set -euo pipefail
          node --check site.js
          python3 -m json.tool data.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import json, re
          from PIL import Image

          root = Path('.')
          errors = []
          html_files = sorted(root.glob('*.html'))
          if len(html_files) < 15:
              errors.append(f'HTML page count too low: {len(html_files)}')

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]; self.ids=[]; self.title=False; self.desc=False; self.viewport=False; self.canonical=False; self.lang=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='html' and a.get('lang'): self.lang=True
                  if tag=='title': self.title=True
                  if tag=='meta' and a.get('name')=='description' and a.get('content'): self.desc=True
                  if tag=='meta' and a.get('name')=='viewport': self.viewport=True
                  if tag=='link' and a.get('rel')=='canonical' and a.get('href'): self.canonical=True
                  if a.get('id'): self.ids.append(a['id'])
                  for key in ('href','src'):
                      if a.get(key): self.refs.append((key,a[key]))

          for page in html_files:
              parser=AuditParser(); parser.feed(page.read_text(encoding='utf-8'))
              if page.name != '404.html':
                  for flag,name in [(parser.lang,'lang'),(parser.title,'title'),(parser.desc,'description'),(parser.viewport,'viewport'),(parser.canonical,'canonical')]:
                      if not flag: errors.append(f'{page}: missing {name}')
              dups={x for x in parser.ids if parser.ids.count(x)>1}
              if dups: errors.append(f'{page}: duplicate IDs {sorted(dups)}')
              text=page.read_text(encoding='utf-8')
              if 'site.css?v=320.0' not in text: errors.append(f'{page}: stale/missing site.css version')
              if 'site.js?v=320.0' not in text: errors.append(f'{page}: stale/missing site.js version')
              for kind,ref in parser.refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','javascript:','#','data:')): continue
                  path=unquote(urlsplit(ref).path)
                  if not path or path.startswith('/'): continue
                  target=(page.parent/path).resolve()
                  try: target.relative_to(root.resolve())
                  except ValueError: continue
                  if not target.exists(): errors.append(f'{page}: missing local {kind} target {ref}')

          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          ids=[p.get('id') for p in data.get('products',[])]
          expected={'guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'}
          if set(ids)!=expected: errors.append(f'Product IDs mismatch: {ids}')
          if not {'guilu-drink-30','guilu-drink-180'}.issubset(ids): errors.append('Both Guilu drink sizes must remain')
          for product in data.get('products',[]):
              for key in ('image','dmImage','detailPage'):
                  ref=str(product.get(key,'')).split('?')[0]
                  if ref and not Path(ref).exists(): errors.append(f"data.json {product.get('id')}: missing {key} {ref}")

          for name in ['welcome','products','guide','combo','usage','recipes','faq','service','brand']:
              f=Path(f'images/brand/xianjiawei-scene-{name}.jpg')
              if not f.exists():
                  errors.append(f'Missing mascot image: {f}')
                  continue
              with Image.open(f) as im:
                  if im.width < 1500 or im.height < 1100: errors.append(f'Low-resolution mascot: {f} {im.size}')

          js=Path('site.js').read_text(encoding='utf-8')
          for old in ('site-core.js','site-fix-v317.js','website-mascot-sprite.js'):
              if old in js: errors.append(f'site.js still references {old}')
          for name in ['welcome','products','guide','combo','usage','recipes','faq','service','brand']:
              if f'xianjiawei-scene-{name}.jpg?v=320.0' not in js: errors.append(f'Mascot mapping missing: {name}')

          print(f'Audited {len(html_files)} HTML pages, {len(data.get("products",[]))} products, 9 mascot images.')
          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print('SITE AUDIT PASSED')
          PY

      - name: Commit and publish
        run: |
          rm -f RUN_REPAIR_SITE_V320.txt
          rm -f .github/workflows/repair-site-v320.yml
          rmdir assets 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '全站檢查修正並更新高畫質小老闆圖 v320'
          git pull --rebase origin main
          git push origin main
