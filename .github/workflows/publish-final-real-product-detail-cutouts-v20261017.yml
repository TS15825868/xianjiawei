name: 仙加味完整產品實拍標示去背最終版
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final-real-product-detail-cutouts-v20261017.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-authentic-detail-cutouts-v20261017
  cancel-in-progress: false
jobs:
  publish-original-pixels-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic transparency-only processing
        run: python -m pip install "pillow>=10,<13"
      - name: Retain original product pixels and only erase source-photo background
        run: python tools/publish-final-real-product-detail-cutouts-v20261017.py
      - name: Validate current real product gallery and media references
        run: |
          python tools/validate-partner-catalog-integrity.py
          python tools/audit-real-package-background-v20261017.py
          node tools/audit-pure-product-hero.cjs
      - name: Commit eight genuine-label cutouts and formal product page replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xianjiawei-actions
          git config user.email xianjiawei-actions@users.noreply.github.com
          git add images/catalog-user-detail-cutouts-v20261017/
          git add product-danshen-tea.html product-jinan-siwuyin.html product-guilu-vitality.html partner-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'images: replace tea x6, Siwu and Vitality backs with actual transparent package labels'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
