name: Apply LINE OA mascot images

on:
  push:
    branches: [main]
    paths:
      - APPLY_LINEOA_MASCOTS.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and publish mascot images
        run: |
          mkdir -p images/line-mascot
          base64 -d .lineoa-upload/general.b64 > /tmp/xianjiawei-line-mascot.jpg
          test $(wc -c < /tmp/xianjiawei-line-mascot.jpg) -gt 10000
          for pose in welcome products recommend combo usage faq service brand; do
            cp /tmp/xianjiawei-line-mascot.jpg "images/line-mascot/xianjiawei-mascot-line-${pose}.jpg"
          done

      - name: Commit images
        run: |
          rm -rf .lineoa-upload
          rm -f APPLY_LINEOA_MASCOTS.txt
          rm -f .github/workflows/apply-lineoa-mascot-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '更新 LINE OA 小老闆 Flex 卡片圖片'
          git pull --rebase origin main
          git push origin main
