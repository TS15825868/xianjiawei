name: v298.7 integrate 黃帝內經

on:
  push:
    paths:
      - TRIGGER_V298_7.txt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add 黃帝內經 layer to 漢方百科
        shell: python
        run: |
          from pathlib import Path

          path = Path('hanfang-baike.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
            '以古籍文化、臺灣中藥典與中華藥典的閱讀方式，整理鹿角、龜板、枸杞、紅棗、黃耆、粉光蔘與鹿茸，並說明其在仙加味產品中的位置。',
            '以《黃帝內經》的生活節奏、《本草綱目》的本草文化，以及臺灣中藥典與中華藥典的品質規格，整理鹿角、龜板、枸杞、紅棗、黃耆、粉光蔘與鹿茸在仙加味產品中的位置。'
          )
          text = text.replace(
            '仙加味漢方百科：古籍、臺灣中藥典與中華藥典閱讀方式',
            '仙加味漢方百科：黃帝內經、本草綱目與現代藥典閱讀方式'
          )
          text = text.replace(
            '<section class="hero hero--compact"><div class="hero__content"><p class="eyebrow">漢方百科</p><h1>從古籍文化到現代品質規格，讀懂成分名稱</h1><p>《本草綱目》用於理解歷史名稱與本草文化；《臺灣中藥典》與《中華藥典》用於理解官方品質標準與檢驗規範。產品資訊仍以實際標示、規格與一般使用方式為準。</p>',
            '<section class="hero hero--compact"><div class="hero__content"><p class="eyebrow">漢方百科</p><h1>從生活節奏、本草文化到現代品質規格</h1><p>《黃帝內經》用於理解飲食、作息與四時生活觀點；《本草綱目》用於理解歷史名稱與本草文化；《臺灣中藥典》與《中華藥典》用於理解官方品質標準與檢驗規範。產品資訊仍以實際標示、規格與一般使用方式為準。</p>'
          )

          old_layers = '<section class="section"><div class="section-heading"><p class="eyebrow">先看懂三層資料</p><h2>古籍、藥典與產品標示各自回答不同問題</h2></div><div class="grid grid-3"><article class="card reveal"><h3>《本草綱目》</h3><p>用於整理古代名稱、部位、來源、採集與本草文化背景。</p></article><article class="card reveal"><h3>《臺灣中藥典》</h3><p>由衛生福利部中醫藥司公告，重點在中藥材、飲片與製劑的官方品質規格及檢驗方法。</p></article><article class="card reveal"><h3>《中華藥典》</h3><p>由食品藥物管理署編修，屬藥品品質標準與檢驗方法的重要技術規範。</p></article></div></section>'
          new_layers = '<section class="section"><div class="section-heading"><p class="eyebrow">先看懂四層資料</p><h2>生活觀點、本草文化、藥典與產品標示各自回答不同問題</h2></div><div class="grid grid-2"><article class="card reveal"><h3>《黃帝內經》</h3><p>用於理解古代對飲食有節、起居有常與順應四時的生活觀點，放在日常節奏與養生文化中閱讀。</p></article><article class="card reveal"><h3>《本草綱目》</h3><p>用於整理古代名稱、部位、來源、採集與本草文化背景。</p></article><article class="card reveal"><h3>《臺灣中藥典》</h3><p>由衛生福利部中醫藥司公告，重點在中藥材、飲片與製劑的官方品質規格及檢驗方法。</p></article><article class="card reveal"><h3>《中華藥典》</h3><p>由食品藥物管理署編修，屬藥品品質標準與檢驗方法的重要技術規範。</p></article></div></section>'
          text = text.replace(old_layers, new_layers)

          marker = '<section class="section"><div class="section-heading"><p class="eyebrow">名稱對照</p>'
          neijing_section = '<section class="section"><div class="section-heading"><p class="eyebrow">《黃帝內經》的生活觀點</p><h2>補養不是一次做很多，而是放進飲食、作息與季節裡</h2><p>仙加味以生活文化方式整理《黃帝內經》的觀點，不將古籍內容直接等同於單一產品或成分的作用。</p></div><div class="grid grid-3"><article class="card reveal"><h3>食飲有節</h3><p>日常飲食重視適量與規律，食補也適合依自己的生活節奏安排，而不是一次集中使用。</p></article><article class="card reveal"><h3>起居有常</h3><p>規律作息與長期安排，是古籍生活觀點中重要的一部分，也呼應仙加味「補養，是一種節奏」的品牌方向。</p></article><article class="card reveal"><h3>順應四時</h3><p>古籍重視季節與生活環境的變化；實際產品選擇仍回到個人使用方式、規格與日常情境比較。</p></article></div></section>'
          if neijing_section not in text:
              text = text.replace(marker, neijing_section + marker)

          text = text.replace('site.css?v=297.2', 'site.css?v=298.7')
          text = text.replace('site.js?v=298.6', 'site.js?v=298.7')
          text = text.replace('內容版本 v297.2', '內容版本 v298.7')
          path.write_text(text, encoding='utf-8')

      - name: Remove trigger and commit
        run: |
          rm -f TRIGGER_V298_7.txt
          rm -f .github/workflows/v298-7-neijing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v298.7: add 黃帝內經 life-rhythm layer to 漢方百科"
          git push origin main
