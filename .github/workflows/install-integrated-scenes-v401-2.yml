name: Install integrated website mascot scenes v401.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-integrated-scenes-v401-2.yml"

permissions:
  contents: write

concurrency:
  group: install-integrated-scenes-v401-2
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download integrated scene package
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://drive.google.com/uc?export=download&id=1Zyx31T6J7TADRBIVkH5f6P1LIMr8yvHq&confirm=t" \
            -o /tmp/xianjiawei-integrated-scenes-v401.2.zip
          unzip -t /tmp/xianjiawei-integrated-scenes-v401.2.zip

      - name: Install and verify files
        run: |
          set -euo pipefail
          unzip -o /tmp/xianjiawei-integrated-scenes-v401.2.zip -d .
          for f in dm video knowledge hanfang-baike sources; do
            test -s "images/brand/website-mascot-${f}.jpg"
            test "$(stat -c%s "images/brand/website-mascot-${f}.jpg")" -gt 300000
            file "images/brand/website-mascot-${f}.jpg" | grep -q 'JPEG image data'
          done
          grep -q 'const VERSION = "401.2"' site-fix-v317.js
          grep -q '"version": "401.2"' deploy-version.json
          grep -q '"version": "401.2"' images/brand/website-mascot-manifest.json
          grep -q 'integrated-scene' images/brand/website-mascot-manifest.json
          rm -f .github/workflows/install-integrated-scenes-v401-2.yml

      - name: Commit integrated scenes directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新官網其他頁面融合版小老闆圖 v401.2"
          git push origin main
