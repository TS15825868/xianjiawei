name: 仙加味官網目前正式版一次性診斷

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-site-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run validators and write compact report
        run: |
          python - <<'PY'
          import json, subprocess, sys
          checks=[
            ('release',['python','tools/validate-site-release.py']),
            ('public',['python','tools/validate-public-customer-pages-v20260809.py']),
            ('visual',['python','tools/validate-visual-cohesion-v20260809.py']),
            ('aio',['python','tools/validate_public_aio_seo.py']),
            ('boundary',['python','tools/validate-public-boundary-v20260808.py']),
            ('publishing',['python','tools/validate-publishing-content-match-v20260809.py']),
          ]
          report={}
          for name,cmd in checks:
            p=subprocess.run(cmd,text=True,capture_output=True)
            out=(p.stdout+'\n'+p.stderr).strip()
            lines=[line.strip() for line in out.splitlines() if line.strip()]
            report[name]={'rc':p.returncode,'tail':' | '.join(lines[-8:])[-1400:]}
          js=['site.js','site-core-v410.js','site-product-data-authority.js','site-customer-display-v20260812.js','site-dm-authority-v20260811.js','site-media-modal-final-v20260814.js','site-product-image-safety.js','site-official-product-variants.js','site-public-content-cleanup-v20260809.js','site-public-image-retirement-v20260812.js','site-mascot-placement-v20260812.js','site-stability-v20260814.js','publishing-center-guardian.js']
          bad=[]
          for file in js:
            p=subprocess.run(['node','--check',file],text=True,capture_output=True)
            if p.returncode:bad.append(file+': '+(p.stderr or p.stdout)[-500:])
          report['javascript']={'rc':0 if not bad else 1,'tail':' | '.join(bad)[-1400:]}
          report['all_pass']=all(item['rc']==0 for item in report.values())
          open('data/site-validation-diagnostic.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Commit diagnostic report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site-validation-diagnostic.json
          git commit -m 'test(site): record one-shot current validation diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
