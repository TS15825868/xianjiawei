name: Apply product image fix v408.3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'PING_V408_3_FIX_FAST'
    runs-on: ubuntu-latest
    steps:
      - name: Started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.3_FIX_STARTED'
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Checkout complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.3_CHECKOUT_COMPLETE'
      - name: Apply fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/fix_product_images_v4083.py > /tmp/fix.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo 'V408.3_FIX_FAILED'
              echo '```'
              tail -c 12000 /tmp/fix.log
              echo '```'
            } > /tmp/comment.txt
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.txt
            exit "$code"
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.3_SCRIPT_COMPLETE'
      - name: Commit
        run: |
          rm -rf _trigger
          rm -f tools/fix_product_images_v4083.py
          rm -f .github/workflows/fix-product-images-v4083.yml
          rm -f .github/workflows/test-v4083.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修正全站產品圖片為真實原圖 v408.3'
          git push origin HEAD:main
      - name: Reply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body 'V408.3_PRODUCT_IMAGE_FIX_SUCCESS'
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
