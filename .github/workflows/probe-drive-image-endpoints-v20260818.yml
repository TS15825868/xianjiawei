name: 測試Drive圖片匿名端點
on:
  push:
    branches: [main]
    paths: ['assets/staging/probe-drive-image-endpoints-v20260818.trigger']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        shell: bash
        run: |
          set -u
          id='1LyVWdVSx_Wdz3K4jeJg1Hw6iIPAQAwsS'
          urls=(
            "https://drive.google.com/thumbnail?id=$id&sz=w1600"
            "https://lh3.googleusercontent.com/d/$id=w1600"
            "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            "https://drive.google.com/uc?export=view&id=$id"
          )
          : > assets/staging/drive-endpoint-probe.txt
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1)); out="/tmp/probe-$i"
            code=$(curl -L -sS -o "$out" -w '%{http_code}' --max-time 20 "$u" || true)
            size=$(wc -c < "$out" 2>/dev/null || echo 0)
            typ=$(file -b "$out" 2>/dev/null || true)
            printf '%s code=%s size=%s type=%s\n' "$i" "$code" "$size" "$typ" >> assets/staging/drive-endpoint-probe.txt
          done
          cat assets/staging/drive-endpoint-probe.txt
      - name: Save
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/staging/drive-endpoint-probe.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: 記錄Drive圖片端點測試'
          git push origin HEAD:main
