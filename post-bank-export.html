<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>仙加味｜貼文母庫安全匯出</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f4ed;color:#0b1f3b;margin:0;padding:32px}main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #e4ddd0}.ok{color:#245b3b}.error{color:#8b1e1e}</style>
</head>
<body>
<main>
<h1>仙加味貼文母庫安全匯出</h1>
<p id="state">正在重建並驗證正式 500 篇母庫…</p>
<p>此頁保留現行資料層來組成 500 篇完整母庫，但守門只驗目前能力、正式資料與顧客結果；不拿歷史 layer 版號、舊 UI 版號或固定重生成批次數字當發布條件。</p>
</main>
<script src="publishing-center-data-v6.js?v=current"></script>
<script src="publishing-center-data-v7.js?v=current"></script>
<script src="publishing-center-data-v8-fixes.js?v=current"></script>
<script src="publishing-center-data-v10-published-locks.js?v=current"></script>
<script src="publishing-center-data-v11-campaign-holds.js?v=current"></script>
<script src="publishing-center-data-v12-auto-candidates.js?v=current"></script>
<script src="publishing-center-data-v13-character-scenes.js?v=current"></script>
<script src="publishing-center-data-v14-boss-daily.js?v=current"></script>
<script src="publishing-center-data-v15-companions.js?v=current"></script>
<script src="publishing-center-data-v16-actual-product-photos.js?v=current"></script>
<script src="publishing-center-data-v17-retired-composite-guard.js?v=current"></script>
<script>
(()=>{
  'use strict';
  const SCHEMA='xjw-post-bank-export-v1';
  const RUNTIME='current-capability-export-runtime500';
  const INTERNAL_ORIGIN='https://xianjiawei-internal.tung314069.workers.dev';
  const state=document.getElementById('state');

  const imageUrl=post=>String(post?.image_url||'').trim();
  const regenerationRequired=post=>{
    const status=String(post?.image_status||'');
    const mode=String(post?.candidate_generation_mode||post?.regeneration_mode||'');
    return status==='needs_generation'||status==='replace-required'||post?.requires_image_generation===true||/chatgpt.*required|chatgpt_handoff|regeneration-required/i.test(mode);
  };
  const protectedPost=post=>post?.status==='published'||post?.prevent_republish===true||post?.do_not_republish===true;
  const campaignHold=post=>post?.campaign_hold===true||post?.status==='campaign_hold'||Boolean(post?.hold_until);

  function currentProductAuthority(){
    const authority=window.XJWActualProductPhotoAuthority;
    const version=String(authority?.productImageVersion||'').trim();
    const map=authority?.map||{};
    if(!version)throw new Error('500篇母庫未載入目前 products-v3 產品圖片權威。');
    const urls=Object.values(map).map(String);
    if(urls.length!==6||urls.some(url=>!/\/images\/products-v3\//.test(url)||/products-v2/.test(url)))throw new Error('產品圖片權威不是六項 products-v3 正式原圖。');
    return{version,map};
  }

  function verifyPosts(posts){
    if(posts.length!==500)throw new Error(`正式 runtime 母庫必須剛好500篇，目前${posts.length}篇`);
    const ids=posts.map(post=>String(post?.id||'').trim());
    if(ids.some(id=>!id)||new Set(ids).size!==posts.length)throw new Error('500篇母庫存在空白或重複ID，停止匯出。');

    let needsGeneration=0,publishedLocked=0,campaignHoldCount=0,candidateReview=0;
    for(const post of posts){
      const url=imageUrl(post);
      const serialized=JSON.stringify(post);
      if(/\/images\/products-v2\/|\/images\/dm-final\//i.test(url))throw new Error(`${post.id} 仍引用舊產品圖／舊DM。`);
      if(/30\s*cc.{0,40}(玻璃瓶|瓶裝|[／/]\s*瓶)/i.test(serialized))throw new Error(`${post.id} 仍出現30cc瓶型舊稱。`);
      if(/龜鹿湯塊.{0,80}(300\s*g|600\s*g)/i.test(serialized))throw new Error(`${post.id} 龜鹿湯塊仍出現舊容量。`);
      if(regenerationRequired(post)){
        needsGeneration++;
        if(url)throw new Error(`${post.id} 已標記需重生成，但仍沿用舊圖片。`);
        if(post?.publish_allowed===true||post?.schedule_enabled===true)throw new Error(`${post.id} 需重生成卻仍允許排程／發布。`);
      }
      if(/generated-v20260808-priority1/i.test(url))throw new Error(`${post.id} 仍引用已退役 priority1 產品卡／海報。`);
      if(protectedPost(post))publishedLocked++;
      else if(campaignHold(post))campaignHoldCount++;
      else if(post?.image_status==='candidate-review-required'||post?.image_status==='official-reference-pending-layout-review')candidateReview++;
    }
    return{needsGeneration,publishedLocked,campaignHoldCount,candidateReview};
  }

  async function run(){
    try{
      const productAuthority=currentProductAuthority();
      const response=await fetch('content/public-post-library.json?authority=current',{cache:'no-store'});
      if(!response.ok)throw new Error(`母庫讀取失敗 HTTP ${response.status}`);
      const data=await response.json();
      const posts=Array.isArray(data.posts)?data.posts:[];
      const audit=verifyPosts(posts);
      const payload={
        schema:SCHEMA,
        runtime:RUNTIME,
        version:data.version||'',
        generated_at:new Date().toISOString(),
        authority:'TS15825868/xianjiawei',
        product_image_version:productAuthority.version,
        product_image_authority:'images/products-v3/',
        retired_assets_removed:true,
        capabilities:{
          runtime_500_assembled:true,
          post_count_500:true,
          unique_post_ids:true,
          products_v3_authority:true,
          products_v2_forbidden:true,
          regeneration_clears_old_image:true,
          approval_not_granted_by_exporter:true,
          schedule_not_granted_by_exporter:true,
          publish_not_granted_by_exporter:true
        },
        known_regeneration:{count:audit.needsGeneration},
        published_locked_count:audit.publishedLocked,
        campaign_hold_count:audit.campaignHoldCount,
        candidate_review_count:audit.candidateReview,
        posts,
        counts:data.counts||{}
      };
      state.className='ok';
      state.textContent=`已重建並驗證 ${posts.length} 篇；需重生成 ${audit.needsGeneration}、已發布／防重發 ${audit.publishedLocked}、活動冷卻 ${audit.campaignHoldCount}。`;
      if(window.parent!==window)window.parent.postMessage(payload,INTERNAL_ORIGIN);
      window.XJWPostBankExport=Object.freeze({schema:SCHEMA,runtime:RUNTIME,count:posts.length,productImageVersion:productAuthority.version,retiredAssetsRemoved:true,capabilities:payload.capabilities,payload});
    }catch(error){
      state.className='error';state.textContent=error?.message||String(error);
      if(window.parent!==window)window.parent.postMessage({schema:SCHEMA,error:error?.message||String(error)},INTERNAL_ORIGIN);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
</body>
</html>
