<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>仙加味｜貼文母庫安全匯出</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f4ed;color:#0b1f3b;margin:0;padding:32px}main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #e4ddd0}code{word-break:break-all}.ok{color:#245b3b}.error{color:#8b1e1e}</style>
</head>
<body>
<main><h1>仙加味貼文母庫安全匯出</h1><p id="state">正在重建正式 runtime 母庫…</p><p>此頁只用於舊 500 篇內容庫的一次性安全遷移；不核准、不排程、不發布。</p></main>
<script src="publishing-center-data-v6.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v7.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v8-fixes.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v10-published-locks.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v11-campaign-holds.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v12-auto-candidates.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v13-character-scenes.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v14-boss-daily.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v15-companions.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v16-actual-product-photos.js?v=20260809-export-v1"></script>
<script src="publishing-center-data-v17-retired-composite-guard.js?v=20260809-export-v1"></script>
<script>
(()=>{
  'use strict';
  const SCHEMA='xjw-post-bank-export-v1';
  const INTERNAL_ORIGIN='https://xianjiawei-internal.tung314069.workers.dev';
  const state=document.getElementById('state');
  async function run(){
    try{
      const response=await fetch('content/public-post-library.json?v=20260809-export-v1',{cache:'no-store'});
      if(!response.ok)throw new Error(`母庫讀取失敗 HTTP ${response.status}`);
      const data=await response.json();
      const posts=Array.isArray(data.posts)?data.posts:[];
      if(posts.length!==500)throw new Error(`runtime 母庫應為500篇，目前${posts.length}篇`);
      const payload={schema:SCHEMA,version:data.version||'',generated_at:new Date().toISOString(),authority:'TS15825868/xianjiawei',posts,counts:data.counts||{}};
      state.className='ok';state.textContent=`已重建 ${posts.length} 篇；候選只供正式貼文系統同步與人工審核。`;
      if(window.parent!==window)window.parent.postMessage(payload,INTERNAL_ORIGIN);
      window.XJWPostBankExport=Object.freeze({schema:SCHEMA,count:posts.length,version:payload.version,payload});
    }catch(error){
      state.className='error';state.textContent=error?.message||String(error);
      if(window.parent!==window)window.parent.postMessage({schema:SCHEMA,error:error?.message||String(error)},INTERNAL_ORIGIN);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
</body>
</html>
