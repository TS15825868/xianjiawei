<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>仙加味｜貼文母庫安全匯出</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f4ed;color:#0b1f3b;margin:0;padding:32px}main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #e4ddd0}.ok{color:#245b3b}.error{color:#8b1e1e}</style>
</head>
<body><main><h1>仙加味貼文母庫安全匯出</h1><p id="state">正在重建並驗證目前正式貼文母庫…</p><p>目前正式匯出只使用最新核心母庫與目前媒體權威，不再載入舊版大量產生層。母庫可持續增加；守門驗證 ID 唯一、產品權威、圖文配對、季節／天氣媒體狀態與發布安全。</p></main>
<script src="publishing-center-data-v16-actual-product-photos.js?v=current"></script>
<script src="publishing-center-data-v18-content-media-match.js?v=current"></script>
<script src="publishing-center-data-current-authority-guard.js?v=current"></script>
<script>
(()=>{
'use strict';
const SCHEMA='xjw-post-bank-export-v1',RUNTIME='current-capability-post-bank-export-v18',INTERNAL_ORIGIN='https://xianjiawei-internal.tung314069.workers.dev';
const state=document.getElementById('state');
const imageUrl=post=>String(post?.image_url||'').trim();
const regenerationRequired=post=>{const status=String(post?.image_status||''),mode=String(post?.candidate_generation_mode||post?.regeneration_mode||'');return status==='needs_generation'||status==='replace-required'||post?.requires_image_generation===true||/chatgpt.*required|chatgpt_handoff|regeneration-required/i.test(mode)};
const protectedPost=post=>post?.status==='published'||post?.prevent_republish===true||post?.do_not_republish===true;
const campaignHold=post=>post?.campaign_hold===true||post?.status==='campaign_hold'||Boolean(post?.hold_until);
function currentProductAuthority(){
 const authority=window.XJWActualProductPhotoAuthority,version=String(authority?.productImageVersion||'').trim(),map=authority?.map||{},urls=Object.values(map).map(String);
 if(!version)throw new Error('母庫未載入目前 products-v3 產品圖片權威。');
 if(urls.length!==6||urls.some(url=>!/\/images\/products-v3\//.test(url)||/products-v2/.test(url)))throw new Error('產品圖片權威不是六項 products-v3 正式原圖。');
 return{version,map};
}
function verifyPosts(posts,declaredTotal){
 if(!Array.isArray(posts)||posts.length<1)throw new Error('目前正式貼文母庫沒有可同步內容。');
 if(Number.isFinite(declaredTotal)&&declaredTotal>0&&declaredTotal!==posts.length)throw new Error(`目前母庫宣告數量${declaredTotal}與實際${posts.length}不一致。`);
 const ids=posts.map(post=>String(post?.id||'').trim());
 if(ids.some(id=>!id)||new Set(ids).size!==posts.length)throw new Error('目前母庫存在空白或重複ID，停止匯出。');
 let needsGeneration=0,publishedLocked=0,campaignHoldCount=0,candidateReview=0,liveWeather=0;
 for(const post of posts){
  const url=imageUrl(post),serialized=JSON.stringify(post);
  if(/\/images\/products-v2\//i.test(url))throw new Error(`${post.id} 仍引用products-v2退役產品圖。`);
  if(/30\s*cc.{0,40}(玻璃瓶|瓶裝|[／/]\s*瓶)/i.test(serialized))throw new Error(`${post.id} 仍出現30cc瓶型退役稱呼。`);
  if(/龜鹿湯塊.{0,80}(300\s*g|600\s*g)/i.test(serialized))throw new Error(`${post.id} 龜鹿湯塊仍出現退役容量。`);
  if(regenerationRequired(post)){needsGeneration++;if(url)throw new Error(`${post.id} 已標記需重生成，但仍沿用舊圖片。`);if(post?.publish_allowed===true||post?.schedule_enabled===true)throw new Error(`${post.id} 需重生成卻仍允許排程／發布。`);}
  if(post?.live_check_required===true||post?.weather_review_required===true)liveWeather++;
  if(protectedPost(post))publishedLocked++;else if(campaignHold(post))campaignHoldCount++;else if(['candidate-review-required','official-reference-pending-layout-review','live-check-required'].includes(String(post?.image_status||'')))candidateReview++;
 }
 return{needsGeneration,publishedLocked,campaignHoldCount,candidateReview,liveWeather};
}
async function run(){
 try{
  const productAuthority=currentProductAuthority();
  const response=await fetch('content/public-post-library.json?authority=current',{cache:'no-store'});if(!response.ok)throw new Error(`母庫讀取失敗 HTTP ${response.status}`);
  const data=await response.json(),posts=Array.isArray(data.posts)?data.posts:[],declaredTotal=Number(data?.counts?.total||posts.length),audit=verifyPosts(posts,declaredTotal);
  const payload={schema:SCHEMA,runtime:RUNTIME,version:data.version||'',generated_at:new Date().toISOString(),authority:'TS15825868/xianjiawei',post_count:posts.length,product_image_version:productAuthority.version,product_image_authority:'images/products-v3/',retired_assets_removed:true,legacy_generation_layers_loaded:false,capabilities:{current_post_count:true,post_count_matches_current_catalog:true,unique_post_ids:true,products_v3_authority:true,products_v2_forbidden:true,current_asset_authority_guard:true,semantic_media_bindings:true,weather_live_check_metadata:true,legacy_generation_layers_disabled:true,regeneration_clears_old_image:true,approval_not_granted_by_exporter:true,schedule_not_granted_by_exporter:true,publish_not_granted_by_exporter:true},known_regeneration:{count:audit.needsGeneration},published_locked_count:audit.publishedLocked,campaign_hold_count:audit.campaignHoldCount,candidate_review_count:audit.candidateReview,live_weather_count:audit.liveWeather,posts,counts:data.counts||{}};
  state.className='ok';state.textContent=`已驗證目前 ${posts.length} 篇；需重生成 ${audit.needsGeneration}、已發布／防重發 ${audit.publishedLocked}、天氣即時確認 ${audit.liveWeather}。`;
  if(window.parent!==window)window.parent.postMessage(payload,INTERNAL_ORIGIN);
  window.XJWPostBankExport=Object.freeze({schema:SCHEMA,runtime:RUNTIME,count:posts.length,productImageVersion:productAuthority.version,retiredAssetsRemoved:true,capabilities:payload.capabilities,payload});
 }catch(error){state.className='error';state.textContent=error?.message||String(error);if(window.parent!==window)window.parent.postMessage({schema:SCHEMA,error:error?.message||String(error)},INTERNAL_ORIGIN);}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script></body></html>
