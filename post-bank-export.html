<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>仙加味｜貼文母庫安全匯出</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f4ed;color:#0b1f3b;margin:0;padding:32px}main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #e4ddd0}.ok{color:#245b3b}.error{color:#8b1e1e}</style>
</head>
<body>
<main>
<h1>仙加味貼文母庫安全匯出</h1>
<p id="state">正在驗證正式 500 篇母庫…</p>
<p>此頁只做正式母庫安全遷移，不核准、不排程、不發布。驗收目前資料能力與產品圖片權威，不綁舊 UI、舊 post-bank、舊重生成批次數字或歷史版號。</p>
</main>
<script>
(()=>{
  'use strict';
  const SCHEMA='xjw-post-bank-export-v1';
  const RUNTIME='current-capability-export';
  const PRODUCT_IMAGE_VERSION='products-v3-current-authority';
  const INTERNAL_ORIGIN='https://xianjiawei-internal.tung314069.workers.dev';
  const state=document.getElementById('state');

  const imageUrl=post=>String(post?.image_url||'').trim();
  const regenerationRequired=post=>{
    const status=String(post?.image_status||'');
    const mode=String(post?.candidate_generation_mode||post?.regeneration_mode||'');
    return status==='needs_generation'||status==='replace-required'||post?.requires_image_generation===true||/chatgpt.*required|chatgpt_handoff/i.test(mode);
  };
  const retiredImage=url=>/\/images\/products-v2\/|generated-v20260808-(?:priority1|preflight)/i.test(String(url||''));

  function verifyPosts(posts){
    if(posts.length!==500)throw new Error(`正式母庫必須剛好500篇，目前${posts.length}篇`);
    const ids=posts.map(post=>String(post?.id||'').trim());
    if(ids.some(id=>!id)||new Set(ids).size!==posts.length)throw new Error('500篇母庫存在空白或重複ID，停止匯出。');

    let needsGeneration=0;
    let publishedLocked=0;
    for(const post of posts){
      const url=imageUrl(post);
      if(/\/images\/products-v2\//i.test(url))throw new Error(`${post.id} 仍引用 products-v2 舊產品圖`);
      if(regenerationRequired(post)){
        needsGeneration++;
        if(url)throw new Error(`${post.id} 已標記需重生成，但仍沿用舊圖片；請先清除錯圖。`);
      }else if(retiredImage(url)){
        throw new Error(`${post.id} 仍引用已退役候選素材：${url}`);
      }
      if(post?.status==='published'||post?.prevent_republish===true||post?.do_not_republish===true)publishedLocked++;
    }
    return{needsGeneration,publishedLocked};
  }

  async function run(){
    try{
      const response=await fetch('content/public-post-library.json?authority=current',{cache:'no-store'});
      if(!response.ok)throw new Error(`母庫讀取失敗 HTTP ${response.status}`);
      const data=await response.json();
      const posts=Array.isArray(data.posts)?data.posts:[];
      const audit=verifyPosts(posts);
      const payload={
        schema:SCHEMA,
        runtime:RUNTIME,
        version:data.version||'',
        generated_at:new Date().toISOString(),
        authority:'TS15825868/xianjiawei',
        product_image_version:PRODUCT_IMAGE_VERSION,
        product_image_authority:'images/products-v3/',
        retired_assets_removed:true,
        capabilities:{
          post_count_500:true,
          unique_post_ids:true,
          products_v3_authority:true,
          products_v2_forbidden:true,
          regeneration_clears_old_image:true,
          approval_not_granted_by_exporter:true,
          schedule_not_granted_by_exporter:true,
          publish_not_granted_by_exporter:true
        },
        known_regeneration:{count:audit.needsGeneration},
        published_locked_count:audit.publishedLocked,
        posts,
        counts:data.counts||{}
      };
      state.className='ok';
      state.textContent=`已驗證 ${posts.length} 篇；目前需重生成 ${audit.needsGeneration} 篇、已發布／防重發鎖定 ${audit.publishedLocked} 篇。`;
      if(window.parent!==window)window.parent.postMessage(payload,INTERNAL_ORIGIN);
      window.XJWPostBankExport=Object.freeze({schema:SCHEMA,runtime:RUNTIME,count:posts.length,productImageVersion:PRODUCT_IMAGE_VERSION,retiredAssetsRemoved:true,capabilities:payload.capabilities,payload});
    }catch(error){
      state.className='error';state.textContent=error?.message||String(error);
      if(window.parent!==window)window.parent.postMessage({schema:SCHEMA,error:error?.message||String(error)},INTERNAL_ORIGIN);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
</body>
</html>
