<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>仙加味｜貼文母庫安全匯出</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f4ed;color:#0b1f3b;margin:0;padding:32px}main{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #e4ddd0}code{word-break:break-all}.ok{color:#245b3b}.error{color:#8b1e1e}</style>
</head>
<body>
<main><h1>仙加味貼文母庫安全匯出</h1><p id="state">正在重建正式 runtime 母庫…</p><p>此頁只用於 500 篇內容庫的安全遷移；不核准、不排程、不發布。產品本體只認 20260810-products-v3-true-originals-v2 真正實拍原圖；舊海報／卡片候選不視為完成圖。</p></main>
<script src="publishing-center-data-v6.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v7.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v8-fixes.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v10-published-locks.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v11-campaign-holds.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v12-auto-candidates.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v13-character-scenes.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v14-boss-daily.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v15-companions.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v16-actual-product-photos.js?v=20260810-export-v2-true-originals"></script>
<script src="publishing-center-data-v17-retired-composite-guard.js?v=20260810-export-v2-true-originals"></script>
<script>
(()=>{
  'use strict';
  const SCHEMA='xjw-post-bank-export-v1';
  const RUNTIME='20260810-export-v2-true-originals';
  const PRODUCT_IMAGE_VERSION='20260810-products-v3-true-originals-v2';
  const FORCED_REGEN_IDS=['POST-PRODUCT-OVERVIEW','POST-COMBO','POST-GUIDE','POST-CHOOSE','POST-CHOOSE-BY-HABIT'];
  const INTERNAL_ORIGIN='https://xianjiawei-internal.tung314069.workers.dev';
  const state=document.getElementById('state');
  function verifyRuntime(posts){
    const authority=window.XJWActualProductPhotoAuthority;
    if(authority?.productImageVersion!==PRODUCT_IMAGE_VERSION)throw new Error(`產品圖守門未載入目前正式版本：${authority?.productImageVersion||'未提供'}`);
    for(const id of FORCED_REGEN_IDS){
      const post=posts.find(item=>item?.id===id);
      if(!post)throw new Error(`母庫缺少強制重生成貼文：${id}`);
      if(post.image_status!=='needs_generation'||String(post.image_url||'').trim())throw new Error(`${id} 仍帶舊卡片／海報候選，已停止匯出`);
      if(post.candidate_generation_mode!=='copy-matched-regeneration-required')throw new Error(`${id} 未進入正式ChatGPT重生成流程`);
    }
  }
  async function run(){
    try{
      const response=await fetch(`content/public-post-library.json?v=${RUNTIME}`,{cache:'no-store'});
      if(!response.ok)throw new Error(`母庫讀取失敗 HTTP ${response.status}`);
      const data=await response.json();
      const posts=Array.isArray(data.posts)?data.posts:[];
      if(posts.length!==500)throw new Error(`runtime 母庫應為500篇，目前${posts.length}篇`);
      verifyRuntime(posts);
      const payload={schema:SCHEMA,runtime:RUNTIME,version:data.version||'',generated_at:new Date().toISOString(),authority:'TS15825868/xianjiawei',product_image_version:PRODUCT_IMAGE_VERSION,forced_regeneration_ids:FORCED_REGEN_IDS,posts,counts:data.counts||{}};
      state.className='ok';state.textContent=`已重建 ${posts.length} 篇；5篇舊產品卡片已強制重生成，候選只供正式貼文系統同步與人工審核。`;
      if(window.parent!==window)window.parent.postMessage(payload,INTERNAL_ORIGIN);
      window.XJWPostBankExport=Object.freeze({schema:SCHEMA,runtime:RUNTIME,count:posts.length,version:payload.version,productImageVersion:PRODUCT_IMAGE_VERSION,forcedRegenerationIds:FORCED_REGEN_IDS,payload});
    }catch(error){
      state.className='error';state.textContent=error?.message||String(error);
      if(window.parent!==window)window.parent.postMessage({schema:SCHEMA,error:error?.message||String(error)},INTERNAL_ORIGIN);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>
</body>
</html>
