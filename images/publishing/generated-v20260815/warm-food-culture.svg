<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="龜鹿與溫熱飲食、燉煮文化有什麼關係？"><style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.serif{font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}.navy{fill:#0f2a46}.red{fill:#85201f}.muted{fill:#6f675d}.small{font-size:24px}.body{font-size:27px}.sub{font-size:28px}.card{fill:#fffdf8;stroke:#d8c6a4;stroke-width:2}.line{stroke:#b38c4f;stroke-width:2}
</style><rect width="1200" height="1200" fill="#f7f4ed"/><path d="M40 72 C120 20 190 52 236 104" fill="none" stroke="#d7c09a" stroke-width="3"/><path d="M1160 1020 C1080 1080 1020 1050 968 1000" fill="none" stroke="#d7c09a" stroke-width="3"/><text x="58" y="72" class="serif red" font-size="40" font-weight="700">仙加味</text><text x="58" y="110" class="muted small">補養，是一種節奏。</text><line x1="58" y1="390" x2="1142" y2="390" class="line"/><text x="58" y="175" class="serif navy" font-size="46" font-weight="700"><tspan x="58">龜鹿與溫熱飲食、</tspan><tspan x="58" dy="60">燉煮文化有什麼關係？</tspan></text><text x="60" y="330" class="red sub">從傳統餐桌看龜鹿文化的延續</text><rect x="760" y="435" width="380" height="455" rx="32" fill="#efe5d3" stroke="#d8c6a4" stroke-width="2"/><ellipse cx="950" cy="720" rx="135" ry="58" fill="#9f6c3d"/><ellipse cx="950" cy="695" rx="128" ry="48" fill="#c38a55"/><path d="M900 640 C875 600 910 580 890 545 M950 630 C930 590 970 575 950 535 M1000 640 C980 600 1015 580 1000 545" fill="none" stroke="#b38c4f" stroke-width="10" stroke-linecap="round"/><text x="950" y="825" text-anchor="middle" class="serif red" font-size="34" font-weight="700">溫熱飲食・家常燉煮</text><rect x="60" y="450" width="620" height="440" rx="28" class="card"/><text x="90" y="510" class="serif navy" font-size="34" font-weight="700">把四件事分開理解</text><text x="100" y="585" class="body navy">一、文化背景</text><text x="100" y="650" class="body navy">二、產品成分</text><text x="100" y="715" class="body navy">三、產品規格</text><text x="100" y="780" class="body navy">四、料理方式</text><text x="90" y="850" class="muted" font-size="24">資訊清楚，日常搭配也更容易理解。</text><rect x="58" y="930" width="1084" height="140" rx="22" class="card"/><image x="82" y="945" width="110" height="110" href="../../dm-final/05_guilu-tangkuai-75g-dm.jpg" preserveAspectRatio="xMidYMid meet"/><image x="205" y="945" width="110" height="110" href="../../dm-final/06_guilu-jiao-600g-dm.jpg" preserveAspectRatio="xMidYMid meet"/><text x="350" y="995" class="body navy">溫熱飲食與燉煮，是理解傳統餐桌文化的一個角度。</text><text x="350" y="1035" class="muted" font-size="23">實際產品仍依正式規格與使用方式安排。</text><rect x="0" y="1110" width="1200" height="90" fill="#0f2a46"/><text x="600" y="1166" text-anchor="middle" fill="#e7c78c" class="serif" font-size="29">台興山產・仙加味　｜　補養，是一種節奏。</text></svg>