</style><rect width="1200" height="1200" fill="#f7f4ed"/><path d="M40 72 C120 20 190 52 236 104" fill="none" stroke="#d7c09a" stroke-width="3"/><path d="M1160 1020 C1080 1080 1020 1050 968 1000" fill="none" stroke="#d7c09a" stroke-width="3"/><text x="58" y="72" class="serif red" font-size="40" font-weight="700">仙加味</text><text x="58" y="110" class="muted small">補養，是一種節奏。</text><line x1="58" y1="390" x2="1142" y2="390" class="line"/><text x="58" y="180" class="serif navy title"><tspan x="58" dy="0">第一次認識龜鹿，</tspan><tspan x="58" dy="66">先看哪三件事？</tspan></text><text x="60" y="335" class="red sub">文化、型態、生活方式，先把三件事看清楚</text><rect x="850" y="45" width="290" height="300" rx="30" class="card"/><image x="860" y="55" width="270" height="280" href="../../brand/hd-v20260812/faq.png" preserveAspectRatio="xMidYMid slice"/><rect x="60" y="455" width="340" height="500" rx="26" class="card"/><circle cx="105" cy="500" r="28" fill="#85201f"/><text x="105" y="510" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">1</text><text x="145" y="510" class="serif navy" font-size="34" font-weight="700">飲食文化</text><text x="88" y="570" class="body muted">先理解傳統飲食文化。</text><path d="M150 700 C230 630 300 650 330 760 C260 820 190 820 150 700Z" fill="#efe4cf"/><circle cx="240" cy="735" r="45" fill="#d6b47c" opacity=".45"/><rect x="430" y="455" width="340" height="500" rx="26" class="card"/><circle cx="475" cy="500" r="28" fill="#85201f"/><text x="475" y="510" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">2</text><text x="515" y="510" class="serif navy" font-size="34" font-weight="700">產品型態</text><text x="458" y="570" class="body muted">再看即飲、膏與料理型態。</text><image x="500" y="625" width="200" height="280" href="../../dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg" preserveAspectRatio="xMidYMid meet"/><rect x="800" y="455" width="340" height="500" rx="26" class="card"/><circle cx="845" cy="500" r="28" fill="#85201f"/><text x="845" y="510" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">3</text><text x="885" y="510" class="serif navy" font-size="34" font-weight="700">生活方式</text><text x="828" y="570" class="body muted">最後對照自己的日常安排。</text><path d="M890 700 C970 630 1040 650 1070 760 C1000 820 930 820 890 700Z" fill="#efe4cf"/><circle cx="980" cy="735" r="45" fill="#d6b47c" opacity=".45"/><rect x="58" y="982" width="1084" height="88" rx="22" class="card"/><text x="90" y="1038" class="body navy">先理解文化，再看型態，最後對照自己的生活方式。</text><rect x="0" y="1110" width="1200" height="90" fill="#0f2a46"/><text x="600" y="1166" text-anchor="middle" fill="#e7c78c" class="serif" font-size="29">台興山產・仙加味　｜　補養，是一種節奏。</text></svg>