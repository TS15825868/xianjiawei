<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="把龜鹿放進家常餐桌，可以怎麼搭配？"><style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.serif{font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}.navy{fill:#0f2a46}.red{fill:#85201f}.muted{fill:#6f675d}.small{font-size:24px}.body{font-size:27px}.sub{font-size:28px}.card{fill:#fffdf8;stroke:#d8c6a4;stroke-width:2}.line{stroke:#b38c4f;stroke-width:2}
</style><rect width="1200" height="1200" fill="#f7f4ed"/><path d="M40 72 C120 20 190 52 236 104" fill="none" stroke="#d7c09a" stroke-width="3"/><path d="M1160 1020 C1080 1080 1020 1050 968 1000" fill="none" stroke="#d7c09a" stroke-width="3"/><text x="58" y="72" class="serif red" font-size="40" font-weight="700">仙加味</text><text x="58" y="110" class="muted small">補養，是一種節奏。</text><line x1="58" y1="390" x2="1142" y2="390" class="line"/><text x="58" y="175" class="serif navy" font-size="48" font-weight="700"><tspan x="58">把龜鹿放進家常餐桌，</tspan><tspan x="58" dy="62">可以怎麼搭配？</tspan></text><text x="60" y="330" class="red sub">從熱飲、雞湯與排骨湯等熟悉料理開始</text><rect x="870" y="45" width="270" height="292" rx="30" class="card"/><image x="880" y="55" width="250" height="272" href="../../brand/hd-v20260812/choose.jpg" preserveAspectRatio="xMidYMid slice"/><rect x="60" y="455" width="510" height="500" rx="28" class="card"/><text x="90" y="505" class="serif navy" font-size="34" font-weight="700">龜鹿湯塊 75g</text><image x="115" y="550" width="400" height="330" href="../../dm-final/05_guilu-tangkuai-75g-dm.jpg" preserveAspectRatio="xMidYMid meet"/><rect x="630" y="455" width="510" height="500" rx="28" class="card"/><text x="660" y="505" class="serif navy" font-size="34" font-weight="700">龜鹿膠 600g</text><image x="685" y="550" width="400" height="330" href="../../dm-final/06_guilu-jiao-600g-dm.jpg" preserveAspectRatio="xMidYMid meet"/><rect x="58" y="980" width="1084" height="90" rx="22" class="card"/><text x="88" y="1023" class="body navy">先用熟悉的家常湯底開始，再依產品型態與使用方式安排。</text><text x="88" y="1057" class="muted" font-size="22">例如雞湯或排骨湯，重點是料理方式與生活節奏。</text><rect x="0" y="1110" width="1200" height="90" fill="#0f2a46"/><text x="600" y="1166" text-anchor="middle" fill="#e7c78c" class="serif" font-size="29">台興山產・仙加味　｜　補養，是一種節奏。</text></svg>