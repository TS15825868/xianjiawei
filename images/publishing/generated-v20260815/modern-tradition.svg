<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="傳統龜鹿文化，怎麼變得更方便理解？"><style>
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}.serif{font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}.navy{fill:#0f2a46}.red{fill:#85201f}.muted{fill:#6f675d}.small{font-size:24px}.body{font-size:27px}.sub{font-size:28px}.card{fill:#fffdf8;stroke:#d8c6a4;stroke-width:2}.line{stroke:#b38c4f;stroke-width:2}
</style><rect width="1200" height="1200" fill="#f7f4ed"/><path d="M40 72 C120 20 190 52 236 104" fill="none" stroke="#d7c09a" stroke-width="3"/><path d="M1160 1020 C1080 1080 1020 1050 968 1000" fill="none" stroke="#d7c09a" stroke-width="3"/><text x="58" y="72" class="serif red" font-size="40" font-weight="700">仙加味</text><text x="58" y="110" class="muted small">補養，是一種節奏。</text><line x1="58" y1="390" x2="1142" y2="390" class="line"/><text x="58" y="175" class="serif navy" font-size="48" font-weight="700"><tspan x="58">傳統龜鹿文化，</tspan><tspan x="58" dy="62">怎麼變得更方便理解？</tspan></text><text x="60" y="330" class="red sub">保留工序與文化，把說明方式做得更清楚</text><rect x="870" y="45" width="270" height="292" rx="30" class="card"/><image x="880" y="55" width="250" height="272" href="../../brand/hd-v20260812/brand-story.png" preserveAspectRatio="xMidYMid slice"/><rect x="60" y="455" width="250" height="500" rx="26" class="card"/><text x="90" y="510" class="serif red" font-size="34" font-weight="700">原料</text><text x="90" y="560" class="body navy">把來源與名稱</text><text x="90" y="600" class="body navy">分開說清楚</text><circle cx="185" cy="745" r="70" fill="#eadcc4"/><path d="M145 755 C185 690 225 690 245 755" fill="none" stroke="#9c7549" stroke-width="14" stroke-linecap="round"/><rect x="335" y="455" width="250" height="500" rx="26" class="card"/><text x="365" y="510" class="serif red" font-size="34" font-weight="700">規格</text><text x="365" y="560" class="body navy">容量、重量、包裝</text><text x="365" y="600" class="body navy">各自清楚標示</text><image x="390" y="650" width="140" height="230" href="../../dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg" preserveAspectRatio="xMidYMid meet"/><rect x="610" y="455" width="250" height="500" rx="26" class="card"/><text x="640" y="510" class="serif red" font-size="34" font-weight="700">型態</text><text x="640" y="560" class="body navy">即飲、膏、湯塊</text><text x="640" y="600" class="body navy">依生活情境理解</text><image x="665" y="650" width="140" height="230" href="../../dm-final/05_guilu-tangkuai-75g-dm.jpg" preserveAspectRatio="xMidYMid meet"/><rect x="885" y="455" width="250" height="500" rx="26" class="card"/><text x="915" y="510" class="serif red" font-size="34" font-weight="700">使用</text><text x="915" y="560" class="body navy">保存、料理與</text><text x="915" y="600" class="body navy">一般使用方式</text><path d="M945 745 h130 v80 h-130z" fill="#eadcc4"/><path d="M965 720 q45 -40 90 0" fill="none" stroke="#9c7549" stroke-width="12"/><rect x="58" y="980" width="1084" height="90" rx="22" class="card"/><text x="88" y="1023" class="body navy">把原料、規格、產品型態、保存與一般使用方式整理清楚。</text><text x="88" y="1057" class="muted" font-size="22">讓第一次接觸的人，也能順著自己的生活節奏理解。</text><rect x="0" y="1110" width="1200" height="90" fill="#0f2a46"/><text x="600" y="1166" text-anchor="middle" fill="#e7c78c" class="serif" font-size="29">台興山產・仙加味　｜　補養，是一種節奏。</text></svg>