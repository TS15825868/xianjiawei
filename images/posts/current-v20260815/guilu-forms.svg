<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="#fff" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">型</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="49" fill="#0B1F3B" font-weight="800">龜鹿飲、膏、湯塊、膠差在哪？</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" fill="#6B7280">先比較使用型態，不用先背全部規格</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><g font-family="Noto Sans TC, PingFang TC, sans-serif"><rect x="125" y="390" width="230" height="400" rx="30" fill="#FCF7EE"/><text x="240" y="500" text-anchor="middle" font-size="38" fill="#0B1F3B" font-weight="700">龜鹿飲</text><text x="240" y="565" text-anchor="middle" font-size="24" fill="#6B7280">即飲型態</text><text x="240" y="620" text-anchor="middle" font-size="24" fill="#6B7280">外出方便</text><rect x="383" y="390" width="230" height="400" rx="30" fill="#F1F5EF"/><text x="498" y="500" text-anchor="middle" font-size="38" fill="#0B1F3B" font-weight="700">龜鹿膏</text><text x="498" y="565" text-anchor="middle" font-size="24" fill="#6B7280">小匙取用</text><text x="498" y="620" text-anchor="middle" font-size="24" fill="#6B7280">可溫水化開</text><rect x="641" y="390" width="230" height="400" rx="30" fill="#F1EFF6"/><text x="756" y="500" text-anchor="middle" font-size="38" fill="#0B1F3B" font-weight="700">龜鹿湯塊</text><text x="756" y="565" text-anchor="middle" font-size="24" fill="#6B7280">熱水／保溫壺</text><text x="756" y="620" text-anchor="middle" font-size="24" fill="#6B7280">家常湯品</text><rect x="899" y="390" width="230" height="400" rx="30" fill="#F7F1EC"/><text x="1014" y="500" text-anchor="middle" font-size="38" fill="#0B1F3B" font-weight="700">龜鹿膠</text><text x="1014" y="565" text-anchor="middle" font-size="24" fill="#6B7280">家庭料理</text><text x="1014" y="620" text-anchor="middle" font-size="24" fill="#6B7280">溫熱搭配</text><text x="627" y="900" text-anchor="middle" font-size="30" fill="#46583D" font-weight="700">這張只整理型態，不模擬產品實體尺寸</text></g><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>