<g font-family="Noto Sans TC, PingFang TC, sans-serif">
<rect x="125" y="365" width="470" height="200" rx="28" fill="#FCFBF7" stroke="#DED6C7"/><circle cx="205" cy="465" r="45" fill="#46583D"/><text x="205" y="477" text-anchor="middle" font-size="28" fill="white">匙</text><text x="285" y="438" font-size="30" fill="#0B1F3B" font-weight="700">龜鹿膏</text><text x="285" y="485" font-size="22" fill="#6B7280">直接取用／溫熱水化開</text>
<rect x="659" y="365" width="470" height="200" rx="28" fill="#FCFBF7" stroke="#DED6C7"/><circle cx="739" cy="465" r="45" fill="#8B1E1E"/><text x="739" y="477" text-anchor="middle" font-size="28" fill="white">飲</text><text x="819" y="438" font-size="30" fill="#0B1F3B" font-weight="700">龜鹿飲</text><text x="819" y="485" font-size="22" fill="#6B7280">直接飲用／隔水溫熱</text>
<rect x="125" y="620" width="470" height="200" rx="28" fill="#FCFBF7" stroke="#DED6C7"/><circle cx="205" cy="720" r="45" fill="#B6975A"/><text x="205" y="732" text-anchor="middle" font-size="28" fill="white">湯</text><text x="285" y="693" font-size="30" fill="#0B1F3B" font-weight="700">湯塊／龜鹿膠</text><text x="285" y="740" font-size="22" fill="#6B7280">熱水／保溫壺／家常湯品</text>
<rect x="659" y="620" width="470" height="200" rx="28" fill="#FCFBF7" stroke="#DED6C7"/><circle cx="739" cy="720" r="45" fill="#0B1F3B"/><text x="739" y="732" text-anchor="middle" font-size="28" fill="white">粉</text><text x="819" y="693" font-size="30" fill="#0B1F3B" font-weight="700">鹿茸粉</text><text x="819" y="740" font-size="22" fill="#6B7280">依習慣加入溫飲</text></g>
