<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="#fff" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">暖</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="50" fill="#0B1F3B" font-weight="800">龜鹿與溫熱飲食、燉煮文化</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" fill="#6B7280">從傳統餐桌理解文化，再把今天的產品資訊分開看</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><g transform="translate(627 610)"><ellipse cx="0" cy="170" rx="300" ry="62" fill="#E8DFD0"/><path d="M-275 -30 Q-245 180 0 205 Q245 180 275 -30 Z" fill="#7C4B36"/><path d="M-210 -40 Q0 -145 210 -40" fill="none" stroke="#0B1F3B" stroke-width="24" stroke-linecap="round"/><path d="M-135 -130 q35 -75 70 0 M-15 -155 q35 -75 70 0 M105 -130 q35 -75 70 0" fill="none" stroke="#B6975A" stroke-width="15" stroke-linecap="round"/></g><text x="627" y="945" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="30" fill="#46583D" font-weight="700">溫熱飲食｜燉煮文化｜家常餐桌</text><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>