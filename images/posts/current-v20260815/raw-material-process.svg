<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="white" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">料</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="54" fill="#0B1F3B" font-weight="800">從原料到成品</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#6B7280">把每一段整理成可理解的流程</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><text x="120" y="500" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="34" fill="#0B1F3B">原料確認與整理</text><text x="120" y="570" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="34" fill="#0B1F3B">前處理與加工</text><text x="120" y="640" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="34" fill="#0B1F3B">規格與包裝確認</text><text x="120" y="710" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="34" fill="#0B1F3B">把傳統工序說清楚，不延伸療效</text><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>