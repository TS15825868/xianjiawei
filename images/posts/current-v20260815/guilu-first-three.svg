<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="#fff" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">三</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="52" fill="#0B1F3B" font-weight="800">第一次認識龜鹿，先看三件事</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" fill="#6B7280">文化、型態、生活方式，分開看會更清楚</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><g font-family="Noto Sans TC, PingFang TC, sans-serif"><rect x="120" y="410" width="300" height="390" rx="32" fill="#FCF7EE" stroke="#DED6C7"/><text x="270" y="505" text-anchor="middle" font-size="64" fill="#8B1E1E" font-weight="800">1</text><text x="270" y="590" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">傳統文化</text><text x="270" y="650" text-anchor="middle" font-size="23" fill="#6B7280">先理解飲食脈絡</text><rect x="477" y="410" width="300" height="390" rx="32" fill="#F1F5EF" stroke="#DED6C7"/><text x="627" y="505" text-anchor="middle" font-size="64" fill="#46583D" font-weight="800">2</text><text x="627" y="590" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">今天的型態</text><text x="627" y="650" text-anchor="middle" font-size="23" fill="#6B7280">即飲、膏、料理型</text><rect x="834" y="410" width="300" height="390" rx="32" fill="#F1EFF6" stroke="#DED6C7"/><text x="984" y="505" text-anchor="middle" font-size="64" fill="#B6975A" font-weight="800">3</text><text x="984" y="590" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">生活方式</text><text x="984" y="650" text-anchor="middle" font-size="23" fill="#6B7280">選順手的使用方式</text><text x="627" y="900" text-anchor="middle" font-size="30" fill="#46583D" font-weight="700">三件事先看清楚，再往下比較規格</text></g><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>