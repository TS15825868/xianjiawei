<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="#fff" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">日</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="52" fill="#0B1F3B" font-weight="800">為什麼有人把龜鹿放進日常？</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" fill="#6B7280">先從飲食文化、產品型態與生活方式理解</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><g font-family="Noto Sans TC, PingFang TC, sans-serif"><circle cx="280" cy="600" r="135" fill="#F3E9D6"/><text x="280" y="585" text-anchor="middle" font-size="40" fill="#0B1F3B" font-weight="700">飲食文化</text><text x="280" y="635" text-anchor="middle" font-size="23" fill="#6B7280">從傳統餐桌認識</text><circle cx="627" cy="600" r="135" fill="#E9EFE6"/><text x="627" y="585" text-anchor="middle" font-size="40" fill="#0B1F3B" font-weight="700">產品型態</text><text x="627" y="635" text-anchor="middle" font-size="23" fill="#6B7280">飲、膏、湯塊、膠</text><circle cx="974" cy="600" r="135" fill="#EEEAF4"/><text x="974" y="585" text-anchor="middle" font-size="40" fill="#0B1F3B" font-weight="700">生活方式</text><text x="974" y="635" text-anchor="middle" font-size="23" fill="#6B7280">攜帶、保存、料理</text><text x="627" y="870" text-anchor="middle" font-size="31" fill="#46583D" font-weight="700">不先談效果，先把日常使用情境看清楚</text></g><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>