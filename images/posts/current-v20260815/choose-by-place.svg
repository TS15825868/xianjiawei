<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><rect x="72" y="72" width="1110" height="1110" rx="48" fill="#fff" stroke="#E3DCCD" stroke-width="3"/><circle cx="172" cy="178" r="54" fill="#8B1E1E"/><text x="172" y="190" text-anchor="middle" font-size="34" fill="white" font-weight="700">場</text><text x="256" y="168" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="50" fill="#0B1F3B" font-weight="800">在家、外出、工作空檔怎麼選？</text><text x="256" y="220" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" fill="#6B7280">先看自己平常在哪裡使用，再比較型態與容量</text><line x1="120" y1="304" x2="1134" y2="304" stroke="#B6975A" stroke-width="3"/><g font-family="Noto Sans TC, PingFang TC, sans-serif"><rect x="120" y="405" width="310" height="430" rx="34" fill="#FCF7EE"/><path d="M200 575l75-70 75 70v110H200z" fill="#B6975A"/><rect x="260" y="625" width="30" height="60" fill="#F7F4ED"/><text x="275" y="760" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">在家</text><text x="275" y="805" text-anchor="middle" font-size="22" fill="#6B7280">固定安排</text><rect x="472" y="405" width="310" height="430" rx="34" fill="#EEF4EC"/><circle cx="627" cy="555" r="65" fill="#46583D"/><path d="M602 555h50M627 530v50" stroke="#F7F4ED" stroke-width="10" stroke-linecap="round"/><text x="627" y="760" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">外出</text><text x="627" y="805" text-anchor="middle" font-size="22" fill="#6B7280">輕巧攜帶</text><rect x="824" y="405" width="310" height="430" rx="34" fill="#F1EFF6"/><rect x="904" y="500" width="150" height="100" rx="10" fill="#0B1F3B"/><rect x="930" y="615" width="100" height="15" rx="7" fill="#B6975A"/><text x="979" y="760" text-anchor="middle" font-size="34" fill="#0B1F3B" font-weight="700">工作空檔</text><text x="979" y="805" text-anchor="middle" font-size="22" fill="#6B7280">順手使用</text></g><text x="627" y="930" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="30" fill="#46583D" font-weight="700">生活場景先決定，再往下看產品</text><text x="120" y="1110" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="28" fill="#46583D" font-weight="700">仙加味</text><text x="120" y="1152" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="24" fill="#6B7280">補養，是一種節奏。</text></svg>