<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
<title id="t">仙加味日常燉湯情境圖</title><desc id="d">暖米色居家料理情境，呈現備料、熱氣湯鍋、慢慢燉煮與溫熱享用。</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8eedc"/><stop offset="1" stop-color="#c99a55"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".28"/></filter></defs>
<rect width="1080" height="1080" fill="url(#g)"/>
<image href="https://ts15825868.github.io/xianjiawei/images/brand/approved-v405/recipes.webp" x="45" y="150" width="990" height="742" preserveAspectRatio="xMidYMid meet" filter="url(#s)"/>
<rect x="45" y="42" width="990" height="116" rx="30" fill="#fffaf1" opacity=".97"/>
<text x="82" y="94" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="30" font-weight="700" fill="#9b1c1f">仙加味・日常料理</text>
<text x="82" y="139" font-family="Noto Serif TC,Microsoft JhengHei,sans-serif" font-size="52" font-weight="800" fill="#0b1f3b">慢慢燉煮，溫熱享用</text>
<rect x="80" y="875" width="920" height="150" rx="32" fill="#0b1f3b" opacity=".96"/>
<text x="540" y="934" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="33" font-weight="700" fill="#fff">備料・放入湯鍋・慢火燉煮・盛湯</text>
<text x="540" y="983" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="27" fill="#f5d994">雞湯或排骨湯的家常溫熱情境</text>
