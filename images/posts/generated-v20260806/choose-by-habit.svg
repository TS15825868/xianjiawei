<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">仙加味依習慣選擇產品圖</title><desc id="d">依固定安排、方便即飲、料理搭配與自行搭配四種習慣選擇，使用核定產品比較圖。</desc><defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".25"/></filter><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6ead5"/><stop offset="1" stop-color="#d6ad69"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><rect x="45" y="40" width="990" height="130" rx="34" fill="#fffaf1"/><text x="80" y="94" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="700" fill="#9b1c1f">仙加味・怎麼選</text><text x="80" y="148" font-family="Noto Serif TC,Microsoft JhengHei,sans-serif" font-size="50" font-weight="800" fill="#0b1f3b">依你的日常習慣選擇</text><image href="https://ts15825868.github.io/xianjiawei/images/brand/approved-v405/choose.webp" x="45" y="185" width="990" height="650" preserveAspectRatio="xMidYMid meet" filter="url(#s)"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" text-anchor="middle"><g transform="translate(65 850)"><rect width="225" height="155" rx="26" fill="#fffaf1"/><text x="112" y="54" font-size="27" font-weight="800" fill="#0b1f3b">固定安排</text><text x="112" y="98" font-size="24" fill="#9b1c1f">龜鹿膏</text><text x="112" y="130" font-size="19" fill="#5f6570">小匙取用</text></g><g transform="translate(310 850)"><rect width="225" height="155" rx="26" fill="#fffaf1"/><text x="112" y="54" font-size="27" font-weight="800" fill="#0b1f3b">方便即飲</text><text x="112" y="98" font-size="24" fill="#9b1c1f">龜鹿飲</text><text x="112" y="130" font-size="19" fill="#5f6570">30cc／180cc</text></g><g transform="translate(555 850)"><rect width="225" height="155" rx="26" fill="#fffaf1"/><text x="112" y="54" font-size="27" font-weight="800" fill="#0b1f3b">料理搭配</text><text x="112" y="98" font-size="24" fill="#9b1c1f">湯塊／龜鹿膠</text><text x="112" y="130" font-size="19" fill="#5f6570">燉湯或熱水</text></g><g transform="translate(800 850)"><rect width="215" height="155" rx="26" fill="#fffaf1"/><text x="107" y="54" font-size="27" font-weight="800" fill="#0b1f3b">自行搭配</text><text x="107" y="98" font-size="24" fill="#9b1c1f">鹿茸粉</text><text x="107" y="130" font-size="19" fill="#5f6570">溫飲搭配</text></g></g></svg>