<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><text x="82" y="92" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="29" font-weight="700" fill="#9B2C2C">仙加味・料理搭配</text><text x="82" y="158" font-family="Noto Serif TC,PingFang TC,sans-serif" font-size="56" font-weight="800" fill="#0B1F3B">家常食材，慢慢燉成一鍋湯</text><g transform="translate(85 245)"><rect width="520" height="690" rx="42" fill="#FFFDF9" stroke="#DED7CA" stroke-width="3"/><ellipse cx="260" cy="405" rx="195" ry="70" fill="#554036"/><path d="M90 315h340l-42 220H132z" fill="#2F3941"/><ellipse cx="260" cy="315" rx="170" ry="55" fill="#D6A36C"/><circle cx="205" cy="300" r="34" fill="#E7D18A"/><circle cx="270" cy="292" r="30" fill="#A8684E"/><circle cx="330" cy="310" r="30" fill="#83A25C"/><path d="M190 205q-40-70 5-125M270 200q-38-65 6-120M345 210q-40-68 4-125" fill="none" stroke="#D9D9D9" stroke-width="16" stroke-linecap="round"/><text x="260" y="595" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="34" font-weight="800" fill="#0B1F3B">雞湯／排骨湯</text><text x="260" y="640" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="22" fill="#667085">依家中習慣準備食材</text></g><g transform="translate(650 245)"><rect width="520" height="690" rx="42" fill="#EEF3EE" stroke="#CEDACF" stroke-width="3"/><circle cx="150" cy="240" r="58" fill="#E4C16A"/><circle cx="255" cy="210" r="54" fill="#9CB16A"/><circle cx="360" cy="250" r="58" fill="#B67251"/><rect x="95" y="360" width="330" height="88" rx="24" fill="#D8B283"/><path d="M115 404h290" stroke="#8C633E" stroke-width="10" stroke-linecap="round"/><text x="260" y="595" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="34" font-weight="800" fill="#0B1F3B">山藥・紅棗・蔬菜</text><text x="260" y="640" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="22" fill="#667085">料理情境不畫