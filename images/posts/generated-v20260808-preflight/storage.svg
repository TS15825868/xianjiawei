<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="t d"><title id="t">保存方式</title><desc id="d">冷藏、防潮與開封後儘速使用三種保存提醒，不出現產品。</desc><rect width="1254" height="1254" fill="#F7F4ED"/><text x="86" y="92" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="29" font-weight="700" fill="#9B2C2C">仙加味・保存提醒</text><text x="86" y="158" font-family="Noto Serif TC,PingFang TC,sans-serif" font-size="58" font-weight="800" fill="#0B1F3B">保存方式，看清楚再收好</text>
<g font-family="Noto Sans TC,PingFang TC,sans-serif"><g transform="translate(78 250)"><rect width="340" height="660" rx="36" fill="#E8F1F5" stroke="#C8D7DE" stroke-width="3"/><rect x="92" y="100" width="156" height="280" rx="18" fill="#fff" stroke="#54778A" stroke-width="8"/><path d="M92 225h156M220 145v38M220 270v38" stroke="#54778A" stroke-width="9"/><path d="M146 455c30-42 74-42 104 0-18 28-34 42-52 42s-34-14-52-42z" fill="#8EC4D6"/><text x="170" y="550" text-anchor="middle" font-size="34" font-weight="800" fill="#0B1F3B">開罐後冷藏</text><text x="170" y="602" text-anchor="middle" font-size="23" fill="#475467">依產品標示處理</text></g>
<g transform="translate(457 250)"><rect width="340" height="660" rx="36" fill="#F3ECD8" stroke="#DED1A9" stroke-width="3"/><rect x="82" y="130" width="176" height="225" rx="26" fill="#FFFDF9" stroke="#8B6B3F" stroke-width="8"/><rect x="105" y="95" width="130" height="56" rx="16" fill="#8B6B3F"/><path d="M130 415q40-60 80 0M145 455q25-35 50 0" fill="none" stroke="#C28B3B" stroke-width="13" stroke-linecap="round"/><text x="170" y="550" text-anchor="middle" font-size="34" font-weight="800" fill="#0B1F3B">密封防潮</text><text x="170" y="602" text-anchor="middle" font-size="23" fill="#475467">乾燥陰涼收納</text></g>
<g transform="translate(836 250)"><rect width="340" height="660" rx="36" fill="#EEF1E7" stroke="#C9D3BC" stroke-width="3"/><circle cx="170" cy="245" r="105" fill="#fff" stroke="#315A49" stroke-width="9"/><path d="M170 245l0-66M170 245l58 28" stroke="#315A49" stroke-width="13" stroke-linecap="round"/><path d="M104 410h132" stroke="#9B2C2C" stroke-width="15" stroke-linecap="round"/><text x="170" y="550" text-anchor="middle" font-size="34" font-weight="800" fill="#0B1F3B">開封後儘速</text><text x="170" y="602" text-anchor="middle" font-size="23" fill="#475467">飲用／使用完成</text></g></g>
<rect x="106" y="964" width="1042" height="130" rx="30" fill="#0B1F3B"/><text x="627" y="1020" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="29" font-weight="700" fill="#fff">不同產品保存方式不同，以實際包裝標示為準</text><text x="627" y="1064" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="22" fill="#F4D89B">本圖不呈現產品｜避免包裝誤導</text></svg>