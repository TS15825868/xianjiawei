<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254"><rect width="1254" height="1254" fill="#F7F4ED"/><text x="82" y="92" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="29" font-weight="700" fill="#9B2C2C">仙加味・聯絡我們</text><text x="82" y="158" font-family="Noto Serif TC,PingFang TC,sans-serif" font-size="56" font-weight="800" fill="#0B1F3B">想了解產品，直接從官方 LINE 詢問</text><rect x="265" y="240" width="724" height="720" rx="68" fill="#0B1F3B"/><rect x="302" y="290" width="650" height="600" rx="40" fill="#FFFDF9"/><circle cx="627" cy="409" r="76" fill="#315A49"/><text x="627" y="433" text-anchor="middle" font-family="Noto Serif TC,PingFang TC,sans-serif" font-size="58" font-weight="900" fill="#fff">仙</text><rect x="372" y="535" width="510" height="150" rx="55" fill="#DFF0E7"/><path d="M445 684l-25 72 92-68" fill="#DFF0E7"/><text x="627" y="597" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="34" font-weight="800" fill="#174B3A">仙加味官方 LINE</text><text x="627" y="647" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="26" fill="#315A49">產品・試喝・下單問題都可留言</text><rect x="412" y="760" width="430" height="76" rx="38" fill="#315A49"/><text x="627" y="810" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="29" font-weight="800" fill="#fff">加入 LINE 後直接傳訊息</text><rect x="156" y="1010" width="942" height="120" rx="28" fill="#FFFDF9" stroke="#DED7CA" stroke-width="3"/><text x="627" y="1062" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="27" font-weight="700" fill="#0B1F3B">聯絡圖不展示產品，避免舊包裝與錯誤規格混入</text><text x="627" y="1103" text-anchor="middle" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="20" fill="#667085">品牌導流專用候選｜待16項審核</text></svg>