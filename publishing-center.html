<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b1f3b">
<title>仙加味｜公開貼文發布中心</title>
<meta name="description" content="仙加味公開貼文手動發布中心：檢查產品、季節、情境、冷熱、表情與動作，預覽圖片、複製文案及保存手動發布紀錄。">
<link rel="stylesheet" href="publishing-center.css?v=20260806-2">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">仙加味・公開內容工具</p>
    <h1>貼文發布中心</h1>
    <p class="subtitle">手動審核、手動發布，不含客戶、訂單、成本或平台密碼。</p>
  </div>
  <a class="button secondary" href="index.html">回官網</a>
</header>

<main class="shell">
  <section class="notice" aria-label="使用說明">
    <strong>這裡不會自動替你發文。</strong>
    <span>核准前必須確認：產品／規格／價格、季節、情境、冷熱、表情、動作全部符合；完成各平台發布後再按「標記已發布」。</span>
  </section>

  <section class="metrics" aria-label="貼文統計">
    <article><small>公開母本</small><strong id="metricTotal">—</strong><span>篇</span></article>
    <article><small>待審核</small><strong id="metricPending">—</strong><span>篇</span></article>
    <article><small>已發布鎖定</small><strong id="metricLocked">—</strong><span>篇</span></article>
    <article><small>本機已發布</small><strong id="metricLocal">—</strong><span>篇</span></article>
  </section>

  <section class="toolbar" aria-label="篩選工具">
    <label>
      <span>搜尋貼文</span>
      <input id="searchInput" type="search" placeholder="輸入標題、產品或文案關鍵字">
    </label>
    <label>
      <span>顯示狀態</span>
      <select id="statusFilter">
        <option value="pending">待審核／可處理</option>
        <option value="approved">本機已核准</option>
        <option value="published">已發布</option>
        <option value="needs-image">圖片待更換</option>
        <option value="all">全部</option>
      </select>
    </label>
    <div class="toolbar-actions">
      <button class="button secondary" id="exportButton" type="button">匯出發布紀錄</button>
      <button class="button secondary" id="reloadButton" type="button">重新讀取Git</button>
    </div>
  </section>

  <section id="loadingState" class="state-card">正在讀取公開Git貼文資料…</section>
  <section id="errorState" class="state-card error" hidden>
    <h2>公開貼文資料暫時無法讀取</h2>
    <p id="errorMessage"></p>
    <button class="button primary" id="retryButton" type="button">重新連線</button>
  </section>
  <section id="postList" class="post-grid" aria-live="polite"></section>
</main>

<dialog id="postDialog" class="post-dialog">
  <form method="dialog" class="dialog-shell">
    <button class="dialog-close" value="close" aria-label="關閉">×</button>
    <div id="dialogContent"></div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<footer>
  <p>公開Git只保存可公開的品牌文案、圖片、圖文匹配規則與生成指令。私人ERP資料不會顯示在此頁。</p>
</footer>

<script src="publishing-known-mismatch-guard.js?v=20260806-1"></script>
<script src="publishing-visual-match.js?v=20260806-1"></script>
<script type="module" src="publishing-center.js?v=20260806-2"></script>
</body>
</html>
