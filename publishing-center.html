<header class="topbar"><div><p class="eyebrow">仙加味・內容候選庫</p><h1>貼文候選審核中心</h1><p class="subtitle">查看候選文案與圖片、完成16項檢查；核准後匯入獨立貼文系統進行正式審核、排程或立即發布。</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="button secondary" href="index.html">回官網</a><a class="button primary" href="https://xianjiawei-internal.tung314069.workers.dev/publishing.html" target="_blank" rel="noopener">前往獨立貼文發佈系統</a></div></header>
<main class="shell">
<section class="review-flow"><strong>操作流程：</strong>候選文案／圖片 → 16項人工檢查 → 不符合可用 ChatGPT 重生成 → 匯入獨立貼文系統草稿 → 正式審核 → 固定排程或立即發布。候選頁不保存社群平台 Token，也不直接對外發布。</section>
<section class="metrics"><article><small>候選內容</small><strong id="metricTotal">—</strong><span>篇</span></article><article><small>待審核</small><strong id="metricPending">—</strong><span>篇</span></article><article><small>已發布鎖定</small><strong id="metricLocked">—</strong><span>篇</span></article><article><small>本機補登</small><strong id="metricLocal">—</strong><span>篇</span></article></section>
<section class="toolbar"><label><span>搜尋貼文</span><input id="searchInput" type="search" placeholder="輸入標題、產品、季節、天氣、場合、地點或角色"></label><label><span>顯示狀態</span><select id="statusFilter"><option value="pending">待審核／可處理</option><option value="approved">已核准／已排程</option><option value="published">已發布／本機補登</option><option value="needs-image">需重生成／待更換</option><option value="all">全部</option></select></label><div class="toolbar-actions"><button class="button secondary" id="exportButton" type="button">匯出審核紀錄</button><button class="button secondary" id="reloadButton" type="button">重新讀取候選庫</button></div></section>
<section id="loadingState" class="state-card">正在讀取候選內容與圖文檢查規則…</section><section id="errorState" class="state-card error" hidden><h2>候選貼文資料暫時無法讀取</h2><p id="errorMessage"></p><button class="button primary" id="retryButton" type="button">重新連線</button></section><section id="postList" class="post-grid" aria-live="polite"></section>
</main>
<dialog id="postDialog" class="post-dialog"><form method="dialog" class="dialog-shell"><button class="dialog-close" value="close" aria-label="關閉">×</button><div id="dialogContent"></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer><p>公開候選頁只負責內容整理與安全交接；正式審核、排程、立即發布與各平台結果統一由獨立貼文發佈系統管理。</p></footer>
