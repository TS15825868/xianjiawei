<!doctype html>
<html lang="zh-Hant-TW">

  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f7f4ed;color:#0b1f3b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:20px}.title{text-align:center;margin:6px 0 18px;font-size:clamp(24px,5vw,40px)}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{margin:0;background:#fff;border:1px solid #d9e0e8;border-radius:24px;overflow:hidden;box-shadow:0 12px 34px rgba(11,31,59,.10)}.card img{display:block;width:100%;height:auto}.card figcaption{text-align:center;font-size:18px;font-weight:800;padding:14px}.note{text-align:center;font-size:16px;margin:18px 0 4px;color:#506078}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:28px}}
