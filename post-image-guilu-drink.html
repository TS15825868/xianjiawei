<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>仙加味・龜鹿飲｜30cc 與 180cc</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f7f4ed;color:#0b1f3b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:20px}.title{text-align:center;margin:6px 0 18px;font-size:clamp(24px,5vw,40px)}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{margin:0;background:#fff;border:1px solid #d9e0e8;border-radius:24px;overflow:hidden;box-shadow:0 12px 34px rgba(11,31,59,.10)}.card img{display:block;width:100%;height:520px;object-fit:contain;background:#fff;padding:18px}.card figcaption{text-align:center;font-size:18px;font-weight:800;padding:14px}.note{text-align:center;font-size:16px;margin:18px 0 4px;color:#506078}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:28px}}@media(max-width:759px){.card img{height:420px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">仙加味・龜鹿飲｜兩種正式規格</h1>
    <section class="grid" aria-label="龜鹿飲兩種正式規格圖片">
      <figure class="card">
        <img src="images/products-v3/guilu-drink-30.jpg?v=current" alt="仙加味龜鹿飲30cc小玻璃裸罐正式產品原圖" loading="eager">
        <figcaption>30cc／罐（小玻璃罐）</figcaption>
      </figure>
      <figure class="card">
        <img src="images/products-v3/guilu-drink-180.jpg?v=current" alt="仙加味龜鹿飲180cc鋁袋正式產品原圖" loading="eager">
        <figcaption>180cc／包（鋁袋）</figcaption>
      </figure>
    </section>
    <p class="note">兩種規格分開呈現，只使用 products-v3 正式產品原圖並保持原比例；30cc 不稱瓶、不加貼紙，180cc 保持狹長鋁袋。</p>
  </main>
</body>
</html>
